":["C"]},{"number":188,"text":"A network administrator is working to improve WLAN performance on a dual-band wireless router . What is a simple way to achieve a split-the-traffic result?","options":[{"key":"A","text":"Add a Wi-Fi range extender to the WLAN and set the AP and the range extender to serve different bands."},{"key":"B","text":"Check and keep the firmware of the wireless router updated."},{"key":"C","text":"Make sure that different SSIDs are used for the 2.4 GHz and 5 GHz bands."},{"key":"D","text":"Require all wireless devices to use the 802.11n standard."}],"answer":["C"]},{"number":189,"text":"Which access control component, implementation, or protocol controls what users can do on the network?","options":[{"key":"A","text":"accounting"},{"key":"B","text":"802.1X"},{"key":"C","text":"authorization"},{"key":"D","text":"authentication"}],"answer":["C"]},{"number":190,"text":"Which type of wireless network is suitable for providing wireless access to a city or district?","options":[{"key":"A","text":"wireless wide-area network"},{"key":"B","text":"wireless personal-area network"},{"key":"C","text":"wireless local-area network"},{"key":"D","text":"wireless metropolitan-area network"}],"answer":["D"]},{"number":191,"text":"On a Cisco 3504 WLC Summary page ( Advanced > Summary ), which tab allows a network administrator to access and configure a WLAN for a specific security option such as WPA2?","options":[{"key":"A","text":"MANAGEMENT"},{"key":"B","text":"WIRELESS"},{"key":"C","text":"WLANs"},{"key":"D","text":"SECURITY"}],"answer":["C"]},{"number":192,"text":"What type of wireless antenna is best suited for providing coverage in large open spaces, such as hallways or large conference rooms?","options":[{"key":"A","text":"Yagi"},{"key":"B","text":"omnidirectional"},{"key":"C","text":"dish"},{"key":"D","text":"directional"}],"answer":["B"]},{"number":193,"text":"What security benefit is gained from enabling BPDU guard on PortFast enabled interfaces?","options":[{"key":"A","text":"preventing buffer overflow attacks"},{"key":"B","text":"preventing rogue switches from being added to the network"},{"key":"C","text":"protecting against Layer 2 loops"},{"key":"D","text":"enforcing the placement of root bridges"}],"answer":["B"]},{"number":194,"text":"Which access control component, implementation, or protocol logs EXEC and configuration commands configured by a user?","options":[{"key":"A","text":"authentication"},{"key":"B","text":"authorization"},{"key":"C","text":"802.1X"},{"key":"D","text":"accounting"}],"answer":["D"]},{"number":195,"text":"Which type of wireless network uses transmitters to provide coverage over an extensive geographic area?","options":[{"key":"A","text":"wireless metropolitan-area network"},{"key":"B","text":"wireless local-area network"},{"key":"C","text":"wireless personal-area network"},{"key":"D","text":"wireless wide-area network"}],"answer":["D"]},{"number":196,"text":"Which access control component, implementation, or protocol controls who is permitted to access a network?","options":[{"key":"A","text":"authorization"},{"key":"B","text":"802.1X"},{"key":"C","text":"accounting"},{"key":"D","text":"authentication"}],"answer":["D"]},{"number":197,"text":"What two IEEE 802.11 wireless standards operate only in the 5 GHz range? (Choose two.)","options":[{"key":"A","text":"802.11g"},{"key":"B","text":"802.11ad"},{"key":"C","text":"802.11ac"},{"key":"D","text":"802.11a"},{"key":"E","text":"802.11n"},{"key":"F","text":"802.11b"}],"answer":["C","D"]},{"number":198,"text":"Which type of wireless network uses low powered transmitters for a short-range network, usually 20 to 30 ft. (6 to 9 meters)?","options":[{"key":"A","text":"wireless metropolitan-area network"},{"key":"B","text":"wireless personal-area network"},{"key":"C","text":"wireless local-area network"},{"key":"D","text":"wireless wide-area network"}],"answer":["B"]},{"number":199,"text":"Which wireless network topology would be used by network engineers to provide a wireless network for an entire college building?","options":[{"key":"A","text":"ad hoc"},{"key":"B","text":"hotspot"},{"key":"C","text":"infrastructure"},{"key":"D","text":"mixed mode"}],"answer":["C"]},{"number":200,"text":"Which type of wireless network uses transmitters to provide wireless service over a large urban region?","options":[{"key":"A","text":"wireless wide-area network"},{"key":"B","text":"wireless personal-area network"},{"key":"C","text":"wireless metropolitan-area network"},{"key":"D","text":"wireless local-area network."}],"answer":["C"]},{"number":201,"text":"Which type of wireless network is suitable for use in a home or office?","options":[{"key":"A","text":"wireless wide-area network"},{"key":"B","text":"wireless personal-area network"},{"key":"C","text":"wireless local-area network"},{"key":"D","text":"wireless metropolitan-area network"}],"answer":["C"]},{"number":202,"text":"Which access control component, implementation, or protocol indicates success or failure of a client-requested service with a PASS or FAIL message?","options":[{"key":"A","text":"accounting"},{"key":"B","text":"authentication"},{"key":"C","text":"802.1X"},{"key":"D","text":"authorization"}],"answer":["D"]},{"number":203,"text":"Which type of wireless network often makes use of devices mounted on buildings?","options":[{"key":"A","text":"wireless local-area network"},{"key":"B","text":"wireless metropolitan-area network"},{"key":"C","text":"wireless personal-area network"},{"key":"D","text":"wireless wide-area network"}],"answer":["B"]},{"number":204,"text":"Which access control component, implementation, or protocol collects and reports usage data?","options":[{"key":"A","text":"accounting"},{"key":"B","text":"authentication"},{"key":"C","text":"authorization"},{"key":"D","text":"802.1X"}],"answer":["A"]},{"number":205,"text":"Which access control component, implementation, or protocol audits what users actions are performed on the network?","options":[{"key":"A","text":"Accounting"},{"key":"B","text":"Authorization"},{"key":"C","text":"Authentication"},{"key":"D","text":"802.1X"}],"answer":["A"]},{"number":206,"text":"Which type of wireless network commonly uses Bluetooth or ZigBee devices?","options":[{"key":"A","text":"wireless wide-area network"},{"key":"B","text":"wireless personal-area network"},{"key":"C","text":"wireless local-area network"},{"key":"D","text":"wireless metropolitan-area network"}],"answer":["B"]},{"number":207,"text":"Which access control component, implementation, or protocol is implemented either locally or as a server-based solution?","options":[{"key":"A","text":"authorization"},{"key":"B","text":"802.1X"},{"key":"C","text":"accounting"},{"key":"D","text":"authentication"}],"answer":["D"]},{"number":208,"text":"A technician is troubleshooting a slow WLAN and decides to use the split-the-traffic approach. Which two parameters would have to be configured to do this? (Choose two.)","options":[{"key":"A","text":"Configure the 5 GHz band for streaming multimedia and time sensitive traffic."},{"key":"B","text":"Configure the security mode to WPA Personal TKIP/AES for one network and WPA2 Personal AES for the other network."},{"key":"C","text":"Configure the 2.4 GHz band for basic internet traffic that is not time sensitive."},{"key":"D","text":"Configure the security mode to WPA Personal TKIP/AES for both networks."},{"key":"E","text":"Configure a common SSID for both split networks."}],"answer":["A","C"]},{"number":209,"text":"Which access control component, implementation, or protocol restricts LAN access through publicly accessible switch ports?","options":[{"key":"A","text":"802.1X"},{"key":"B","text":"authorization"},{"key":"C","text":"accounting"},{"key":"D","text":"authentication"}],"answer":["A"]},{"number":210,"text":"A network administrator is required to upgrade wireless access to end users in a building. To provide data rates up to 1.3Gb/s and still be backward compatible with older devices, which wireless standard should be implemented?","options":[{"key":"A","text":"802.11g"},{"key":"B","text":"802.11n"},{"key":"C","text":"802.11ac"},{"key":"D","text":"802.11b"}],"answer":["C"]},{"number":211,"text":"Which feature on a Cisco router permits the forwarding of traffic for which there is no specific route?","options":[{"key":"A","text":"next-hop"},{"key":"B","text":"gateway of last resort"},{"key":"C","text":"route source"},{"key":"D","text":"outgoing interface"}],"answer":["B"]},{"number":212,"text":"Which three advantages are provided by static routing? (Choose three.)","options":[{"key":"A","text":"Static routing does not advertise over the network, thus providing better security."},{"key":"B","text":"Configuration of static routes is error-free."},{"key":"C","text":"Static routes scale well as the network grows."},{"key":"D","text":"Static routing typically uses less network bandwidth and fewer CPU operations than dynamic routing does."},{"key":"E","text":"The path a static route uses to send data is known."},{"key":"F","text":"No intervention is required to maintain changing route information."}],"answer":["A","D","E"]},{"number":213,"text":"What are two functions of dynamic routing protocols? (Choose two.)","options":[{"key":"A","text":"to maintain routing tables"},{"key":"B","text":"to assure low router overhead"},{"key":"C","text":"to avoid exposing network information"},{"key":"D","text":"to discover the network"},{"key":"E","text":"to choose the path that is specified by the administrator"}],"answer":["A","D"]},{"number":214,"text":"What is an advantage of using dynamic routing protocols instead of static routing?","options":[{"key":"A","text":"easier to implement"},{"key":"B","text":"more secure in controlling routing updates"},{"key":"C","text":"fewer router resource overhead requirements"},{"key":"D","text":"ability to actively search for new routes if the current path becomes unavailable"}],"answer":["D"]},{"number":215,"text":"What happens to a static route entry in a routing table when the outgoing interface associated with that route goes into the down state?","options":[{"key":"A","text":"The static route is removed from the routing table."},{"key":"B","text":"The router polls neighbors for a replacement route."},{"key":"C","text":"The router automatically redirects the static route to use another interface."},{"key":"D","text":"The static route remains in the table because it was defined as static."}],"answer":["A"]},{"number":216,"text":"What is a characteristic of a static route that matches all packets?","options":[{"key":"A","text":"It uses a single network address to send multiple static routes to one destination address."},{"key":"B","text":"It identifies the gateway IP address to which the router sends all IP packets for which it does not have a learned or static route."},{"key":"C","text":"It backs up a route already discovered by a dynamic routing protocol."},{"key":"D","text":"It is configured with a higher administrative distance than the original dynamic routing protocol has."}],"answer":["B"]},{"number":217,"text":"When would it be more beneficial to use a dynamic routing protocol instead of static routing?","options":[{"key":"A","text":"in an organization where routers suffer from performance issues"},{"key":"B","text":"on a stub network that has a single exit point"},{"key":"C","text":"in an organization with a smaller network that is not expected to grow in size"},{"key":"D","text":"on a network where there is a lot of topology changes"}],"answer":["D"]},{"number":218,"text":"Which route would be used to forward a packet with a source IP address of 192.168.10.1 and a destination IP address of 10.1.1.1?","options":[{"key":"A","text":"C 192.168.10.0/30 is directly connected, GigabitEthernet0/1"},{"key":"B","text":"O 10.1.1.0/24 [110/65] via 192.168.200.2, 00:01:20, Serial0/1/0"},{"key":"C","text":"S* 0.0.0.0/0 [1/0] via 172.16.1.1"},{"key":"D","text":"S 10.1.0.0/16 is directly connected, GigabitEthernet0/0"}],"answer":["B"]},{"number":219,"text":"Which value in a routing table represents trustworthiness and is used by the router to determine which route to install into the routing table when there are multiple routes toward the same destination?","options":[{"key":"A","text":"administrative distance"},{"key":"B","text":"metric"},{"key":"C","text":"outgoing interface"},{"key":"D","text":"routing protocol"}],"answer":["A"]},{"number":220,"text":"On which two routers would a default static route be configured? (Choose two.)","options":[{"key":"A","text":"any router where a backup route to dynamic routing is needed for reliability"},{"key":"B","text":"the router that serves as the gateway of last resort"},{"key":"C","text":"any router running an IOS prior to 12.0"},{"key":"D","text":"stub router connection to the rest of the corporate or campus network"},{"key":"E","text":"edge router connection to the ISP"}],"answer":["D","E"]},{"number":221,"text":"What is a characteristic of a floating static route?","options":[{"key":"A","text":"When it is configured, it creates a gateway of last resort."},{"key":"B","text":"It is used to provide load balancing between static routes."},{"key":"C","text":"It is simply a static route with 0.0.0.0/0 as the destination IPv4 address."},{"key":"D","text":"It is configured with a higher administrative distance than the original dynamic routing protocol has."}],"answer":["D"]},{"number":222,"text":"What network prefix and prefix-length combination is used to create a default static route that will match any IPv6 destination?","options":[{"key":"A","text":"FFFF::/128"},{"key":"B","text":"::1/64"},{"key":"C","text":"::/128"},{"key":"D","text":"::/0"}],"answer":["D"]},{"number":223,"text":"Consider the following command: ip route 192.168.10.0 255.255.255.0 10.10.10.2 5 What does the 5 at the end of the command signify?","options":[{"key":"A","text":"exit interface"},{"key":"B","text":"maximum number of hops to the 192.168.10.0/24 network"},{"key":"C","text":"metric"},{"key":"D","text":"administrative distance"}],"answer":["D"]},{"number":224,"text":"An administrator issues the ipv6 route 2001:db8:acad:1::/32 gigabitethernet0/0 2001:db8:acad:6::1 100 command on a router . What administrative distance is assigned to this route?","options":[{"key":"A","text":"0"},{"key":"B","text":"1"},{"key":"C","text":"32"},{"key":"D","text":"100"}],"answer":["D"]},{"number":225,"text":"What characteristic completes the following statement?When an IPv6 static route is configured, the next-hop address can be ......","options":[{"key":"A","text":"a destination host route with a /128 prefix."},{"key":"B","text":"the \"show ipv6 route static\" command."},{"key":"C","text":"an IPv6 link-local address on the adjacent router ."},{"key":"D","text":"the interface type and interface number ."}],"answer":["C"]},{"number":226,"text":"What two pieces of information are needed in a fully specified static route to eliminate recursive lookups? (Choose two.)","options":[{"key":"A","text":"the interface ID of the next-hop neighbor"},{"key":"B","text":"the interface ID exit interface"},{"key":"C","text":"the IP address of the exit interface"},{"key":"D","text":"the IP address of the next-hop neighbor"},{"key":"E","text":"the administrative distance for the destination network"}],"answer":["B","D"]},{"number":227,"text":"What route would have the lowest administrative distance?","options":[{"key":"A","text":"a route received through the OSPF routing protocol"},{"key":"B","text":"a directly connected network"},{"key":"C","text":"a static route"},{"key":"D","text":"a route received through the EIGRP routing protocol"}],"answer":["B"]},{"number":228,"text":"What characteristic completes the following statement?When an IPv6 static route is configured, as a backup route to a static route in the routing table, the \"distance\" command is used with ......","options":[{"key":"A","text":"the \"show ipv6 route static\" command."},{"key":"B","text":"an administrative distance of 2."},{"key":"C","text":"a destination host route with a /128 prefix."},{"key":"D","text":"the interface type and interface number ."}],"answer":["B"]},{"number":229,"text":"A router has used the OSPF protocol to learn a route to the 172.16.32.0/19 network. Which command will implement a backup floating static route to this network?","options":[{"key":"A","text":"ip route 172.16.0.0 255.255.224.0 S0/0/0 100"},{"key":"B","text":"ip route 172.16.0.0 255.255.240.0 S0/0/0 200"},{"key":"C","text":"ip route 172.16.32.0 255.255.224.0 S0/0/0 200"},{"key":"D","text":"ip route 172.16.32.0 255.255.0.0 S0/0/0 100"}],"answer":["C"]},{"number":230,"text":"Consider the following command: ip route 192.168.10.0 255.255.255.0 10.10.10.2 5 How would an administrator test this configuration?","options":[{"key":"A","text":"Delete the default gateway route on the router ."},{"key":"B","text":"Manually shut down the router interface used as a primary route."},{"key":"C","text":"Ping from the 192.168.10.0 network to the 10.10.10.2 address."},{"key":"D","text":"Ping any valid address on the 192.168.10.0/24 network."}],"answer":["B"]},{"number":231,"text":"Refer to the exhibit. Which type of IPv6 static route is configured in the exhibit? ipv6 route 2001:0DB8::/32 2001:0DB8:3000::1 [Refer to exhibit: open the source PDF at page 95.]","options":[{"key":"A","text":"floating static route"},{"key":"B","text":"fully specified static route"},{"key":"C","text":"recursive static route"},{"key":"D","text":"directly attached static route"}],"answer":["C"]},{"number":232,"text":"What characteristic completes the following statement?When an IPv6 static route is configured, it is first necessary to configure ......","options":[{"key":"A","text":"the next-hop address of two different adjacent routers."},{"key":"B","text":"the \"ipv6 unicast-routing\" command."},{"key":"C","text":"an IPv6 link-local address on the adjacent router ."},{"key":"D","text":"an administrative distance of 2."}],"answer":["B"]},{"number":233,"text":"Consider the following command: ip route 192.168.10.0 255.255.255.0 10.10.10.2 5 Which route would have to go down in order for this static route to appear in the routing table?","options":[{"key":"A","text":"a default route"},{"key":"B","text":"a static route to the 192.168.10.0/24 network"},{"key":"C","text":"an OSPF-learned route to the 192.168.10.0/24 network"},{"key":"D","text":"an EIGRP-learned route to the 192.168.10.0/24 network"}],"answer":["B"]},{"number":234,"text":"What are two advantages of static routing over dynamic routing? (Choose two.)","options":[{"key":"A","text":"Static routing is more secure because it does not advertise over the network."},{"key":"B","text":"Static routing scales well with expanding networks."},{"key":"C","text":"Static routing requires very little knowledge of the network for correct implementation."},{"key":"D","text":"Static routing uses fewer router resources than dynamic routing."},{"key":"E","text":"Static routing is relatively easy to configure for large networks."}],"answer":["A","D"]},{"number":235,"text":"What characteristic completes the following statement?When an IPv6 static route is configured, it is possible that the same IPv6 link-local address is used for ...","options":[{"key":"A","text":"a destination host route with a /128 prefix."},{"key":"B","text":"the \"ipv6 unicast-routing\" command."},{"key":"C","text":"the next-hop address of two different adjacent routers."},{"key":"D","text":"an administrative distance of 2."}],"answer":["C"]},{"number":236,"text":"A network administrator configures the interface fa0/0 on the router R1 with the command ip address 172.16.1.254 255.255.255.0. However , when the administrator issues the command show ip route, the routing table does not show the directly connected network. What is the possible cause of the problem?","options":[{"key":"A","text":"The subnet mask is incorrect for the IPv4 address."},{"key":"B","text":"The configuration needs to be saved first."},{"key":"C","text":"The interface fa0/0 has not been activated."},{"key":"D","text":"No packets with a destination network of 172.16.1.0 have been sent to R1."}],"answer":["C"]},{"number":237,"text":"What characteristic completes the following statement?When an IPv6 static route is configured, a fully-specified configuration should be used with ...","options":[{"key":"A","text":"::/0."},{"key":"B","text":"the \"ipv6 unicast-routing\" command."},{"key":"C","text":"the next-hop address of two different adjacent routers."},{"key":"D","text":"a directly connected multiaccess network."}],"answer":["D"]},{"number":238,"text":"What characteristic completes the following statement?When an IPv6 static route is configured, the installation of the route can be verified with ......","options":[{"key":"A","text":"a destination host route with a /128 prefix."},{"key":"B","text":"the interface type and interface number ."},{"key":"C","text":"the \"show ipv6 route static\" command."},{"key":"D","text":"an administrative distance of 2."}],"answer":["C"]},{"number":239,"text":"A network administrator configures the interface fa0/0 on the router R1 with the command ip address 172.16.1.254 255.255.255.0 . However , when the ad- ministrator issues the command show ip route , the routing table does not show the directly connected network. What is the possible cause of the problem?","options":[{"key":"A","text":"The subnet mask is incorrect for the IPv4 address."},{"key":"B","text":"No packets with a destination network of 172.16.1.0 have been sent to R1."},{"key":"C","text":"The configuration needs to be saved first."},{"key":"D","text":"The interface fa0/0 has not been activated."}],"answer":["D"]},{"number":240,"text":"Ipv6 route 2001:0DB8::/32 2001:0DB8:3000::1Which static route is configured here?","options":[{"key":"A","text":"Floating static"},{"key":"B","text":"Recursive static"},{"key":"C","text":"Directly attached static"},{"key":"D","text":"Fully specified static"}],"answer":["B"]},{"number":241,"text":"A network administrator is using the router-on-a-stick method to configure inter-VLAN routing. Switch port Gi1/1 is used to connect to the router . Which command should be entered to prepare this port for the task?","options":[{"key":"A","text":"Switch(config)# interface gigabitethernet 1/1 Switch(config-if)# spanning-tree vlan 1"},{"key":"B","text":"Switch(config)# interface gigabitethernet 1/1 Switch(config-if)# spanning-tree portfast"},{"key":"C","text":"Switch(config)# interface gigabitethernet 1/1 Switch(config-if)# switchport mode trunk"},{"key":"D","text":"Switch(config)# interface gigabitethernet 1/1 Switch(config-if)# switchport access vlan 1"}],"answer":["C"]},{"number":242,"text":"An employee connects wirelessly to the company network using a cell phone. The employee then configures the cell phone to act as a wireless access point that will allow new employees to connect to the company network. Which type of security threat best describes this situation?","options":[{"key":"A","text":"cracking"},{"key":"B","text":"denial of service"},{"key":"C","text":"rogue access point"},{"key":"D","text":"spoofing"}],"answer":["C"]},{"number":243,"text":"Which combination of WLAN authentication and encryption is recommended as a best practice for home users?","options":[{"key":"A","text":"WPA2 and AES"},{"key":"B","text":"WEP and RC4"},{"key":"C","text":"WPA and PSK"},{"key":"D","text":"EAP and AES"},{"key":"E","text":"WEP and TKIP"}],"answer":["A"]},{"number":244,"text":"What are the two methods that a wireless NIC can use to discover an AP? (Choose two.)","options":[{"key":"A","text":"transmitting a probe request"},{"key":"B","text":"sending an ARP request broadcast"},{"key":"C","text":"receiving a broadcast beacon frame"},{"key":"D","text":"initiating a three-way handshake"},{"key":"E","text":"sending a multicast frame"}],"answer":["A","C"]},{"number":245,"text":"What address and prefix length is used when configuring an IPv6 default static route?","options":[{"key":"A","text":"::/0"},{"key":"B","text":"::1/128"},{"key":"C","text":"0.0.0.0/0"},{"key":"D","text":"FF02::1/8"}],"answer":["A"]},{"number":246,"text":"Which statement describes the behavior of a switch when the MAC address table is full?","options":[{"key":"A","text":"It treats frames as unknown unicast and floods all incoming frames to all ports on the switch."},{"key":"B","text":"It treats frames as unknown unicast and floods all incoming frames to all ports across multiple switches."},{"key":"C","text":"It treats frames as unknown unicast and floods all incoming frames to all ports within the local VLAN."},{"key":"D","text":"It treats frames as unknown unicast and floods all incoming frames to all ports within the collision domain."}],"answer":["C"]},{"number":247,"text":"Which term describes the role of a Cisco switch in the 802.1X port-based access control?","options":[{"key":"A","text":"agent"},{"key":"B","text":"supplicant"},{"key":"C","text":"authenticator"},{"key":"D","text":"authentication server"}],"answer":["C"]},{"number":248,"text":"What is a result of connecting two or more switches together?","options":[{"key":"A","text":"The number of broadcast domains is increased."},{"key":"B","text":"The size of the broadcast domain is increased."},{"key":"C","text":"The number of collision domains is reduced."},{"key":"D","text":"The size of the collision domain is increased."}],"answer":["B"]},{"number":249,"text":"A small publishing company has a network design such that when a broadcast is sent on the LAN, 200 devices receive the transmitted broadcast. How can the network administrator reduce the number of devices that receive broadcast traffic?","options":[{"key":"A","text":"Add more switches so that fewer devices are on a particular switch."},{"key":"B","text":"Replace the switches with switches that have more ports per switch. This will allow more devices on a particular switch."},{"key":"C","text":"Segment the LAN into smaller LANs and route between them."},{"key":"D","text":"Replace at least half of the switches with hubs to reduce the size of the broadcast domain."}],"answer":["C"]},{"number":250,"text":"What are two switch characteristics that could help alleviate network congestion? (Choose two.)","options":[{"key":"A","text":"fast internal switching"},{"key":"B","text":"large frame buffers"},{"key":"C","text":"store-and-forward switching"},{"key":"D","text":"low port density"},{"key":"E","text":"frame check sequence (FCS) check"}],"answer":["A","B"]},{"number":251,"text":"A network engineer is configuring a LAN with a redundant first hop to make better use of the available network resources. Which protocol should the engineer implement?","options":[{"key":"A","text":"FHRP"},{"key":"B","text":"GLBP"},{"key":"C","text":"HSRP"},{"key":"D","text":"VRRP"}],"answer":["B"]},{"number":252,"text":"After sticky learning of MAC addresses is enabled, what action is needed to prevent dynamically learned MAC addresses from being lost in the event that an associated interface goes down?","options":[{"key":"A","text":"Reboot the switch."},{"key":"B","text":"Copy the running configuration to the startup configuration."},{"key":"C","text":"Shut down the interface then enable it again with the no shutdown command."},{"key":"D","text":"Configure port security for violation protect mode."}],"answer":["B"]},{"number":253,"text":"A small coffee shop is offering free Wi-Fi to customers. The network includes a wireless router and a DSL modem that is connected to the local phone company. What method is typically used to configure the connection to the phone company?","options":[{"key":"A","text":"Set the WAN connection in the wireless router as a DHCP client."},{"key":"B","text":"Set the connection between the wireless router and the DSL modem as a private IP network."},{"key":"C","text":"Set the DSL modem as a DHCP client to get a public IP address from the wireless router ."},{"key":"D","text":"Set the DSL modem as a DHCP client to the phone company and a DHCP server for the internal connection."}],"answer":["A"]},{"number":254,"text":"Which three components are combined to form a bridge ID?","options":[{"key":"A","text":"MAC address"},{"key":"B","text":"extended system ID"},{"key":"C","text":"IP address"},{"key":"D","text":"cost"},{"key":"E","text":"bridge priority"},{"key":"F","text":"port ID"}],"answer":["A","B","E"]},{"number":255,"text":"What is an advantage of PVST+?","options":[{"key":"A","text":"PVST+ requires fewer CPU cycles for all the switches in the network."},{"key":"B","text":"PVST+ reduces bandwidth consumption compared to traditional implementations of STP that use CST."},{"key":"C","text":"PVST+ optimizes performance on the network through autoselection of the root bridge."},{"key":"D","text":"PVST+ optimizes performance on the network through load sharing."}],"answer":["D"]},{"number":256,"text":"Which problem is evident if the show ip interface command shows that the interface is down and the line protocol is down?","options":[{"key":"A","text":"An encapsulation mismatch has occurred."},{"key":"B","text":"A cable has not been attached to the port."},{"key":"C","text":"The no shutdown command has not been issued on the interface."},{"key":"D","text":"There is an IP address conflict with the configured address on the interface."}],"answer":["B"]},{"number":257,"text":"A technician is configuring a new Cisco 2960 switch. What is the effect of issuing the BranchSw(config)#interface VLAN88 command?","options":[{"key":"A","text":"It updates the MAC address table for the associated port."},{"key":"B","text":"It applies an IPv4 address to the virtual interface."},{"key":"C","text":"It permits an IPv6 address to be configured on a switch physical interface."},{"key":"D","text":"It applies an IPv6 address to the virtual interface."},{"key":"E","text":"It enters configuration mode for a switch virtual interface."}],"answer":["E"]},{"number":258,"text":"In what situation would a Layer 2 switch have an IP address configured?","options":[{"key":"A","text":"when the Layer 2 switch is using a routed port"},{"key":"B","text":"when the Layer 2 switch needs to be remotely managed"},{"key":"C","text":"when the Layer 2 switch is the default gateway of user traffic"},{"key":"D","text":"when the Layer 2 switch needs to forward user traffic to another device"}],"answer":["B"]},{"number":259,"text":"Which command would create a valid IPv6 default route?","options":[{"key":"A","text":"ipv6 route ::/0 2001:db8:acad:2::a"},{"key":"B","text":"ipv6 route ::/0 fe80::1"},{"key":"C","text":"ipv6 route ::/128 2001:db8:acad:1::1"},{"key":"D","text":"ipv6 route 2001:db8:acad:1::/64 ::1"}],"answer":["A"]},{"number":260,"text":"A junior technician was adding a route to a LAN router . A traceroute to a device on the new network revealed a wrong path and unreachable status. What should be done or checked?","options":[{"key":"A","text":"Create a floating static route to that network."},{"key":"B","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"C","text":"Check the configuration of the exit interface on the new static route."},{"key":"D","text":"Verify that the static route to the server is present in the routing table."}],"answer":["C"]},{"number":261,"text":"Which command will start the process to bundle two physical interfaces to create an EtherChannel group via LACP?","options":[{"key":"A","text":"channel-group 2 mode auto"},{"key":"B","text":"interface port-channel 2"},{"key":"C","text":"channel-group 1 mode desirable"},{"key":"D","text":"interface range GigabitEthernet 0/4 - 5"}],"answer":["D"]},{"number":262,"text":"Which type of traffic is designed for a native VLAN?","options":[{"key":"A","text":"management"},{"key":"B","text":"user-generated"},{"key":"C","text":"tagged"},{"key":"D","text":"untagged"}],"answer":["D"]},{"number":263,"text":"What type of VLAN is configured specifically for network traffic such as SSH, Telnet, HTTPS, HTTP , and SNMP?","options":[{"key":"A","text":"management VLAN"},{"key":"B","text":"security VLAN"},{"key":"C","text":"trunk VLAN"},{"key":"D","text":"voice VLAN"}],"answer":["A"]},{"number":264,"text":"A network administrator is implementing DHCPv6 for the company. The administrator configures a router to send RA messages with M flag as 1 by using the interface command ipv6 nd managed-config-flag . What effect will this configuration have on the operation of the clients?","options":[{"key":"A","text":"Clients must use the information that is contained in RA messages."},{"key":"B","text":"Clients must use all configuration information that is provided by a DHCPv6 server ."},{"key":"C","text":"Clients must use the prefix and prefix length that are provided by a DHCPv6 server and generate a random interface ID."},{"key":"D","text":"Clients must use the prefix and prefix length that are provided by RA messages and obtain additional information from a DHCPv6 server ."}],"answer":["B"]},{"number":265,"text":"On which port should Dynamic ARP Inspection (DAI) be configured on a switch?","options":[{"key":"A","text":"access ports only"},{"key":"B","text":"any untrusted port"},{"key":"C","text":"an uplink port to another switch"},{"key":"D","text":"on any port where DHCP snooping is disabled"}],"answer":["C"]},{"number":266,"text":"Which Cisco solution helps prevent ARP spoofing and ARP poisoning attacks?","options":[{"key":"A","text":"Dynamic ARP Inspection"},{"key":"B","text":"IP Source Guard"},{"key":"C","text":"DHCP Snooping"},{"key":"D","text":"Port Security"}],"answer":["A"]},{"number":267,"text":"What is the reason for disabling SSID broadcasting and changing the default SSID on a wireless access point?","options":[{"key":"A","text":"Wireless clients must then have the SSID manually configured to connect to the wireless network."},{"key":"B","text":"Disabling SSID broadcasting frees up radio frequency bandwidth and increases the data throughput of the access point."},{"key":"C","text":"Anyone with the default SSID can gain access to the access point and change the configuration."},{"key":"D","text":"The access point stops broadcasting its own MAC address, thus preventing unauthorized wireless clients from connecting to the network."}],"answer":["A"]},{"number":268,"text":"What are two characteristics of Cisco Express Forwarding (CEF)? (Choose two.)","options":[{"key":"A","text":"When a packet arrives on a router interface, it is forwarded to the control plane where the CPU searches for a match in the fast-switching cache."},{"key":"B","text":"This is the fastest forwarding mechanism on Cisco routers and multilayer switches."},{"key":"C","text":"With this switching method, flow information for a packet is stored in the fast-switching cache to forward future packets to the same destination without CPU intervention."},{"key":"D","text":"When a packet arrives on a router interface, it is forwarded to the control plane where the CPU matches the destination address with a matching routing table entry."},{"key":"E","text":"Packets are forwarded based on information in the FIB and an adjacency table."}],"answer":["B","E"]},{"number":269,"text":"A network administrator of a college is configuring WLAN security with WPA2 Enterprise authentication. Which server is required when deploying this type of authentication?","options":[{"key":"A","text":"AAA"},{"key":"B","text":"RADIUS"},{"key":"C","text":"DHCP"},{"key":"D","text":"SNMP"}],"answer":["B"]},{"number":270,"text":"What is a potential issue when using the WLC to upgrade and deploy the latest firmware image to all APs?","options":[{"key":"A","text":"Usernames and passwords must be manually entered into the AP so that WLAN authentication continues during the upgrade."},{"key":"B","text":"Only one of the two bands would work at a time."},{"key":"C","text":"Users will not be able to use the WLAN."},{"key":"D","text":"Old 802.11 standards may not be supported anymore."}],"answer":["C"]},{"number":271,"text":"A network administrator is configuring a WLC to provide WLAN access to users in an office building. When testing the newly created WLAN, the administrator does not see the SSID from a wireless device. What is a possible cause?","options":[{"key":"A","text":"The WLAN security setting is incorrect."},{"key":"B","text":"The APs have not been configured for the new WLAN."},{"key":"C","text":"The new WLAN needs to be enabled."},{"key":"D","text":"The RADUIS server is not operational."}],"answer":["C"]},{"number":272,"text":"What is the best way to prevent a VLAN hopping attack?","options":[{"key":"A","text":"Disable trunk negotiation for trunk ports and statically set nontrunk ports as access ports."},{"key":"B","text":"Disable STP on all nontrunk ports."},{"key":"C","text":"Use VLAN 1 as the native VLAN on trunk ports."},{"key":"D","text":"Use ISL encapsulation on all trunk links."}],"answer":["A"]},{"number":273,"text":"Which option shows a correctly configured IPv4 default static route?","options":[{"key":"A","text":"ip route 0.0.0.0 255.255.255.0 S0/0/0"},{"key":"B","text":"ip route 0.0.0.0 0.0.0.0 S0/0/0"},{"key":"C","text":"ip route 0.0.0.0 255.255.255.255 S0/0/0"},{"key":"D","text":"ip route 0.0.0.0 255.0.0.0 S0/0/0"}],"answer":["B"]},{"number":274,"text":"What is a method to launch a VLAN hopping attack?","options":[{"key":"A","text":"introducing a rogue switch and enabling trunking"},{"key":"B","text":"sending spoofed native VLAN information"},{"key":"C","text":"sending spoofed IP addresses from the attacking host"},{"key":"D","text":"flooding the switch with MAC addresses"}],"answer":["A"]},{"number":275,"text":"A cybersecurity analyst is using the macof tool to evaluate configurations of switches deployed in the backbone network of an organization. Which type of LAN attack is the analyst targeting during this evaluation?","options":[{"key":"A","text":"VLAN hopping"},{"key":"B","text":"DHCP spoofing"},{"key":"C","text":"MAC address table overflow"},{"key":"D","text":"VLAN double-tagging"}],"answer":["C"]},{"number":276,"text":"Which statement is correct about how a Layer 2 switch determines how to forward frames?","options":[{"key":"A","text":"Frame forwarding decisions are based on MAC address and port mappings in the CAM table."},{"key":"B","text":"Only frames with a broadcast destination address are forwarded out all active switch ports."},{"key":"C","text":"Unicast frames are always forwarded regardless of the destination MAC address."},{"key":"D","text":"Cut-through frame forwarding ensures that invalid frames are always dropped."}],"answer":["A"]},{"number":277,"text":"Which statement describes a result after multiple Cisco LAN switches are interconnected?","options":[{"key":"A","text":"The broadcast domain expands to all switches."},{"key":"B","text":"One collision domain exists per switch."},{"key":"C","text":"There is one broadcast domain and one collision domain per switch."},{"key":"D","text":"Frame collisions increase on the segments connecting the switches."},{"key":"E","text":"Unicast frames are always forwarded regardless of the destination MAC address."}],"answer":["A"]},{"number":278,"text":"An administrator is trying to remove configurations from a switch. After using the command erase startup-config and reloading the switch, the administrator finds that VLANs 10 and 100 still exist on the switch. Why were these VLANs not removed?","options":[{"key":"A","text":"Because these VLANs are stored in a file that is called vlan.dat that is located in flash memory, this file must be manually deleted."},{"key":"B","text":"These VLANs cannot be deleted unless the switch is in VTP client mode."},{"key":"C","text":"These VLANs are default VLANs that cannot be removed."},{"key":"D","text":"These VLANs can only be removed from the switch by using the no vlan 10 and no vlan 100 commands."}],"answer":["A"]},{"number":279,"text":"What is a secure configuration option for remote access to a network device?","options":[{"key":"A","text":"Configure an ACL and apply it to the VTY lines."},{"key":"B","text":"Configure 802.1x."},{"key":"C","text":"Configure SSH."},{"key":"D","text":"Configure Telnet."}],"answer":["C"]},{"number":280,"text":"Which wireless encryption method is the most secure?","options":[{"key":"A","text":"WPA2 with AES"},{"key":"B","text":"WPA2 with TKIP"},{"key":"C","text":"WEP"},{"key":"D","text":"WPA"}],"answer":["A"]},{"number":281,"text":"After attaching four PCs to the switch ports, configuring the SSID and setting authentication properties for a small office network, a technician successfully tests the connectivity of all PCs that are connected to the switch and WLAN. A firewall is then configured on the device prior to connecting it to the Internet. What type of network device includes all of the described features?","options":[{"key":"A","text":"firewall appliance"},{"key":"B","text":"wireless router"},{"key":"C","text":"switch"},{"key":"D","text":"standalone wireless access point"}],"answer":["B"]},{"number":282,"text":"What protocol or technology disables redundant paths to eliminate Layer 2 loops?","options":[{"key":"A","text":"VTP"},{"key":"B","text":"STP"},{"key":"C","text":"EtherChannel"},{"key":"D","text":"DTP"}],"answer":["B"]},{"number":283,"text":"Which two VTP modes allow for the creation, modification, and deletion of VLANs on the local switch? (Choose two.)","options":[{"key":"A","text":"client"},{"key":"B","text":"master"},{"key":"C","text":"distribution"},{"key":"D","text":"slave"},{"key":"E","text":"server"},{"key":"F","text":"transparent"}],"answer":["E","F"]},{"number":284,"text":"Which three steps should be taken before moving a Cisco switch to a new VTP management domain? (Choose three.)","options":[{"key":"A","text":"Configure the switch with the name of the new management domain."},{"key":"B","text":"Reset the VTP counters to allow the switch to synchronize with the other switches in the domain."},{"key":"C","text":"Configure the VTP server in the domain to recognize the BID of the new switch."},{"key":"D","text":"Download the VTP database from the VTP server in the new domain."},{"key":"E","text":"Select the correct VTP mode and version."},{"key":"F","text":"Reboot the switch."}],"answer":["A","E","F"]},{"number":285,"text":"A network administrator is preparing the implementation of Rapid PVST+ on a production network. How are the Rapid PVST+ link types determined on the switch interfaces?","options":[{"key":"A","text":"Link types can only be configured on access ports configured with a single VLAN."},{"key":"B","text":"Link types can only be determined if PortFast has been configured."},{"key":"C","text":"Link types are determined automatically."},{"key":"D","text":"Link types must be configured with specific port configuration commands."}],"answer":["C"]},{"number":286,"text":"How will a router handle static routing differently if Cisco Express Forwarding is disabled?","options":[{"key":"A","text":"It will not perform recursive lookups."},{"key":"B","text":"Ethernet multiaccess interfaces will require fully specified static routes to avoid routing inconsistencies."},{"key":"C","text":"Static routes that use an exit interface will be unnecessary."},{"key":"D","text":"Serial point-to-point interfaces will require fully specified static routes to avoid routing inconsistencies."}],"answer":["B"]},{"number":287,"text":"Compared with dynamic routes, what are two advantages of using static routes on a router? (Choose two.)","options":[{"key":"A","text":"They improve netw ork security."},{"key":"B","text":"They take less time to converge when the network topology changes."},{"key":"C","text":"They improve the efficiency of discovering neighboring networks."},{"key":"D","text":"They use fewer router resources."}],"answer":["A","D"]},{"number":288,"text":"What is the effect of entering the spanning-tree portfast configuration command on a switch?","options":[{"key":"A","text":"It disables an unused port."},{"key":"B","text":"It disables all trunk ports."},{"key":"C","text":"It enables portfast on a specific switch interface."},{"key":"D","text":"It checks the source L2 address in the Ethernet header against the sender L2 address in the ARP body."}],"answer":["C"]},{"number":289,"text":"What is the IPv6 prefix that is used for link-local addresses?","options":[{"key":"A","text":"FF01::/8"},{"key":"B","text":"2001::/3"},{"key":"C","text":"FC00::/7"},{"key":"D","text":"FE80::/10"}],"answer":["D"]},{"number":290,"text":"Which two statements are characteristics of routed ports on a multilayer switch? (Choose two.)","options":[{"key":"A","text":"In a switched network, they are mostly configured between switches at the core and distribution layers."},{"key":"B","text":"The interface vlan command has to be entered to create a VLAN on routed ports."},{"key":"C","text":"They support subinterfaces, like interfaces on the Cisco IOS routers."},{"key":"D","text":"They are used for point-to-multipoint links."},{"key":"E","text":"They are not associated with a particular VLAN."}],"answer":["A","E"]},{"number":291,"text":"Successful inter-VLAN routing has been operating on a network with multiple VLANs across multiple switches for some time. When an inter-switch trunk link fails and Spanning Tree Protocol brings up a back- up trunk link, it is reported that hosts on two VLANs can access some, but not all the network resources that could be accessed previously. Hosts on all other VLANS do not have this problem. What is the most likely cause of this problem?","options":[{"key":"A","text":"The protected edge port function on the backup trunk interfaces has been disabled."},{"key":"B","text":"The allowed VLANs on the backup link were not configured correctly."},{"key":"C","text":"Dynamic Trunking Protocol on the link has failed."},{"key":"D","text":"Inter-VLAN routing also failed when the trunk link failed."}],"answer":["A"]},{"number":292,"text":"Which command will start the process to bundle two physical interfaces to create an EtherChannel group via LACP?","options":[{"key":"A","text":"interface port-channel 2"},{"key":"B","text":"channel-group 1 mode desirable"},{"key":"C","text":"interface range GigabitEthernet 0/4 - 5"},{"key":"D","text":"channel-group 2 mode auto"}],"answer":["C"]},{"number":293,"text":"What action takes place when a frame entering a switch has a multicast destination MAC address?","options":[{"key":"A","text":"The switch will forward the frame out all ports except the incoming port."},{"key":"B","text":"The switch forwards the frame out of the specified port."},{"key":"C","text":"The switch adds a MAC address table entry mapping for the destination MAC address and the ingress port."},{"key":"D","text":"The switch replaces the old entry and uses the more current port."}],"answer":["A"]},{"number":294,"text":"A junior technician was adding a route to a LAN router . A traceroute to a device on the new network revealed a wrong path and unreachable status. What should be done or checked?","options":[{"key":"A","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"B","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"C","text":"Create a floating static route to that network."},{"key":"D","text":"Check the configuration of the exit interface on the new static route."}],"answer":["D"]},{"number":295,"text":"Select the three PAgP channel establishment modes. (Choose three.)","options":[{"key":"A","text":"auto"},{"key":"B","text":"default"},{"key":"C","text":"passive"},{"key":"D","text":"desirable"},{"key":"E","text":"extended"},{"key":"F","text":"on"}],"answer":["A","D","F"]},{"number":296,"text":"A static route has been configured on a router . However , the destination network no longer exists. What should an administrator do to remove the static route from the routing table?","options":[{"key":"A","text":"Remove the route using the no ip route command."},{"key":"B","text":"Change the administrative distance for that route."},{"key":"C","text":"Change the routing metric for that route."},{"key":"D","text":"Nothing. The static route will go away on its own."}],"answer":["A"]},{"number":297,"text":"What two default wireless router settings can affect network security? (Choose two.)","options":[{"key":"A","text":"The SSID is broadcast."},{"key":"B","text":"MAC address filtering is enabled."},{"key":"C","text":"WEP encryption is enabled."},{"key":"D","text":"The wireless channel is automatically selected."},{"key":"E","text":"A well-known administrator password is set."}],"answer":["A","E"]},{"number":298,"text":"What is the common term given to SNMP log messages that are generated by network devices and sent to the SNMP server?","options":[{"key":"A","text":"traps"},{"key":"B","text":"acknowledgments"},{"key":"C","text":"auditing"},{"key":"D","text":"warnings"}],"answer":["A"]},{"number":299,"text":"A network administrator is adding a new WLAN on a Cisco 3500 series WLC. Which tab should the administrator use to create a new VLAN interface to be used for the new WLAN?","options":[{"key":"A","text":"WIRELESS"},{"key":"B","text":"MANAGEMENT"},{"key":"C","text":"CONTROLLER"},{"key":"D","text":"WLANs"}],"answer":["C"]},{"number":300,"text":"A network administrator is configuring a WLAN. Why would the administrator change the default DHCP IPv4 addresses on an AP?","options":[{"key":"A","text":"to restrict access to the WLAN by authorized, authenticated users only"},{"key":"B","text":"to monitor the operation of the wireless network"},{"key":"C","text":"to reduce outsiders intercepting data or accessing the wireless network by using a well-known address range"},{"key":"D","text":"to reduce the risk of interference by external devices such as microwave ovens"}],"answer":["C"]},{"number":301,"text":"Which two functions are performed by a WLC when using split media access control (MAC)? (Choose two.)","options":[{"key":"A","text":"packet acknowledgments and retransmissions"},{"key":"B","text":"frame queuing and packet prioritization"},{"key":"C","text":"beacons and probe responses"},{"key":"D","text":"frame translation to other protocols"},{"key":"E","text":"association and re-association of roaming clients"}],"answer":["D","E"]},{"number":302,"text":"On what switch ports should BPDU guard be enabled to enhance STP stability?","options":[{"key":"A","text":"all PortFast-enabled ports"},{"key":"B","text":"only ports that are elected as designated ports"},{"key":"C","text":"only ports that attach to a neighboring switch"},{"key":"D","text":"all trunk ports that are not root ports"}],"answer":["A"]},{"number":303,"text":"Which network attack is mitigated by enabling BPDU guard?","options":[{"key":"A","text":"rogue switches on a network"},{"key":"B","text":"CAM table overflow attacks"},{"key":"C","text":"MAC address spoofing"},{"key":"D","text":"rogue DHCP servers on a network"}],"answer":["A"]},{"number":304,"text":"Why is DHCP snooping required when using the Dynamic ARP Inspection feature?","options":[{"key":"A","text":"It relies on the settings of trusted and untrusted ports set by DHCP snooping."},{"key":"B","text":"It uses the MAC address table to verify the default gateway IP address."},{"key":"C","text":"It redirects ARP requests to the DHCP server for verification."},{"key":"D","text":"It uses the MAC-address-to-IP-address binding database to validate an ARP packet."}],"answer":["D"]},{"number":305,"text":"A network administrator is configuring a new Cisco switch for remote management access. Which three items must be configured on the switch for the task? (Choose three.)","options":[{"key":"A","text":"IP address"},{"key":"B","text":"VTP domain"},{"key":"C","text":"vty lines"},{"key":"D","text":"default VLAN"},{"key":"E","text":"default gateway"},{"key":"F","text":"loopback address"}],"answer":["A","C","E"]},{"number":306,"text":"A technician is troubleshooting a slow WLAN and decides to use the split-the-traffic approach. Which two parameters would have to be configured to do this? (Choose two.)","options":[{"key":"A","text":"Configure the 5 GHz band for streaming multimedia and time sensitive traffic."},{"key":"B","text":"Configure the security mode to WPA Personal TKIP/AES for one network and WPA2 Personal AES for the other network"},{"key":"C","text":"Configure the 2.4 GHz band for basic internet traffic that is not time sensitive."},{"key":"D","text":"Configure the security mode to WPA Personal TKIP/AES for both networks."},{"key":"E","text":"Configure a common SSID for both split networks."}],"answer":["A","C"]},{"number":307,"text":"A company has just switched to a new ISP . The ISP has completed and checked the connection from its site to the company. However , employees at the company are not able to access the internet. What should be done or checked?","options":[{"key":"A","text":"Verify that the static route to the server is present in the routing table."},{"key":"B","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"C","text":"Ensure that the old default route has been removed from the company edge routers."},{"key":"D","text":"Create a floating static route to that network."}],"answer":["C"]},{"number":308,"text":"Which information does a switch use to populate the MAC address table?","options":[{"key":"A","text":"the destination MAC address and the incoming port"},{"key":"B","text":"the destination MAC address and the outgoing port"},{"key":"C","text":"the source and destination MAC addresses and the incoming port"},{"key":"D","text":"the source and destination MAC addresses and the outgoing port"},{"key":"E","text":"the source MAC address and the incoming port"},{"key":"F","text":"the source MAC address and the outgoing port"}],"answer":["E"]},{"number":309,"text":"Which type of static route is configured with a greater administrative distance to provide a backup route to a route learned from a dynamic routing protocol?","options":[{"key":"A","text":"floating static route"},{"key":"B","text":"default static route"},{"key":"C","text":"summary static route"},{"key":"D","text":"standard static route"}],"answer":["A"]},{"number":310,"text":"What action takes place when a frame entering a switch has a unicast destination MAC address appearing in the MAC address table?","options":[{"key":"A","text":"The switch updates the refresh timer for the entry."},{"key":"B","text":"The switch forwards the frame out of the specified port."},{"key":"C","text":"The switch purges the entire MAC address table."},{"key":"D","text":"The switch replaces the old entry and uses the more current port."}],"answer":["B"]},{"number":311,"text":"What protocol or technology allows data to transmit over redundant switch links?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"DTP"},{"key":"C","text":"STP"},{"key":"D","text":"VTP"}],"answer":["A"]},{"number":312,"text":"What is the effect of entering the shutdown configuration command on a switch?","options":[{"key":"A","text":"It enables BPDU guard on a specific port."},{"key":"B","text":"It disables an unused port."},{"key":"C","text":"It enables portfast on a specific switch interface."},{"key":"D","text":"It disables DTP on a non-trunking interface."}],"answer":["B"]},{"number":313,"text":"What would be the primary reason an attacker would launch a MAC address overflow attack?","options":[{"key":"A","text":"so that the switch stops forwarding traffic"},{"key":"B","text":"so that legitimate hosts cannot obtain a MAC address"},{"key":"C","text":"so that the attacker can see frames that are destined for other hosts"},{"key":"D","text":"so that the attacker can execute arbitrary code on the switch"}],"answer":["C"]},{"number":314,"text":"During the AAA process, when will authorization be implemented?","options":[{"key":"A","text":"Immediately after successful authentication against an AAA data source"},{"key":"B","text":"Immediately after AAA accounting and auditing receives detailed reports"},{"key":"C","text":"Immediately after an AAA client sends authentication information to a centralized server"},{"key":"D","text":"Immediately after the determination of which resources a user can access"}],"answer":["A"]},{"number":315,"text":"A company security policy requires that all MAC addressing be dynamically learned and added to both the MAC address table and the running configuration on each switch. Which port security configuration will accomplish this?","options":[{"key":"A","text":"auto secure MAC addresses"},{"key":"B","text":"dynamic secure MAC addresses"},{"key":"C","text":"static secure MAC addresses"},{"key":"D","text":"sticky secure MAC addresses"}],"answer":["D"]},{"number":316,"text":"Which three Wi-Fi standards operate in the 2.4GHz range of frequencies? (Choose three.)","options":[{"key":"A","text":"802.11a"},{"key":"B","text":"802.11b"},{"key":"C","text":"802.11g"},{"key":"D","text":"802.11n"},{"key":"E","text":"802.11ac"}],"answer":["B","C","D"]},{"number":317,"text":"To obtain an overview of the spanning tree status of a switched network, a network engineer issues the show spanning-tree command on a switch. Which two items of information will this command display? (Choose two.)","options":[{"key":"A","text":"The root bridge BID."},{"key":"B","text":"The role of the ports in all VLANs."},{"key":"C","text":"The status of native VLAN ports."},{"key":"D","text":"The number of broadcasts received on each root port."},{"key":"E","text":"The IP address of the management VLAN interface."}],"answer":["A","B"]},{"number":318,"text":"Which method of IPv6 prefix assignment relies on the prefix contained in RA messages?","options":[{"key":"A","text":"EUI-64"},{"key":"B","text":"SLAAC"},{"key":"C","text":"static"},{"key":"D","text":"stateful DHCPv6"}],"answer":["B"]},{"number":319,"text":"Which two protocols are used to provide server-based AAA authentication? (Choose two.)","options":[{"key":"A","text":"802.1x"},{"key":"B","text":"SSH"},{"key":"C","text":"SNMP"},{"key":"D","text":"TACACS+"},{"key":"E","text":"RADIUS"}],"answer":["D","E"]},{"number":320,"text":"A network administrator is configuring a WLAN. Why would the administrator disable the broadcast feature for the SSID?","options":[{"key":"A","text":"to eliminate outsiders scanning for available SSIDs in the area"},{"key":"B","text":"to reduce the risk of interference by external devices such as microwave ovens"},{"key":"C","text":"to reduce the risk of unauthorized APs being added to the network"},{"key":"D","text":"to provide privacy and integrity to wireless traffic by using encryption"}],"answer":["A"]},{"number":321,"text":"Which mitigation technique would prevent rogue servers from providing false IP configuration parameters to clients?","options":[{"key":"A","text":"implementing port security"},{"key":"B","text":"turning on DHCP snooping"},{"key":"C","text":"disabling CDP on edge ports"},{"key":"D","text":"implementing port-security on edge ports"}],"answer":["B"]},{"number":322,"text":"A network administrator configures the port security feature on a switch. The security policy specifies that each access port should allow up to two MAC addresses. When the maximum number of MAC addresses is reached, a frame with the unknown source MAC address is dropped and a notification is sent to the syslog server . Which security violation mode should be configured for each access port?","options":[{"key":"A","text":"shutdown"},{"key":"B","text":"restrict"},{"key":"C","text":"warning"},{"key":"D","text":"protect"}],"answer":["B"]},{"number":323,"text":"What protocol or technology defines a group of routers, one of them defined as active and another one as standby?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"VTP"},{"key":"C","text":"HSRP"},{"key":"D","text":"DTP"}],"answer":["C"]},{"number":324,"text":"Which three pairs of trunking modes will establish a functional trunk link between two Cisco switches? (Choose three.)","options":[{"key":"A","text":"dynamic auto - dynamic auto"},{"key":"B","text":"access - trunk"},{"key":"C","text":"dynamic desirable - trunk"},{"key":"D","text":"access - dynamic auto"},{"key":"E","text":"dynamic desirable - dynamic desirable"},{"key":"F","text":"dynamic desirable - dynamic auto"}],"answer":["C","E","F"]},{"number":325,"text":"A technician is configuring a router for a small company with multiple WLANs and doesn't need the complexity of a dynamic routing protocol. What should be done or checked?","options":[{"key":"A","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"B","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"C","text":"Create extra static routes to the same location with an AD of 1."},{"key":"D","text":"Check the statistics on the default route for oversaturation."}],"answer":["B"]},{"number":326,"text":"A company is deploying a wireless network in the distribution facility in a Boston suburb. The warehouse is quite large and it requires multiple access points to be used. Because some of the company devices still operate at 2.4GHz, the network administrator decides to deploy the 802.11g standard. Which channel assignments on the multiple access points will make sure that the wireless channels are not overlapping?","options":[{"key":"A","text":"channels 1, 5, and 9"},{"key":"B","text":"channels 1, 6, and 11"},{"key":"C","text":"channels 1, 7, and 13"},{"key":"D","text":"channels 2, 6, and 10"}],"answer":["B"]},{"number":327,"text":"A network administrator of a small advertising company is configuring WLAN security by using the WPA2 PSK method. Which credential do office users need in order to connect their laptops to the WLAN?","options":[{"key":"A","text":"the company username and password through Active Directory service"},{"key":"B","text":"a key that matches the key on the AP"},{"key":"C","text":"a user passphrase"},{"key":"D","text":"a username and password configured on the AP"}],"answer":["B"]},{"number":328,"text":"What mitigation plan is best for thwarting a DoS attack that is creating a MAC address table overflow?","options":[{"key":"A","text":"Disable DTP ."},{"key":"B","text":"Disable STP ."},{"key":"C","text":"Enable port security."},{"key":"D","text":"Place unused ports in an unused VLAN."}],"answer":["C"]},{"number":329,"text":"Why might this solution improve the wireless network performance for that type of service?","options":[{"key":"A","text":"Requiring the users to switch to the 5 GHz band for streaming media is inconvenient and will result in fewer users accessing these services."},{"key":"B","text":"The 5 GHz band has more channels and is less crowded than the 2.4 GHz band, which makes it more suited to streaming multimedia."},{"key":"C","text":"The 5 GHz band has a greater range and is therefore likely to be interference-free."},{"key":"D","text":"The only users that can switch to the 5 GHz band will be those with the latest wireless NICs, which will reduce usage."}],"answer":["B"]},{"number":330,"text":"Which DHCPv4 message will a client send to accept an IPv4 address that is offered by a DHCP server?","options":[{"key":"A","text":"broadcast DHCPACK"},{"key":"B","text":"broadcast DHCPREQUEST"},{"key":"C","text":"unicast DHCPACK"},{"key":"D","text":"unicast DHCPREQUEST"}],"answer":["B"]},{"number":331,"text":"After a host has generated an IPv6 address by using the DHCPv6 or SLAAC process, how does the host verify that the address is unique and therefore usable?","options":[{"key":"A","text":"The host sends an ICMPv6 echo request message to the DHCPv6 or SLAAC-learned address and if no reply is returned, the address is considered unique."},{"key":"B","text":"The host sends an ICMPv6 neighbor solicitation message to the DHCP or SLAAC-learned address and if no neighbor advertisement is returned, the address is considered unique."},{"key":"C","text":"The host checks the local neighbor cache for the learned address and if the address is not cached, it it considered unique."},{"key":"D","text":"The host sends an ARP broadcast to the local link and if no hosts send a reply, the address is considered unique."}],"answer":["B"]},{"number":332,"text":"What network attack seeks to create a DoS for clients by preventing them from being able to obtain a DHCP lease?","options":[{"key":"A","text":"IP address spoofing"},{"key":"B","text":"DHCP starvation"},{"key":"C","text":"CAM table attack"},{"key":"D","text":"DHCP spoofing"}],"answer":["B"]},{"number":333,"text":"What protocol or technology uses source IP to destination IP as a load-balancing mechanism?","options":[{"key":"A","text":"VTP"},{"key":"B","text":"EtherChannel"},{"key":"C","text":"DTP"},{"key":"D","text":"STP"}],"answer":["B"]},{"number":334,"text":"What protocol should be disabled to help mitigate VLAN attacks?","options":[{"key":"A","text":"CDP"},{"key":"B","text":"ARP"},{"key":"C","text":"STP"},{"key":"D","text":"DTP"}],"answer":["D"]},{"number":335,"text":"What protocol or technology requires switches to be in server mode or client mode?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"STP"},{"key":"C","text":"VTP"},{"key":"D","text":"DTP"}],"answer":["C"]},{"number":336,"text":"What are two reasons a network administrator would segment a network with a Layer 2 switch? (Choose two.)","options":[{"key":"A","text":"to create fewer collision domains"},{"key":"B","text":"to enhance user bandwidth"},{"key":"C","text":"to create more broadcast domains"},{"key":"D","text":"to eliminate virtual circuits"},{"key":"E","text":"to isolate traffic between segments"},{"key":"F","text":"to isolate ARP request messages from the rest of the network"}],"answer":["B","E"]},{"number":337,"text":"What command will enable a router to begin sending messages that allow it to configure a link-local address without using an IPv6 DHCP server?","options":[{"key":"A","text":"a static route"},{"key":"B","text":"the ipv6 route ::/0 command"},{"key":"C","text":"the ipv6 unicast-routing command"},{"key":"D","text":"the ip routing command"}],"answer":["C"]},{"number":338,"text":"A network administrator is using the router-on-a-stick model to configure a switch and a router for inter-VLAN routing. What configuration should be made on the switch port that connects to the router?","options":[{"key":"A","text":"Configure it as a trunk port and allow only untagged traffic."},{"key":"B","text":"Configure the port as an access port and a member of VLAN1."},{"key":"C","text":"Configure the port as an 802.1q trunk port."},{"key":"D","text":"Configure the port as a trunk port and assign it to VLAN1."}],"answer":["C"]},{"number":339,"text":"What are three techniques for mitigating VLAN attacks? (Choose three.)","options":[{"key":"A","text":"Use private VLANs."},{"key":"B","text":"Enable BPDU guard."},{"key":"C","text":"Enable trunking manually"},{"key":"D","text":"Enable Source Guard."},{"key":"E","text":"Disable DTP ."},{"key":"F","text":"Set the native VLAN to an unused VLAN."}],"answer":["C","E","F"]},{"number":340,"text":"In which situation would a technician use the show interfaces switch command?","options":[{"key":"A","text":"to determine if remote access is enabled"},{"key":"B","text":"when packets are being dropped from a particular directly attached host"},{"key":"C","text":"when an end device can reach local devices, but not remote devices"},{"key":"D","text":"to determine the MAC address of a directly attached network device on a particular interface"}],"answer":["B"]},{"number":341,"text":"What is a drawback of the local database method of securing device access that can be solved by using AAA with centralized servers?","options":[{"key":"A","text":"There is no ability to provide accountability."},{"key":"B","text":"User accounts must be configured locally on each device, which is an unscalable authentication solution."},{"key":"C","text":"It is very susceptible to brute-force attacks because there is no username."},{"key":"D","text":"The passwords can only be stored in plain text in the running configuration."}],"answer":["B"]},{"number":342,"text":"What action does a DHCPv4 client take if it receives more than one DHCPOFFER from multiple DHCP servers?","options":[{"key":"A","text":"It sends a DHCPREQUEST that identifies which lease offer the client is accepting."},{"key":"B","text":"It sends a DHCPNAK and begins the DHCP process over again."},{"key":"C","text":"It discards both offers and sends a new DHCPDIS- COVER."},{"key":"D","text":"It accepts both DHCPOFFER messages and sends a DHCPACK."}],"answer":["A"]},{"number":343,"text":"What method of wireless authentication is dependent on a RADIUS authentication server?","options":[{"key":"A","text":"WEP"},{"key":"B","text":"WPA Personal"},{"key":"C","text":"WPA2 Personal"},{"key":"D","text":"WPA2 Enterprise"}],"answer":["D"]},{"number":344,"text":"A network administrator has found a user sending a double-tagged 802.1Q frame to a switch. What is the best solution to prevent this type of attack?","options":[{"key":"A","text":"The native VLAN number used on any trunk should be one of the active data VLANs."},{"key":"B","text":"The VLANs for user access ports should be different VLANs than any native VLANs used on trunk ports."},{"key":"C","text":"Trunk ports should be configured with port security."},{"key":"D","text":"Trunk ports should use the default VLAN as the native VLAN number ."}],"answer":["B"]},{"number":345,"text":"On a Cisco 3504 WLC Summary page ( Advanced > Summary ), which tab allows a network administrator to configure a particular WLAN with a WPA2 policy?","options":[{"key":"A","text":"WLANs"},{"key":"B","text":"SECURITY"},{"key":"C","text":"WIRELESS"},{"key":"D","text":"MANAGEMENT"}],"answer":["A"]},{"number":346,"text":"Users are complaining of sporadic access to the internet every afternoon. What should be done or checked?","options":[{"key":"A","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"B","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"C","text":"Create a floating static route to that network."},{"key":"D","text":"Check the statistics on the default route for oversaturation."}],"answer":["D"]},{"number":347,"text":"What action takes place when the source MAC address of a frame entering a switch appears in the MAC address table associated with a different port?","options":[{"key":"A","text":"The switch purges the entire MAC address table."},{"key":"B","text":"The switch replaces the old entry and uses the more current port."},{"key":"C","text":"The switch updates the refresh timer for the entry."},{"key":"D","text":"The switch forwards the frame out of the specified port."}],"answer":["B"]},{"number":348,"text":"A network administrator is configuring a WLAN. Why would the administrator use a WLAN controller?","options":[{"key":"A","text":"to centralize management of multiple WLANs"},{"key":"B","text":"to provide privacy and integrity to wireless traffic by using encryption"},{"key":"C","text":"to facilitate group configuration and management of multiple WLANs through a WLC"},{"key":"D","text":"to provide prioritized service for time-sensitive applications"}],"answer":["C"]},{"number":349,"text":"Which three statements accurately describe duplex and speed settings on Cisco 2960 switches? (Choose three.)","options":[{"key":"A","text":"An autonegotiation failure can result in connectivity issues."},{"key":"B","text":"When the speed is set to 1000 Mb/s, the switch ports will operate in full-duplex mode."},{"key":"C","text":"The duplex and speed settings of each switch port can be manually configured."},{"key":"D","text":"Enabling autonegotiation on a hub will prevent mismatched port speeds when connecting the hub to the switch."},{"key":"E","text":"By default, the speed is set to 100 Mb/s and the duplex mode is set to autonegotiation."},{"key":"F","text":"By default, the autonegotiation feature is disabled."}],"answer":["A","B","C"]},{"number":350,"text":"A network administrator uses the spanning-tree portfast bpduguard default global configuration command to enable BPDU guard on a switch. However , BPDU guard is not activated on all access ports. What is the cause of the issue?","options":[{"key":"A","text":"BPDU guard needs to be activated in the interface configuration command mode."},{"key":"B","text":"Access ports configured with root guard cannot be configured with BPDU guard."},{"key":"C","text":"Access ports belong to different VLANs."},{"key":"D","text":"PortFast is not configured on all access ports."}],"answer":["D"]},{"number":351,"text":"Which two types of spanning tree protocols can cause suboptimal traffic flows because they assume only one spanning-tree instance for the entire bridged network? (Choose two.)","options":[{"key":"A","text":"MSTP"},{"key":"B","text":"RSTP"},{"key":"C","text":"Rapid PVST+"},{"key":"D","text":"PVST+"},{"key":"E","text":"STP"}],"answer":["B","E"]},{"number":352,"text":"A WLAN engineer deploys a WLC and five wireless APs using the CAPWAP protocol with the DTLS feature to secure the control plane of the network devices. While testing the wireless network, the WLAN engineer notices that data traffic is being exchanged between the WLC and the APs in plain-text and is not being encrypted. What is the most likely reason for this?","options":[{"key":"A","text":"DTLS only provides data security through authentication and does not provide encryption for data moving between a wireless LAN controller (WLC) and an access point (AP)."},{"key":"B","text":"Although DTLS is enabled by default to secure the CAPWAP control channel, it is disabled by default for the data channel."},{"key":"C","text":"DTLS is a protocol that only provides security between the access point (AP) and the wireless client."},{"key":"D","text":"Data encryption requires a DTLS license to be installed on each access point (AP) prior to being enabled on the wireless LAN controller (WLC)."}],"answer":["B"]},{"number":353,"text":"A new switch is to be added to an existing network in a remote office. The network administrator does not want the technicians in the remote office to be able to add new VLANs to the switch, but the switch should receive VLAN updates from the VTP domain. Which two steps must be performed to configure VTP on the new switch to meet these conditions? (Choose two.)","options":[{"key":"A","text":"Configure the new switch as a VTP client."},{"key":"B","text":"Configure the existing VTP domain name on the new switch."},{"key":"C","text":"Configure an IP address on the new switch."},{"key":"D","text":"Configure all ports of both switches to access mode."},{"key":"E","text":"Enable VTP pruning."}],"answer":["A","B"]},{"number":354,"text":"What action takes place when the source MAC address of a frame entering a switch is not in the MAC address table?","options":[{"key":"A","text":"The switch adds a MAC address table entry for the destination MAC address and the egress port."},{"key":"B","text":"The switch adds the MAC address and incoming port number to the table."},{"key":"C","text":"The switch replaces the old entry and uses the more current port."},{"key":"D","text":"The switch updates the refresh timer for the entry."}],"answer":["B"]},{"number":355,"text":"Employees are unable to connect to servers on one of the internal networks. What should be done or checked?","options":[{"key":"A","text":"Use the \"show ip interface brief\" command to see if an interface is down."},{"key":"B","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"C","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"D","text":"Check the statistics on the default route for oversaturation."}],"answer":["A"]},{"number":356,"text":"What is the effect of entering the ip dhcp snooping configuration command on a switch?","options":[{"key":"A","text":"It enables DHCP snooping globally on a switch."},{"key":"B","text":"It enables PortFast globally on a switch."},{"key":"C","text":"It disables DTP negotiations on trunking ports."},{"key":"D","text":"It manually enables a trunk link."}],"answer":["A"]},{"number":357,"text":"An administrator notices that large numbers of packets are being dropped on one of the branch routers. What should be done or checked?","options":[{"key":"A","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"B","text":"Create extra static routes to the same location with an AD of 1."},{"key":"C","text":"Check the statistics on the default route for oversaturation."},{"key":"D","text":"Check the routing table for a missing static route."}],"answer":["D"]},{"number":358,"text":"What are two switch characteristics that could help alleviate network congestion? (Choose two.)","options":[{"key":"A","text":"fast internal switching"},{"key":"B","text":"large frame buffers"},{"key":"C","text":"store-and-forward switching"},{"key":"D","text":"low port density"},{"key":"E","text":"frame check sequence (FCS) check"}],"answer":["A","B"]},{"number":359,"text":"What is a result of connecting two or more switches together?","options":[{"key":"A","text":"The number of broadcast domains is increased."},{"key":"B","text":"The size of the broadcast domain is increased."},{"key":"C","text":"The number of collision domains is reduced."},{"key":"D","text":"The size of the collision domain is increased."}],"answer":["B"]},{"number":360,"text":"Branch users were able to access a site in the morning but have had no connectivity with the site since lunch time. What should be done or checked?","options":[{"key":"A","text":"Verify that the static route to the server is present in the routing table."},{"key":"B","text":"Use the \"show ip interface brief\" command to see if an interface is down."},{"key":"C","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"D","text":"Create a floating static route to that network."}],"answer":["B"]},{"number":361,"text":"What is the effect of entering the switchport port-security configuration command on a switch?","options":[{"key":"A","text":"It dynamically learns the L2 address and copies it to the running configuration."},{"key":"B","text":"It enables port security on an interface."},{"key":"C","text":"It enables port security globally on the switch."},{"key":"D","text":"It restricts the number of discovery messages, per second, to be received on the interface."}],"answer":["B"]},{"number":362,"text":"A network administrator is configuring a WLAN. Why would the administrator use multiple lightweight APs?","options":[{"key":"A","text":"to centralize management of multiple WLANs"},{"key":"B","text":"to monitor the operation of the wireless network"},{"key":"C","text":"to provide prioritized service for time-sensitive applications"},{"key":"D","text":"to facilitate group configuration and management of multiple WLANs through a WLC"}],"answer":["D"]},{"number":363,"text":"A network administrator is configuring a WLAN. Why would the administrator use RADIUS servers on the network?","options":[{"key":"A","text":"to centralize management of multiple WLANs"},{"key":"B","text":"to restrict access to the WLAN by authorized, au- thenticated users only"},{"key":"C","text":"to facilitate group configuration and management of multiple WLANs through a WLC"},{"key":"D","text":"to monitor the operation of the wireless network"}],"answer":["B"]},{"number":364,"text":"What is the effect of entering the switchport mode access configuration command on a switch?","options":[{"key":"A","text":"It enables BPD
