"key":"F","text":"loopback address"}],"answer":["A","C","E"]},{"number":306,"text":"A technician is troubleshooting a slow WLAN and decides to use the split-the-traffic approach. Which two parameters would have to be configured to do this? (Choose two.)","options":[{"key":"A","text":"Configure the 5 GHz band for streaming multimedia and time sensitive traffic."},{"key":"B","text":"Configure the security mode to WPA Personal TKIP/AES for one network and WPA2 Personal AES for the other network"},{"key":"C","text":"Configure the 2.4 GHz band for basic internet traffic that is not time sensitive."},{"key":"D","text":"Configure the security mode to WPA Personal TKIP/AES for both networks."},{"key":"E","text":"Configure a common SSID for both split networks."}],"answer":["A","C"]},{"number":307,"text":"A company has just switched to a new ISP . The ISP has completed and checked the connection from its site to the company. However , employees at the company are not able to access the internet. What should be done or checked?","options":[{"key":"A","text":"Verify that the static route to the server is present in the routing table."},{"key":"B","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"C","text":"Ensure that the old default route has been removed from the company edge routers."},{"key":"D","text":"Create a floating static route to that network."}],"answer":["C"]},{"number":308,"text":"Which information does a switch use to populate the MAC address table?","options":[{"key":"A","text":"the destination MAC address and the incoming port"},{"key":"B","text":"the destination MAC address and the outgoing port"},{"key":"C","text":"the source and destination MAC addresses and the incoming port"},{"key":"D","text":"the source and destination MAC addresses and the outgoing port"},{"key":"E","text":"the source MAC address and the incoming port"},{"key":"F","text":"the source MAC address and the outgoing port"}],"answer":["E"]},{"number":309,"text":"Which type of static route is configured with a greater administrative distance to provide a backup route to a route learned from a dynamic routing protocol?","options":[{"key":"A","text":"floating static route"},{"key":"B","text":"default static route"},{"key":"C","text":"summary static route"},{"key":"D","text":"standard static route"}],"answer":["A"]},{"number":310,"text":"What action takes place when a frame entering a switch has a unicast destination MAC address appearing in the MAC address table?","options":[{"key":"A","text":"The switch updates the refresh timer for the entry."},{"key":"B","text":"The switch forwards the frame out of the specified port."},{"key":"C","text":"The switch purges the entire MAC address table."},{"key":"D","text":"The switch replaces the old entry and uses the more current port."}],"answer":["B"]},{"number":311,"text":"What protocol or technology allows data to transmit over redundant switch links?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"DTP"},{"key":"C","text":"STP"},{"key":"D","text":"VTP"}],"answer":["A"]},{"number":312,"text":"What is the effect of entering the shutdown configuration command on a switch?","options":[{"key":"A","text":"It enables BPDU guard on a specific port."},{"key":"B","text":"It disables an unused port."},{"key":"C","text":"It enables portfast on a specific switch interface."},{"key":"D","text":"It disables DTP on a non-trunking interface."}],"answer":["B"]},{"number":313,"text":"What would be the primary reason an attacker would launch a MAC address overflow attack?","options":[{"key":"A","text":"so that the switch stops forwarding traffic"},{"key":"B","text":"so that legitimate hosts cannot obtain a MAC address"},{"key":"C","text":"so that the attacker can see frames that are destined for other hosts"},{"key":"D","text":"so that the attacker can execute arbitrary code on the switch"}],"answer":["C"]},{"number":314,"text":"During the AAA process, when will authorization be implemented?","options":[{"key":"A","text":"Immediately after successful authentication against an AAA data source"},{"key":"B","text":"Immediately after AAA accounting and auditing receives detailed reports"},{"key":"C","text":"Immediately after an AAA client sends authentication information to a centralized server"},{"key":"D","text":"Immediately after the determination of which resources a user can access"}],"answer":["A"]},{"number":315,"text":"A company security policy requires that all MAC addressing be dynamically learned and added to both the MAC address table and the running configuration on each switch. Which port security configuration will accomplish this?","options":[{"key":"A","text":"auto secure MAC addresses"},{"key":"B","text":"dynamic secure MAC addresses"},{"key":"C","text":"static secure MAC addresses"},{"key":"D","text":"sticky secure MAC addresses"}],"answer":["D"]},{"number":316,"text":"Which three Wi-Fi standards operate in the 2.4GHz range of frequencies? (Choose three.)","options":[{"key":"A","text":"802.11a"},{"key":"B","text":"802.11b"},{"key":"C","text":"802.11g"},{"key":"D","text":"802.11n"},{"key":"E","text":"802.11ac"}],"answer":["B","C","D"]},{"number":317,"text":"To obtain an overview of the spanning tree status of a switched network, a network engineer issues the show spanning-tree command on a switch. Which two items of information will this command display? (Choose two.)","options":[{"key":"A","text":"The root bridge BID."},{"key":"B","text":"The role of the ports in all VLANs."},{"key":"C","text":"The status of native VLAN ports."},{"key":"D","text":"The number of broadcasts received on each root port."},{"key":"E","text":"The IP address of the management VLAN interface."}],"answer":["A","B"]},{"number":318,"text":"Which method of IPv6 prefix assignment relies on the prefix contained in RA messages?","options":[{"key":"A","text":"EUI-64"},{"key":"B","text":"SLAAC"},{"key":"C","text":"static"},{"key":"D","text":"stateful DHCPv6"}],"answer":["B"]},{"number":319,"text":"Which two protocols are used to provide server-based AAA authentication? (Choose two.)","options":[{"key":"A","text":"802.1x"},{"key":"B","text":"SSH"},{"key":"C","text":"SNMP"},{"key":"D","text":"TACACS+"},{"key":"E","text":"RADIUS"}],"answer":["D","E"]},{"number":320,"text":"A network administrator is configuring a WLAN. Why would the administrator disable the broadcast feature for the SSID?","options":[{"key":"A","text":"to eliminate outsiders scanning for available SSIDs in the area"},{"key":"B","text":"to reduce the risk of interference by external devices such as microwave ovens"},{"key":"C","text":"to reduce the risk of unauthorized APs being added to the network"},{"key":"D","text":"to provide privacy and integrity to wireless traffic by using encryption"}],"answer":null},{"number":321,"text":"Which mitigation technique would prevent rogue servers from providing false IP configuration parameters to clients?","options":[{"key":"A","text":"implementing port security"},{"key":"B","text":"turning on DHCP snooping"},{"key":"C","text":"disabling CDP on edge ports"},{"key":"D","text":"implementing port-security on edge ports"}],"answer":["B"]},{"number":322,"text":"A network administrator configures the port security feature on a switch. The security policy specifies that each access port should allow up to two MAC addresses. When the maximum number of MAC addresses is reached, a frame with the unknown source MAC address is dropped and a notification is sent to the syslog server . Which security violation mode should be configured for each access port?","options":[{"key":"A","text":"shutdown"},{"key":"B","text":"restrict"},{"key":"C","text":"warning"},{"key":"D","text":"protect"}],"answer":["B"]},{"number":323,"text":"What protocol or technology defines a group of routers, one of them defined as active and another one as standby?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"VTP"},{"key":"C","text":"HSRP"},{"key":"D","text":"DTP"}],"answer":["C"]},{"number":324,"text":"Which three pairs of trunking modes will establish a functional trunk link between two Cisco switches? (Choose three.)","options":[{"key":"A","text":"dynamic auto - dynamic auto"},{"key":"B","text":"access - trunk"},{"key":"C","text":"dynamic desirable - trunk"},{"key":"D","text":"access - dynamic auto"},{"key":"E","text":"dynamic desirable - dynamic desirable"},{"key":"F","text":"dynamic desirable - dynamic auto"}],"answer":["C","E","F"]},{"number":325,"text":"A technician is configuring a router for a small company with multiple WLANs and doesn't need the complexity of a dynamic routing protocol. What should be done or checked?","options":[{"key":"A","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"B","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"C","text":"Create extra static routes to the same location with an AD of 1."},{"key":"D","text":"Check the statistics on the default route for oversaturation."}],"answer":["B"]},{"number":326,"text":"A company is deploying a wireless network in the distribution facility in a Boston suburb. The warehouse is quite large and it requires multiple access points to be used. Because some of the company devices still operate at 2.4GHz, the network administrator decides to deploy the 802.11g standard. Which channel assignments on the multiple access points will make sure that the wireless channels are not overlapping?","options":[{"key":"A","text":"channels 1, 5, and 9"},{"key":"B","text":"channels 1, 6, and 11"},{"key":"C","text":"channels 1, 7, and 13"},{"key":"D","text":"channels 2, 6, and 10"}],"answer":["B"]},{"number":327,"text":"A network administrator of a small advertising company is configuring WLAN security by using the WPA2 PSK method. Which credential do office users need in order to connect their laptops to the WLAN?","options":[{"key":"A","text":"the company username and password through Active Directory service"},{"key":"B","text":"a key that matches the key on the AP"},{"key":"C","text":"a user passphrase"},{"key":"D","text":"a username and password configured on the AP"}],"answer":["B"]},{"number":328,"text":"What mitigation plan is best for thwarting a DoS attack that is creating a MAC address table overflow?","options":[{"key":"A","text":"Disable DTP ."},{"key":"B","text":"Disable STP ."},{"key":"C","text":"Enable port security."},{"key":"D","text":"Place unused ports in an unused VLAN."}],"answer":["C"]},{"number":329,"text":"Why might this solution improve the wireless network performance for that type of service?","options":[{"key":"A","text":"Requiring the users to switch to the 5 GHz band for streaming media is inconvenient and will result in fewer users accessing these services."},{"key":"B","text":"The 5 GHz band has more channels and is less crowded than the 2.4 GHz band, which makes it more suited to streaming multimedia."},{"key":"C","text":"The 5 GHz band has a greater range and is therefore likely to be interference-free."},{"key":"D","text":"The only users that can switch to the 5 GHz band will be those with the latest wireless NICs, which will reduce usage."}],"answer":["B"]},{"number":330,"text":"Which DHCPv4 message will a client send to accept an IPv4 address that is offered by a DHCP server?","options":[{"key":"A","text":"broadcast DHCPACK"},{"key":"B","text":"broadcast DHCPREQUEST"},{"key":"C","text":"unicast DHCPACK"},{"key":"D","text":"unicast DHCPREQUEST"}],"answer":["B"]},{"number":331,"text":"After a host has generated an IPv6 address by using the DHCPv6 or SLAAC process, how does the host verify that the address is unique and therefore usable?","options":[{"key":"A","text":"The host sends an ICMPv6 echo request message to the DHCPv6 or SLAAC-learned address and if no reply is returned, the address is considered unique."},{"key":"B","text":"The host sends an ICMPv6 neighbor solicitation message to the DHCP or SLAAC-learned address and if no neighbor advertisement is returned, the address is considered unique."},{"key":"C","text":"The host checks the local neighbor cache for the learned address and if the address is not cached, it it considered unique."},{"key":"D","text":"The host sends an ARP broadcast to the local link and if no hosts send a reply, the address is considered unique."}],"answer":["B"]},{"number":332,"text":"What network attack seeks to create a DoS for clients by preventing them from being able to obtain a DHCP lease?","options":[{"key":"A","text":"IP address spoofing"},{"key":"B","text":"DHCP starvation"},{"key":"C","text":"CAM table attack"},{"key":"D","text":"DHCP spoofing"}],"answer":["B"]},{"number":333,"text":"What protocol or technology uses source IP to destination IP as a load-balancing mechanism?","options":[{"key":"A","text":"VTP"},{"key":"B","text":"EtherChannel"},{"key":"C","text":"DTP"},{"key":"D","text":"STP"}],"answer":["B"]},{"number":334,"text":"What protocol should be disabled to help mitigate VLAN attacks?","options":[{"key":"A","text":"CDP"},{"key":"B","text":"ARP"},{"key":"C","text":"STP"},{"key":"D","text":"DTP"}],"answer":["D"]},{"number":335,"text":"What protocol or technology requires switches to be in server mode or client mode?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"STP"},{"key":"C","text":"VTP"},{"key":"D","text":"DTP"}],"answer":["C"]},{"number":336,"text":"What are two reasons a network administrator would segment a network with a Layer 2 switch? (Choose two.)","options":[{"key":"A","text":"to create fewer collision domains"},{"key":"B","text":"to enhance user bandwidth"},{"key":"C","text":"to create more broadcast domains"},{"key":"D","text":"to eliminate virtual circuits"},{"key":"E","text":"to isolate traffic between segments"},{"key":"F","text":"to isolate ARP request messages from the rest of the network"}],"answer":["B","E"]},{"number":337,"text":"What command will enable a router to begin sending messages that allow it to configure a link-local address without using an IPv6 DHCP server?","options":[{"key":"A","text":"a static route"},{"key":"B","text":"the ipv6 route ::/0 command"},{"key":"C","text":"the ipv6 unicast-routing command"},{"key":"D","text":"the ip routing command"}],"answer":["C"]},{"number":338,"text":"A network administrator is using the router-on-a-stick model to configure a switch and a router for inter-VLAN routing. What configuration should be made on the switch port that connects to the router?","options":[{"key":"A","text":"Configure it as a trunk port and allow only untagged traffic."},{"key":"B","text":"Configure the port as an access port and a member of VLAN1."},{"key":"C","text":"Configure the port as an 802.1q trunk port."},{"key":"D","text":"Configure the port as a trunk port and assign it to VLAN1."}],"answer":["C"]},{"number":339,"text":"What are three techniques for mitigating VLAN attacks? (Choose three.)","options":[{"key":"A","text":"Use private VLANs."},{"key":"B","text":"Enable BPDU guard."},{"key":"C","text":"Enable trunking manually"},{"key":"D","text":"Enable Source Guard."},{"key":"E","text":"Disable DTP ."},{"key":"F","text":"Set the native VLAN to an unused VLAN."}],"answer":["C","E","F"]},{"number":340,"text":"In which situation would a technician use the show interfaces switch command?","options":[{"key":"A","text":"to determine if remote access is enabled"},{"key":"B","text":"when packets are being dropped from a particular directly attached host"},{"key":"C","text":"when an end device can reach local devices, but not remote devices"},{"key":"D","text":"to determine the MAC address of a directly attached network device on a particular interface"}],"answer":["B"]},{"number":341,"text":"What is a drawback of the local database method of securing device access that can be solved by using AAA with centralized servers?","options":[{"key":"A","text":"There is no ability to provide accountability."},{"key":"B","text":"User accounts must be configured locally on each device, which is an unscalable authentication solution."},{"key":"C","text":"It is very susceptible to brute-force attacks because there is no username."},{"key":"D","text":"The passwords can only be stored in plain text in the running configuration."}],"answer":["B"]},{"number":342,"text":"What action does a DHCPv4 client take if it receives more than one DHCPOFFER from multiple DHCP servers?","options":[{"key":"A","text":"It sends a DHCPREQUEST that identifies which lease offer the client is accepting."},{"key":"B","text":"It sends a DHCPNAK and begins the DHCP process over again."},{"key":"C","text":"It discards both offers and sends a new DHCPDIS- COVER."},{"key":"D","text":"It accepts both DHCPOFFER messages and sends a DHCPACK."}],"answer":["A"]},{"number":343,"text":"What method of wireless authentication is dependent on a RADIUS authentication server?","options":[{"key":"A","text":"WEP"},{"key":"B","text":"WPA Personal"},{"key":"C","text":"WPA2 Personal"},{"key":"D","text":"WPA2 Enterprise"}],"answer":["D"]},{"number":344,"text":"A network administrator has found a user sending a double-tagged 802.1Q frame to a switch. What is the best solution to prevent this type of attack?","options":[{"key":"A","text":"The native VLAN number used on any trunk should be one of the active data VLANs."},{"key":"B","text":"The VLANs for user access ports should be different VLANs than any native VLANs used on trunk ports."},{"key":"C","text":"Trunk ports should be configured with port security."},{"key":"D","text":"Trunk ports should use the default VLAN as the native VLAN number ."}],"answer":["B"]},{"number":345,"text":"On a Cisco 3504 WLC Summary page ( Advanced > Summary ), which tab allows a network administrator to configure a particular WLAN with a WPA2 policy?","options":[{"key":"A","text":"WLANs"},{"key":"B","text":"SECURITY"},{"key":"C","text":"WIRELESS"},{"key":"D","text":"MANAGEMENT"}],"answer":["A"]},{"number":346,"text":"Users are complaining of sporadic access to the internet every afternoon. What should be done or checked?","options":[{"key":"A","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"B","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"C","text":"Create a floating static route to that network."},{"key":"D","text":"Check the statistics on the default route for oversaturation."}],"answer":["D"]},{"number":347,"text":"What action takes place when the source MAC address of a frame entering a switch appears in the MAC address table associated with a different port?","options":[{"key":"A","text":"The switch purges the entire MAC address table."},{"key":"B","text":"The switch replaces the old entry and uses the more current port."},{"key":"C","text":"The switch updates the refresh timer for the entry."},{"key":"D","text":"The switch forwards the frame out of the specified port."}],"answer":["B"]},{"number":348,"text":"A network administrator is configuring a WLAN. Why would the administrator use a WLAN controller?","options":[{"key":"A","text":"to centralize management of multiple WLANs"},{"key":"B","text":"to provide privacy and integrity to wireless traffic by using encryption"},{"key":"C","text":"to facilitate group configuration and management of multiple WLANs through a WLC"},{"key":"D","text":"to provide prioritized service for time-sensitive applications"}],"answer":["C"]},{"number":349,"text":"Which three statements accurately describe duplex and speed settings on Cisco 2960 switches? (Choose three.)","options":[{"key":"A","text":"An autonegotiation failure can result in connectivity issues."},{"key":"B","text":"When the speed is set to 1000 Mb/s, the switch ports will operate in full-duplex mode."},{"key":"C","text":"The duplex and speed settings of each switch port can be manually configured."},{"key":"D","text":"Enabling autonegotiation on a hub will prevent mismatched port speeds when connecting the hub to the switch."},{"key":"E","text":"By default, the speed is set to 100 Mb/s and the duplex mode is set to autonegotiation."},{"key":"F","text":"By default, the autonegotiation feature is disabled."}],"answer":["A","B","C"]},{"number":350,"text":"A network administrator uses the spanning-tree portfast bpduguard default global configuration command to enable BPDU guard on a switch. However , BPDU guard is not activated on all access ports. What is the cause of the issue?","options":[{"key":"A","text":"BPDU guard needs to be activated in the interface configuration command mode."},{"key":"B","text":"Access ports configured with root guard cannot be configured with BPDU guard."},{"key":"C","text":"Access ports belong to different VLANs."},{"key":"D","text":"PortFast is not configured on all access ports."}],"answer":["D"]},{"number":351,"text":"Which two types of spanning tree protocols can cause suboptimal traffic flows because they assume only one spanning-tree instance for the entire bridged network? (Choose two.)","options":[{"key":"A","text":"MSTP"},{"key":"B","text":"RSTP"},{"key":"C","text":"Rapid PVST+"},{"key":"D","text":"PVST+"},{"key":"E","text":"STP"}],"answer":["B","E"]},{"number":352,"text":"A WLAN engineer deploys a WLC and five wireless APs using the CAPWAP protocol with the DTLS feature to secure the control plane of the network devices. While testing the wireless network, the WLAN engineer notices that data traffic is being exchanged between the WLC and the APs in plain-text and is not being encrypted. What is the most likely reason for this?","options":[{"key":"A","text":"DTLS only provides data security through authentication and does not provide encryption for data moving between a wireless LAN controller (WLC) and an access point (AP)."},{"key":"B","text":"Although DTLS is enabled by default to secure the CAPWAP control channel, it is disabled by default for the data channel."},{"key":"C","text":"DTLS is a protocol that only provides security between the access point (AP) and the wireless client."},{"key":"D","text":"Data encryption requires a DTLS license to be installed on each access point (AP) prior to being enabled on the wireless LAN controller (WLC)."}],"answer":["B"]},{"number":353,"text":"A new switch is to be added to an existing network in a remote office. The network administrator does not want the technicians in the remote office to be able to add new VLANs to the switch, but the switch should receive VLAN updates from the VTP domain. Which two steps must be performed to configure VTP on the new switch to meet these conditions? (Choose two.)","options":[{"key":"A","text":"Configure the new switch as a VTP client."},{"key":"B","text":"Configure the existing VTP domain name on the new switch."},{"key":"C","text":"Configure an IP address on the new switch."},{"key":"D","text":"Configure all ports of both switches to access mode."},{"key":"E","text":"Enable VTP pruning."}],"answer":["A","B"]},{"number":354,"text":"What action takes place when the source MAC address of a frame entering a switch is not in the MAC address table?","options":[{"key":"A","text":"The switch adds a MAC address table entry for the destination MAC address and the egress port."},{"key":"B","text":"The switch adds the MAC address and incoming port number to the table."},{"key":"C","text":"The switch replaces the old entry and uses the more current port."},{"key":"D","text":"The switch updates the refresh timer for the entry."}],"answer":["B"]},{"number":355,"text":"Employees are unable to connect to servers on one of the internal networks. What should be done or checked?","options":[{"key":"A","text":"Use the \"show ip interface brief\" command to see if an interface is down."},{"key":"B","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"C","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"D","text":"Check the statistics on the default route for oversaturation."}],"answer":["A"]},{"number":356,"text":"What is the effect of entering the ip dhcp snooping configuration command on a switch?","options":[{"key":"A","text":"It enables DHCP snooping globally on a switch."},{"key":"B","text":"It enables PortFast globally on a switch."},{"key":"C","text":"It disables DTP negotiations on trunking ports."},{"key":"D","text":"It manually enables a trunk link."}],"answer":["A"]},{"number":357,"text":"An administrator notices that large numbers of packets are being dropped on one of the branch routers. What should be done or checked?","options":[{"key":"A","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"B","text":"Create extra static routes to the same location with an AD of 1."},{"key":"C","text":"Check the statistics on the default route for oversaturation."},{"key":"D","text":"Check the routing table for a missing static route."}],"answer":["D"]},{"number":358,"text":"What are two switch characteristics that could help alleviate network congestion? (Choose two.)","options":[{"key":"A","text":"fast internal switching"},{"key":"B","text":"large frame buffers"},{"key":"C","text":"store-and-forward switching"},{"key":"D","text":"low port density"},{"key":"E","text":"frame check sequence (FCS) check"}],"answer":["A","B"]},{"number":359,"text":"What is a result of connecting two or more switches together?","options":[{"key":"A","text":"The number of broadcast domains is increased."},{"key":"B","text":"The size of the broadcast domain is increased."},{"key":"C","text":"The number of collision domains is reduced."},{"key":"D","text":"The size of the collision domain is increased."}],"answer":["B"]},{"number":360,"text":"Branch users were able to access a site in the morning but have had no connectivity with the site since lunch time. What should be done or checked?","options":[{"key":"A","text":"Verify that the static route to the server is present in the routing table."},{"key":"B","text":"Use the \"show ip interface brief\" command to see if an interface is down."},{"key":"C","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"D","text":"Create a floating static route to that network."}],"answer":["B"]},{"number":361,"text":"What is the effect of entering the switchport port-security configuration command on a switch?","options":[{"key":"A","text":"It dynamically learns the L2 address and copies it to the running configuration."},{"key":"B","text":"It enables port security on an interface."},{"key":"C","text":"It enables port security globally on the switch."},{"key":"D","text":"It restricts the number of discovery messages, per second, to be received on the interface."}],"answer":["B"]},{"number":362,"text":"A network administrator is configuring a WLAN. Why would the administrator use multiple lightweight APs?","options":[{"key":"A","text":"to centralize management of multiple WLANs"},{"key":"B","text":"to monitor the operation of the wireless network"},{"key":"C","text":"to provide prioritized service for time-sensitive applications"},{"key":"D","text":"to facilitate group configuration and management of multiple WLANs through a WLC"}],"answer":["D"]},{"number":363,"text":"A network administrator is configuring a WLAN. Why would the administrator use RADIUS servers on the network?","options":[{"key":"A","text":"to centralize management of multiple WLANs"},{"key":"B","text":"to restrict access to the WLAN by authorized, au- thenticated users only"},{"key":"C","text":"to facilitate group configuration and management of multiple WLANs through a WLC"},{"key":"D","text":"to monitor the operation of the wireless network"}],"answer":["B"]},{"number":364,"text":"What is the effect of entering the switchport mode access configuration command on a switch?","options":[{"key":"A","text":"It enables BPDU guard on a specific port."},{"key":"B","text":"It manually enables a trunk link."},{"key":"C","text":"It disables an unused port."},{"key":"D","text":"It disables DTP on a non-trunking interface."}],"answer":["D"]},{"number":365,"text":"A network administrator has configured a router for stateless DHCPv6 operation. However , users report that workstations are not receiving DNS server information. Which two router configuration lines should be verified to ensure that stateless DHCPv6 service is properly configured? (Choose two.)","options":[{"key":"A","text":"The domain-name line is included in the ipv6 dhcp pool section."},{"key":"B","text":"The dns-server line is included in the ipv6 dhcp pool section."},{"key":"C","text":"The ipv6 nd other-config-flag is entered for the interface that faces the LAN segment."},{"key":"D","text":"The address prefix line is included in the ipv6 dhcp pool section."},{"key":"E","text":"The ipv6 nd managed-config-flag is entered for the interface that faces the LAN segment."}],"answer":["B","C"]},{"number":366,"text":"A network administrator is configuring a WLAN. Why would the administrator disable the broadcast feature for the SSID?","options":[{"key":"A","text":"to eliminate outsiders scanning for available SSIDs in the area"},{"key":"B","text":"to centralize management of multiple WLANs"},{"key":"C","text":"to facilitate group configuration and management of multiple WLANs through a WLC"},{"key":"D","text":"to provide prioritized service for time-sensitive applications"}],"answer":["A"]},{"number":367,"text":"What action takes place when a frame entering a switch has a unicast destination MAC address that is not in the MAC address table?","options":[{"key":"A","text":"The switch updates the refresh timer for the entry."},{"key":"B","text":"The switch resets the refresh timer on all MAC address table entries."},{"key":"C","text":"The switch replaces the old entry and uses the more current port."},{"key":"D","text":"The switch will forward the frame out all ports except the incoming port."}],"answer":["D"]},{"number":368,"text":"A junior technician was adding a route to a LAN router . A traceroute to a device on the new network revealed a wrong path and unreachable status. What should be done or checked?","options":[{"key":"A","text":"Create a floating static route to that network."},{"key":"B","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"C","text":"Check the configuration of the exit interface on the new static route."},{"key":"D","text":"Verify that the static route to the server is present in the routing table."}],"answer":["C"]},{"number":369,"text":"What is the effect of entering the ip arp inspection vlan 10 configuration command on a switch?","options":[{"key":"A","text":"It specifies the maximum number of L2 addresses allowed on a port."},{"key":"B","text":"It enables DAI on specific switch interfaces previously configured with DHCP snooping."},{"key":"C","text":"It enables DHCP snooping globally on a switch."},{"key":"D","text":"It globally enables BPDU guard on all PortFast-enabled ports."}],"answer":["B"]},{"number":370,"text":"What protocol or technology manages trunk negotiations between switches?","options":[{"key":"A","text":"VTP"},{"key":"B","text":"EtherChannel"},{"key":"C","text":"DTP"},{"key":"D","text":"STP"}],"answer":null},{"number":371,"text":"A network administrator is configuring a WLAN. Why would the administrator apply WPA2 with AES to the WLAN?","options":[{"key":"A","text":"to reduce the risk of unauthorized APs being added to the network"},{"key":"B","text":"to centralize management of multiple WLANs"},{"key":"C","text":"to provide prioritized service for time-sensitive applications"},{"key":"D","text":"to provide privacy and integrity to wireless traffic by using encryption"}],"answer":["D"]},{"number":372,"text":"Users on a LAN are unable to get to a company web server but are able to get elsewhere. What should be done or checked?","options":[{"key":"A","text":"Ensure that the old default route has been removed from the company edge routers."},{"key":"B","text":"Verify that the static route to the server is present in the routing table."},{"key":"C","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"D","text":"Create a floating static route to that network."}],"answer":["B"]},{"number":373,"text":"What IPv6 prefix is designed for link-local communication?","options":[{"key":"A","text":"2001::/3"},{"key":"B","text":"ff00::/8"},{"key":"C","text":"fc::/07"},{"key":"D","text":"fe80::/10"}],"answer":["D"]},{"number":374,"text":"What is the effect of entering the ip dhcp snooping limit rate 6 configuration command on a switch?","options":[{"key":"A","text":"It displays the IP-to-MAC address associations for switch interfaces."},{"key":"B","text":"It enables port security globally on the switch."},{"key":"C","text":"It restricts the number of discovery messages, per second, to be received on the interface."},{"key":"D","text":"It dynamically learns the L2 address and copies it to the running configuration."}],"answer":["C"]},{"number":375,"text":"A network administrator is configuring a WLAN. Why would the administrator change the default DHCP IPv4 addresses on an AP?","options":[{"key":"A","text":"to eliminate outsiders scanning for available SSIDs in the area"},{"key":"B","text":"to reduce the risk of unauthorized APs being added to the network"},{"key":"C","text":"to reduce outsiders intercepting data or accessing the wireless network by using a well-known address range"},{"key":"D","text":"to reduce the risk of interference by external devices such as microwave ovens"}],"answer":["C"]},{"number":376,"text":"What is the effect of entering the ip arp inspection validate src-mac configuration command on a switch?","options":[{"key":"A","text":"It checks the source L2 address in the Ethernet header against the sender L2 address in the ARP body."},{"key":"B","text":"It disables all trunk ports."},{"key":"C","text":"It displays the IP-to-MAC address associations for switch interfaces."},{"key":"D","text":"It enables portfast on a specific switch interface."}],"answer":["A"]},{"number":377,"text":"What protocol or technology is a Cisco proprietary protocol that is automatically enabled on 2960 switches?","options":[{"key":"A","text":"DTP"},{"key":"B","text":"STP"},{"key":"C","text":"VTP"},{"key":"D","text":"EtherChannel"}],"answer":["A"]},{"number":378,"text":"What address and prefix length is used when configuring an IPv6 default static route?","options":[{"key":"A","text":"::/0"},{"key":"B","text":"FF02::1/8"},{"key":"C","text":"0.0.0.0/0"},{"key":"D","text":"::1/128"}],"answer":["A"]},{"number":379,"text":"What are two characteristics of Cisco Express Forwarding (CEF)? (Choose two.)","options":[{"key":"A","text":"When a packet arrives on a router interface, it is forwarded to the control plane where the CPU matches the destination address with a matching routing table entry."},{"key":"B","text":"This is the fastest forwarding mechanism on Cisco routers and multilayer switches."},{"key":"C","text":"With this switching method, flow information for a packet is stored in the fast-switching cache to forward future packets to the same destination without CPU intervention."},{"key":"D","text":"Packets are forwarded based on information in the FIB and an adjacency table."},{"key":"E","text":"When a packet arrives on a router interface, it is forwarded to the control plane where the CPU searches for a match in the fast-switching cache."}],"answer":["B","D"]},{"number":380,"text":"Which term describes the role of a Cisco switch in the 802.1X port-based access control?","options":[{"key":"A","text":"agent"},{"key":"B","text":"supplicant"},{"key":"C","text":"authenticator"},{"key":"D","text":"authentication server"}],"answer":["C"]},{"number":381,"text":"Which Cisco solution helps prevent ARP spoofing and ARP poisoning attacks?","options":[{"key":"A","text":"Dynamic ARP Inspection"},{"key":"B","text":"IP Source Guard"},{"key":"C","text":"DHCP Snooping"},{"key":"D","text":"Port Security"}],"answer":["A"]},{"number":382,"text":"What is an advantage of PVST+?","options":[{"key":"A","text":"PVST+ optimizes performance on the network through autoselection of the root bridge."},{"key":"B","text":"PVST+ reduces bandwidth consumption compared to traditional implementations of STP that use CST."},{"key":"C","text":"PVST+ requires fewer CPU cycles for all the switches in the network."},{"key":"D","text":"PVST+ optimizes performance on the network through load sharing."}],"answer":["D"]},{"number":383,"text":"What protocol or technology uses a standby router to assume packet-forwarding responsibility if the active router fails?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"DTP"},{"key":"C","text":"HSRP"},{"key":"D","text":"VTP"}],"answer":["C"]},{"number":384,"text":"What is the effect of entering the show ip dhcp snooping binding configuration command on a switch?","options":[{"key":"A","text":"It switches a trunk port to access mode."},{"key":"B","text":"It checks the source L2 address in the Ethernet header against the sender L2 address in the ARP body."},{"key":"C","text":"It restricts the number of discovery messages, per second, to be received on the interface."},{"key":"D","text":"It displays the IP-to-MAC address associations for switch interfaces."}],"answer":["D"]},{"number":385,"text":"What action takes place when the source MAC address of a frame entering a switch is in the MAC address table?","options":[{"key":"A","text":"The switch forwards the frame out of the specified port."},{"key":"B","text":"The switch updates the refresh timer for the entry."},{"key":"C","text":"The switch replaces the old entry and uses the more current port."},{"key":"D","text":"The switch adds a MAC address table entry for the destination MAC address and the egress port."}],"answer":["B"]},{"number":386,"text":"A small publishing company has a network design such that when a broadcast is sent on the LAN, 200 devices receive the transmitted broadcast. How can the network administrator reduce the number of devices that receive broadcast traffic?","options":[{"key":"A","text":"Add more switches so that fewer devices are on a particular switch."},{"key":"B","text":"Replace the switches with switches that have more ports per switch. This will allow more devices on a particular switch."},{"key":"C","text":"Segment the LAN into smaller LANs and route between them."},{"key":"D","text":"Replace at least half of the switches with hubs to reduce the size of the broadcast domain."}],"answer":["C"]},{"number":387,"text":"What defines a host route on a Cisco router?","options":[{"key":"A","text":"The link-local address is added automatically to the routing table as an IPv6 host route."},{"key":"B","text":"An IPv4 static host route configuration uses a destination IP address of a specific device and a /32 subnet mask."},{"key":"C","text":"A host route is designated with a C in the routing table."},{"key":"D","text":"A static IPv6 host route must include the interface type and the interface number of the next hop router ."}],"answer":["B"]},{"number":388,"text":"What else is required when configuring an IPv6 static route using a next-hop link-local address?","options":[{"key":"A","text":"administrative distance"},{"key":"B","text":"ip address of the neighbor router"},{"key":"C","text":"network number and subnet mask on the interface of the neighbor router"},{"key":"D","text":"interface number and type"}],"answer":["D"]},{"number":389,"text":"A technician is configuring a wireless network for a small business using a SOHO wireless router . Which two authentication methods are used, if the router is configured with WPA2? (Choose two.)","options":[{"key":"A","text":"personal"},{"key":"B","text":"AES"},{"key":"C","text":"TKIP"},{"key":"D","text":"WEP"},{"key":"E","text":"enterprise"}],"answer":["A","E"]},{"number":390,"text":"Which mitigation technique would prevent rogue servers from providing false IPv6 configuration parameters to clients?","options":[{"key":"A","text":"enabling DHCPv6 Guard"},{"key":"B","text":"enabling RA Guard"},{"key":"C","text":"implementing port security on edge ports"},{"key":"D","text":"disabling CDP on edge ports"}],"answer":["A"]},{"number":391,"text":"A PC has sent an RS message to an IPv6 router attached to the same network. Which two pieces of information will the router send to the client? (Choose two.)","options":[{"key":"A","text":"prefix length"},{"key":"B","text":"subnet mask in dotted decimal notation"},{"key":"C","text":"domain name"},{"key":"D","text":"administrative distance"},{"key":"E","text":"prefix"},{"key":"F","text":"DNS server IP address"}],"answer":["A","E"]},{"number":392,"text":"While attending a conference, participants are using laptops for network connectivity. When a guest speaker attempts to connect to the network, the laptop fails to display any available wireless networks. The access point must be operating in which mode?","options":[{"key":"A","text":"mixed"},{"key":"B","text":"passive"},{"key":"C","text":"active"},{"key":"D","text":"open"}],"answer":["C"]},{"number":393,"text":"Which three components are combined to form a bridge ID?","options":[{"key":"A","text":"extended system ID"},{"key":"B","text":"cost"},{"key":"C","text":"IP address"},{"key":"D","text":"bridge priority"},{"key":"E","text":"MAC address"},{"key":"F","text":"port ID"}],"answer":["A","D","E"]}]},{"id":"FA25_FE","title":"FA25 • FE • 50 câu","group":"Đề học kỳ","questions":[{"number":1,"text":"If more than one DHCP server is available on the local network, in which order will DHCP messages be sent between a host and a DHCP server?","options":[{"key":"A","text":"acknowledgment, request, offer, discover"},{"key":"B","text":"request, discover, offer, acknowledgment"},{"key":"C","text":"discover, offe ynamic ARP Inspection (DAI)?","options":[{"key":"A","text":"To prevent unauthorized DHCP servers"},{"key":"B","text":"To mitigate ARP spoofing and ARP poisoning attacks"},{"key":"C","text":"To control access to VLANS"},{"key":"D","text":"To provide routing between VLANS"}],"answer":["B"]},{"number":9,"text":"What advantage does SSH offer over Telnet?","options":[{"key":"A","text":"connection-oriented service"},{"key":"B","text":"encryption"},{"key":"C","text":"more connection lines"},{"key":"D","text":"username and password authentication"}],"answer":["B"]},{"number":10,"text":"What is a key difference between SSH and Telnet in terms of security?","options":[{"key":"A","text":"SSH uses port 23 while Telnet uses port 22"},{"key":"B","text":"Telnet encrypts only usernames"},{"key":"C","text":"SSH encrypts both authentication and data"},{"key":"D","text":"SSH does not require authentication"}],"answer":["C"]},{"number":11,"text":"What character is used to enable the filtering of commands?","options":[{"key":"A","text":"pipe |"},{"key":"B","text":"comma,"},{"key":"C","text":"colon:"},{"key":"D","text":"semi colon;"}],"answer":["A"]},{"number":12,"text":"Which statement describes SVIs?","options":[{"key":"A","text":"An SVI can only be created for the management VLAN."},{"key":"B","text":"A default SVI is created for VLAN 1 for switch administration."},{"key":"C","text":"Creating an SVI automatically creates an associated VLAN."},{"key":"D","text":"An SVI is created automatically for each VLAN on a multilayer switch."}],"answer":["B"]},{"number":13,"text":"What is the first action in the boot sequence when a switch is powered on?","options":[{"key":"A","text":"low-level CPU initialization"},{"key":"B","text":"load boot loader software"},{"key":"C","text":"load the default Cisco IOS software"},{"key":"D","text":"load a power-on self-test program"}],"answer":["D"]},{"number":14,"text":"Where are dynamically learned MAC addresses stored when sticky learning is enabled with t tatic route"},{"key":"B","text":"Floating static route"},{"key":"C","text":"Generic static route"},{"key":"D","text":"Summary static route"}],"answer":["B"]},{"number":25,"text":"Which distinct type of VLAN is used by an administrator to access and configure a switch?","options":[{"key":"A","text":"data VLAN"},{"key":"B","text":"default VLAN"},{"key":"C","text":"native VLAN"},{"key":"D","text":"management VLAN"}],"answer":["D"]},{"number":26,"text":"In a VLAN-enabled network, how is broadcast traffic handled?","options":[{"key":"A","text":"It is discarded"},{"key":"B","text":"It is forwarded to the default gateway"},{"key":"C","text":"It is sent only to VLAN 1"},{"key":"D","text":"It is flooded within its own VLAN only"}],"answer":["D"]},{"number":27,"text":"What will a Cisco LAN switch do if it receives an incoming frame and the destination MAC address is not lis in the MAC address table?","options":[{"key":"A","text":"Send the frame to the default gateway address."},{"key":"B","text":"Drop the frame."},{"key":"C","text":"Use ARP to resolve the port that is related to the frame."},{"key":"D","text":"Forward the frame out all ports except the port where the frame is received."}],"answer":["D"]},{"number":28,"text":"What will a Cisco LAN switch do if it receives an incoming frame and the destination MAC address is not lis in the MAC address table?","options":[{"key":"A","text":"Send the frame to the default gateway address."},{"key":"B","text":"Drop the frame."},{"key":"C","text":"Use ARP to resolve the port that is related to the frame."},{"key":"D","text":"Forward the frame out all ports except the port where the frame is received."}],"answer":["B"]},{"number":29,"text":"What does the term \"port density\" represent for an Ethernet switch?","options":[{"key":"A","text":"the memory space that is allocated to each switch port"},{"key":"B","text":"the number of available ports"},{"key":"C","text":"the speed of each port"},{"key":"D","text":"the numbers of hosts that a ork system?","options":[{"key":"A","text":"Layer 4"},{"key":"B","text":"Layer 7"},{"key":"C","text":"Layer 2"},{"key":"D","text":"Layer 3"}],"answer":["C"]},{"number":47,"text":"What happens during a MAC address flooding attack?","options":[{"key":"A","text":"The switch deletes its MAC table"},{"key":"B","text":"The switch stops forwarding packets"},{"key":"C","text":"The switch sends all traffic to the attacker"},{"key":"D","text":"The switch floods frames out all ports"}],"answer":["D"]},{"number":48,"text":"Which of the following best describes a DDoS attack?","options":[{"key":"A","text":"One device sending encrypted data to a server"},{"key":"B","text":"A single host scanning all open ports"},{"key":"C","text":"Many devices overwhelming a target with traffic"},{"key":"D","text":"A switch flooding traffic to all ports"}],"answer":["C"]},{"number":49,"text":"Because of implemented security controls, a user can only access a server with FTP. Which AAA component accomplishes this?","options":[{"key":"A","text":"authorization"},{"key":"B","text":"authentication"},{"key":"C","text":"accessibility"},{"key":"D","text":"accounting"},{"key":"E","text":"auditing"}],"answer":["A"]},{"number":50,"text":"What is the destination IP address when an IPv4 host sends a DHCPDISCOVER message?","options":[{"key":"A","text":"192.168.1.1"},{"key":"B","text":"224.0.0.1"},{"key":"C","text":"0.0.0.0"},{"key":"D","text":"255.255.255.255"}],"answer":["D"]}]},{"id":"SP25_RE","title":"SP25 • RE • 49 câu","group":"Đề học kỳ","questions":[{"number":1,"text":"Which DHCP IPv4 message contains the following information? Destination address: 255.255.255.255 Client IPv4 address: 0.0.0.0 Default gateway address: 0.0.0.0 Subnet mask: 0.0.0.0","options":[{"key":"A","text":"DHCPDISCOVER"},{"key":"B","text":"DHCPOFFER"},{"key":"C","text":"DHCPACK"},{"key":"D","text":"DHCPREQUEST"}],"answer":["A"]},{"number":2,"text":"Which command disables Cisco Discovery Protocol (CDP) on an interface?","options":[{"ke VI can only be created for the management VLAN"},{"key":"C","text":"A default SVI is created for VLAN 1 for switch administration"},{"key":"D","text":"Creating an SVI automatically creates an associated VLAN"}],"answer":["C"]},{"number":8,"text":"What character is used to enable the filtering of commands?","options":[{"key":"A","text":"pipe |"},{"key":"B","text":"comma,"},{"key":"C","text":"colon:"},{"key":"D","text":"semi colon;"}],"answer":["A"]},{"number":9,"text":"Which router bootup sequence is correct?","options":[{"key":"A","text":"1-perform the POST and load the bootstrap program 2-locate and load the Cisco IOS software 3-locate and load the startup configuration file or enter setup mode"},{"key":"B","text":"1-perform the POST and load the startup configuration file 2-locate and load the bootstrap program 3-locate and load the Cisco IOS software"},{"key":"C","text":"1-perform the POST and load the bootstrap program 2-locate and load the startup configuration file or enter setup mode 3-locate and load the Cisco IOS software"},{"key":"D","text":"1-perform the POST and load the Cisco IOS software 2-locate and load the startup configuration file or enter setup mode 3-locate and load the bootstrap program"}],"answer":["A"]},{"number":10,"text":"Which command would be best to use on an unused switch port if a company adheres to the best practices as recommended by Cisco?","options":[{"key":"A","text":"switchport port-security mac-address sticky mac-address"},{"key":"B","text":"ip dhcp snooping"},{"key":"C","text":"shutdown"},{"key":"D","text":"switchport port-security violation shutdown"},{"key":"E","text":"switchport port-security mac-address sticky"}],"answer":["C"]},{"number":11,"text":"On what switch ports should PortFast be enabled to enhance STP stability?","options":[{"key":"A","text":"only ports that are elected as designated ports"},{"key":"B","text":"all trunk ports that are not root ports"},{"key":"C","text":"all end-user ports"},{"key":"D","text":"only ctions"},{"key":"B","text":"Collisions on the network"},{"key":"C","text":"Malfunctioning Network Interface Cards (NICS)"},{"key":"D","text":"Interface overload due to high traffic"}],"answer":["B"]},{"number":46,"text":"Why is Layer 2 security important in a network?","options":[{"key":"A","text":"It prevents STP loops"},{"key":"B","text":"If compromised, upper layers can also be attacked"},{"key":"C","text":"It replaces ACLS"},{"key":"D","text":"It enables NAT transtation"}],"answer":["B"]},{"number":47,"text":"What is the primary purpose of Spanning Tree Protocol (STP)?","options":[{"key":"A","text":"To automatically assign IP addresses to devices"},{"key":"B","text":"To prevent Layer 2 loops while allowing for network redundancy."},{"key":"C","text":"To prioritize voice traffic over data traffic."},{"key":"D","text":"To extend broadcast domains across routers."}],"answer":["B"]},{"number":48,"text":"What is the purpose of CAPWAP in a WLAN?","options":[{"key":"A","text":"To allow a WLC to manage multiple access points"},{"key":"B","text":"To encrypt data between wireless clients and access points"},{"key":"C","text":"To provide a virtual private network (VPN) over WLAN"},{"key":"D","text":"To enable client devices to connect to multiple SSIDs simultaneous"}],"answer":["A"]},{"number":49,"text":"Which prefix is used to configure a default static route in IPv6?","options":[{"key":"A","text":"0.0.0.0/0"},{"key":"B","text":"::1/128"},{"key":"C","text":"::/0"},{"key":"D","text":"FF00::/8"}],"answer":["C"]},{"number":50,"text":"Which command should be configured on a router interface to set the router as a stateful DHCPv6 client?","options":[{"key":"A","text":"ipv6 address dhop"},{"key":"B","text":"ipv6 address autoconfigure"},{"key":"C","text":"ipv6 enable"},{"key":"D","text":"ipv6 dhcp server stateful"}],"answer":["A"]}]},{"id":"SP26_RE","title":"SP26 • RE • 50 câu","group":"Đề học kỳ","questions":[{"number":1,"text":"What is the correct four-step process a DHCPv4 client follows to obtain an initial lease?","options":[{"key":"A","text":"DHCPOFFER, DHCPREQUEST, DHCPDISCOVER, DHCPACK."},{"key":"B","text":"DHCPREQUEST, DHCPACK, DHCPDISCOVER, DHCPOFFER."},{"key":"C","text":"DHCPDISCOVER, DHCPOFFER, DHCPREQUEST, DHCPACK."},{"key":"D","text":"DHCPACK, DHCPDISCOVER, DHCPOFFER, DHCPREQUEST"}],"answer":["C"]},{"number":2,"text":"What is the primary function of a Layer 3 switch?","options":[{"key":"A","text":"To connect devices at Layer 1"},{"key":"B","text":"To provide routing services between VLANS"},{"key":"C","text":"To manage broadcast traffic only"},{"key":"D","text":"To serve as a firewall"}],"answer":["B"]},{"number":3,"text":"Which two messages are broadcast during the DHCPv4 lease process? (Choose two)","options":[{"key":"A","text":"DHCPDISCOVER"},{"key":"B","text":"DHCPACK"},{"key":"C","text":"DHCPOFFER"},{"key":"D","text":"DHCPREQUEST"},{"key":"E","text":"DHCPDECLINE"}],"answer":["A","D"]},{"number":4,"text":"When a client is requesting an initial address lease from a DHCP server, why is the DHCPREQUEST message sent as a broadcast?","options":[{"key":"A","text":"The client does not yet know the IP address of the DHCP server that sent the offer."},{"key":"B","text":"The client may have received offers from multiple servers, and the broadcast serves to implicitly decline those other offers."},{"key":"C","text":"The client does not have a MAC address assigned yet, so it cannot send a unicast message at Layer 2."},{"key":"D","text":"The DHCP server may be on a different subnet, so the request must be sent as a broadcast."}],"answer":["B"]},{"number":5,"text":"What are two advantages of static routing over dynamic routing? (Choose two.)","options":[{"key":"A","text":"Static routing is more secure because it does not advertise routes to other routers."},{"key":"B","text":"Static routing is relatively easy to configure for large networks."},{"key":"C","text":"Static routing requires very little knowledge of the network for correct i e of setting the native VLAN separate from data VLANs?","options":[{"key":"A","text":"A separate VLAN should be used to carry uncommon untagged frames to avoid bandwidth contention on data VLANS."},{"key":"B","text":"The security of management frames that are carried in the native VLAN can be enhanced."},{"key":"C","text":"The native VLAN is for carrying VLAN management traffic only."},{"key":"D","text":"The native VLAN is for routers and switches to exchange their management information, so it should be different from data VLANS."}],"answer":["B"]},{"number":27,"text":"Which statement is true about broadcast and collision domains?","options":[{"key":"A","text":"The size of the collision domain can be reduced by adding hubs to a network."},{"key":"B","text":"Adding a switch to a network will increase the size of the broadcast domain."},{"key":"C","text":"Adding a router to a network will increase the size of the collision domain."},{"key":"D","text":"The more interfaces a router has the larger the resulting broadcast domain"}],"answer":["B"]},{"number":28,"text":"What is one function of a Layer 2 switch?","options":[{"key":"A","text":"forwards data based on logical addressing"},{"key":"B","text":"determines which interface is used to forward a frame based on the destination MAC address"},{"key":"C","text":"duplicates the electrical signal of each frame to every port"},{"key":"D","text":"learns the port assigned to a host by examining the destination MAC address"}],"answer":["B"]},{"number":29,"text":"Which port speed will be auto negotiated between a host with a 1 Gbps NIC connecting to a Cisco Catalyst 2960 switch with a 100 Mbps port?","options":[{"key":"A","text":"10 Mbps"},{"key":"B","text":"100 Mbps"},{"key":"C","text":"1 Gbps"},{"key":"D","text":"10 Gbps"}],"answer":["B"]},{"number":30,"text":"Which method does a switch use to decide where to forward frames on a LAN?","options":[{"key":"A","text":"ARP cache."},{"key":"B","text":"IP routing table."},{"key":"C", ,{"number":50,"text":"What is the primary purpose of the IEEE 802.1X standard?","options":[{"key":"A","text":"To prevent IP address spoofing attacks."},{"key":"B","text":"To restrict unauthorized workstations from connecting to a LAN through switch ports."},{"key":"C","text":"To dynamically assign IP addresses to network devices."},{"key":"D","text":"To mitigate broadcast storms caused by Layer 2 loops."}],"answer":["B"]}]},{"id":"SU25_FE","title":"SU25 • FE • 50 câu","group":"Đề học kỳ","questions":[{"number":1,"text":"What type of static route is created when the next-hop IP address and exit interface are specified?","options":[{"key":"A","text":"recursive static route"},{"key":"B","text":"directly connected static route"},{"key":"C","text":"fully specified static route"},{"key":"D","text":"floating static route"}],"answer":["C"]},{"number":2,"text":"What is a characteristic of a default static route?","options":[{"key":"A","text":"It backs up a route already discovered by a dynamic routing protocol."},{"key":"B","text":"It is configured with a higher administrative distance than is the original dynamic routing protocol."},{"key":"C","text":"It uses a single network address to send multiple static routes to one destination address."},{"key":"D","text":"identifies the gateway IP address to which the router sends all IP packets for which it does not have a learned or static route."}],"answer":["D"]},{"number":3,"text":"Which of the following is a step to mitigate VLAN hopping attacks?","options":[{"key":"A","text":"Enable DTP (auto trunking) on all ports"},{"key":"B","text":"Disable DTP negotiations on trunking ports"},{"key":"C","text":"Set all ports to trunk mode by default"},{"key":"D","text":"Assign VLAN 1 as the native VLAN on all ports"}],"answer":["B"]},{"number":4,"text":"A network administrator is determining the best placement of VLAN trunk links. Which two types of point-to-point connections utilize VLAN trunking? (Choose two.)","options":[{"key":"A","tex rough"}],"answer":["C"]},{"number":9,"text":"What DHCPv6 message does a host send to look for a DHCPv6 server?","options":[{"key":"A","text":"ADVERTISE"},{"key":"B","text":"SOLICIT"},{"key":"C","text":"INFORMATION-REQUEST"},{"key":"D","text":"REQUEST"}],"answer":["B"]},{"number":10,"text":"Which command must be configured on a router to enable it to join the IPv6 all-routers multicast address ff02::2?","options":[{"key":"A","text":"ip routing"},{"key":"B","text":"ipv6 unicast-routing"},{"key":"C","text":"ipv6 address 'ipv6-address/prefix-length'"},{"key":"D","text":"ipv6 address 'ipv6-address' link-local"}],"answer":["B"]},{"number":11,"text":"Which command can be used to reset the interface to the default SLAAC option, disabling stateless DHCPv6?","options":[{"key":"A","text":"no ipv6 nd managed-config-flag"},{"key":"B","text":"no ipv6 nd other-config-flag"},{"key":"C","text":"no ipv6 dhcp server"},{"key":"D","text":"no ipv6 address autoconfig"}],"answer":["B"]},{"number":12,"text":"What destination UDP port do DHCPv6 clients use to send DHCPv6 messages?","options":[{"key":"A","text":"67"},{"key":"B","text":"68"},{"key":"C","text":"547"},{"key":"D","text":"546"}],"answer":["C"]},{"number":13,"text":"Which type of VLAN is assigned to 802.1Q trunk ports to carry untagged traffic?","options":[{"key":"A","text":"default"},{"key":"B","text":"native"},{"key":"C","text":"data"},{"key":"D","text":"management"}],"answer":["B"]},{"number":14,"text":"Which two concepts relate to a switch port that is intended to have only end devices attached and intended never to be used to connect to another switch? (Choose two.)","options":[{"key":"A","text":"bridge ID"},{"key":"B","text":"PortFast"},{"key":"C","text":"edge port"},{"key":"D","text":"extended system ID"},{"key":"E","text":"PVST+"}],"answer":["B","C"]},{"number":15,"text":"What happens to a port that is associated with VLAN 10 when the administrator deletes VLAN 10 from the switch?","options":[{"key":"A","text":"The port creates the VLAN again"},{"key":"B","text":"The port goes back to the default VLAN"},{"key":"C","text":"The port automatically associates itself with the native VLAN"},{"key":"D","text":"The port becomes inactive"}],"answer":["D"]},{"number":16,"text":"Which three components are combined to form a bridge ID?","options":[{"key":"A","text":"Bridge priority"},{"key":"B","text":"Cost"},{"key":"C","text":"Extended system ID"},{"key":"D","text":"IP address"},{"key":"E","text":"MAC address"},{"key":"F","text":"Port ID"}],"answer":["A","C","E"]},{"number":17,"text":"Which frequency band is used by the 802.11ac standard?","options":[{"key":"A","text":"2.4 GHz"},{"key":"B","text":"3.6 GHz"},{"key":"C","text":"5 GHz"},{"key":"D","text":"7 GHz"}],"answer":["C"]},{"number":18,"text":"What will a router do if it does not have a default route configured and a packet needs to be forwarded to a destination network that is not listed in the routing table?","options":[{"key":"A","text":"send it back to the source"},{"key":"B","text":"drop it"},{"key":"C","text":"forward it to another router"},{"key":"D","text":"None of the mentioned."}],"answer":["B"]},{"number":19,"text":"A network administrator has entered a static route to an Ethernet LAN that is connected to an adjacent router. However, the route is not shown in the routing table. Which command would the administrator use to verify that the exit interface is up?","options":[{"key":"A","text":"show ip interface brief"},{"key":"B","text":"tracert"},{"key":"C","text":"snow ip protocols"},{"key":"D","text":"show ip route"}],"answer":["A"]},{"number":20,"text":"Which of the following is a standalone device, like a home router, where the entire WLAN configuration resides on the device?","options":[{"key":"A","text":"Range extender"},{"key":"B","text":"Autonomous AP C Controller-based AP"},{"key":"D","text":"USB Wireless NIC"}],"answer":["B"]},{"number":21,"text":"Which protocol is specified in RFC 1256 and allows IPv4 hosts to locate routers that provide IP connectivity to other networks?","options":[{"key":"A","text":"HSRP"},{"key":"B","text":"GLBP"},{"key":"C","text":"VRRP"},{"key":"D","text":"IRDP"}],"answer":["D"]},{"number":22,"text":"What command enables preemption in HSRP, allowing a higher priority router to take over as the active router?","options":[{"key":"A","text":"standby priority"},{"key":"B","text":"standby preempt"},{"key":"C","text":"standby track"},{"key":"D","text":"standby ip"}],"answer":["B"]},{"number":23,"text":"A user has just purchased a generic home router and would like to secure it. What should be done to help secure the wireless home router?","options":[{"key":"A","text":"Change the default SSID."},{"key":"B","text":"Set a private IPv4 network for the internal network."},{"key":"C","text":"Allow only IPv6 traffic to enter the router."},{"key":"D","text":"Change the default administrator password."}],"answer":["D"]},{"number":24,"text":"What is a difference between autonomous APs that operate in a home environment and controller-based APs that operate in a corporate environment?","options":[{"key":"A","text":"Controller-based APs can be automatically configured and managed by a WLAN controller."},{"key":"B","text":"Controller-based APs are known as lightweight APs and require an initial configuration to operate."},{"key":"C","text":"Autonomous APs do not support PoE."},{"key":"D","text":"Autonomous APs incorporate the functions of a router, switch, and AP into one device."}],"answer":["A"]},{"number":25,"text":"What two protocols are supported on Cisco devices for AAA communications? (Choose two.)","options":[{"key":"A","text":"RADIUS"},{"key":"B","text":"LLDP"},{"key":"C","text":"HSRP"},{"key":"D","text":"VTP"},{"key":"E","text":"TACACS+"}],"answer":["A","E"]},{"number":26,"text":"Because of implemented security controls, a user can only access a server with FTP. Which AAA component accomplishes this?","options":[{"key":"A","text":"authorization"},{"key":"B","text":"authentication"},{"key":"C","text":"accessibility"},{"key":"D","text":"accounting"},{"key":"E","text":"auditing"}],"answer":["A"]},{"number":27,"text":"Why is authentication with AAA preferred over a local database method?","options":[{"key":"A","text":"It specifies a different password for each line or port."},{"key":"B","text":"It requires a login and password combination on the console, vty lines, and aux ports."},{"key":"C","text":"It provides a fallback authentication method if the administrator forgets the username or password."},{"key":"D","text":"It uses less network bandwidth."}],"answer":["C"]},{"number":28,"text":"What is involved in an IP address spoofing attack?","options":[{"key":"A","text":"Bogus DHCPDISCOVER messages are sent to consume all the available addresses on a DHCP server."},{"key":"B","text":"A rogue DHCP server provides false IP configuration parameters to legitimate DHCP clients."},{"key":"C","text":"A rogue node replies to an ARP request with its own MAC address indicated for the target IP address."},{"key":"D","text":"A legitimate network IP address is hijacked by a roque node."}],"answer":["D"]},{"number":29,"text":"A DHCP-enabled client PC has just booted. During which two steps will the client PC use broadcast messages when communicating with a DHCP server? (Choose two.)","options":[{"key":"A","text":"DHCPNAK"},{"key":"B","text":"DHCPREQUEST"},{"key":"C","text":"DHCPOFFER"},{"key":"D","text":"DHCPACK"},{"key":"E","text":"DHCPDISCOVER"}],"answer":["B","E"]},{"number":30,"text":"What kind of message is sent by a DHCPv4 client requesting an IP address?","options":[{"key":"A","text":"DHCPDISCOVER unicast message"},{"key":"B","text":"DHCPDISCOVER broadcast message"},{"key":"C","text":"DHCPOFFER unicast message"},{"key":"D","text":"DHCPACK unicast message"}],"answer":["B"]},{"number":31,"text":"What is the destination IP address when an IPv4 host sends a DHCPDISCOVER message?","options":[{"key":"A","text":"192.168.1.1"},{"key":"B","text":"255.255.255.255"},{"key":"C","text":"0.0.0.0"},{"key":"D","text":"224.0.0.1"}],"answer":["B"]},{"number":32,"text":"An administrator issues the commands: Router(config)# interface g0/1 Router(config-if)# ip address dhcp","options":[{"key":"A","text":"configuring the router to act as a DHCPv4 server"},{"key":"B","text":"configuring the router to act as a relay agent"},{"key":"C","text":"configuring the router to resolve IP address conflicts"},{"key":"D","text":"configuring the router to obtain IP parameters from a DHCPv4 server"}],"answer":["D"]},{"number":33,"text":"Which type of static route creates a gateway of last resort?","options":[{"key":"A","text":"summary static route"},{"key":"B","text":"standard static route"},{"key":"C","text":"floating static route"},{"key":"D","text":"default static route"}],"answer":["D"]},{"number":34,"text":"What is the main function of Dynamic ARP Inspection (DAI)?","options":[{"key":"A","text":"To prevent unauthorized DHCP servers"},{"key":"B","text":"To mitigate ARP spoofing and ARP poisoning attacks"},{"key":"C","text":"To control access to VLANS"},{"key":"D","text":"To provide routing between VLANS"}],"answer":["B"]},{"number":35,"text":"Which of the following mitigation techniques prevents many types of attacks including MAC address table overflow and DHCP starvation attacks?","options":[{"key":"A","text":"IPSG"},{"key":"B","text":"DHCP snooping"},{"key":"C","text":"DAI"},{"key":"D","text":"Port security"}],"answer":["D"]},{"number":36,"text":"Which AAA component is responsible for determining what the user can access?","options":[{"key":"A","text":"Authentication"},{"key":"B","text":"Authorization"},{"key":"C","text":"Accounting"},{"key":"D","text":"All of other choices"}],"answer":["B"]},{"number":37,"text":"A network administrator has configured VLAN 99 as the management VLAN and has configured it with an IP address and subnet mask. The administrator issues the show interface vlan 99 command and notices that the line protocol i VLAN on trunk ports."},{"key":"D","text":"Disable trunk negotiation for trunk ports and statically set nontrunk ports as access ports."}],"answer":["D"]},{"number":43,"text":"What is the most likely scenario in which the WAN interface of a router would be configured as a DHCP client to be assigned a dynamic IP address from an ISP?","options":[{"key":"A","text":"The router is also the gateway for a LAN"},{"key":"B","text":"There is a web server for public access on the LAN that is attached to the router"},{"key":"C","text":"It is a SOHO or home broadband router"},{"key":"D","text":"The router is configured as a DHCP server"}],"answer":["C"]},{"number":44,"text":"Which security feature should be enabled in order to prevent an attacker from overflowing the MAC address table of a switch?","options":[{"key":"A","text":"storm control"},{"key":"B","text":"port security"},{"key":"C","text":"PPDU filter"},{"key":"D","text":"root guard"}],"answer":["B"]},{"number":45,"text":"What Layer 2 attack is mitigated by disabling Dynamic Trunking Protocol?","options":[{"key":"A","text":"VLAN hopping"},{"key":"B","text":"DHCP spoofing"},{"key":"C","text":"ARP poisoning"},{"key":"D","text":"ARP spoofing"}],"answer":["A"]},{"number":46,"text":"The root bridge will be the switch with the:","options":[{"key":"A","text":"Lowest bridge ID"},{"key":"B","text":"Highest bridge ID"},{"key":"C","text":"Lowest port priority"},{"key":"D","text":"Highest port priority"}],"answer":["A"]},{"number":47,"text":"What message informs IPv6 enabled interfaces to use stateful DHCPv6 for obtaining an IPv6 address?","options":[{"key":"A","text":"the ICMPv6 Router Advertisement"},{"key":"B","text":"the DHCPv6 Reply message"},{"key":"C","text":"the ICMPv6 Router Solicitation"},{"key":"D","text":"the DHCPv6 Advertise message"}],"answer":["A"]},{"number":48,"text":"What are two characteristics of the SLAAC method for IPv6 address configuration? (Choose two.)","options":[{"key":"A","text":"Router solicitation messages are sent by the router to offer IPv6 addressing to clients."},{"key":"B","text":"The default gateway of an IPv6 client on a LAN will be the link-local address of the router interface attached to the LAN."},{"key":"C","text":"This stateful method of acquiring an IPv6 address requires at least one DHCPv6 server."},{"key":"D","text":"Clients send router advertisement messages to routers to request IPv6 addressing."},{"key":"E","text":"IPv6 addressing is dynamically assigned to clients through the use of ICMPv6."}],"answer":["B","E"]},{"number":49,"text":"Which method would an IPv6-enabled host using SLAAC employ to learn the address of the default gateway?","options":[{"key":"A","text":"neighbor advertisements that are received from link neighbors"},{"key":"B","text":"router advertisements that are received from the link router"},{"key":"C","text":"reply messages that are received from the DHCPv6 server"},{"key":"D","text":"advertise messages that are received from the DHCPv6 server"}],"answer":["B"]},{"number":50,"text":"What is the default maximum number of MAC addresses that can be learned on a switch port with port security enabled?","options":[{"key":"A","text":"1"},{"key":"B","text":"10"},{"key":"C","text":"100"},{"key":"D","text":"8192"}],"answer":["A"]}]},{"id":"SU25_RE","title":"SU25 • RE • 50 câu","group":"Đề học kỳ","questions":[{"number":1,"text":"What is the purpose of AAA accounting?","options":[{"key":"A","text":"to determine which resources the user can access"},{"key":"B","text":"to collect and report application usage"},{"key":"C","text":"to prove users are who they say they are"},{"key":"D","text":"to determine which operations the user can perform"}],"answer":["B"]},{"number":2,"text":"When a client is requesting an initial address lease from a DHCP server, why is the DHCPREQUEST message sent as a broadcast?","options":[{"key":"A","text":"The client does not yet know the IP address of the DHCP server that sent the offer."},{"key":"B","text":"The client may have received offers from multiple servers, and the broadcast serves to implicitly decline those other offers."},{"key":"C","text":"The client does not have a MAC address assigned yet, so it cannot send a unicast message at Layer 2."},{"key":"D","text":"The DHCP server may be on a different subnet, so the request must be sent as a broadcast."}],"answer":["B"]},{"number":3,"text":"What happens when a port security violation occurs and the port is in the default violation mode?","options":[{"key":"A","text":"The port shuts down immediately and must be re-enabled manually"},{"key":"B","text":"The port drops packets but remains operational"},{"key":"C","text":"The port logs a message but continues to operate normally"},{"key":"D","text":"The port resets and clears all MAC addresses"}],"answer":["A"]},{"number":4,"text":"What advantage does SSH offer over Telnet?","options":[{"key":"A","text":"connection-oriented service"},{"key":"B","text":"encryption"},{"key":"C","text":"more connection lines"},{"key":"D","text":"username and password authentication"}],"answer":["B"]},{"number":5,"text":"What flag settings combination is used for stateless DHCP?","options":[{"key":"A","text":"A = 1 M = 0 O = 0"},{"key":"B","text":"A = 0 M = 1 0=0"},{"key":"C","text":"A = 1 M = 0 O = 1"},{"key":"D","text":"A = 0 M = 1 O = 1"}],"answer":["A"]},{"number":6,"text":"What does the term \"port density\" represent for an Ethernet switch?","options":[{"key":"A","text":"the memory space that is allocated to each switch port"},{"key":"B","text":"the number of available ports"},{"key":"C","text":"the speed of each port"},{"key":"D","text":"the numbers of hosts that are connected to each switch port"}],"answer":["B"]},{"number":7,"text":"What are two advantages of static routing over dynamic routing? (Choose two.)","options":[{"key":"A","text":"Static routing is more secure because it does not advertise routes to other routers."},{"key":"B","text":"Static routing is relatively easy to configure for large networks."},{"key":"C","text":"Static routing requires very little knowledge of the network for correct implementation."},{"key":"D","text":"Static routing scales well with expanding networks."},{"key":"E","text":"Static routing uses fewer router resources than dynamic routing."}],"answer":["A","E"]},{"number":8,"text":"What is the Spanning Tree Protocol (STP)?","options":[{"key":"A","text":"A Layer 3 routing protocol."},{"key":"B","text":"A Layer 2 loop prevention protocol."},{"key":"C","text":"A Layer 2 bandwidth management protoco"},{"key":"D","text":"A Layer 3 load balancing protocol."}],"answer":["B"]},{"number":9,"text":"Which is an example of a DHCP starvation attack?","options":[{"key":"A","text":"A threat actor changes the MAC address of the threat actor's device to the MAC address of the default gateway."},{"key":"B","text":"A threat actor configures a host with the 802.1Q protocol and forms a trunk with the connected switch."},{"key":"C","text":"A threat actor discovers the IOS version and IP addresses of the local switch."},{"key":"D","text":"A threat actor leases all the available IP addresses on a subnet to deny legitimate clients DHCP resources."},{"key":"E","text":"A threat actor sends a BPDU message with priority 0."},{"key":"F","text":"A threat actor sends a message that causes all other devices to believe the MAC address of the threat actor's device is the default gateway."}],"answer":["D"]},{"number":10,"text":"In an 802.1X implementation, which device is responsible for relaying responses?","options":[{"key":"A","text":"Supplicant"},{"key":"B","text":"Authenticator"},{"key":"C","text":"Router"},{"key":"D","text":"Authentication server"},{"key":"E","text":"Client"}],"answer":["B"]},{"number":11,"text":"What route has the highest administrative distance?","options":[{"key":"A","text":"A directly connected network"},{"key":"B","text":"A route received through the EIGRP routing protocol"},{"key":"C","text":"A route received through the OSPF routing protocol"},{"key":"D","text":"A static route"}],"answer":["C"]},{"number":12,"text":"What is an advantage of configuring a Cisco router as a relay agent?","options":[{"key":"A","text":"It can forward both broadcast and multicast messages on behalf of clients."},{"key":"B","text":"It can provide relay services for multiple UDP services."},{"key":"C","text":"It reduces the response time from a DHCP server."},{"key":"D","text":"It will allow DHCPDISCOVER messages to pass without alteration"}],"answer":["B"]},{"number":13,"text":"An IPv6-enabled interface is required to have which type of address?","options":[{"key":"A","text":"loopback"},{"key":"B","text":"global unicast"},{"key":"C","text":"link-local"},{"key":"D","text":"static"}],"answer":["C"]},{"number":14,"text":"Which statement describes the system LED operation on Cisco Catalyst switches?","options":[{"key":"A","text":"If the LED is blinking after, the switch is performing POST"},{"key":"B","text":"If the LED is amber, the system is receiving power but it is not functioning properly"},{"key":"C","text":"If the LED is blinking green, the system is operating normally"},{"key":"D","text":"If the LED is amber, the system is not powered on"}],"answer":["B"]},{"number":15,"text":"What DHCPv6 message does a host send to the DHCPv6 server if it is using stateful DHCPv6?","options":[{"key":"A","text":"ADVERTISE"},{"key":"B","text":"SOLICIT"},{"key":"C","text":"INFORMATION-REQUEST"},{"key":"D","text":"REQUEST"}],"answer":["B"]},{"number":16,"text":"Which three statements accurately describe VLAN types?","options":[{"key":"A","text":"A data VLAN is used to carry VLAN management data and user-generated traffic."},{"key":"B","text":"A management VLAN is any VLAN that is configured to access management features of the switch."},{"key":"C","text":"After the initial boot of an unconfigured switch, all ports are members of the default VLAN."},{"key":"D","text":"An 802.1Q trunk port, with a native VLAN assigned, supports both tagged and untagged traffic."},{"key":"E","text":"Voice VLANs are used to support user phone and email traffic on a network."},{"key":"F","text":"VLAN 1 is always used as the management VLAN"}],"answer":["B","C","D"]},{"number":17,"text":"How does an IPv6 client ensure that it has a unique address after it configures its IPv6 address using the SLAAC allocation method?","options":[{"key":"A","text":"It contacts the DHCPv6 server via a special formed ICMPv6 message."},{"key":"B","text":"It checks with the IPv6 address database that is hosted by the SLAAC server."},{"key":"C","text":"It sends an ARP message with the IPv6 address as the destination IPv6 address."},{"key":"D","text":"It sends an ICMPv6 Neighbor Solicitation message with the IPv6 address as the target IPv6 address."}],"answer":["D"]},{"number":18,"text":"Which command configures the switch to remember dynamically learned MAC addresses even after a reboot?","options":[{"key":"A","text":"switchport port-security mac-address dynamic"},{"key":"B","text":"switchport port-security mac-address sticky"},{"key":"C","text":"switchport port-security aging time 10"},{"key":"D","text":"switchport port-security violation protect"}],"answer":["B"]},{"number":19,"text":"How often does a router send RA messages by default?","options":[{"key":"A","text":"Every 100 seconds"},{"key":"B","text":"Every 150 seconds"},{"key":"C","text":"Every 200 seconds"},{"key":"D","text":"Every 300 seconds"}],"answer":["C"]},{"number":20,"text":"You cannot ping a directly connected host. Which IOS command can be used to validate Layer 1 and Layer 2 connectivity?","options":[{"key":"A","text":"ping"},{"key":"B","text":"show cdp neighbors detail"},{"key":"C","text":"show ip interface brief"},{"key":"D","text":"show ip route"},{"key":"E","text":"traceroute"}],"answer":["B"]},{"number":21,"text":"A laptop cannot connect to a wireless access point. Which two troubleshooting steps should be taken first? (Choose two.)","options":[{"k
