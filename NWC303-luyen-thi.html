e Layer 3 topology"},{"key":"D","text":"To avoid redundancy"}],"answer":["B"]},{"number":36,"text":"[SP26 · Q36] The root bridge will be the switch with the","options":[{"key":"A","text":"Lowest bridge ID"},{"key":"B","text":"Highest bridge ID"},{"key":"C","text":"Lowest port priority"},{"key":"D","text":"Highest port priority"}],"answer":["A"]},{"number":37,"text":"[SP26 · Q37] Which protocol is a Cisco proprietary protocol that manages trunk negotiations?","options":[{"key":"A","text":"Spanning Tree Protocol (STP)"},{"key":"B","text":"Open Shortest Path First (OSPF)"},{"key":"C","text":"Dynamic Trunking Protocol (DTP)."},{"key":"D","text":"Virtual Router Redundancy Protocol (VRRP)."}],"answer":["C"]},{"number":38,"text":"[SP26 · Q38] How does EtherChannel improve network redundancy without being blocked by STP?","options":[{"key":"A","text":"By creating loops within the network"},{"key":"B","text":"By ensuring links operate independently"},{"key":"C","text":"By aggregating links into one logical connection"},{"key":"D","text":"By disabling loop-prevention protocols"}],"answer":["C"]},{"number":39,"text":"[SP26 · Q39] Which AAA component is responsible for controlling who is permitted to access the network?","options":[{"key":"A","text":"Authentication"},{"key":"B","text":"Authorization"},{"key":"C","text":"Accounting"},{"key":"D","text":"All of other choices"}],"answer":["A"]},{"number":40,"text":"[SP26 · Q40] Why does voice traffic require a separate VLAN?","options":[{"key":"A","text":"It uses static IP addressing"},{"key":"B","text":"It needs low latency and QoS istency and Qos der"},{"key":"C","text":"It can only use broadcast packets"},{"key":"D","text":"It cannot be routed"},{"key":"E","text":"Fit interferes with HTTP traffic"}],"answer":["B"]},{"number":41,"text":"[SP26 · Q41] Which three Cisco products focus on endpoint security solutions? (Choose three.)","options":[{"key":"A","text":"NAC Appliance"},{"key":"B","text":"Adaptive Security Appliance"},{"key":"C","text":"SSL/IPsec VPN Appliance"},{"key":"D","text":"IPS Sensor Appliance"},{"key":"E","text":"Web Security Appliance"},{"key":"F","text":"Email Security Appliance"}],"answer":["A","B","C"]},{"number":42,"text":"[SP26 · Q42] In Cisco IOS, which command is used to administratively disable an unused switch port?","options":[{"key":"A","text":"shutdown port"},{"key":"B","text":"disable"},{"key":"C","text":"shutdown"},{"key":"D","text":"no enable"}],"answer":["C"]},{"number":43,"text":"[SP26 · Q43] What does Administrative Distance (AD) represent in a router's IP routing table?","options":[{"key":"A","text":"The bandwidth of the link to the destination network."},{"key":"B","text":"The 'trustworthiness' of the route source."},{"key":"C","text":"The number of hops to the destination."},{"key":"D","text":"The total cost of the path"}],"answer":["B"]},{"number":44,"text":"[SP26 · Q44] In Cisco IOS 15, when does an active interface appear in the routing table with two entries, 'C' and 'L\"?","options":[{"key":"A","text":"When it is a loopback interface."},{"key":"B","text":"When it is a configured static route"},{"key":"C","text":"When it represents a directly connected network ( connected network (Connected) and its local address (Local)."},{"key":"D","text":"When it is a dynamically learned OSPF route"}],"answer":["C"]},{"number":45,"text":"[SP26 · Q45] What is the most common cause of Runt Frames?","options":[{"key":"A","text":"Damaged cables or loose connections"},{"key":"B","text":"Collisions on the network"},{"key":"C","text":"Malfunctioning Network Interface Cards (NICS)"},{"key":"D","text":"Interface overload due to high traffic"}],"answer":["B"]},{"number":46,"text":"[SP26 · Q46] Why is Layer 2 security important in a network?","options":[{"key":"A","text":"It prevents STP loops"},{"key":"B","text":"If compromised, upper layers can also be attacked"},{"key":"C","text":"It replaces ACLS"},{"key":"D","text":"It enables NAT transtation"}],"answer":["B"]},{"number":47,"text":"[SP26 · Q47] What is the primary purpose of Spanning Tree Protocol (STP)?","options":[{"key":"A","text":"To automatically assign IP addresses to devices"},{"key":"B","text":"To prevent Layer 2 loops while allowing for network redundancy."},{"key":"C","text":"To prioritize voice traffic over data traffic."},{"key":"D","text":"To extend broadcast domains across routers."}],"answer":["B"]},{"number":48,"text":"[SP26 · Q48] What is the purpose of CAPWAP in a WLAN?","options":[{"key":"A","text":"To allow a WLC to manage multiple access points"},{"key":"B","text":"To encrypt data between wireless clients and access points"},{"key":"C","text":"To provide a virtual private network (VPN) over WLAN"},{"key":"D","text":"To enable client devices to connect to multiple SSIDs simultaneous"}],"answer":["A"]},{"number":49,"text":"[SP26 · Q49] Which prefix is used to configure a default static route in IPv6?","options":[{"key":"A","text":"0.0.0.0/0"},{"key":"B","text":"::1/128"},{"key":"C","text":"::/0"},{"key":"D","text":"FF00::/8"}],"answer":["C"]},{"number":50,"text":"[SP26 · Q50] Which command should be configured on a router interface to set the router as a stateful DHCPv6 client?","options":[{"key":"A","text":"ipv6 address dhop"},{"key":"B","text":"ipv6 address autoconfigure"},{"key":"C","text":"ipv6 enable"},{"key":"D","text":"ipv6 dhcp server stateful"}],"answer":["A"]},{"number":1,"text":"[SP26 · Q1] What is the correct four-step process a DHCPv4 client follows to obtain an initial lease?","options":[{"key":"A","text":"DHCPOFFER, DHCPREQUEST, DHCPDISCOVER, DHCPACK."},{"key":"B","text":"DHCPREQUEST, DHCPACK, DHCPDISCOVER, DHCPOFFER."},{"key":"C","text":"DHCPDISCOVER, DHCPOFFER, DHCPREQUEST, DHCPACK."},{"key":"D","text":"DHCPACK, DHCPDISCOVER, DHCPOFFER, DHCPREQUEST"}],"answer":["C"]},{"number":2,"text":"[SP26 · Q2] What is the primary function of a Layer 3 switch?","options":[{"key":"A","text":"To connect devices at Layer 1"},{"key":"B","text":"To provide routing services between VLANS"},{"key":"C","text":"To manage broadcast traffic only"},{"key":"D","text":"To serve as a firewall"}],"answer":["B"]},{"number":3,"text":"[SP26 · Q3] Which two messages are broadcast during the DHCPv4 lease process? (Choose two)","options":[{"key":"A","text":"DHCPDISCOVER"},{"key":"B","text":"DHCPACK"},{"key":"C","text":"DHCPOFFER"},{"key":"D","text":"DHCPREQUEST"},{"key":"E","text":"DHCPDECLINE"}],"answer":["A","D"]},{"number":4,"text":"[SP26 · Q4] When a client is requesting an initial address lease from a DHCP server, why is the DHCPREQUEST message sent as a broadcast?","options":[{"key":"A","text":"The client does not yet know the IP address of the DHCP server that sent the offer."},{"key":"B","text":"The client may have received offers from multiple servers, and the broadcast serves to implicitly decline those other offers."},{"key":"C","text":"The client does not have a MAC address assigned yet, so it cannot send a unicast message at Layer 2."},{"key":"D","text":"The DHCP server may be on a different subnet, so the request must be sent as a broadcast."}],"answer":["B"]},{"number":5,"text":"[SP26 · Q5] What are two advantages of static routing over dynamic routing? (Choose two.)","options":[{"key":"A","text":"Static routing is more secure because it does not advertise routes to other routers."},{"key":"B","text":"Static routing is relatively easy to configure for large networks."},{"key":"C","text":"Static routing requires very little knowledge of the network for correct implementation."},{"key":"D","text":"Static routing scales well with expanding networks."},{"key":"E","text":"Static routing uses fewer router resources than dynamic routing."}],"answer":["A","E"]},{"number":6,"text":"[SP26 · Q6] Which three advantages are provided by static routing? (Choose three.)","options":[{"key":"A","text":"Static routing does no advertise over the network, thus providing better security."},{"key":"B","text":"No intervention is required to maintain changing route information."},{"key":"C","text":"Static routes scale well as the network grows."},{"key":"D","text":"The path a static route uses to send data is known."},{"key":"E","text":"Configuration of static routes is error-free."},{"key":"F","text":"Static routing typically uses less network bandwidth and fewer CPU operations than dynamic routing does."}],"answer":["A","D","F"]},{"number":7,"text":"[SP26 · Q7] What does the metric value in the routing table output indicate?","options":[{"key":"A","text":"The maximum bandwidth available"},{"key":"B","text":"The administrative level of the router"},{"key":"C","text":"The cost of the path to the destination"},{"key":"D","text":"The number of packets forwarded"}],"answer":["C"]},{"number":8,"text":"[SP26 · Q8] Which type of static route would typically be used on a border router so that devices inside the company could access the Internet?","options":[{"key":"A","text":"float"},{"key":"B","text":"directly connected"},{"key":"C","text":"summary"},{"key":"D","text":"default"}],"answer":["D"]},{"number":9,"text":"[SP26 · Q9] What advantage does SSH offer over Telnet?","options":[{"key":"A","text":"connection-oriented service"},{"key":"B","text":"encryption"},{"key":"C","text":"more connection lines"},{"key":"D","text":"username and password authentication"}],"answer":["B"]},{"number":10,"text":"[SP26 · Q10] What advantage does SSH offer over Telnet?","options":[{"key":"A","text":"connection-oriented services"},{"key":"B","text":"more connection lines"},{"key":"C","text":"username and password authentication"},{"key":"D","text":"encryption"}],"answer":["D"]},{"number":11,"text":"[SP26 · Q11] What is a key security concern with the Telnet protocol, which uses TCP port 23?","options":[{"key":"A","text":"It uses encrypted communication for data transmission."},{"key":"B","text":"It transmits login authentication and data in plaintext."},{"key":"C","text":"It requires additional hardware to establish connections"},{"key":"D","text":"It does not support communication between devices"}],"answer":["B"]},{"number":12,"text":"[SP26 · Q12] An IPv6-enabled interface is required to have which type of address?","options":[{"key":"A","text":"loopback"},{"key":"B","text":"global unicast"},{"key":"C","text":"link-local"},{"key":"D","text":"static"}],"answer":["C"]},{"number":13,"text":"[SP26 · Q13] For security purposes, what is considered a best practice regarding the management VLAN of a switch?","options":[{"key":"A","text":"Keep the default management VLAN as VLAN 1."},{"key":"B","text":"Avoid using VLANs for management purposes."},{"key":"C","text":"Use a VLAN other than VLAN 1 as the management VLAN."},{"key":"D","text":"Delete all VLANs on the switch."}],"answer":["C"]},{"number":14,"text":"[SP26 · Q14] Which destination IPv4 address does a DHCPv4 client use to send the initial DHCP Discover packet when the client is looking for a DHCP server?","options":[{"key":"A","text":"127.0.0.1"},{"key":"B","text":"255.255.255.255"},{"key":"C","text":"the IP address of the default gateway"},{"key":"D","text":"224.0.0.1"}],"answer":["B"]},{"number":15,"text":"[SP26 · Q15] Which is a DHCPv4 address allocation method that assigns IPv4 addresses for a limited lease period?","options":[{"key":"A","text":"automatic allocation"},{"key":"B","text":"pre-allocation"},{"key":"C","text":"dynamic allocation"},{"key":"D","text":"manual allocation"}],"answer":["C"]},{"number":16,"text":"[SP26 · Q16] Dynamic ARP Inspection (DAI) requires which other security feature to be enabled for its proper operation?","options":[{"key":"A","text":"Port Security."},{"key":"B","text":"VLAN tagging (802.1Q)."},{"key":"C","text":"DHCP snooping."},{"key":"D","text":"STP BPDU Guar"}],"answer":["C"]},{"number":17,"text":"[SP26 · Q17] Which two commands can be used to enable PortFast on a switch? (Choose two.)","options":[{"key":"A","text":"S1(config-if)# enable spanning-tree portfast"},{"key":"B","text":"S1(config-if)# spanning-tree portfast"},{"key":"C","text":"S1(config)# enable spanning-tree portfast default"},{"key":"D","text":"S1(config)# spanning-tree portfast default"},{"key":"E","text":"S1(config-line)# spanning-tree portfast"}],"answer":["B","D"]},{"number":18,"text":"[SP26 · Q18] What role does ICMPv6 play in the SLAAC process?","options":[{"key":"A","text":"It assigns DNS servers to IPv6 hosts directly"},{"key":"B","text":"It relays DHCPv6 messages"},{"key":"C","text":"It carries RA and RS messages"},{"key":"D","text":"It encrypts the IPv6 header"}],"answer":["C"]},{"number":19,"text":"[SP26 · Q19] The port closest to the root bridge in terms of least overall cost (best path) to the root bridge is the:","options":[{"key":"A","text":"Designated port"},{"key":"B","text":"Blocked port or non-designated port"},{"key":"C","text":"Root port"},{"key":"D","text":"Routed port"}],"answer":["C"]},{"number":20,"text":"[SP26 · Q20] Which two flags in a Router Advertisement determine the method a host uses to obtain addressing information?","options":[{"key":"A","text":"Land G"},{"key":"B","text":"M and O"},{"key":"C","text":"A and D"},{"key":"D","text":"F and T"}],"answer":["B"]},{"number":21,"text":"[SP26 · Q21] Which flag in an ICMPv6 RA message indicates that a host should use SLAAC to create an IPv6 Global Unicast Address (GUA)?","options":[{"key":"A","text":"The O flag (Other Configuration flag)."},{"key":"B","text":"The M flag (Managed Address Configuration flag)."},{"key":"C","text":"The A flag (Address Autoconfiguration flag)."},{"key":"D","text":"The R flag (Router Preference flag)."}],"answer":["C"]},{"number":22,"text":"[SP26 · Q22] A network administrator is configuring a route to forward packets to a specific web server. What type of route should be configured by the administrator?","options":[{"key":"A","text":"an OSPF route"},{"key":"B","text":"a static route with an administrative distance higher than 1"},{"key":"C","text":"a default route"},{"key":"D","text":"a host route"},{"key":"E","text":"an EIGRP route"}],"answer":["D"]},{"number":23,"text":"[SP26 · Q23] Which type of static route that is configured on a router uses only the exit interface?","options":[{"key":"A","text":"fully specified static route"},{"key":"B","text":"directly connected static route"},{"key":"C","text":"recursive static route"},{"key":"D","text":"default static route"}],"answer":["B"]},{"number":24,"text":"[SP26 · Q24] A network administrator uses the command ip route 172.18.0.0 255.255.0.0 S0/0/1 to configure a floating static route on a router. That route will function as a backup route to reach the EIGRP learned network 172.18.0.0/16. After this configuration, the EIGRP route is removed from the routing table even though EIGRP is still functioning properly. Why is the static route not functioning as intended?","options":[{"key":"A","text":"The network mask is incorrectly configured."},{"key":"B","text":"The next hop neighbor IP address is not configured."},{"key":"C","text":"The destination network is incorrectly configured."},{"key":"D","text":"The administrative distance value is not high enough on the static route."}],"answer":["D"]},{"number":25,"text":"[SP26 · Q25] What command, or set of commands, would be used to determine if the following configuration on router HQ works as designed? ip route 0.0.0.0 0.0.0.0 serial 0/0/0 10 ip route 0.0.0.0 0.0.0.0 serial 0/1/0","options":[{"key":"A","text":"HQ# traceroute 128.107.0.99"},{"key":"B","text":"HQ# show ip route"},{"key":"C","text":"HQ(config)# interface serial 0/1/0 HQ(config-if)# shutdown HQ(config-if)# end HQ# show ip route"},{"key":"D","text":"HQ# ping 128.107.0.99 HQ# ping 64.100.0.5"},{"key":"E","text":"HQ# show ip interface brief"}],"answer":["C"]},{"number":26,"text":"[SP26 · Q26] What is the purpose of setting the native VLAN separate from data VLANs?","options":[{"key":"A","text":"A separate VLAN should be used to carry uncommon untagged frames to avoid bandwidth contention on data VLANS."},{"key":"B","text":"The security of management frames that are carried in the native VLAN can be enhanced."},{"key":"C","text":"The native VLAN is for carrying VLAN management traffic only."},{"key":"D","text":"The native VLAN is for routers and switches to exchange their management information, so it should be different from data VLANS."}],"answer":["B"]},{"number":27,"text":"[SP26 · Q27] Which statement is true about broadcast and collision domains?","options":[{"key":"A","text":"The size of the collision domain can be reduced by adding hubs to a network."},{"key":"B","text":"Adding a switch to a network will increase the size of the broadcast domain."},{"key":"C","text":"Adding a router to a network will increase the size of the collision domain."},{"key":"D","text":"The more interfaces a router has the larger the resulting broadcast domain"}],"answer":["B"]},{"number":28,"text":"[SP26 · Q28] What is one function of a Layer 2 switch?","options":[{"key":"A","text":"forwards data based on logical addressing"},{"key":"B","text":"determines which interface is used to forward a frame based on the destination MAC address"},{"key":"C","text":"duplicates the electrical signal of each frame to every port"},{"key":"D","text":"learns the port assigned to a host by examining the destination MAC address"}],"answer":["B"]},{"number":29,"text":"[SP26 · Q29] Which port speed will be auto negotiated between a host with a 1 Gbps NIC connecting to a Cisco Catalyst 2960 switch with a 100 Mbps port?","options":[{"key":"A","text":"10 Mbps"},{"key":"B","text":"100 Mbps"},{"key":"C","text":"1 Gbps"},{"key":"D","text":"10 Gbps"}],"answer":["B"]},{"number":30,"text":"[SP26 · Q30] Which method does a switch use to decide where to forward frames on a LAN?","options":[{"key":"A","text":"ARP cache."},{"key":"B","text":"IP routing table."},{"key":"C","text":"MAC address table."},{"key":"D","text":"DNS lookup."}],"answer":["C"]},{"number":31,"text":"[SP26 · Q31] What flag settings combination is used for stateless DHCP?","options":[{"key":"A","text":"A = 1 M = 0 O=0"},{"key":"B","text":"A = 0 M = 1 o = 0"},{"key":"C","text":"A = 1 M = 0 O = 1"},{"key":"D","text":"A = 0 M = 1 O = 1"}],"answer":["C"]},{"number":32,"text":"[SP26 · Q32] Which IEEE standard operates at wireless frequencies in both the 5 GHz and 2.4 GHz ranges?","options":[{"key":"A","text":"802.11a"},{"key":"B","text":"802.11g"},{"key":"C","text":"802.11b"},{"key":"D","text":"802.11n"}],"answer":["D"]},{"number":33,"text":"[SP26 · Q33] Which three components are combined to form a bridge ID?","options":[{"key":"A","text":"Bridge priority"},{"key":"B","text":"Cost"},{"key":"C","text":"Extended system ID"},{"key":"D","text":"IP address"},{"key":"E","text":"MAC address"},{"key":"F","text":"Port ID"}],"answer":["A","C","E"]},{"number":34,"text":"[SP26 · Q34] Which STP port state allows MAC address learning but not forwarding?","options":[{"key":"A","text":"Blocking"},{"key":"B","text":"Listening"},{"key":"C","text":"Learning"},{"key":"D","text":"Forwarding"},{"key":"E","text":"Disabled"}],"answer":["C"]},{"number":35,"text":"[SP26 · Q35] Which antenna type provides 360-degree coverage and is ideal for homes?","options":[{"key":"A","text":"Parabolic"},{"key":"B","text":"Directional"},{"key":"C","text":"Omnidirectional"},{"key":"D","text":"Panel"}],"answer":["C"]},{"number":36,"text":"[SP26 · Q36] What are some potential consequences of a Layer 2 loop in a switched Ethernet network?","options":[{"key":"A","text":"Only increased network spee"},{"key":"B","text":"MAC address table instability, link saturation, and high CPU utilization."},{"key":"C","text":"Improved network security and reduced latency."},{"key":"D","text":"Automatic load balancing across all links."}],"answer":["B"]},{"number":37,"text":"[SP26 · Q37] Which feature of 802.11n wireless access points allows them to transmit data at faster speeds than previous versions of 802.11 Wi-Fi standards did?","options":[{"key":"A","text":"SPS"},{"key":"B","text":"WPS"},{"key":"C","text":"MITM"},{"key":"D","text":"MIMO"}],"answer":["D"]},{"number":38,"text":"[SP26 · Q38] Which two port states in STP do not forward frames, but still process BPDUs?","options":[{"key":"A","text":"Blocking and Disabled"},{"key":"B","text":"Listening and Forwarding"},{"key":"C","text":"Blocking and Listening"},{"key":"D","text":"Learning and Forwarding"}],"answer":["C"]},{"number":39,"text":"[SP26 · Q39] Which of the following wireless networks typically uses lower powered transmitters for short ranges?","options":[{"key":"A","text":"WPAN"},{"key":"B","text":"WLAN"},{"key":"C","text":"WMAN"},{"key":"D","text":"WWAN"}],"answer":["A"]},{"number":40,"text":"[SP26 · Q40] Why might a default static route with correct syntax not be used for forwarding?","options":[{"key":"A","text":"Its administrative distance is too low"},{"key":"B","text":"Another route has a longer match"},{"key":"C","text":"It must be configured on VLAN 1"},{"key":"D","text":"It uses a loopback interface"}],"answer":["B"]},{"number":41,"text":"[SP26 · Q41] What IPv6 default static route prefix would you configure for a global route entry?","options":[{"key":"A","text":"/64"},{"key":"B","text":"::/128"},{"key":"C","text":"::/0"},{"key":"D","text":"fe80::/10"}],"answer":["C"]},{"number":42,"text":"[SP26 · Q42] A static route has been configured on a router. However, the destination network no longer exists. What should an administrator do to remove the static route from the routing table?","options":[{"key":"A","text":"Remove the route using the no ip route command."},{"key":"B","text":"Change the routing metric for that route."},{"key":"C","text":"Change the administrative distance for that route."},{"key":"D","text":"Nothing. The static route will go away on its own."}],"answer":["A"]},{"number":43,"text":"[SP26 · Q43] What command enables preemption in HSRP, allowing a higher priority router to take over as the active router?","options":[{"key":"A","text":"standby priority"},{"key":"B","text":"standby preempt"},{"key":"C","text":"standby track"},{"key":"D","text":"standby ip"}],"answer":["B"]},{"number":44,"text":"[SP26 · Q44] Which configuration step is required for basic wireless setup?","options":[{"key":"A","text":"Create a VLAN for wireless"},{"key":"B","text":"Set up firewall rules"},{"key":"C","text":"Configure SSID and select security mode"},{"key":"D","text":"Enable RIP on the router"}],"answer":["C"]},{"number":45,"text":"[SP26 · Q45] Which benefit does NAT provide on a WLAN router?","options":[{"key":"A","text":"Encrypts internal traffic"},{"key":"B","text":"Prevents channel interference"},{"key":"C","text":"Hides internal IP addresses from external networks"},{"key":"D","text":"Assigns MAC addresses dynamically"},{"key":"E","text":"Balances bandwidth between multiple wireless clients"}],"answer":["C"]},{"number":46,"text":"[SP26 · Q46] When security is a concern, which OSI Layer is considered to be the weakest link in a network system?","options":[{"key":"A","text":"Layer 4"},{"key":"B","text":"Layer 7"},{"key":"C","text":"Layer 2"},{"key":"D","text":"Layer 3"}],"answer":["B"]},{"number":47,"text":"[SP26 · Q47] In an 802.1X deployment, which component acts as the authentication server?","options":[{"key":"A","text":"Switch"},{"key":"B","text":"Access point"},{"key":"C","text":"RADIUS server"},{"key":"D","text":"Default gateway"}],"answer":["C"]},{"number":48,"text":"[SP26 · Q48] A user is configuring a wireless access point and wants to prevent any neighbors from discovering the network. What action does the user need to take?","options":[{"key":"A","text":"Configure DMZ settings."},{"key":"B","text":"Configure a DNS server."},{"key":"C","text":"Disable SSID broadcast."},{"key":"D","text":"Enable WPA encryption."}],"answer":["C"]},{"number":49,"text":"[SP26 · Q49] What two protocols are supported on Cisco devices for AAA communications? (Choose two.)","options":[{"key":"A","text":"RADIUS"},{"key":"B","text":"LLDP"},{"key":"C","text":"HSRP"},{"key":"D","text":"VTP"},{"key":"E","text":"TACACS+"}],"answer":["A","E"]},{"number":50,"text":"[SP26 · Q50] What is the primary purpose of the IEEE 802.1X standard?","options":[{"key":"A","text":"To prevent IP address spoofing attacks."},{"key":"B","text":"To restrict unauthorized workstations from connecting to a LAN through switch ports."},{"key":"C","text":"To dynamically assign IP addresses to network devices."},{"key":"D","text":"To mitigate broadcast storms caused by Layer 2 loops."}],"answer":["B"]},{"number":1,"text":"[SU25 · Q1] What type of static route is created when the next-hop IP address and exit interface are specified?","options":[{"key":"A","text":"recursive static route"},{"key":"B","text":"directly connected static route"},{"key":"C","text":"fully specified static route"},{"key":"D","text":"floating static route"}],"answer":["C"]},{"number":2,"text":"[SU25 · Q2] What is a characteristic of a default static route?","options":[{"key":"A","text":"It backs up a route already discovered by a dynamic routing protocol."},{"key":"B","text":"It is configured with a higher administrative distance than is the original dynamic routing protocol."},{"key":"C","text":"It uses a single network address to send multiple static routes to one destination address."},{"key":"D","text":"identifies the gateway IP address to which the router sends all IP packets for which it does not have a learned or static route."}],"answer":["D"]},{"number":3,"text":"[SU25 · Q3] Which of the following is a step to mitigate VLAN hopping attacks?","options":[{"key":"A","text":"Enable DTP (auto trunking) on all ports"},{"key":"B","text":"Disable DTP negotiations on trunking ports"},{"key":"C","text":"Set all ports to trunk mode by default"},{"key":"D","text":"Assign VLAN 1 as the native VLAN on all ports"}],"answer":["B"]},{"number":4,"text":"[SU25 · Q4] A network administrator is determining the best placement of VLAN trunk links. Which two types of point-to-point connections utilize VLAN trunking? (Choose two.)","options":[{"key":"A","text":"between two switches that utilize multiple VLANS"},{"key":"B","text":"between a switch and a server that has an 802.1Q NIC"},{"key":"C","text":"between a switch and a network printer"},{"key":"D","text":"between two switches that share a common VLAN"},{"key":"E","text":"between a switch and a client PC"}],"answer":["A","B"]},{"number":5,"text":"[SU25 · Q5] What are two reasons a network administrator would segment a network with a Layer 2 switch? (Choose two.)","options":[{"key":"A","text":"To create fewer collision domains"},{"key":"B","text":"To create more broadcast domains"},{"key":"C","text":"To eliminate virtual circuits"},{"key":"D","text":"To enhance user bandwidth"},{"key":"E","text":"To isolate ARP request messages from the rest of the network"},{"key":"F","text":"To isolate traffic between segments"}],"answer":["D","F"]},{"number":6,"text":"[SU25 · Q6] What happens to a port that is associated with VLAN 10 when the administrator deletes VLAN 10 from the switch?","options":[{"key":"A","text":"The port creates the VLAN again."},{"key":"B","text":"The port goes back to the default VLAN."},{"key":"C","text":"The port automatically associates itself with the native VLAN."},{"key":"D","text":"The port becomes inactive."}],"answer":["D"]},{"number":7,"text":"[SU25 · Q7] What is the significant difference between a hub and a Layer 2 LAN switch?","options":[{"key":"A","text":"A hub divides collision domains, and a switch divides broadcast domains."},{"key":"B","text":"Each port of a hub is a collision domain, and each port of a switch is a broadcast domain."},{"key":"C","text":"A switch creates many smaller collision domains, and a hub increases the size of a single collision domain."},{"key":"D","text":"A hub forwards frames, and a switch forwards only packets."}],"answer":["C"]},{"number":8,"text":"[SU25 · Q8] Which switching method makes use of the FCS value?","options":[{"key":"A","text":"broadcast"},{"key":"B","text":"large frame buffer"},{"key":"C","text":"store-and-forward"},{"key":"D","text":"cut-through"}],"answer":["C"]},{"number":9,"text":"[SU25 · Q9] What DHCPv6 message does a host send to look for a DHCPv6 server?","options":[{"key":"A","text":"ADVERTISE"},{"key":"B","text":"SOLICIT"},{"key":"C","text":"INFORMATION-REQUEST"},{"key":"D","text":"REQUEST"}],"answer":["B"]},{"number":10,"text":"[SU25 · Q10] Which command must be configured on a router to enable it to join the IPv6 all-routers multicast address ff02::2?","options":[{"key":"A","text":"ip routing"},{"key":"B","text":"ipv6 unicast-routing"},{"key":"C","text":"ipv6 address 'ipv6-address/prefix-length'"},{"key":"D","text":"ipv6 address 'ipv6-address' link-local"}],"answer":["B"]},{"number":11,"text":"[SU25 · Q11] Which command can be used to reset the interface to the default SLAAC option, disabling stateless DHCPv6?","options":[{"key":"A","text":"no ipv6 nd managed-config-flag"},{"key":"B","text":"no ipv6 nd other-config-flag"},{"key":"C","text":"no ipv6 dhcp server"},{"key":"D","text":"no ipv6 address autoconfig"}],"answer":["B"]},{"number":12,"text":"[SU25 · Q12] What destination UDP port do DHCPv6 clients use to send DHCPv6 messages?","options":[{"key":"A","text":"67"},{"key":"B","text":"68"},{"key":"C","text":"547"},{"key":"D","text":"546"}],"answer":["C"]},{"number":13,"text":"[SU25 · Q13] Which type of VLAN is assigned to 802.1Q trunk ports to carry untagged traffic?","options":[{"key":"A","text":"default"},{"key":"B","text":"native"},{"key":"C","text":"data"},{"key":"D","text":"management"}],"answer":["B"]},{"number":14,"text":"[SU25 · Q14] Which two concepts relate to a switch port that is intended to have only end devices attached and intended never to be used to connect to another switch? (Choose two.)","options":[{"key":"A","text":"bridge ID"},{"key":"B","text":"PortFast"},{"key":"C","text":"edge port"},{"key":"D","text":"extended system ID"},{"key":"E","text":"PVST+"}],"answer":["B","C"]},{"number":15,"text":"[SU25 · Q15] What happens to a port that is associated with VLAN 10 when the administrator deletes VLAN 10 from the switch?","options":[{"key":"A","text":"The port creates the VLAN again"},{"key":"B","text":"The port goes back to the default VLAN"},{"key":"C","text":"The port automatically associates itself with the native VLAN"},{"key":"D","text":"The port becomes inactive"}],"answer":["D"]},{"number":16,"text":"[SU25 · Q16] Which three components are combined to form a bridge ID?","options":[{"key":"A","text":"Bridge priority"},{"key":"B","text":"Cost"},{"key":"C","text":"Extended system ID"},{"key":"D","text":"IP address"},{"key":"E","text":"MAC address"},{"key":"F","text":"Port ID"}],"answer":["A","C","E"]},{"number":17,"text":"[SU25 · Q17] Which frequency band is used by the 802.11ac standard?","options":[{"key":"A","text":"2.4 GHz"},{"key":"B","text":"3.6 GHz"},{"key":"C","text":"5 GHz"},{"key":"D","text":"7 GHz"}],"answer":["C"]},{"number":18,"text":"[SU25 · Q18] What will a router do if it does not have a default route configured and a packet needs to be forwarded to a destination network that is not listed in the routing table?","options":[{"key":"A","text":"send it back to the source"},{"key":"B","text":"drop it"},{"key":"C","text":"forward it to another router"},{"key":"D","text":"None of the mentioned."}],"answer":["B"]},{"number":19,"text":"[SU25 · Q19] A network administrator has entered a static route to an Ethernet LAN that is connected to an adjacent router. However, the route is not shown in the routing table. Which command would the administrator use to verify that the exit interface is up?","options":[{"key":"A","text":"show ip interface brief"},{"key":"B","text":"tracert"},{"key":"C","text":"snow ip protocols"},{"key":"D","text":"show ip route"}],"answer":["A"]},{"number":20,"text":"[SU25 · Q20] Which of the following is a standalone device, like a home router, where the entire WLAN configuration resides on the device?","options":[{"key":"A","text":"Range extender"},{"key":"B","text":"Autonomous AP C Controller-based AP"},{"key":"D","text":"USB Wireless NIC"}],"answer":["B"]},{"number":21,"text":"[SU25 · Q21] Which protocol is specified in RFC 1256 and allows IPv4 hosts to locate routers that provide IP connectivity to other networks?","options":[{"key":"A","text":"HSRP"},{"key":"B","text":"GLBP"},{"key":"C","text":"VRRP"},{"key":"D","text":"IRDP"}],"answer":["D"]},{"number":22,"text":"[SU25 · Q22] What command enables preemption in HSRP, allowing a higher priority router to take over as the active router?","options":[{"key":"A","text":"standby priority"},{"key":"B","text":"standby preempt"},{"key":"C","text":"standby track"},{"key":"D","text":"standby ip"}],"answer":["B"]},{"number":23,"text":"[SU25 · Q23] A user has just purchased a generic home router and would like to secure it. What should be done to help secure the wireless home router?","options":[{"key":"A","text":"Change the default SSID."},{"key":"B","text":"Set a private IPv4 network for the internal network."},{"key":"C","text":"Allow only IPv6 traffic to enter the router."},{"key":"D","text":"Change the default administrator password."}],"answer":["D"]},{"number":24,"text":"[SU25 · Q24] What is a difference between autonomous APs that operate in a home environment and controller-based APs that operate in a corporate environment?","options":[{"key":"A","text":"Controller-based APs can be automatically configured and managed by a WLAN controller."},{"key":"B","text":"Controller-based APs are known as lightweight APs and require an initial configuration to operate."},{"key":"C","text":"Autonomous APs do not support PoE."},{"key":"D","text":"Autonomous APs incorporate the functions of a router, switch, and AP into one device."}],"answer":["A"]},{"number":25,"text":"[SU25 · Q25] What two protocols are supported on Cisco devices for AAA communications? (Choose two.)","options":[{"key":"A","text":"RADIUS"},{"key":"B","text":"LLDP"},{"key":"C","text":"HSRP"},{"key":"D","text":"VTP"},{"key":"E","text":"TACACS+"}],"answer":["A","E"]},{"number":26,"text":"[SU25 · Q26] Because of implemented security controls, a user can only access a server with FTP. Which AAA component accomplishes this?","options":[{"key":"A","text":"authorization"},{"key":"B","text":"authentication"},{"key":"C","text":"accessibility"},{"key":"D","text":"accounting"},{"key":"E","text":"auditing"}],"answer":["A"]},{"number":27,"text":"[SU25 · Q27] Why is authentication with AAA preferred over a local database method?","options":[{"key":"A","text":"It specifies a different password for each line or port."},{"key":"B","text":"It requires a login and password combination on the console, vty lines, and aux ports."},{"key":"C","text":"It provides a fallback authentication method if the administrator forgets the username or password."},{"key":"D","text":"It uses less network bandwidth."}],"answer":["C"]},{"number":28,"text":"[SU25 · Q28] What is involved in an IP address spoofing attack?","options":[{"key":"A","text":"Bogus DHCPDISCOVER messages are sent to consume all the available addresses on a DHCP server."},{"key":"B","text":"A rogue DHCP server provides false IP configuration parameters to legitimate DHCP clients."},{"key":"C","text":"A rogue node replies to an ARP request with its own MAC address indicated for the target IP address."},{"key":"D","text":"A legitimate network IP address is hijacked by a roque node."}],"answer":["D"]},{"number":29,"text":"[SU25 · Q29] A DHCP-enabled client PC has just booted. During which two steps will the client PC use broadcast messages when communicating with a DHCP server? (Choose two.)","options":[{"key":"A","text":"DHCPNAK"},{"key":"B","text":"DHCPREQUEST"},{"key":"C","text":"DHCPOFFER"},{"key":"D","text":"DHCPACK"},{"key":"E","text":"DHCPDISCOVER"}],"answer":["B","E"]},{"number":30,"text":"[SU25 · Q30] What kind of message is sent by a DHCPv4 client requesting an IP address?","options":[{"key":"A","text":"DHCPDISCOVER unicast message"},{"key":"B","text":"DHCPDISCOVER broadcast message"},{"key":"C","text":"DHCPOFFER unicast message"},{"key":"D","text":"DHCPACK unicast message"}],"answer":["B"]},{"number":31,"text":"[SU25 · Q31] What is the destination IP address when an IPv4 host sends a DHCPDISCOVER message?","options":[{"key":"A","text":"192.168.1.1"},{"key":"B","text":"255.255.255.255"},{"key":"C","text":"0.0.0.0"},{"key":"D","text":"224.0.0.1"}],"answer":["B"]},{"number":32,"text":"[SU25 · Q32] An administrator issues the commands: Router(config)# interface g0/1 Router(config-if)# ip address dhcp","options":[{"key":"A","text":"configuring the router to act as a DHCPv4 server"},{"key":"B","text":"configuring the router to act as a relay agent"},{"key":"C","text":"configuring the router to resolve IP address conflicts"},{"key":"D","text":"configuring the router to obtain IP parameters from a DHCPv4 server"}],"answer":["D"]},{"number":33,"text":"[SU25 · Q33] Which type of static route creates a gateway of last resort?","options":[{"key":"A","text":"summary static route"},{"key":"B","text":"standard static route"},{"key":"C","text":"floating static route"},{"key":"D","text":"default static route"}],"answer":["D"]},{"number":34,"text":"[SU25 · Q34] What is the main function of Dynamic ARP Inspection (DAI)?","options":[{"key":"A","text":"To prevent unauthorized DHCP servers"},{"key":"B","text":"To mitigate ARP spoofing and ARP poisoning attacks"},{"key":"C","text":"To control access to VLANS"},{"key":"D","text":"To provide routing between VLANS"}],"answer":["B"]},{"number":35,"text":"[SU25 · Q35] Which of the following mitigation techniques prevents many types of attacks including MAC address table overflow and DHCP starvation attacks?","options":[{"key":"A","text":"IPSG"},{"key":"B","text":"DHCP snooping"},{"key":"C","text":"DAI"},{"key":"D","text":"Port security"}],"answer":["D"]},{"number":36,"text":"[SU25 · Q36] Which AAA component is responsible for determining what the user can access?","options":[{"key":"A","text":"Authentication"},{"key":"B","text":"Authorization"},{"key":"C","text":"Accounting"},{"key":"D","text":"All of other choices"}],"answer":["B"]},{"number":37,"text":"[SU25 · Q37] A network administrator has configured VLAN 99 as the management VLAN and has configured it with an IP address and subnet mask. The administrator issues the show interface vlan 99 command and notices that the line protocol is down. Which action can change the state of the line protocol to up?","options":[{"key":"A","text":"Configure a transport input method on the vty lines."},{"key":"B","text":"Connect a host to an interface associated with VLAN 99."},{"key":"C","text":"Fremove all access ports from VLAN 99."},{"key":"D","text":"Configure a default gateway."}],"answer":["B"]},{"number":38,"text":"[SU25 · Q38] Which statement describes SVIs?","options":[{"key":"A","text":"An SVI can only be created for the management VLAN."},{"key":"B","text":"A default SVI is created for VLAN 1 for switch administration."},{"key":"C","text":"Creating an SVI automatically creates an associated VLAN."},{"key":"D","text":"An SVI is created automatically for each VLAN on a multilayer switch."}],"answer":["B"]},{"number":39,"text":"[SU25 · Q39] Which prompt is displayed when a network administrator successfully accesses the boot loader on a switch to recover from a system crash?","options":[{"key":"A","text":"switch#"},{"key":"B","text":"system#"},{"key":"C","text":"system:"},{"key":"D","text":"switch:"}],"answer":["D"]},{"number":40,"text":"[SU25 · Q40] What type of Ethernet cable would be used to connect one switch to another switch when neither switch supports the auto-MDIX feature?","options":[{"key":"A","text":"crossover"},{"key":"B","text":"rollover"},{"key":"C","text":"straight-through"},{"key":"D","text":"coaxial"}],"answer":["A"]},{"number":41,"text":"[SU25 · Q41] Which command will display a summary of all IPv6-enabled interfaces on a router that includes the Ipv6 address and operational status?","options":[{"key":"A","text":"show ip interface brief"},{"key":"B","text":"show ipv6 route"},{"key":"C","text":"show running-config interface"},{"key":"D","text":"show ipv6 interface brief"}],"answer":["D"]},{"number":42,"text":"[SU25 · Q42] What is the best way to prevent a VLAN hopping attack?","options":[{"key":"A","text":"Use ISL encapsulation on all trunk links."},{"key":"B","text":"Disable STP on all nontrunk ports."},{"key":"C","text":"Use VLAN 1 as the native VLAN on trunk ports."},{"key":"D","text":"Disable trunk negotiation for trunk ports and statically set nontrunk ports as access ports."}],"answer":["D"]},{"number":43,"text":"[SU25 · Q43] What is the most likely scenario in which the WAN interface of a router would be configured as a DHCP client to be assigned a dynamic IP address from an ISP?","options":[{"key":"A","text":"The router is also the gateway for a LAN"},{"key":"B","text":"There is a web server for public access on the LAN that is attached to the router"},{"key":"C","text":"It is a SOHO or home broadband router"},{"key":"D","text":"The router is configured as a DHCP server"}],"answer":["C"]},{"number":44,"text":"[SU25 · Q44] Which security feature should be enabled in order to prevent an attacker from overflowing the MAC address table of a switch?","options":[{"key":"A","text":"storm control"},{"key":"B","text":"port security"},{"key":"C","text":"PPDU filter"},{"key":"D","text":"root guard"}],"answer":["B"]},{"number":45,"text":"[SU25 · Q45] What Layer 2 attack is mitigated by disabling Dynamic Trunking Protocol?","options":[{"key":"A","text":"VLAN hopping"},{"key":"B","text":"DHCP spoofing"},{"key":"C","text":"ARP poisoning"},{"key":"D","text":"ARP spoofing"}],"answer":["A"]},{"number":46,"text":"[SU25 · Q46] The root bridge will be the switch with the:","options":[{"key":"A","text":"Lowest bridge ID"},{"key":"B","text":"Highest bridge ID"},{"key":"C","text":"Lowest port priority"},{"key":"D","text":"Highest port priority"}],"answer":["A"]},{"number":47,"text":"[SU25 · Q47] What message informs IPv6 enabled interfaces to use stateful DHCPv6 for obtaining an IPv6 address?","options":[{"key":"A","text":"the ICMPv6 Router Advertisement"},{"key":"B","text":"the DHCPv6 Reply message"},{"key":"C","text":"the ICMPv6 Router Solicitation"},{"key":"D","text":"the DHCPv6 Advertise message"}],"answer":["A"]},{"number":48,"text":"[SU25 · Q48] What are two characteristics of the SLAAC method for IPv6 address configuration? (Choose two.)","options":[{"key":"A","text":"Router solicitation messages are sent by the router to offer IPv6 addressing to clients."},{"key":"B","text":"The default gateway of an IPv6 client on a LAN will be the link-local address of the router interface attached to the LAN."},{"key":"C","text":"This stateful method of acquiring an IPv6 address requires at least one DHCPv6 server."},{"key":"D","text":"Clients send router advertisement messages to routers to request IPv6 addressing."},{"key":"E","text":"IPv6 addressing is dynamically assigned to clients through the use of ICMPv6."}],"answer":["B","E"]},{"number":49,"text":"[SU25 · Q49] Which method would an IPv6-enabled host using SLAAC employ to learn the address of the default gateway?","options":[{"key":"A","text":"neighbor advertisements that are received from link neighbors"},{"key":"B","text":"router advertisements that are received from the link router"},{"key":"C","text":"reply messages that are received from the DHCPv6 server"},{"key":"D","text":"advertise messages that are received from the DHCPv6 server"}],"answer":["B"]},{"number":50,"text":"[SU25 · Q50] What is the default maximum number of MAC addresses that can be learned on a switch port with port security enabled?","options":[{"key":"A","text":"1"},{"key":"B","text":"10"},{"key":"C","text":"100"},{"key":"D","text":"8192"}],"answer":["A"]},{"number":1,"text":"[SU25 · Q1] What is the purpose of AAA accounting?","options":[{"key":"A","text":"to determine which resources the user can access"},{"key":"B","text":"to collect and report application usage"},{"key":"C","text":"to prove users are who they say they are"},{"key":"D","text":"to determine which operations the user can perform"}],"answer":["B"]},{"number":2,"text":"[SU25 · Q2] When a client is requesting an initial address lease from a DHCP server, why is the DHCPREQUEST message sent as a broadcast?","options":[{"key":"A","text":"The client does not yet know the IP address of the DHCP server that sent the offer."},{"key":"B","text":"The client may have received offers from multiple servers, and the broadcast serves to implicitly decline those other offers."},{"key":"C","text":"The client does not have a MAC address assigned yet, so it cannot send a unicast message at Layer 2."},{"key":"D","text":"The DHCP server may be on a different subnet, so the request must be sent as a broadcast."}],"answer":["B"]},{"number":3,"text":"[SU25 · Q3] What happens when a port security violation occurs and the port is in the default violation mode?","options":[{"key":"A","text":"The port shuts down immediately and must be re-enabled manually"},{"key":"B","text":"The port drops packets but remains operational"},{"key":"C","text":"The port logs a message but continues to operate normally"},{"key":"D","text":"The port resets and clears all MAC addresses"}],"answer":["A"]},{"number":4,"text":"[SU25 · Q4] What advantage does SSH offer over Telnet?","options":[{"key":"A","text":"connection-oriented service"},{"key":"B","text":"encryption"},{"key":"C","text":"more connection lines"},{"key":"D","text":"username and password authentication"}],"answer":["B"]},{"number":5,"text":"[SU25 · Q5] What flag settings combination is used for stateless DHCP?","options":[{"key":"A","text":"A = 1 M = 0 O = 0"},{"key":"B","text":"A = 0 M = 1 0=0"},{"key":"C","text":"A = 1 M = 0 O = 1"},{"key":"D","text":"A = 0 M = 1 O = 1"}],"answer":["A"]},{"number":6,"text":"[SU25 · Q6] What does the term \"port density\" represent for an Ethernet switch?","options":[{"key":"A","text":"the memory space that is allocated to each switch port"},{"key":"B","text":"the number of available ports"},{"key":"C","text":"the speed of each port"},{"key":"D","text":"the numbers of hosts that are connected to each switch port"}],"answer":["B"]},{"number":7,"text":"[SU25 · Q7] What are two advantages of static routing over dynamic routing? (Choose two.)","options":[{"key":"A","text":"Static routing is more secure because it does not advertise routes to other routers."},{"key":"B","text":"Static routing is relatively easy to configure for large networks."},{"key":"C","text":"Static routing requires very little knowledge of the network for correct implementation."},{"key":"D","text":"Static routing scales well with expanding networks."},{"key":"E","text":"Static routing uses fewer router resources than dynamic routing."}],"answer":["A","E"]},{"number":8,"text":"[SU25 · Q8] What is the Spanning Tree Protocol (STP)?","options":[{"key":"A","text":"A Layer 3 routing protocol."},{"key":"B","text":"A Layer 2 loop prevention protocol."},{"key":"C","text":"A Layer 2 bandwidth management protoco"},{"key":"D","text":"A Layer 3 load balancing protocol."}],"answer":["B"]},{"number":9,"text":"[SU25 · Q9] Which is an example of a DHCP starvation attack?","options":[{"key":"A","text":"A threat actor changes the MAC address of the threat actor's device to the MAC address of the default gateway."},{"key":"B","text":"A threat actor configures a host with the 802.1Q protocol and forms a trunk with the connected switch."},{"key":"C","text":"A threat actor discovers the IOS version and IP addresses of the local switch."},{"key":"D","text":"A threat actor leases all the available IP addresses on a subnet to deny legitimate clients DHCP resources."},{"key":"E","text":"A threat actor sends a BPDU message with priority 0."},{"key":"F","text":"A threat actor sends a message that causes all other devices to believe the MAC address of the threat actor's device is the default gateway."}],"answer":["D"]},{"number":10,"text":"[SU25 · Q10] In an 802.1X implementation, which device is responsible for relaying responses?","options":[{"key":"A","text":"Supplicant"},{"key":"B","text":"Authenticator"},{"key":"C","text":"Router"},{"key":"D","text":"Authentication server"},{"key":"E","text":"Client"}],"answer":["B"]},{"number":11,"text":"[SU25 · Q11] What route has the highest administrative distance?","options":[{"key":"A","text":"A directly connected network"},{"key":"B","text":"A route received through the EIGRP routing protocol"},{"key":"C","text":"A route received through the OSPF routing protocol"},{"key":"D","text":"A static route"}],"answer":["C"]},{"number":12,"text":"[SU25 · Q12] What is an advantage of configuring a Cisco router as a relay agent?","options":[{"key":"A","text":"It can forward both broadcast and multicast messages on behalf of clients."},{"key":"B","text":"It can provide relay services for multiple UDP services."},{"key":"C","text":"It reduces the response time from a DHCP server."},{"key":"D","text":"It will allow DHCPDISCOVER messages to pass without alteration"}],"answer":["B"]},{"number":13,"text":"[SU25 · Q13] An IPv6-enabled interface is required to have which type of address?","options":[{"key":"A","text":"loopback"},{"key":"B","text":"global unicast"},{"key":"C","text":"link-local"},{"key":"D","text":"static"}],"answer":["C"]},{"number":14,"text":"[SU25 · Q14] Which statement describes the system LED operation on Cisco Catalyst switches?","options":[{"key":"A","text":"If the LED is blinking after, the switch is performing POST"},{"key":"B","text":"If the LED is amber, the system is receiving power but it is not functioning properly"},{"key":"C","text":"If the LED is blinking green, the system is operating normally"},{"key":"D","text":"If the LED is amber, the system is not powered on"}],"answer":["B"]},{"number":15,"text":"[SU25 · Q15] What DHCPv6 message does a host send to the DHCPv6 server if it is using stateful DHCPv6?","options":[{"key":"A","text":"ADVERTISE"},{"key":"B","text":"SOLICIT"},{"key":"C","text":"INFORMATION-REQUEST"},{"key":"D","text":"REQUEST"}],"answer":["B"]},{"number":16,"text":"[SU25 · Q16] Which three statements accurately describe VLAN types?","options":[{"key":"A","text":"A data VLAN is used to carry VLAN management data and user-generated traffic."},{"key":"B","text":"A management VLAN is any VLAN that is configured to access management features of the switch."},{"key":"C","text":"After the initial boot of an unconfigured switch, all ports are members of the default VLAN."},{"key":"D","text":"An 802.1Q trunk port, with a native VLAN assigned, supports both tagged and untagged traffic."},{"key":"E","text":"Voice VLANs are used to support user phone and email traffic on a network."},{"key":"F","text":"VLAN 1 is always used as the management VLAN"}],"answer":["B","C","D"]},{"number":17,"text":"[SU25 · Q17] How does an IPv6 client ensure that it has a unique address after it configures its IPv6 address using the SLAAC allocation method?","options":[{"key":"A","text":"It contacts the DHCPv6 server via a special formed ICMPv6 message."},{"key":"B","text":"It checks with the IPv6 address database that is hosted by the SLAAC server."},{"key":"C","text":"It sends an ARP message with the IPv6 address as the destination IPv6 address."},{"key":"D","text":"It sends an ICMPv6 Neighbor Solicitation message with the IPv6 address as the target IPv6 address."}],"answer":["D"]},{"number":18,"text":"[SU25 · Q18] Which command configures the switch to remember dynamically learned MAC addresses even after a reboot?","options":[{"key":"A","text":"switchport port-security mac-address dynamic"},{"key":"B","text":"switchport port-security mac-address sticky"},{"key":"C","text":"switchport port-security aging time 10"},{"key":"D","text":"switchport port-security violation protect"}],"answer":["B"]},{"number":19,"text":"[SU25 · Q19] How often does a router send RA messages by default?","options":[{"key":"A","text":"Every 100 seconds"},{"key":"B","text":"Every 150 seconds"},{"key":"C","text":"Every 200 seconds"},{"key":"D","text":"Every 300 seconds"}],"answer":["C"]},{"number":20,"text":"[SU25 · Q20] You cannot ping a directly connected host. Which IOS command can be used to validate Layer 1 and Layer 2 connectivity?","options":[{"key":"A","text":"ping"},{"key":"B","text":"show cdp neighbors detail"},{"key":"C","text":"show ip interface brief"},{"key":"D","text":"show ip route"},{"key":"E","text":"traceroute"}],"answer":["B"]},{"number":21,"text":"[SU25 · Q21] A laptop cannot connect to a wireless access point. Which two troubleshooting steps should be taken first? (Choose two.)","options":[{"key":"A","text":"Ensure that the wireless SSID is chosen."},{"key":"B","text":"Ensure that the correct network media is selected."},{"key":"C","text":"Ensure that the NIC is configured for the proper frequency."},{"key":"D","text":"Ensure that the laptop antenna is attached."},{"key":"E","text":"Ensure that the wireless NIC is enabled."}],"answer":["A","E"]},{"number":22,"text":"[SU25 · Q22] Which FHRP allows load balancing between a group of redundant routers?","options":[{"key":"A","text":"HSRP"},{"key":"B","text":"GLBP"},{"key":"C","text":"VRRP"},{"key":"D","text":"IRDP"}],"answer":["B"]},{"number":23,"text":"[SU25 · Q23] Which port state will switch ports immediately transition to when configured for PortFast?","options":[{"key":"A","text":"forwarding"},{"key":"B","text":"blocking"},{"key":"C","text":"listening"},{"key":"D","text":"learning"}],"answer":["A"]},{"number":24,"text":"[SU25 · Q24] Which address does a DHCPv4 server target when sending a DHCPOFFER message to a client that makes an address request?","options":[{"key":"A","text":"client hardware address"},{"key":"B","text":"client IP address"},{"key":"C","text":"broadcast MAC address"},{"key":"D","text":"gateway IP address"}],"answer":["A"]},{"number":25,"text":"[SU25 · Q25] Which protocol could be used by a company to monitor devices such as a wireless LAN controller (WLC)?","options":[{"key":"A","text":"SSH"},{"key":"B","text":"NTP"},{"key":"C","text":"PAT"},{"key":"D","text":"SNMP"}],"answer":["D"]},{"number":26,"text":"[SU25 · Q26] Which feature of 802.11n wireless access points allows them to transmit data at faster speeds than previous versions of 802.11 Wi-Fi standards did?","options":[{"key":"A","text":"SPS"},{"key":"B","text":"WPS"},{"key":"C","text":"MITM"},{"key":"D","text":"MIMO"}],"answer":["D"]},{"number":27,"text":"[SU25 · Q27] Which two statements are correct? (Choose two.)","options":[{"key":"A","text":"Half duplex has only one channel."},{"key":"B","text":"Full duplex increases the effective bandwidth."},{"key":"C","text":"Full duplex allows both ends to transmit and receive simultaneously."},{"key":"D","text":"Full duplex offers 100 percent potential use of the bandwidth."},{"key":"E","text":"All modern NICS support both half-duplex and full-duplex communication"}],"answer":["B","C"]},{"number":28,"text":"[SU25 · Q28] Which three IOS troubleshooting commands can help to isolate problems with a static route? (Choose three.)","options":[{"key":"A","text":"show version"},{"key":"B","text":"show arp"},{"key":"C","text":"show ip interface brief"},{"key":"D","text":"show ip route"},{"key":"E","text":"ping"}],"answer":["C","D","E"]},{"number":29,"text":"[SU25 · Q29] In which memory location are the VLAN configurations of normal range VLANs stored on a Catalyst switch?","options":[{"key":"A","text":"ROM"},{"key":"B","text":"flash"},{"key":"C","text":"NVRAM"},{"key":"D","text":"RAM"}],"answer":["B"]},{"number":30,"text":"[SU25 · Q30] Which frequency band SSID name should users with time-sensitive applications connect to?","options":[{"key":"A","text":"The 2.4 GHz band, because it is less crowded than the 5 GHz band."},{"key":"B","text":"The 2.4 GHz band, because it has more channels than the 5 GHz band."},{"key":"C","text":"The 2.4 GHz band, because the channel is likely interference-free."},{"key":"D","text":"The 5 GHz band, because it has more channels than the 2.4 GHz band."}],"answer":["D"]},{"number":31,"text":"[SU25 · Q31] Which IEEE 802.11 standard operates in both the 2.4 GHz and 5 GHz frequency bands?","options":[{"key":"A","text":"802.11a"},{"key":"B","text":"802.11b"},{"key":"C","text":"802.11g"},{"key":"D","text":"802.11n"}],"answer":["D"]},{"number":32,"text":"[SU25 · Q32] If more than one DHCP server is available on the local network, in which order will DHCP messages be sent between a host and a DHCP server?","options":[{"key":"A","text":"acknowledgment, request, offer, discover"},{"key":"B","text":"request, discover, offer, acknowledgment"},{"key":"C","text":"discover, offer, request, acknowledgment"},{"key":"D","text":"request, acknowledgment, discover, offer"}],"answer":["C"]},{"number":33,"text":"[SU25 · Q33] Which command should be configured on a router interface to set the router as a stateful DHCPv6 client?","options":[{"key":"A","text":"ipv6 address dhcp"},{"key":"B","text":"ipv6 address autoconfigure"},{"key":"C","text":"ipv6 enable"},{"key":"D","text":"ipv6 dhcp server stateful"}],"answer":["A"]},{"number":34,"text":"[SU25 · Q34] What is a recommended best practice when dealing with the native VLAN?","options":[{"key":"A","text":"Use port security."},{"key":"B","text":"Turn off DTP."},{"key":"C","text":"Assign it to an unused VLAN."},{"key":"D","text":"Assign the same VLAN number as the management VLAN."}],"answer":["C"]},{"number":35,"text":"[SU25 · Q35] Why would a floating static route be configured with an administrative distance that is higher than the administrative distance of a dynamic routing protocol that is running on the same router?","options":[{"key":"A","text":"to be used as a backup route"},{"key":"B","text":"to load-balance the traffic"},{"key":"C","text":"to act as a gateway of last resort"},{"key":"D","text":"to be the priority route in the routing table"}],"answer":["A"]},{"number":36,"text":"[SU25 · Q36] Which type of address does a switch use to build the MAC address table?","options":[{"key":"A","text":"source IP address"},{"key":"B","text":"source MAC address"},{"key":"C","text":"destination MAC address"},{"key":"D","text":"destination IP address"}],"answer":["B"]},{"number":37,"text":"[SU25 · Q37] In a network where the DHCP server is on a different subnet than the client, which configuration allows the router to relay DHCP requests to the DHCP server?","options":[{"key":"A","text":"ip dhcp helper-address"},{"key":"B","text":"ip helper-address"},{"key":"C","text":"ip dhcp relay-address"},{"key":"D","text":"ip relay-helper-address"}],"answer":["B"]},{"number":38,"text":"[SU25 · Q38] What is accomplished by the ip dhcp excluded-address 10.10.4.1 10.10.4.5 command?","options":[{"key":"A","text":"The DHCP server will ignore all traffic from clients with IPv4 addresses 10.10.4.1 to 10.10.4.5."},{"key":"B","text":"The DHCP server will not issue IPv4 addresses ranging from 10.10.4.1 to 10.10.4.5."},{"key":"C","text":"Traffic destined for 10.10.4.1 to 10.10.4.5 will be denied."},{"key":"D","text":"Traffic from clients with IPv4 addresses 10.10.4.1 to 10.10.4.5 will be denied."}],"answer":["B"]},{"number":39,"text":"[SU25 · Q39] True or False? In the 802.1X standard, the client attempting to access the network is referred to as the supplicant.","options":[{"key":"A","text":"false"},{"key":"B","text":"true"}],"answer":["B"]},{"number":40,"text":"[SU25 · Q40] Which tasks can be accomplished by using the command history feature? (Choose two.)","options":[{"key":"A","text":"View a list of commands entered in a previous session."},{"key":"B","text":"Recall up to 15 command lines by default."},{"key":"C","text":"Set the command history buffer size."},{"key":"D","text":"Recall previously entered commands."},{"key":"E","text":"Save command lines in a log file for future reference."}],"answer":["C","D"]},{"number":41,"text":"[SU25 · Q41] What is the purpose of setting the native VLAN separate from data VLANs?","options":[{"key":"A","text":"A separate VLAN should be used to carry uncommon untagged frames to avoid bandwidth contention on data VLANS."},{"key":"B","text":"The security of management frames that are carried in the native VLAN can be enhanced."},{"key":"C","text":"The native VLAN is for carrying VLAN management traffic only."},{"key":"D","text":"The native VLAN is for routers and switches to exchange their management information, so it should be different from data VLANS."}],"answer":["B"]},{"number":42,"text":"[SU25 · Q42] What does the letter C mean next to an entry in the output of the show ip route command?","options":[{"key":"A","text":"It identifies a network that is learned through EIGRP"},{"key":"B","text":"It identifies a network that is directly connected to the router."},{"key":"C","text":"It identifies a network that is learned through OSPF."},{"key":"D","text":"It identifies a network that is a static route."}],"answer":["B"]},{"number":43,"text":"[SU25 · Q43] Which two statements describe a switch port that is configured with PortFast? (Choose two.)","options":[{"key":"A","text":"The switch port immediately transitions from the listening to the forwarding state."},{"key":"B","text":"The switch port immediately transitions from blocking to the forwarding state."},{"key":"C","text":"The switch port sends DHCP requests before transitioning to the forwarding state"},{"key":"D","text":"The switch port immediately processes any BPDUs before transitioning to the forwarding state."},{"key":"E","text":"The switch port should never receive BPDUs."}],"answer":["B","E"]},{"number":44,"text":"[SU25 · Q44] Which Layer 2 attack will result in legitimate users not getting valid IP addresses?","options":[{"key":"A","text":"ARP spoofing"},{"key":"B","text":"DHCP starvation"},{"key":"C","text":"IP address spoofing"},{"key":"D","text":"MAC address flooding"}],"answer":["B"]},{"number":45,"text":"[SU25 · Q45] Which command will provide information about the status of all interfaces including the number of giants, runts, and collisions on the interface?","options":[{"key":"A","text":"show interfaces"},{"key":"B","text":"show ip interface brief"},{"key":"C","text":"show history"},{"key":"D","text":"show running-config"}],"answer":["A"]},{"number":46,"text":"[SU25 · Q46] Which AAA component is responsible for controlling who is permitted to access the network?","options":[{"key":"A","text":"Authentication"},{"key":"B","text":"Authorization"},{"key":"C","text":"Accounting"},{"key":"D","text":"All of other choices"}],"answer":["A"]},{"number":47,"text":"[SU25 · Q47] Where are dynamically learned MAC addresses stored when sticky learning is enabled with the switchport port-security mac-address sticky command?","options":[{"key":"A","text":"flash"},{"key":"B","text":"NVRAM"},{"key":"C","text":"RAM"},{"key":"D","text":"ROM"}],"answer":["C"]},{"number":48,"text":"[SU25 · Q48] A network administrator is entering the command ipv6 unicast-routing to start configuring DHCPv6 operation on a router. Which statement describes the function of this command?","options":[{"key":"A","text":"It is required for enabling DNS service in DHCPv6 configurations."},{"key":"B","text":"It is required for sending ICMPv6 RA messages."},{"key":"C","text":"It is required to configure stateless DHCPv6 server on the router."},{"key":"D","text":"It is required to configure stateful DHCPv6 server on the router."}],"answer":["B"]},{"number":49,"text":"[SU25 · Q49] When a router learns that multiple paths are available to a destination network from the same routing protocol, which factor is considered by a router to choose the best path to forward a packet?","options":[{"key":"A","text":"the reliability value of the neighboring routers"},{"key":"B","text":"the fastest bandwidth of exiting interfaces"},{"key":"C","text":"the lowest metric"},{"key":"D","text":"the order of paths on the routing table"}],"answer":["C"]},{"number":50,"text":"[SU25 · Q50] What is one way to correct a spanning tree failure?","options":[{"key":"A","text":"Replace the cables on failed STP links."},{"key":"B","text":"Manually remove redundant links in the switched network."},{"key":"C","text":"Insert redundant links to replace the failed STP links."},{"key":"D","text":"Replace all instances of STP with RSTP."}],"answer":["B"]}]}];const $=s=>document.querySelector(s);let setIndex=0,index=0,answers=[],reviewMode=false,studyMode=false,retryMode=false,currentQuestions=[];const rangeActions=$('#rangeActions'),rangeButtons=$('#rangeButtons');let activePart=0;window.selectQuestionPart=function(part){activePart=activePart===part?0:part;loadSet()};const exam=$('#exam');for(let groupName of [...new Set(sets.map(s=>s.group))]){const group=document.createElement('optgroup');group.label=groupName;sets.filter(s=>s.group===groupName).forEach((s)=>{const o=document.createElement('option');o.value=sets.indexOf(s);o.textContent=`${s.title} (${s.questions.length} câu)`;group.append(o)});exam.append(group)}function correctKeys(q){return Array.isArray(q.answer)?q.answer:String(q.answer).split(/[,;\s]+/).filter(Boolean)}function isMulti(q){return correctKeys(q).length>1}function isAnswered(i){const a=answers[i],q=currentQuestions[i];return isMulti(q)?Array.isArray(a)&&a.length>=correctKeys(q).length:a!==null&&a!==undefined}function isCorrect(i){const q=currentQuestions[i],a=answers[i],keys=correctKeys(q);if(isMulti(q))return Array.isArray(a)&&a.length===keys.length&&keys.every(k=>a.includes(k))&&a.every(k=>keys.includes(k));return a===keys[0]}function reviewIndices(){return answers.map((_,i)=>isAnswered(i)?i:-1).filter(i=>i>=0)}function loadSet(){setIndex=+exam.value;index=0;reviewMode=false;retryMode=false;const bank=sets[setIndex],total=bank.questions.length,parts=Math.ceil(total/30);if(activePart>parts)activePart=0;rangeActions.hidden=!total;rangeButtons.innerHTML='';const addPartButton=(part,label)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.classList.toggle('active',activePart===part);b.setAttribute('aria-pressed',String(activePart===part));b.onclick=()=>window.selectQuestionPart(part);rangeButtons.append(b)};addPartButton(0,`Toàn bộ (${total} câu)`);for(let part=1;part<=parts;part++){const start=(part-1)*30,end=Math.min(part*30,total);addPartButton(part,`Phần ${part} (${end-start} câu)`)}currentQuestions=activePart?bank.questions.slice((activePart-1)*30,Math.min(activePart*30,total)):bank.questions.slice();const start=(activePart-1)*30;$('#rangeStatus').textContent=activePart?`Đang làm phần ${activePart} · câu ${start+1}–${start+currentQuestions.length} (${currentQuestions.length} câu)`:`Đang làm toàn bộ đề (${total} câu)`;answers=Array(currentQuestions.length).fill(null);render()}function move(step){const qs=currentQuestions;if(reviewMode){const list=reviewIndices();if(!list.length)return;let pos=list.indexOf(index);if(pos<0)pos=0;pos=Math.max(0,Math.min(list.length-1,pos+step));index=list[pos]}else index=Math.max(0,Math.min(qs.length-1,index+step));render()}function answerDisplay(q){return correctKeys(q).map(k=>k+'. '+(q.options.find(o=>o.key===k)?.text||'')).join(' / ')}function render(){const qs=currentQuestions,q=qs[index],multi=isMulti(q);$('#qcount').textContent=`Câu ${index+1} / ${qs.length}${reviewMode?' • Xem lại':''}`;$('#question').textContent=q.text;$('#options').innerHTML='';$('#questionOptions').innerHTML='';$('#feedback').textContent='';$('#feedback').className='feedback';$('#answerHint').textContent=multi?`(Chọn ${correctKeys(q).length} đáp án)`:'(Chọn một đáp án)';$('#multiHint').textContent=multi?`Câu này có nhiều đáp án đúng. Hãy chọn đủ ${correctKeys(q).length} lựa chọn.`:'';q.options.forEach(o=>{const selected=multi?(Array.isArray(answers[index])&&answers[index].includes(o.key)):answers[index]===o.key;const lab=document.createElement('label');lab.className='opt';if(studyMode&&selected&&isAnswered(index))lab.classList.add(correctKeys(q).includes(o.key)?'correct':'wrong');const input=document.createElement('input');input.type=multi?'checkbox':'radio';input.name=multi?'answer-multi':'answer';input.checked=selected;input.addEventListener('change',()=>choose(o.key));const tx=document.createElement('span');tx.textContent=o.key;lab.append(input,tx);$('#options').append(lab);const qrow=document.createElement('label');qrow.className='qchoice'+(studyMode&&selected&&isAnswered(index)?(correctKeys(q).includes(o.key)?' correct':' wrong'):'');const qinput=document.createElement('input');qinput.type=multi?'checkbox':'radio';qinput.name=multi?'answer-copy-multi':'answer-copy';qinput.checked=selected;qinput.addEventListener('change',()=>choose(o.key));const qt=document.createElement('span');qt.textContent=o.key+'. '+o.text;qrow.append(qinput,qt);$('#questionOptions').append(qrow)});if(isMulti(q)&&Array.isArray(answers[index])&&!isAnswered(index))$('#feedback').textContent=`Đã chọn ${answers[index].length}/${correctKeys(q).length}`;else if(studyMode&&isAnswered(index)){$('#feedback').className='feedback '+(isCorrect(index)?'good':'bad');$('#feedback').textContent=isCorrect(index)?'✓ Chính xác!':'✗ Chưa đúng. Đáp án đúng: '+answerDisplay(q)}$('#status').textContent=isAnswered(index)?'Đã trả lời':'Chưa trả lời';$('#prev').disabled=index===0&&!reviewMode;$('#next').disabled=index===qs.length-1&&!reviewMode;$('#review').disabled=!reviewMode&&!reviewIndices().length;$('#review').textContent=reviewMode?'Thoát xem lại':'Xem lại câu đã làm';$('#questionNav').innerHTML='';qs.forEach((item,i)=>{const b=document.createElement('button'),done=isAnswered(i);b.textContent=i+1;b.className=(done?'done ':'')+(i===index?'current ':'')+(studyMode&&done&&!isCorrect(i)?'wrong':'');b.title=`Câu ${i+1}${done?(studyMode?(isCorrect(i)?' • Đúng':' • Sai'):' • Đã trả lời'):Array.isArray(answers[i])?' • Đang chọn':' • Chưa làm'}`;b.onclick=()=>{index=i;render()};$('#questionNav').append(b)});const done=answers.reduce((n,_,i)=>n+(isAnswered(i)?1:0),0),correct=answers.reduce((n,_,i)=>n+(isAnswered(i)&&isCorrect(i)?1:0),0);$('#bar').style.width=(done/qs.length*100)+'%';$('#progressText').textContent=`${done}/${qs.length}`;$('#score').textContent=studyMode?`Đã làm ${done}/${qs.length} • Đúng ${correct}`:`Đã trả lời ${done}/${qs.length}`;$('#finish').textContent=studyMode?'Kết thúc xem lại':'Kết thúc bài'}function choose(key){const q=currentQuestions[index],multi=isMulti(q);if(multi){let picked=Array.isArray(answers[index])?[...answers[index]]:[];picked=picked.includes(key)?picked.filter(k=>k!==key):[...picked,key];answers[index]=picked;if(studyMode){if(isAnswered(index)&&isCorrect(index)&&index<currentQuestions.length-1)index++;render();return}if(!isAnswered(index)){render();return}if(index<currentQuestions.length-1)index++;render();return}answers[index]=key;if(studyMode){if(isCorrect(index)&&index<currentQuestions.length-1)index++;render();return}if(index<currentQuestions.length-1)index++;render()}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#leftArrow').onclick=()=>move(-1);$('#rightArrow').onclick=()=>move(1);$('#review').onclick=()=>{if(reviewMode)reviewMode=false;else{const list=reviewIndices();if(!list.length)return;reviewMode=true;index=list[0]}render()};$('#reveal').onclick=()=>{const q=currentQuestions[index];$('#feedback').className='feedback good';$('#feedback').textContent='Đáp án: '+answerDisplay(q)};exam.onchange=()=>{activePart=0;loadSet()};$('#mode').onchange=()=>{studyMode=$('#mode').value==='study';loadSet()};$('#finish').onclick=()=>{const qs=currentQuestions,done=answers.reduce((n,_,i)=>n+(isAnswered(i)?1:0),0),correctIndices=answers.map((_,i)=>isAnswered(i)&&isCorrect(i)?i:-1).filter(i=>i>=0),wrongIndices=answers.map((_,i)=>isAnswered(i)&&!isCorrect(i)?i:-1).filter(i=>i>=0),correct=correctIndices.length;$('#summaryTitle').textContent=retryMode?'Kết quả làm lại câu sai':studyMode?'Hoàn thành phiên học':'Kết quả luyện đề';$('#summaryText').textContent=sets[setIndex].title;$('#summaryDone').textContent=`${done}/${qs.length}`;$('#summaryCorrect').textContent=correct;$('#summaryWrong').textContent=wrongIndices.length;$('#summaryUnanswered').textContent=qs.length-done;$('#summaryWrongList').innerHTML=wrongIndices.length?'<b>Câu sai:</b> '+wrongIndices.map(i=>`<span class="wrong-number">${i+1}</span>`).join(' '):'<b>Câu sai:</b> Không có';$('#retryWrong').hidden=studyMode||wrongIndices.length===0;$('#retryWrong').textContent=`Làm lại câu sai (${wrongIndices.length})`;$('#summary').classList.add('show')};$('#closeSummary').onclick=()=>$('#summary').classList.remove('show');$('#retryWrong').onclick=()=>{const wrong=currentQuestions.filter((_,i)=>isAnswered(i)&&!isCorrect(i));if(!wrong.length)return;currentQuestions=wrong;answers=Array(currentQuestions.length).fill(null);index=0;reviewMode=false;retryMode=true;$('#summary').classList.remove('show');render()};$('#restart').onclick=()=>{$('#summary').classList.remove('show');loadSet()};loadSet();window.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const a=document.activeElement;if(a&&(a.tagName==='SELECT'||a.tagName==='TEXTAREA'||a.isContentEditable||(a.tagName==='INPUT'&&!['radio','checkbox'].includes(a.type))))return;e.preventDefault();const step=e.key==='ArrowLeft'?-1:1;if(typeof move==='function'){move(step)}else{const qs=currentQuestions,next=Math.max(0,Math.min(qs.length-1,index+step));if(next!==index){index=next;render()}}});
</script></body></html>
