est wireless NICs, which will reduce usage."}],"answer":["B"]},{"number":330,"text":"[IT Exam · Q330] Which DHCPv4 message will a client send to accept an IPv4 address that is offered by a DHCP server?","options":[{"key":"A","text":"broadcast DHCPACK"},{"key":"B","text":"broadcast DHCPREQUEST"},{"key":"C","text":"unicast DHCPACK"},{"key":"D","text":"unicast DHCPREQUEST"}],"answer":["B"]},{"number":331,"text":"[IT Exam · Q331] After a host has generated an IPv6 address by using the DHCPv6 or SLAAC process, how does the host verify that the address is unique and therefore usable?","options":[{"key":"A","text":"The host sends an ICMPv6 echo request message to the DHCPv6 or SLAAC-learned address and if no reply is returned, the address is considered unique."},{"key":"B","text":"The host sends an ICMPv6 neighbor solicitation message to the DHCP or SLAAC-learned address and if no neighbor advertisement is returned, the address is considered unique."},{"key":"C","text":"The host checks the local neighbor cache for the learned address and if the address is not cached, it it considered unique."},{"key":"D","text":"The host sends an ARP broadcast to the local link and if no hosts send a reply, the address is considered unique."}],"answer":["B"]},{"number":332,"text":"[IT Exam · Q332] What network attack seeks to create a DoS for clients by preventing them from being able to obtain a DHCP lease?","options":[{"key":"A","text":"IP address spoofing"},{"key":"B","text":"DHCP starvation"},{"key":"C","text":"CAM table attack"},{"key":"D","text":"DHCP spoofing"}],"answer":["B"]},{"number":333,"text":"[IT Exam · Q333] What protocol or technology uses source IP to destination IP as a load-balancing mechanism?","options":[{"key":"A","text":"VTP"},{"key":"B","text":"EtherChannel"},{"key":"C","text":"DTP"},{"key":"D","text":"STP"}],"answer":["B"]},{"number":334,"text":"[IT Exam · Q334] What protocol should be disabled to help mitigate VLAN attacks?","options":[{"key":"A","text":"CDP"},{"key":"B","text":"ARP"},{"key":"C","text":"STP"},{"key":"D","text":"DTP"}],"answer":["D"]},{"number":335,"text":"[IT Exam · Q335] What protocol or technology requires switches to be in server mode or client mode?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"STP"},{"key":"C","text":"VTP"},{"key":"D","text":"DTP"}],"answer":["C"]},{"number":336,"text":"[IT Exam · Q336] What are two reasons a network administrator would segment a network with a Layer 2 switch? (Choose two.)","options":[{"key":"A","text":"to create fewer collision domains"},{"key":"B","text":"to enhance user bandwidth"},{"key":"C","text":"to create more broadcast domains"},{"key":"D","text":"to eliminate virtual circuits"},{"key":"E","text":"to isolate traffic between segments"},{"key":"F","text":"to isolate ARP request messages from the rest of the network"}],"answer":["B","E"]},{"number":337,"text":"[IT Exam · Q337] What command will enable a router to begin sending messages that allow it to configure a link-local address without using an IPv6 DHCP server?","options":[{"key":"A","text":"a static route"},{"key":"B","text":"the ipv6 route ::/0 command"},{"key":"C","text":"the ipv6 unicast-routing command"},{"key":"D","text":"the ip routing command"}],"answer":["C"]},{"number":338,"text":"[IT Exam · Q338] A network administrator is using the router-on-a-stick model to configure a switch and a router for inter-VLAN routing. What configuration should be made on the switch port that connects to the router?","options":[{"key":"A","text":"Configure it as a trunk port and allow only untagged traffic."},{"key":"B","text":"Configure the port as an access port and a member of VLAN1."},{"key":"C","text":"Configure the port as an 802.1q trunk port."},{"key":"D","text":"Configure the port as a trunk port and assign it to VLAN1."}],"answer":["C"]},{"number":339,"text":"[IT Exam · Q339] What are three techniques for mitigating VLAN attacks? (Choose three.)","options":[{"key":"A","text":"Use private VLANs."},{"key":"B","text":"Enable BPDU guard."},{"key":"C","text":"Enable trunking manually"},{"key":"D","text":"Enable Source Guard."},{"key":"E","text":"Disable DTP ."},{"key":"F","text":"Set the native VLAN to an unused VLAN."}],"answer":["C","E","F"]},{"number":340,"text":"[IT Exam · Q340] In which situation would a technician use the show interfaces switch command?","options":[{"key":"A","text":"to determine if remote access is enabled"},{"key":"B","text":"when packets are being dropped from a particular directly attached host"},{"key":"C","text":"when an end device can reach local devices, but not remote devices"},{"key":"D","text":"to determine the MAC address of a directly attached network device on a particular interface"}],"answer":["B"]},{"number":341,"text":"[IT Exam · Q341] What is a drawback of the local database method of securing device access that can be solved by using AAA with centralized servers?","options":[{"key":"A","text":"There is no ability to provide accountability."},{"key":"B","text":"User accounts must be configured locally on each device, which is an unscalable authentication solution."},{"key":"C","text":"It is very susceptible to brute-force attacks because there is no username."},{"key":"D","text":"The passwords can only be stored in plain text in the running configuration."}],"answer":["B"]},{"number":342,"text":"[IT Exam · Q342] What action does a DHCPv4 client take if it receives more than one DHCPOFFER from multiple DHCP servers?","options":[{"key":"A","text":"It sends a DHCPREQUEST that identifies which lease offer the client is accepting."},{"key":"B","text":"It sends a DHCPNAK and begins the DHCP process over again."},{"key":"C","text":"It discards both offers and sends a new DHCPDIS- COVER."},{"key":"D","text":"It accepts both DHCPOFFER messages and sends a DHCPACK."}],"answer":["A"]},{"number":343,"text":"[IT Exam · Q343] What method of wireless authentication is dependent on a RADIUS authentication server?","options":[{"key":"A","text":"WEP"},{"key":"B","text":"WPA Personal"},{"key":"C","text":"WPA2 Personal"},{"key":"D","text":"WPA2 Enterprise"}],"answer":["D"]},{"number":344,"text":"[IT Exam · Q344] A network administrator has found a user sending a double-tagged 802.1Q frame to a switch. What is the best solution to prevent this type of attack?","options":[{"key":"A","text":"The native VLAN number used on any trunk should be one of the active data VLANs."},{"key":"B","text":"The VLANs for user access ports should be different VLANs than any native VLANs used on trunk ports."},{"key":"C","text":"Trunk ports should be configured with port security."},{"key":"D","text":"Trunk ports should use the default VLAN as the native VLAN number ."}],"answer":["B"]},{"number":345,"text":"[IT Exam · Q345] On a Cisco 3504 WLC Summary page ( Advanced > Summary ), which tab allows a network administrator to configure a particular WLAN with a WPA2 policy?","options":[{"key":"A","text":"WLANs"},{"key":"B","text":"SECURITY"},{"key":"C","text":"WIRELESS"},{"key":"D","text":"MANAGEMENT"}],"answer":["A"]},{"number":346,"text":"[IT Exam · Q346] Users are complaining of sporadic access to the internet every afternoon. What should be done or checked?","options":[{"key":"A","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"B","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"C","text":"Create a floating static route to that network."},{"key":"D","text":"Check the statistics on the default route for oversaturation."}],"answer":["D"]},{"number":347,"text":"[IT Exam · Q347] What action takes place when the source MAC address of a frame entering a switch appears in the MAC address table associated with a different port?","options":[{"key":"A","text":"The switch purges the entire MAC address table."},{"key":"B","text":"The switch replaces the old entry and uses the more current port."},{"key":"C","text":"The switch updates the refresh timer for the entry."},{"key":"D","text":"The switch forwards the frame out of the specified port."}],"answer":["B"]},{"number":348,"text":"[IT Exam · Q348] A network administrator is configuring a WLAN. Why would the administrator use a WLAN controller?","options":[{"key":"A","text":"to centralize management of multiple WLANs"},{"key":"B","text":"to provide privacy and integrity to wireless traffic by using encryption"},{"key":"C","text":"to facilitate group configuration and management of multiple WLANs through a WLC"},{"key":"D","text":"to provide prioritized service for time-sensitive applications"}],"answer":["C"]},{"number":349,"text":"[IT Exam · Q349] Which three statements accurately describe duplex and speed settings on Cisco 2960 switches? (Choose three.)","options":[{"key":"A","text":"An autonegotiation failure can result in connectivity issues."},{"key":"B","text":"When the speed is set to 1000 Mb/s, the switch ports will operate in full-duplex mode."},{"key":"C","text":"The duplex and speed settings of each switch port can be manually configured."},{"key":"D","text":"Enabling autonegotiation on a hub will prevent mismatched port speeds when connecting the hub to the switch."},{"key":"E","text":"By default, the speed is set to 100 Mb/s and the duplex mode is set to autonegotiation."},{"key":"F","text":"By default, the autonegotiation feature is disabled."}],"answer":["A","B","C"]},{"number":350,"text":"[IT Exam · Q350] A network administrator uses the spanning-tree portfast bpduguard default global configuration command to enable BPDU guard on a switch. However , BPDU guard is not activated on all access ports. What is the cause of the issue?","options":[{"key":"A","text":"BPDU guard needs to be activated in the interface configuration command mode."},{"key":"B","text":"Access ports configured with root guard cannot be configured with BPDU guard."},{"key":"C","text":"Access ports belong to different VLANs."},{"key":"D","text":"PortFast is not configured on all access ports."}],"answer":["D"]},{"number":351,"text":"[IT Exam · Q351] Which two types of spanning tree protocols can cause suboptimal traffic flows because they assume only one spanning-tree instance for the entire bridged network? (Choose two.)","options":[{"key":"A","text":"MSTP"},{"key":"B","text":"RSTP"},{"key":"C","text":"Rapid PVST+"},{"key":"D","text":"PVST+"},{"key":"E","text":"STP"}],"answer":["B","E"]},{"number":352,"text":"[IT Exam · Q352] A WLAN engineer deploys a WLC and five wireless APs using the CAPWAP protocol with the DTLS feature to secure the control plane of the network devices. While testing the wireless network, the WLAN engineer notices that data traffic is being exchanged between the WLC and the APs in plain-text and is not being encrypted. What is the most likely reason for this?","options":[{"key":"A","text":"DTLS only provides data security through authentication and does not provide encryption for data moving between a wireless LAN controller (WLC) and an access point (AP)."},{"key":"B","text":"Although DTLS is enabled by default to secure the CAPWAP control channel, it is disabled by default for the data channel."},{"key":"C","text":"DTLS is a protocol that only provides security between the access point (AP) and the wireless client."},{"key":"D","text":"Data encryption requires a DTLS license to be installed on each access point (AP) prior to being enabled on the wireless LAN controller (WLC)."}],"answer":["B"]},{"number":353,"text":"[IT Exam · Q353] A new switch is to be added to an existing network in a remote office. The network administrator does not want the technicians in the remote office to be able to add new VLANs to the switch, but the switch should receive VLAN updates from the VTP domain. Which two steps must be performed to configure VTP on the new switch to meet these conditions? (Choose two.)","options":[{"key":"A","text":"Configure the new switch as a VTP client."},{"key":"B","text":"Configure the existing VTP domain name on the new switch."},{"key":"C","text":"Configure an IP address on the new switch."},{"key":"D","text":"Configure all ports of both switches to access mode."},{"key":"E","text":"Enable VTP pruning."}],"answer":["A","B"]},{"number":354,"text":"[IT Exam · Q354] What action takes place when the source MAC address of a frame entering a switch is not in the MAC address table?","options":[{"key":"A","text":"The switch adds a MAC address table entry for the destination MAC address and the egress port."},{"key":"B","text":"The switch adds the MAC address and incoming port number to the table."},{"key":"C","text":"The switch replaces the old entry and uses the more current port."},{"key":"D","text":"The switch updates the refresh timer for the entry."}],"answer":["B"]},{"number":355,"text":"[IT Exam · Q355] Employees are unable to connect to servers on one of the internal networks. What should be done or checked?","options":[{"key":"A","text":"Use the \"show ip interface brief\" command to see if an interface is down."},{"key":"B","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"C","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"D","text":"Check the statistics on the default route for oversaturation."}],"answer":["A"]},{"number":356,"text":"[IT Exam · Q356] What is the effect of entering the ip dhcp snooping configuration command on a switch?","options":[{"key":"A","text":"It enables DHCP snooping globally on a switch."},{"key":"B","text":"It enables PortFast globally on a switch."},{"key":"C","text":"It disables DTP negotiations on trunking ports."},{"key":"D","text":"It manually enables a trunk link."}],"answer":["A"]},{"number":357,"text":"[IT Exam · Q357] An administrator notices that large numbers of packets are being dropped on one of the branch routers. What should be done or checked?","options":[{"key":"A","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"B","text":"Create extra static routes to the same location with an AD of 1."},{"key":"C","text":"Check the statistics on the default route for oversaturation."},{"key":"D","text":"Check the routing table for a missing static route."}],"answer":["D"]},{"number":358,"text":"[IT Exam · Q358] What are two switch characteristics that could help alleviate network congestion? (Choose two.)","options":[{"key":"A","text":"fast internal switching"},{"key":"B","text":"large frame buffers"},{"key":"C","text":"store-and-forward switching"},{"key":"D","text":"low port density"},{"key":"E","text":"frame check sequence (FCS) check"}],"answer":["A","B"]},{"number":359,"text":"[IT Exam · Q359] What is a result of connecting two or more switches together?","options":[{"key":"A","text":"The number of broadcast domains is increased."},{"key":"B","text":"The size of the broadcast domain is increased."},{"key":"C","text":"The number of collision domains is reduced."},{"key":"D","text":"The size of the collision domain is increased."}],"answer":["B"]},{"number":360,"text":"[IT Exam · Q360] Branch users were able to access a site in the morning but have had no connectivity with the site since lunch time. What should be done or checked?","options":[{"key":"A","text":"Verify that the static route to the server is present in the routing table."},{"key":"B","text":"Use the \"show ip interface brief\" command to see if an interface is down."},{"key":"C","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"D","text":"Create a floating static route to that network."}],"answer":["B"]},{"number":361,"text":"[IT Exam · Q361] What is the effect of entering the switchport port-security configuration command on a switch?","options":[{"key":"A","text":"It dynamically learns the L2 address and copies it to the running configuration."},{"key":"B","text":"It enables port security on an interface."},{"key":"C","text":"It enables port security globally on the switch."},{"key":"D","text":"It restricts the number of discovery messages, per second, to be received on the interface."}],"answer":["B"]},{"number":362,"text":"[IT Exam · Q362] A network administrator is configuring a WLAN. Why would the administrator use multiple lightweight APs?","options":[{"key":"A","text":"to centralize management of multiple WLANs"},{"key":"B","text":"to monitor the operation of the wireless network"},{"key":"C","text":"to provide prioritized service for time-sensitive applications"},{"key":"D","text":"to facilitate group configuration and management of multiple WLANs through a WLC"}],"answer":["D"]},{"number":363,"text":"[IT Exam · Q363] A network administrator is configuring a WLAN. Why would the administrator use RADIUS servers on the network?","options":[{"key":"A","text":"to centralize management of multiple WLANs"},{"key":"B","text":"to restrict access to the WLAN by authorized, au- thenticated users only"},{"key":"C","text":"to facilitate group configuration and management of multiple WLANs through a WLC"},{"key":"D","text":"to monitor the operation of the wireless network"}],"answer":["B"]},{"number":364,"text":"[IT Exam · Q364] What is the effect of entering the switchport mode access configuration command on a switch?","options":[{"key":"A","text":"It enables BPDU guard on a specific port."},{"key":"B","text":"It manually enables a trunk link."},{"key":"C","text":"It disables an unused port."},{"key":"D","text":"It disables DTP on a non-trunking interface."}],"answer":["D"]},{"number":365,"text":"[IT Exam · Q365] A network administrator has configured a router for stateless DHCPv6 operation. However , users report that workstations are not receiving DNS server information. Which two router configuration lines should be verified to ensure that stateless DHCPv6 service is properly configured? (Choose two.)","options":[{"key":"A","text":"The domain-name line is included in the ipv6 dhcp pool section."},{"key":"B","text":"The dns-server line is included in the ipv6 dhcp pool section."},{"key":"C","text":"The ipv6 nd other-config-flag is entered for the interface that faces the LAN segment."},{"key":"D","text":"The address prefix line is included in the ipv6 dhcp pool section."},{"key":"E","text":"The ipv6 nd managed-config-flag is entered for the interface that faces the LAN segment."}],"answer":["B","C"]},{"number":366,"text":"[IT Exam · Q366] A network administrator is configuring a WLAN. Why would the administrator disable the broadcast feature for the SSID?","options":[{"key":"A","text":"to eliminate outsiders scanning for available SSIDs in the area"},{"key":"B","text":"to centralize management of multiple WLANs"},{"key":"C","text":"to facilitate group configuration and management of multiple WLANs through a WLC"},{"key":"D","text":"to provide prioritized service for time-sensitive applications"}],"answer":["A"]},{"number":367,"text":"[IT Exam · Q367] What action takes place when a frame entering a switch has a unicast destination MAC address that is not in the MAC address table?","options":[{"key":"A","text":"The switch updates the refresh timer for the entry."},{"key":"B","text":"The switch resets the refresh timer on all MAC address table entries."},{"key":"C","text":"The switch replaces the old entry and uses the more current port."},{"key":"D","text":"The switch will forward the frame out all ports except the incoming port."}],"answer":["D"]},{"number":368,"text":"[IT Exam · Q368] A junior technician was adding a route to a LAN router . A traceroute to a device on the new network revealed a wrong path and unreachable status. What should be done or checked?","options":[{"key":"A","text":"Create a floating static route to that network."},{"key":"B","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"C","text":"Check the configuration of the exit interface on the new static route."},{"key":"D","text":"Verify that the static route to the server is present in the routing table."}],"answer":["C"]},{"number":369,"text":"[IT Exam · Q369] What is the effect of entering the ip arp inspection vlan 10 configuration command on a switch?","options":[{"key":"A","text":"It specifies the maximum number of L2 addresses allowed on a port."},{"key":"B","text":"It enables DAI on specific switch interfaces previously configured with DHCP snooping."},{"key":"C","text":"It enables DHCP snooping globally on a switch."},{"key":"D","text":"It globally enables BPDU guard on all PortFast-enabled ports."}],"answer":["B"]},{"number":370,"text":"[IT Exam · Q370] What protocol or technology manages trunk negotiations between switches?","options":[{"key":"A","text":"VTP"},{"key":"B","text":"EtherChannel"},{"key":"C","text":"DTP"},{"key":"D","text":"STP"}],"answer":null},{"number":371,"text":"[IT Exam · Q371] A network administrator is configuring a WLAN. Why would the administrator apply WPA2 with AES to the WLAN?","options":[{"key":"A","text":"to reduce the risk of unauthorized APs being added to the network"},{"key":"B","text":"to centralize management of multiple WLANs"},{"key":"C","text":"to provide prioritized service for time-sensitive applications"},{"key":"D","text":"to provide privacy and integrity to wireless traffic by using encryption"}],"answer":["D"]},{"number":372,"text":"[IT Exam · Q372] Users on a LAN are unable to get to a company web server but are able to get elsewhere. What should be done or checked?","options":[{"key":"A","text":"Ensure that the old default route has been removed from the company edge routers."},{"key":"B","text":"Verify that the static route to the server is present in the routing table."},{"key":"C","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"D","text":"Create a floating static route to that network."}],"answer":["B"]},{"number":373,"text":"[IT Exam · Q373] What IPv6 prefix is designed for link-local communication?","options":[{"key":"A","text":"2001::/3"},{"key":"B","text":"ff00::/8"},{"key":"C","text":"fc::/07"},{"key":"D","text":"fe80::/10"}],"answer":["D"]},{"number":374,"text":"[IT Exam · Q374] What is the effect of entering the ip dhcp snooping limit rate 6 configuration command on a switch?","options":[{"key":"A","text":"It displays the IP-to-MAC address associations for switch interfaces."},{"key":"B","text":"It enables port security globally on the switch."},{"key":"C","text":"It restricts the number of discovery messages, per second, to be received on the interface."},{"key":"D","text":"It dynamically learns the L2 address and copies it to the running configuration."}],"answer":["C"]},{"number":375,"text":"[IT Exam · Q375] A network administrator is configuring a WLAN. Why would the administrator change the default DHCP IPv4 addresses on an AP?","options":[{"key":"A","text":"to eliminate outsiders scanning for available SSIDs in the area"},{"key":"B","text":"to reduce the risk of unauthorized APs being added to the network"},{"key":"C","text":"to reduce outsiders intercepting data or accessing the wireless network by using a well-known address range"},{"key":"D","text":"to reduce the risk of interference by external devices such as microwave ovens"}],"answer":["C"]},{"number":376,"text":"[IT Exam · Q376] What is the effect of entering the ip arp inspection validate src-mac configuration command on a switch?","options":[{"key":"A","text":"It checks the source L2 address in the Ethernet header against the sender L2 address in the ARP body."},{"key":"B","text":"It disables all trunk ports."},{"key":"C","text":"It displays the IP-to-MAC address associations for switch interfaces."},{"key":"D","text":"It enables portfast on a specific switch interface."}],"answer":["A"]},{"number":377,"text":"[IT Exam · Q377] What protocol or technology is a Cisco proprietary protocol that is automatically enabled on 2960 switches?","options":[{"key":"A","text":"DTP"},{"key":"B","text":"STP"},{"key":"C","text":"VTP"},{"key":"D","text":"EtherChannel"}],"answer":["A"]},{"number":378,"text":"[IT Exam · Q378] What address and prefix length is used when configuring an IPv6 default static route?","options":[{"key":"A","text":"::/0"},{"key":"B","text":"FF02::1/8"},{"key":"C","text":"0.0.0.0/0"},{"key":"D","text":"::1/128"}],"answer":["A"]},{"number":379,"text":"[IT Exam · Q379] What are two characteristics of Cisco Express Forwarding (CEF)? (Choose two.)","options":[{"key":"A","text":"When a packet arrives on a router interface, it is forwarded to the control plane where the CPU matches the destination address with a matching routing table entry."},{"key":"B","text":"This is the fastest forwarding mechanism on Cisco routers and multilayer switches."},{"key":"C","text":"With this switching method, flow information for a packet is stored in the fast-switching cache to forward future packets to the same destination without CPU intervention."},{"key":"D","text":"Packets are forwarded based on information in the FIB and an adjacency table."},{"key":"E","text":"When a packet arrives on a router interface, it is forwarded to the control plane where the CPU searches for a match in the fast-switching cache."}],"answer":["B","D"]},{"number":380,"text":"[IT Exam · Q380] Which term describes the role of a Cisco switch in the 802.1X port-based access control?","options":[{"key":"A","text":"agent"},{"key":"B","text":"supplicant"},{"key":"C","text":"authenticator"},{"key":"D","text":"authentication server"}],"answer":["C"]},{"number":381,"text":"[IT Exam · Q381] Which Cisco solution helps prevent ARP spoofing and ARP poisoning attacks?","options":[{"key":"A","text":"Dynamic ARP Inspection"},{"key":"B","text":"IP Source Guard"},{"key":"C","text":"DHCP Snooping"},{"key":"D","text":"Port Security"}],"answer":["A"]},{"number":382,"text":"[IT Exam · Q382] What is an advantage of PVST+?","options":[{"key":"A","text":"PVST+ optimizes performance on the network through autoselection of the root bridge."},{"key":"B","text":"PVST+ reduces bandwidth consumption compared to traditional implementations of STP that use CST."},{"key":"C","text":"PVST+ requires fewer CPU cycles for all the switches in the network."},{"key":"D","text":"PVST+ optimizes performance on the network through load sharing."}],"answer":["D"]},{"number":383,"text":"[IT Exam · Q383] What protocol or technology uses a standby router to assume packet-forwarding responsibility if the active router fails?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"DTP"},{"key":"C","text":"HSRP"},{"key":"D","text":"VTP"}],"answer":["C"]},{"number":384,"text":"[IT Exam · Q384] What is the effect of entering the show ip dhcp snooping binding configuration command on a switch?","options":[{"key":"A","text":"It switches a trunk port to access mode."},{"key":"B","text":"It checks the source L2 address in the Ethernet header against the sender L2 address in the ARP body."},{"key":"C","text":"It restricts the number of discovery messages, per second, to be received on the interface."},{"key":"D","text":"It displays the IP-to-MAC address associations for switch interfaces."}],"answer":["D"]},{"number":385,"text":"[IT Exam · Q385] What action takes place when the source MAC address of a frame entering a switch is in the MAC address table?","options":[{"key":"A","text":"The switch forwards the frame out of the specified port."},{"key":"B","text":"The switch updates the refresh timer for the entry."},{"key":"C","text":"The switch replaces the old entry and uses the more current port."},{"key":"D","text":"The switch adds a MAC address table entry for the destination MAC address and the egress port."}],"answer":["B"]},{"number":386,"text":"[IT Exam · Q386] A small publishing company has a network design such that when a broadcast is sent on the LAN, 200 devices receive the transmitted broadcast. How can the network administrator reduce the number of devices that receive broadcast traffic?","options":[{"key":"A","text":"Add more switches so that fewer devices are on a particular switch."},{"key":"B","text":"Replace the switches with switches that have more ports per switch. This will allow more devices on a particular switch."},{"key":"C","text":"Segment the LAN into smaller LANs and route between them."},{"key":"D","text":"Replace at least half of the switches with hubs to reduce the size of the broadcast domain."}],"answer":["C"]},{"number":387,"text":"[IT Exam · Q387] What defines a host route on a Cisco router?","options":[{"key":"A","text":"The link-local address is added automatically to the routing table as an IPv6 host route."},{"key":"B","text":"An IPv4 static host route configuration uses a destination IP address of a specific device and a /32 subnet mask."},{"key":"C","text":"A host route is designated with a C in the routing table."},{"key":"D","text":"A static IPv6 host route must include the interface type and the interface number of the next hop router ."}],"answer":["B"]},{"number":388,"text":"[IT Exam · Q388] What else is required when configuring an IPv6 static route using a next-hop link-local address?","options":[{"key":"A","text":"administrative distance"},{"key":"B","text":"ip address of the neighbor router"},{"key":"C","text":"network number and subnet mask on the interface of the neighbor router"},{"key":"D","text":"interface number and type"}],"answer":["D"]},{"number":389,"text":"[IT Exam · Q389] A technician is configuring a wireless network for a small business using a SOHO wireless router . Which two authentication methods are used, if the router is configured with WPA2? (Choose two.)","options":[{"key":"A","text":"personal"},{"key":"B","text":"AES"},{"key":"C","text":"TKIP"},{"key":"D","text":"WEP"},{"key":"E","text":"enterprise"}],"answer":["A","E"]},{"number":390,"text":"[IT Exam · Q390] Which mitigation technique would prevent rogue servers from providing false IPv6 configuration parameters to clients?","options":[{"key":"A","text":"enabling DHCPv6 Guard"},{"key":"B","text":"enabling RA Guard"},{"key":"C","text":"implementing port security on edge ports"},{"key":"D","text":"disabling CDP on edge ports"}],"answer":["A"]},{"number":391,"text":"[IT Exam · Q391] A PC has sent an RS message to an IPv6 router attached to the same network. Which two pieces of information will the router send to the client? (Choose two.)","options":[{"key":"A","text":"prefix length"},{"key":"B","text":"subnet mask in dotted decimal notation"},{"key":"C","text":"domain name"},{"key":"D","text":"administrative distance"},{"key":"E","text":"prefix"},{"key":"F","text":"DNS server IP address"}],"answer":["A","E"]},{"number":392,"text":"[IT Exam · Q392] While attending a conference, participants are using laptops for network connectivity. When a guest speaker attempts to connect to the network, the laptop fails to display any available wireless networks. The access point must be operating in which mode?","options":[{"key":"A","text":"mixed"},{"key":"B","text":"passive"},{"key":"C","text":"active"},{"key":"D","text":"open"}],"answer":["C"]},{"number":393,"text":"[IT Exam · Q393] Which three components are combined to form a bridge ID?","options":[{"key":"A","text":"extended system ID"},{"key":"B","text":"cost"},{"key":"C","text":"IP address"},{"key":"D","text":"bridge priority"},{"key":"E","text":"MAC address"},{"key":"F","text":"port ID"}],"answer":["A","D","E"]},{"number":1,"text":"[FA25 · Q1] If more than one DHCP server is available on the local network, in which order will DHCP messages be sent between a host and a DHCP server?","options":[{"key":"A","text":"acknowledgment, request, offer, discover"},{"key":"B","text":"request, discover, offer, acknowledgment"},{"key":"C","text":"discover, offer, request, acknowledgment"},{"key":"D","text":"request, acknowledgment, discover, offer"}],"answer":["C"]},{"number":2,"text":"[FA25 · Q2] What is the destination IP address when an IPv4 host sends a DHCPDISCOVER message?","options":[{"key":"A","text":"192.168.1.1"},{"key":"B","text":"255.255.255.255"},{"key":"C","text":"0.0.0.0"},{"key":"D","text":"224.0.0.1"}],"answer":["B"]},{"number":3,"text":"[FA25 · Q3] An administrator issues the commands: Router(config)# interface g0/1 Router(config-if)# ip address dhcp","options":[{"key":"A","text":"configuring the router to act as a DHCPv4 server"},{"key":"B","text":"configuring the router to act as a relay agent"},{"key":"C","text":"configuring the router to resolve IP address conflicts"},{"key":"D","text":"configuring the router to obtain IP parameters from a DHCPv4 server"}],"answer":["D"]},{"number":4,"text":"[FA25 · Q4] As a DHCPv4 client lease is about to expire, what is the message that the client sends the DHCP server?","options":[{"key":"A","text":"DHCPDISCOVER"},{"key":"B","text":"DHCPREQUEST"},{"key":"C","text":"DHCPACK"},{"key":"D","text":"DHCPOFFER"}],"answer":["B"]},{"number":5,"text":"[FA25 · Q5] What does a rogue DHCP server do in a DHCP Spoofing attack?","options":[{"key":"A","text":"Floods the network with DHCP requests"},{"key":"B","text":"Provides false IP configuration to clients"},{"key":"C","text":"Blocks legitimate DHCP traffic"},{"key":"D","text":"Captures data by spoofing MAC addresses"}],"answer":["B"]},{"number":6,"text":"[FA25 · Q6] Which device monitors HTTP traffic to block access to risky sites and encrypt outgoing messages?","options":[{"key":"A","text":"NGFW"},{"key":"B","text":"ESA"},{"key":"C","text":"NAC"},{"key":"D","text":"WSA"}],"answer":["D"]},{"number":7,"text":"[FA25 · Q7] What address and prefix length is used when configuring an IPv6 default static route?","options":[{"key":"A","text":"::1/128"},{"key":"B","text":"FF02::1/8"},{"key":"C","text":"::/0"},{"key":"D","text":"0.0.0.0/0"}],"answer":["C"]},{"number":8,"text":"[FA25 · Q8] What is the main function of Dynamic ARP Inspection (DAI)?","options":[{"key":"A","text":"To prevent unauthorized DHCP servers"},{"key":"B","text":"To mitigate ARP spoofing and ARP poisoning attacks"},{"key":"C","text":"To control access to VLANS"},{"key":"D","text":"To provide routing between VLANS"}],"answer":["B"]},{"number":9,"text":"[FA25 · Q9] What advantage does SSH offer over Telnet?","options":[{"key":"A","text":"connection-oriented service"},{"key":"B","text":"encryption"},{"key":"C","text":"more connection lines"},{"key":"D","text":"username and password authentication"}],"answer":["B"]},{"number":10,"text":"[FA25 · Q10] What is a key difference between SSH and Telnet in terms of security?","options":[{"key":"A","text":"SSH uses port 23 while Telnet uses port 22"},{"key":"B","text":"Telnet encrypts only usernames"},{"key":"C","text":"SSH encrypts both authentication and data"},{"key":"D","text":"SSH does not require authentication"}],"answer":["C"]},{"number":11,"text":"[FA25 · Q11] What character is used to enable the filtering of commands?","options":[{"key":"A","text":"pipe |"},{"key":"B","text":"comma,"},{"key":"C","text":"colon:"},{"key":"D","text":"semi colon;"}],"answer":["A"]},{"number":12,"text":"[FA25 · Q12] Which statement describes SVIs?","options":[{"key":"A","text":"An SVI can only be created for the management VLAN."},{"key":"B","text":"A default SVI is created for VLAN 1 for switch administration."},{"key":"C","text":"Creating an SVI automatically creates an associated VLAN."},{"key":"D","text":"An SVI is created automatically for each VLAN on a multilayer switch."}],"answer":["B"]},{"number":13,"text":"[FA25 · Q13] What is the first action in the boot sequence when a switch is powered on?","options":[{"key":"A","text":"low-level CPU initialization"},{"key":"B","text":"load boot loader software"},{"key":"C","text":"load the default Cisco IOS software"},{"key":"D","text":"load a power-on self-test program"}],"answer":["D"]},{"number":14,"text":"[FA25 · Q14] Where are dynamically learned MAC addresses stored when sticky learning is enabled with the switchport port-security mac-address sticky command?","options":[{"key":"A","text":"flash"},{"key":"B","text":"NVRAM"},{"key":"C","text":"RAM"},{"key":"D","text":"ROM"}],"answer":["C"]},{"number":15,"text":"[FA25 · Q15] A network administrator is configuring DHCP snooping on a switch. Which configuration command should be used first?","options":[{"key":"A","text":"ip dhcp snooping"},{"key":"B","text":"ip dhcp snooping limit rate"},{"key":"C","text":"ip dhcp snooping vlan"},{"key":"D","text":"ip dhcp snooping trust"}],"answer":["A"]},{"number":16,"text":"[FA25 · Q16] Which command would be best to use on an unused switch port if a company adheres to the best practices as recommended by Cisco?","options":[{"key":"A","text":"switchport port-security mac-address sticky mac-address"},{"key":"B","text":"ip dhcp snooping"},{"key":"C","text":"shutdown"},{"key":"D","text":"switchport port-security violation shutdown"},{"key":"E","text":"switchport port-security mac-address sticky"}],"answer":["C"]},{"number":17,"text":"[FA25 · Q17] What device is elected by the Spanning Tree Algorithm? All other switches determine a single least-cost path to this device.","options":[{"key":"A","text":"root bridge"},{"key":"B","text":"dedicated bridge"},{"key":"C","text":"default gateway"},{"key":"D","text":"core switch"}],"answer":["A"]},{"number":18,"text":"[FA25 · Q18] What is used in the EUI-64 process to create an IPv6 interface ID on an IPv6 enabled interface?","options":[{"key":"A","text":"A randomly generated 64-bit hexadecimal address"},{"key":"B","text":"An IPv4 address that is configured on the interface"},{"key":"C","text":"An IPv6 address that is provided by a DHCPv6 server"},{"key":"D","text":"The MAC address of an Ethernet interface"}],"answer":["D"]},{"number":19,"text":"[FA25 · Q19] Which two flags in a Router Advertisement determine the method a host uses to obtain addressing information?","options":[{"key":"A","text":"L and G"},{"key":"B","text":"M and O"},{"key":"C","text":"A and D"},{"key":"D","text":"F and T"}],"answer":["B"]},{"number":20,"text":"[FA25 · Q20] Which destination IP address is used when an IPv6 host sends a DHCPv6 SOLICIT message to locate a DHCPv6 server?","options":[{"key":"A","text":"FE80::1"},{"key":"B","text":"FF02::2"},{"key":"C","text":"FF02::1:2"},{"key":"D","text":"FF02::1"}],"answer":["C"]},{"number":21,"text":"[FA25 · Q21] On which router would a default static route be configured?","options":[{"key":"A","text":"A router providing DHCP services to clients."},{"key":"B","text":"A router that is connected to multiple providers."},{"key":"C","text":"A stub router connecting to a service provider."},{"key":"D","text":"On all routers in the network."}],"answer":["C"]},{"number":22,"text":"[FA25 · Q22] A network administrator uses the command ip route 172.18.0.0 255.255.0.0 S0/0/1 to configure a floating static route on a router. That route will function as a backup route to reach the EIGRP learned network 172.18.0.0/16. After this configuration, the EIGRP route is removed from the routing table even though EIGRP is still functioning properly. Why is the static route not functioning as intended?","options":[{"key":"A","text":"The network mask is incorrectly configured."},{"key":"B","text":"The next hop neighbor IP address is not configured."},{"key":"C","text":"The destination network is incorrectly configured."},{"key":"D","text":"The administrative distance value is not high enough on the static route."}],"answer":["D"]},{"number":23,"text":"[FA25 · Q23] What happens when a port security violation occurs and the port is in the default violation mode?","options":[{"key":"A","text":"The port shuts down immediately and must be re-enabled manually"},{"key":"B","text":"The port drops packets but remains operational"},{"key":"C","text":"The port logs a message but continues to operate normally"},{"key":"D","text":"The port resets and clears all MAC addresses"}],"answer":["A"]},{"number":24,"text":"[FA25 · Q24] Which type of route could be configured to be a backup route for a dynamic routing protocol?","options":[{"key":"A","text":"Backup static route"},{"key":"B","text":"Floating static route"},{"key":"C","text":"Generic static route"},{"key":"D","text":"Summary static route"}],"answer":["B"]},{"number":25,"text":"[FA25 · Q25] Which distinct type of VLAN is used by an administrator to access and configure a switch?","options":[{"key":"A","text":"data VLAN"},{"key":"B","text":"default VLAN"},{"key":"C","text":"native VLAN"},{"key":"D","text":"management VLAN"}],"answer":["D"]},{"number":26,"text":"[FA25 · Q26] In a VLAN-enabled network, how is broadcast traffic handled?","options":[{"key":"A","text":"It is discarded"},{"key":"B","text":"It is forwarded to the default gateway"},{"key":"C","text":"It is sent only to VLAN 1"},{"key":"D","text":"It is flooded within its own VLAN only"}],"answer":["D"]},{"number":27,"text":"[FA25 · Q27] What will a Cisco LAN switch do if it receives an incoming frame and the destination MAC address is not lis in the MAC address table?","options":[{"key":"A","text":"Send the frame to the default gateway address."},{"key":"B","text":"Drop the frame."},{"key":"C","text":"Use ARP to resolve the port that is related to the frame."},{"key":"D","text":"Forward the frame out all ports except the port where the frame is received."}],"answer":["D"]},{"number":28,"text":"[FA25 · Q28] What will a Cisco LAN switch do if it receives an incoming frame and the destination MAC address is not lis in the MAC address table?","options":[{"key":"A","text":"Send the frame to the default gateway address."},{"key":"B","text":"Drop the frame."},{"key":"C","text":"Use ARP to resolve the port that is related to the frame."},{"key":"D","text":"Forward the frame out all ports except the port where the frame is received."}],"answer":["B"]},{"number":29,"text":"[FA25 · Q29] What does the term \"port density\" represent for an Ethernet switch?","options":[{"key":"A","text":"the memory space that is allocated to each switch port"},{"key":"B","text":"the number of available ports"},{"key":"C","text":"the speed of each port"},{"key":"D","text":"the numbers of hosts that are connected to each switch port"}],"answer":["B"]},{"number":30,"text":"[FA25 · Q30] Which command is used to manually configure a Global Unicast IPv6 (GUA) address on a router?","options":[{"key":"A","text":"ipv6 address autoconfig"},{"key":"B","text":"ipv6 enable"},{"key":"C","text":"ipv6 address ipv6-address/prefix-length"},{"key":"D","text":"ipv6 unicast-routing"}],"answer":["C"]},{"number":31,"text":"[FA25 · Q31] In the context of mobile devices, what does the term tethering involve?","options":[{"key":"A","text":"connecting a mobile device to a USB port on a computer in order to charge the mobile device"},{"key":"B","text":"connecting a mobile device to another mobile device or computer to share a network connecti"},{"key":"C","text":"connecting a mobile device to a 4G cellular network"},{"key":"D","text":"connecting a mobile device to a hands-free headset"}],"answer":["B"]},{"number":32,"text":"[FA25 · Q32] Which type of access point (AP) is managed by a wireless controller?","options":[{"key":"A","text":"Manual AP"},{"key":"B","text":"Rogue AP"},{"key":"C","text":"Standalone AP"},{"key":"D","text":"Lightweight AP"}],"answer":["D"]},{"number":33,"text":"[FA25 · Q33] Which method of wireless authentication is currently considered to be the strongest?","options":[{"key":"A","text":"open"},{"key":"B","text":"WPA"},{"key":"C","text":"WPA2"},{"key":"D","text":"WEP"},{"key":"E","text":"shared key"}],"answer":["C"]},{"number":34,"text":"[FA25 · Q34] Which two port states in STP do not forward frames, but still process BPDUs?","options":[{"key":"A","text":"Blocking and Disabled"},{"key":"B","text":"Listening and Forwarding"},{"key":"C","text":"Blocking and Listening"},{"key":"D","text":"Learning and Forwarding"}],"answer":["C"]},{"number":35,"text":"[FA25 · Q35] Which type of VLAN is assigned to 802.1Q trunk ports to carry untagged traffic?","options":[{"key":"A","text":"default"},{"key":"B","text":"native"},{"key":"C","text":"data"},{"key":"D","text":"management"}],"answer":["B"]},{"number":36,"text":"[FA25 · Q36] After the election of the root bridge has been completed, how will switches find the best paths to the root bridge?","options":[{"key":"A","text":"Each switch will analyze the port states of all neighbors and use the designated ports to forward traffic to the root."},{"key":"B","text":"Each switch will analyze the sum of all port costs to reach the root and use the path with the lowest cost."},{"key":"C","text":"Each switch will analyze the sum of the hops to reach the root and use the path with the fewest hops."},{"key":"D","text":"Each switch will analyze the BID of all neighbors to reach the root and use the path through the lowest BID neighbors."}],"answer":["B"]},{"number":37,"text":"[FA25 · Q37] What is one way to correct a spanning tree failure?","options":[{"key":"A","text":"Replace the cables on failed STP links."},{"key":"B","text":"Manually remove redundant links in the switched network."},{"key":"C","text":"Insert redundant links to replace the failed STP links."},{"key":"D","text":"Replace all instances of STP with RSTP."}],"answer":["B"]},{"number":38,"text":"[FA25 · Q38] What happens when a destination IP address does not match any route and no default route exists?","options":[{"key":"A","text":"The router forwards the packet to a loopback interface"},{"key":"B","text":"The router stores the packet in a buffer"},{"key":"C","text":"The router drops the packet and sends an ICMP unreachable message"},{"key":"D","text":"The router uses traceroute to find the best possible route to the destination"}],"answer":["C"]},{"number":39,"text":"[FA25 · Q39] Which type of antenna provides 360-degree coverage and is ideal for use in home or office environments?","options":[{"key":"A","text":"Directional"},{"key":"B","text":"Omnidirectional"},{"key":"C","text":"Yagi"},{"key":"D","text":"Parabolic dish"}],"answer":["B"]},{"number":40,"text":"[FA25 · Q40] What will a router do if it does not have a default route configured and a packet needs to be forwarded to a destination network that is not listed in the routing table?","options":[{"key":"A","text":"send it back to the source"},{"key":"B","text":"drop it"},{"key":"C","text":"forward it to another router"},{"key":"D","text":"None of the mentioned."}],"answer":["B"]},{"number":41,"text":"[FA25 · Q41] Which of the following wireless networks typically uses lower powered transmitters for short ranges?","options":[{"key":"A","text":"WPAN"},{"key":"B","text":"WLAN"},{"key":"C","text":"WMAN"},{"key":"D","text":"WWAN"}],"answer":["A"]},{"number":42,"text":"[FA25 · Q42] What functionality is required on routers to provide remote workers with VoIP and videoconferencing capabilities?","options":[{"key":"A","text":"IPsec"},{"key":"B","text":"PPPOE"},{"key":"C","text":"QoS"},{"key":"D","text":"VPN"}],"answer":["C"]},{"number":43,"text":"[FA25 · Q43] In setting up a small office network, the network administrator decides to assign private IP addresses dynamically to workstations and mobile devices. Which feature must be enabled on the company router im order for office devices to access the internet?","options":[{"key":"A","text":"UPnP"},{"key":"B","text":"NAT"},{"key":"C","text":"QoS"},{"key":"D","text":"MAC filtering"}],"answer":["B"]},{"number":44,"text":"[FA25 · Q44] By default, what determines the active router in an HSRP group if priorities are equal?","options":[{"key":"A","text":"The router with the highest MAC address"},{"key":"B","text":"The router with the lowest MAC address"},{"key":"C","text":"The router with the numerically highest IPv4 address"},{"key":"D","text":"The router with the numerically lowest IPv4 address"}],"answer":["C"]},{"number":45,"text":"[FA25 · Q45] A user is configuring a wireless access point and wants to prevent any neighbors from discovering the network. What action does the user need to take?","options":[{"key":"A","text":"Configure DMZ settings."},{"key":"B","text":"Configure a DNS server."},{"key":"C","text":"Disable SSID broadcast."},{"key":"D","text":"Enable WPA encryption."}],"answer":["C"]},{"number":46,"text":"[FA25 · Q46] When security is a concern, which OSI Layer is considered to be the weakest link in a network system?","options":[{"key":"A","text":"Layer 4"},{"key":"B","text":"Layer 7"},{"key":"C","text":"Layer 2"},{"key":"D","text":"Layer 3"}],"answer":["C"]},{"number":47,"text":"[FA25 · Q47] What happens during a MAC address flooding attack?","options":[{"key":"A","text":"The switch deletes its MAC table"},{"key":"B","text":"The switch stops forwarding packets"},{"key":"C","text":"The switch sends all traffic to the attacker"},{"key":"D","text":"The switch floods frames out all ports"}],"answer":["D"]},{"number":48,"text":"[FA25 · Q48] Which of the following best describes a DDoS attack?","options":[{"key":"A","text":"One device sending encrypted data to a server"},{"key":"B","text":"A single host scanning all open ports"},{"key":"C","text":"Many devices overwhelming a target with traffic"},{"key":"D","text":"A switch flooding traffic to all ports"}],"answer":["C"]},{"number":49,"text":"[FA25 · Q49] Because of implemented security controls, a user can only access a server with FTP. Which AAA component accomplishes this?","options":[{"key":"A","text":"authorization"},{"key":"B","text":"authentication"},{"key":"C","text":"accessibility"},{"key":"D","text":"accounting"},{"key":"E","text":"auditing"}],"answer":["A"]},{"number":50,"text":"[FA25 · Q50] What is the destination IP address when an IPv4 host sends a DHCPDISCOVER message?","options":[{"key":"A","text":"192.168.1.1"},{"key":"B","text":"224.0.0.1"},{"key":"C","text":"0.0.0.0"},{"key":"D","text":"255.255.255.255"}],"answer":["D"]},{"number":1,"text":"[SP25 · Q1] Which DHCP IPv4 message contains the following information? Destination address: 255.255.255.255 Client IPv4 address: 0.0.0.0 Default gateway address: 0.0.0.0 Subnet mask: 0.0.0.0","options":[{"key":"A","text":"DHCPDISCOVER"},{"key":"B","text":"DHCPOFFER"},{"key":"C","text":"DHCPACK"},{"key":"D","text":"DHCPREQUEST"}],"answer":["A"]},{"number":2,"text":"[SP25 · Q2] Which command disables Cisco Discovery Protocol (CDP) on an interface?","options":[{"key":"A","text":"no cdp run"},{"key":"B","text":"no lldp transmit"},{"key":"C","text":"no cdp enable"},{"key":"D","text":"disable cdp"}],"answer":["C"]},{"number":3,"text":"[SP25 · Q3] Which three advantages are provided by static routing? (Choose three.)","options":[{"key":"A","text":"Static routing does no advertise over the network, thus providing better security."},{"key":"B","text":"No intervention is required to maintain changing route information."},{"key":"C","text":"Static routes scale well as the network grows."},{"key":"D","text":"The path a static route uses to send data is known."},{"key":"E","text":"Configuration of static routes is error-free."},{"key":"F","text":"Static routing typically uses less network bandwidth and fewer CPU operations than dynamic routing does."}],"answer":["A","E","F"]},{"number":4,"text":"[SP25 · Q4] Which feature on a Cisco router permits the forwarding of traffic for which there is no specific route?","options":[{"key":"A","text":"next-hop"},{"key":"B","text":"gateway of last resort"},{"key":"C","text":"outgoing interface"},{"key":"D","text":"route source"}],"answer":["B"]},{"number":5,"text":"[SP25 · Q5] what is an advantage of using dynamic routing protocols instead of static routing?","options":[{"key":"A","text":"fewer router resource overhead requirements"},{"key":"B","text":"easier to implement"},{"key":"C","text":"more secure in controlling routing updates"},{"key":"D","text":"ability to actively search for new routes if the current path becomes unavailable"}],"answer":["D"]},{"number":6,"text":"[SP25 · Q6] What type of Ethernet cable would be used to connect one switch to another switch when neither switch supports the auto-MDIX feature?","options":[{"key":"A","text":"straight-through"},{"key":"B","text":"rollover"},{"key":"C","text":"crossover"},{"key":"D","text":"coaxial"}],"answer":["C"]},{"number":7,"text":"[SP25 · Q7] Which statement describes SVIs?","options":[{"key":"A","text":"An SVI is created automatically for each VLAN on a multilayer switch"},{"key":"B","text":"An SVI can only be created for the management VLAN"},{"key":"C","text":"A default SVI is created for VLAN 1 for switch administration"},{"key":"D","text":"Creating an SVI automatically creates an associated VLAN"}],"answer":["C"]},{"number":8,"text":"[SP25 · Q8] What character is used to enable the filtering of commands?","options":[{"key":"A","text":"pipe |"},{"key":"B","text":"comma,"},{"key":"C","text":"colon:"},{"key":"D","text":"semi colon;"}],"answer":["A"]},{"number":9,"text":"[SP25 · Q9] Which router bootup sequence is correct?","options":[{"key":"A","text":"1-perform the POST and load the bootstrap program 2-locate and load the Cisco IOS software 3-locate and load the startup configuration file or enter setup mode"},{"key":"B","text":"1-perform the POST and load the startup configuration file 2-locate and load the bootstrap program 3-locate and load the Cisco IOS software"},{"key":"C","text":"1-perform the POST and load the bootstrap program 2-locate and load the startup configuration file or enter setup mode 3-locate and load the Cisco IOS software"},{"key":"D","text":"1-perform the POST and load the Cisco IOS software 2-locate and load the startup configuration file or enter setup mode 3-locate and load the bootstrap program"}],"answer":["A"]},{"number":10,"text":"[SP25 · Q10] Which command would be best to use on an unused switch port if a company adheres to the best practices as recommended by Cisco?","options":[{"key":"A","text":"switchport port-security mac-address sticky mac-address"},{"key":"B","text":"ip dhcp snooping"},{"key":"C","text":"shutdown"},{"key":"D","text":"switchport port-security violation shutdown"},{"key":"E","text":"switchport port-security mac-address sticky"}],"answer":["C"]},{"number":11,"text":"[SP25 · Q11] On what switch ports should PortFast be enabled to enhance STP stability?","options":[{"key":"A","text":"only ports that are elected as designated ports"},{"key":"B","text":"all trunk ports that are not root ports"},{"key":"C","text":"all end-user ports"},{"key":"D","text":"only ports that attach to a neighboring switch"}],"answer":["C"]},{"number":12,"text":"[SP25 · Q12] An administrator who is troubleshooting connectivity issues on a switch notices that a switch port configured for port security is in the err-disabled state. After verifying the cause of the violation, how should the administrator re-enable the port without disrupting network operation?","options":[{"key":"A","text":"Reboot the switch."},{"key":"B","text":"Issue the shutdown command followed by the no shutdown command on the interface."},{"key":"C","text":"Issue the no switchport port-security command, then re-enable port security."},{"key":"D","text":"Issue the no switchport port-security violation shutdown command on the interface."}],"answer":["B"]},{"number":13,"text":"[SP25 · Q13] How many steps are involved in the process of a client receiving an IPv4 address from a DHCPv4 server?","options":[{"key":"A","text":"2 steps."},{"key":"B","text":"3 steps."},{"key":"C","text":"4 steps."},{"key":"D","text":"5 steps."}],"answer":["C"]},{"number":14,"text":"[SP25 · Q14] By default (without any configuration on a switch), what will determine which switch is the root bridge?","options":[{"key":"A","text":"The bridge priority"},{"key":"B","text":"The extended system ID"},{"key":"C","text":"The MAC address of the switch"},{"key":"D","text":"The bridge ID"}],"answer":["C"]},{"number":15,"text":"[SP25 · Q15] What is used in the EUI-64 process to create an IPv6 interface ID on an IPv6 enabled interface?","options":[{"key":"A","text":"A randomly generated 64-bit hexadecimal address"},{"key":"B","text":"An IPv4 address that is configured on the interface C An IPv6 address that is provided by a DHCPv6 server"},{"key":"D","text":"The MAC address of an Ethernet interface"}],"answer":["D"]},{"number":16,"text":"[SP25 · Q16] How is the Root Bridge selected in STP?","options":[{"key":"A","text":"Manually assigned by the network administrator."},{"key":"B","text":"Randomly chosen by switches in the network."},{"key":"C","text":"The switch with the highest MAC address is selected."},{"key":"D","text":"The switch with the lowest Bridge ID (BID) is selected."}],"answer":["D"]},{"number":17,"text":"[SP25 · Q17] A company implements the stateless DHCPv6 method for configuring IPv6 addresses on employee workstations. After a workstation receives messages from multiple DHCPv6 servers to indicate their availability for DHCPv6 service, which message does it send to a server for configuration information?","options":[{"key":"A","text":"DHCPv6 REQUEST"},{"key":"B","text":"DHCPv6 INFORMATION-REQUEST"},{"key":"C","text":"DHCPv6 ADVERTISE"},{"key":"D","text":"DHCPv6 SOLICIT"}],"answer":["B"]},{"number":18,"text":"[SP25 · Q18] Which feature should be enabled to protect against ARP spoofing attacks?","options":[{"key":"A","text":"PortFast"},{"key":"B","text":"DHCP Snooping"},{"key":"C","text":"Dynamic ARP Inspection (DAI)"},{"key":"D","text":"BPDU Guard"}],"answer":["C"]},{"number":19,"text":"[SP25 · Q19] Which type of static route that is configured on a router uses only the exit interface?","options":[{"key":"A","text":"fully specified static route"},{"key":"B","text":"directly connected static route"},{"key":"C","text":"recursive static route"},{"key":"D","text":"default static route"}],"answer":["B"]},{"number":20,"text":"[SP25 · Q20] What is the first step to implement DHCP Snooping on a Cisco switch?","options":[{"key":"A","text":"Configure trusted ports."},{"key":"B","text":"Limit the rate of DHCP messages on untrusted ports."},{"key":"C","text":"Enable DHCP Snooping using the global configuration command."},{"key":"D","text":"Enable DHCP Snooping on specific VLANs."}],"answer":["C"]},{"number":21,"text":"[SP25 · Q21] Which type of route could be configured to be a backup route for a dynamic routing protocol?","options":[{"key":"A","text":"Backup static route"},{"key":"B","text":"Floating static route"},{"key":"C","text":"Generic static route"},{"key":"D","text":"Summary static route"}],"answer":["B"]},{"number":22,"text":"[SP25 · Q22] What is one function of a Layer 2 switch?","options":[{"key":"A","text":"forwards data based on logical addressing"},{"key":"B","text":"determines which interface is used to forward a frame based on the destination MAC address"},{"key":"C","text":"duplicates the electrical signal of each frame to every port"},{"key":"D","text":"learns the port assigned to a host by examining the destination MAC address"}],"answer":["B"]},{"number":23,"text":"[SP25 · Q23] What does \"ingress\" refer to in a switched network?","options":[{"key":"A","text":"Exiting interface"},{"key":"B","text":"Entering interface"},{"key":"C","text":"Forwarding interface"},{"key":"D","text":"Deleting interface"}],"answer":["B"]},{"number":24,"text":"[SP25 · Q24] Which statement is true about broadcast and collision domains?","options":[{"key":"A","text":"The size of the collision domain can be reduced by adding hubs to a network."},{"key":"B","text":"Adding a switch to a network will increase the size of the broadcast domain."},{"key":"C","text":"Adding a router to a network will increase the size of the collision domain."},{"key":"D","text":"The more interfaces a router has the larger the resulting broadcast domain"}],"answer":["B"]},{"number":25,"text":"[SP25 · Q25] Which switch characteristic helps alleviate network congestion when a 10 Gbps port is forwarding data to a 1 Gbps port?","options":[{"key":"A","text":"high port density"},{"key":"B","text":"fast port speed"},{"key":"C","text":"fast internal switching"},{"key":"D","text":"frame buffering"}],"answer":["D"]},{"number":26,"text":"[SP25 · Q26] Which port speed will be auto negotiated between a host with a 1 Gbps NIC connecting to a Cisco Catalyst 2960 switch with a 100 Mbps port?","options":[{"key":"A","text":"10 Mbps"},{"key":"B","text":"100 Mbps"},{"key":"C","text":"1 Gbps"},{"key":"D","text":"10 Gbps"}],"answer":["B"]},{"number":27,"text":"[SP25 · Q27] What Wi-Fi management frame is regularly broadcast by APs to announce their presence?","options":[{"key":"A","text":"association"},{"key":"B","text":"beacon"},{"key":"C","text":"probe"},{"key":"D","text":"authentication"}],"answer":["B"]},{"number":28,"text":"[SP25 · Q28] If three 802.11b access points need to be deployed in close proximity, which three frequency channels should be used? (Choose three.)","options":[{"key":"A","text":"8"},{"key":"B","text":"1"},{"key":"C","text":"3"},{"key":"D","text":"11"},{"key":"E","text":"6"},{"key":"F","text":"5"}],"answer":["B","D","E"]},{"number":29,"text":"[SP25 · Q29] Which wireless network topology is being configured by a technician who is installing a keyboard, a mouse, and headphones, each of which uses Bluetooth?","options":[{"key":"A","text":"hotspot"},{"key":"B","text":"ad hoc mode"},{"key":"C","text":"infrastructure mode"},{"key":"D","text":"mixed mode"}],"answer":["B"]},{"number":30,"text":"[SP25 · Q30] Which method best describes stateless DHCP?","options":[{"key":"A","text":"SLAAC only"},{"key":"B","text":"SLAAC with stateless DHCPv6 Server"},{"key":"C","text":"Stateful DHCPv6 Server"},{"key":"D","text":"All of other choices31. During the implementation of Spanning Tree Protocol, all switches are rebooted by the network administrator. What is the first step of the spanning-tree election process?"},{"key":"A","text":"All the switches send out BPDUs advertising themselves as the root bridge."},{"key":"B","text":"Each switch determines the best path to forward traffic."},{"key":"C","text":"Each switch determines what port to block to prevent a loop from occurring."},{"key":"D","text":"Each switch with a lower root ID than its neighbor will not send BPDUs."}],"answer":["B","A"]},{"number":32,"text":"[SP25 · Q32] What is the purpose of the vlan.dat file on a switch?","options":[{"key":"A","text":"It holds the operating system"},{"key":"B","text":"It holds the running configuration"},{"key":"C","text":"It holds the VLAN database"},{"key":"D","text":"It holds the saved configuration"}],"answer":["C"]},{"number":33,"text":"[SP25 · Q33] In which two port states does a switch learn MAC addresses and process BPDUs in a PVST network? (Choose two.)","options":[{"key":"A","text":"Blocking"},{"key":"B","text":"Disabled"},{"key":"C","text":"Forwarding"},{"key":"D","text":"Learning"},{"key":"E","text":"Listening"}],"answer":["C","D"]},{"number":34,"text":"[SP25 · Q34] What is an accurate description of redundancy?","options":[{"key":"A","text":"designing a network to use multiple virtual devices to ensure that all traffic uses the best path through the internetwork"},{"key":"B","text":"configuring a router with a complete MAC address database to ensure that all frames can be forwarded to the correct destination"},{"key":"C","text":"designing a network to use multiple paths between switches to ensure there is no single point of failure"},{"key":"D","text":"configuring a switch with proper security to ensure that all traffic forwarded through an interface is filtered"}],"answer":["C"]},{"number":35,"text":"[SP25 · Q35] A static route has been configured on a router. However, the destination network no longer exists. What should an administrator do to remove the static route from the routing table?","options":[{"key":"A","text":"Remove the route using the no ip route command."},{"key":"B","text":"Change the routing metric for that route."},{"key":"C","text":"Change the administrative distance for that route."},{"key":"D","t on the networked devices?","options":[{"key":"A","text":"network"},{"key":"B","text":"public"},{"key":"C","text":"wireless"},{"key":"D","text":"private"}],"answer":["D"]},{"number":42,"text":"[SP25 · Q42] A user is configuring a wireless access point and wants to prevent any neighbors from discovering the network. What action does the user need to take?","options":[{"key":"A","text":"Configure DMZ settings."},{"key":"B","text":"Configure a DNS server."},{"key":"C","text":"Disable SSID broadcast."},{"key":"D","text":"Enable WPA encryption."}],"answer":["C"]},{"number":43,"text":"[SP25 · Q43] When security is a concern, which OSI Layer is considered to be the weakest link in a network system?","options":[{"key":"A","text":"Layer 4"},{"key":"B","text":"Layer 7"},{"key":"C","text":"Layer 2"},{"key":"D","text":"Layer 3"}],"answer":["B"]},{"number":44,"text":"[SP25 · Q44] Which service is enabled on a Cisco router by default that can reveal significant information about the router and potentially make it more vulnerable to attack?","options":[{"key":"A","text":"HTTP"},{"key":"B","text":"LLDP"},{"key":"C","text":"CDP"},{"key":"D","text":"FTP"}],"answer":["C"]},{"number":45,"text":"[SP25 · Q45] Which three Cisco products focus on endpoint security solutions? (Choose three.)","options":[{"key":"A","text":"NAC Appliance"},{"key":"B","text":"Adaptive Security Appliance"},{"key":"C","text":"SSL/IPsec VPN Appliance"},{"key":"D","text":"IPS Sensor Appliance"},{"key":"E","text":"Web Security Appliance"},{"key":"F","text":"Email Security Appliance"}],"answer":["A","E","F"]},{"number":46,"text":"[SP25 · Q46] Which Layer 2 attack will result in a switch flooding incoming frames to all ports?","options":[{"key":"A","text":"MAC address overflow"},{"key":"B","text":"Spanning Tree Protocol manipulation"},{"key":"C","text":"IP address spoofing"},{"key":"D","text":"ARP poisoning"}],"answer":["A"]},{"number":47,"text":"[SP25 · Q47] What must an administrator have in order to reset a lost password on a router?","options":[{"key":"A","text":"access to another router"},{"key":"B","text":"physical access to the router"},{"key":"C","text":"a TFTP server"},{"key":"D","text":"a crossover cable"}],"answer":["B"]},{"number":48,"text":"[SP25 · Q48] What protocol is commonly used in Router-on-a-Stick configurations?","options":[{"key":"A","text":"HTTP"},{"key":"B","text":"FTP"},{"key":"C","text":"802.1Q trunking protocol"},{"key":"D","text":"DHCP protocol"}],"answer":["C"]},{"number":49,"text":"[SP25 · Q49] Under which two circumstances would a router usually be configured as a DHCPv4 client? (Choose two.)","options":[{"key":"A","text":"This is an ISP requirement."},{"key":"B","text":"The administrator needs the router to act as a relay agent."},{"key":"C","text":"The router is meant to provide IP addresses to the hosts."},{"key":"D","text":"The router is intended to be used as a SOHO gateway."},{"key":"E","text":"The router has a fixed IP address."}],"answer":["A","D"]},{"number":50,"text":"[SP25 · Q50] Which address does a DHCPv4 server target when sending a DHCPOFFER message to a client that makes an address request?","options":[{"key":"A","text":"broadcast MAC address"},{"key":"B","text":"client hardware address"},{"key":"C","text":"gateway IP address"},{"key":"D","text":"client IP address"}],"answer":["B"]},{"number":1,"text":"[SP26 · Q1] What type of device can be used to break up broadcast domains?","options":[{"key":"A","text":"A Layer 2 switch."},{"key":"B","text":"A hub."},{"key":"C","text":"A Layer 3 device, like a router."},{"key":"D","text":"An access point."}],"answer":["C"]},{"number":2,"text":"[SP26 · Q2] How many steps are involved in the process of a client receiving an IPv4 address from a DHCPv4 server?","options":[{"key":"A","text":"2 steps."},{"key":"B","text":"3 steps."},{"key":"C","text":"4 steps."},{"key":"D","text":"5 steps."}],"answer":["C"]},{"number":3,"text":"[SP26 · Q3] What action will a router take to forward a frame if it does not have an entry in the ARP table to resolve a destination MAC address?","options":[{"key":"A","text":"Sends a DNS request"},{"key":"B","text":"Drops the frame"},{"key":"C","text":"Sends an ARP request"},{"key":"D","text":"Sends frame to the default gateway"}],"answer":["C"]},{"number":4,"text":"[SP26 · Q4] How would you test a floating static route?","options":[{"key":"A","text":"Delete the default gateway route on the router"},{"key":"B","text":"Manually shut down the router interface used as a primary route"},{"key":"C","text":"Ping any valid address on the 192.168.10.0/24 network"},{"key":"D","text":"Ping from the 192.168.10.0 network to the 10 10 10 2 address"}],"answer":["B"]},{"number":5,"text":"[SP26 · Q5] Which interface configuration command is used to enable stateless DHCPv6 on a Cisco router?","options":[{"key":"A","text":"ipv6 nd managed-config-flag"},{"key":"B","text":"ipv6 nd other-config-flag"},{"key":"C","text":"ipv6 dhcp server"},{"key":"D","text":"ipv6 address autoconfig"}],"answer":["B"]},{"number":6,"text":"[SP26 · Q6] What is the purpose of a Next-Generation Firewall (NGFW)?","options":[{"key":"A","text":"To provide simple packet filtering"},{"key":"B","text":"To inspect traffic at the application layer and provide advanced threat protection"},{"key":"C","text":"To manage and route traffic between VLANS"},{"key":"D","text":"To provide a secure connection for remote users"}],"answer":["B"]},{"number":7,"text":"[SP26 · Q7] Which protocol is Cisco-proprietary and allows for transparent failover of a first-hop IPv4 device?","options":[{"key":"A","text":"VRRP"},{"key":"B","text":"GLBP"},{"key":"C","text":"IRDP"},{"key":"D","text":"HSRP"}],"answer":["D"]},{"number":8,"text":"[SP26 · Q8] Which AAA component is responsible for collecting and reporting usage data for auditing and billing purposes?","options":[{"key":"A","text":"Authentication"},{"key":"B","text":"Authorization"},{"key":"C","text":"Accounting"},{"key":"D","text":"All of other choices"}],"answer":["C"]},{"number":9,"text":"[SP26 · Q9] What type of Ethernet cable would be used to connect one switch to another switch when neither switch supports the auto-MDIX feature?","options":[{"key":"A","text":"crossover"},{"key":"B","text":"rollover"},{"key":"C","text":"straight-through"},{"key":"D","text":"coaxial"}],"answer":["A"]},{"number":10,"text":"[SP26 · Q10] What is a significant limitation of Legacy Inter-VLAN routing?","options":[{"key":"A","text":"It is a modem, scalable solution"},{"key":"B","text":"It requires minimal configurationer"},{"key":"C","text":"It does not scale well"},{"key":"D","text":"It uses advanced trunking protocols"}],"answer":["C"]},{"number":11,"text":"[SP26 · Q11] What Layer 2 attack is mitigated by disabling Dynamic Trunking Protocol?","options":[{"key":"A","text":"VLAN hopping"},{"key":"B","text":"DHCP spoofing"},{"key":"C","text":"ARP poisoning"},{"key":"D","text":"ARP spoofing"}],"answer":["A"]},{"number":12,"text":"[SP26 · Q12] What is a characteristic of a default static route?","options":[{"key":"A","text":"It backs up a route already discovered by a dynamic routing protocol"},{"key":"B","text":"It is configured with a higher administrative distance than is the original dynamic routing protocol"},{"key":"C","text":"It uses a single network address to send multiple static routes to one destination address"},{"key":"D","text":"It identifies the gateway IP address to which the router sends all IP packets for which it does not have a leamed or static route."}],"answer":["D"]},{"number":13,"text":"[SP26 · Q13] Which two concepts relate to a switch port that is intended to have only end devices attached and intended never to be used to connect to another switch? (Choose two)","options":[{"key":"A","text":"bridge ID"},{"key":"B","text":"PortFast"},{"key":"C","text":"edge port"},{"key":"D","text":"extended system ID"},{"key":"E","text":"PVST+"}],"answer":["B","C"]},{"number":14,"text":"[SP26 · Q14] Which protocol and port numbers are used by both IPv4 and IPv6 CAPWAP tunnels? (Choose two)","options":[{"key":"A","text":"TOP"},{"key":"B","text":"ICMP"},{"key":"C","text":"UDP"},{"key":"D","text":"17 and 163"},{"key":"E","text":"5246 and 5247"}],"answer":["C","E"]},{"number":15,"text":"[SP26 · Q15] Which HSRP state indicates that a router is actively participating in the election of the active or standby router?","options":[{"key":"A","text":"Initial"},{"key":"B","text":"Leam"},{"key":"C","text":"Speak"},{"key":"D","text":"Standby"}],"answer":["C"]},{"number":16,"text":"[SP26 · Q16] During the implementation of Spanning Tree Protocol, all switches are rebooted by the network administrator. What is the first step of the spanning-tree election process?","options":[{"key":"A","text":"All the switches send out BPDUs advertising themselves as the root bridge"},{"key":"B","text":"Each switch determines the best path to forward traffic"},{"key":"C","text":"Each switch determines what port to block to prevent a loop from occurring."},{"key":"D","text":"Each switch with a lower root ID than its neighbor will not send BPDUs"}],"answer":["A"]},{"number":17,"text":"[SP26 · Q17] Which address does a DHCPv4 server target when sending a DHCPOFFER message to a client that makes an address request?","options":[{"key":"A","text":"broadcast MAC address"},{"key":"B","text":"client hardware address"},{"key":"C","text":"gateway IP address"},{"key":"D","text":"client IP address"}],"answer":["B"]},{"number":18,"text":"[SP26 · Q18] After identifying the problem, what is the next logical step in the troubleshooting methodology?","options":[{"key":"A","text":"Verify full system functionality."},{"key":"B","text":"Document findings"},{"key":"C","text":"Establish a theory of probable causes"},{"key":"D","text":"Implement the solution directly."}],"answer":["C"]},{"number":19,"text":"[SP26 · Q19] Which security feature should be enabled in order to prevent an attacker from overflowing the MAC address table of a switch?","options":[{"key":"A","text":"storm control"},{"key":"B","text":"port security"},{"key":"C","text":"BPDU filter"},{"key":"D","text":"root guard"}],"answer":["B"]},{"number":20,"text":"[SP26 · Q20] On what switch ports should PortFast be enabled to enhance STP stability?","options":[{"key":"A","text":"all trunk ports that are not root ports"},{"key":"B","text":"only ports that attach to a neighboring switch ighboring switch"},{"key":"C","text":"only ports that are elected as designated ports"},{"key":"D","text":"all end-user ports"}],"answer":["D"]},{"number":21,"text":"[SP26 · Q21] What is one major threat that Cisco ESA helps protect against?","options":[{"key":"A","text":"DNS tunneling"},{"key":"B","text":"Spoofed IP routing updates"},{"key":"C","text":"Email phishing and malware"},{"key":"D","text":"Layer 1 signal jamming"}],"answer":["C"]},{"number":22,"text":"[SP26 · Q22] A company implements the stateless DHCPv6 method for configuring IPv6 addresses on employee workstations. After a workstation receives messages from multiple DHCPv6 servers to indicate their availability for DHCPv6 service, which message does it send to a server for configuration information?","options":[{"key":"A","text":"DHCPv6 REQUEST"},{"key":"B","text":"DHCPv6 INFORMATION-REQUEST"},{"key":"C","text":"DHCPv6 ADVERTISE"},{"key":"D","text":"DHCPV6 SOLICIT"}],"answer":["B"]},{"number":23,"text":"[SP26 · Q23] Which of the following wireless networks are specified in the IEEE 802.11 standards for the 2.4 GHz and 5 GHz radio frequencies?","options":[{"key":"A","text":"WPAN"},{"key":"B","text":"WLAN"},{"key":"C","text":"WMAN"},{"key":"D","text":"WWAN"}],"answer":["B"]},{"number":24,"text":"[SP26 · Q24] What is the significant difference between a hub and a Layer 2 LAN switch?","options":[{"key":"A","text":"A hub divides collision domains, and a switch divides broadcast domains"},{"key":"B","text":"Each port of a hub is a collision domain, and each port of a switch is a broadcast domain."},{"key":"C","text":"A switch creates many smaller collision domains, and a hub increases the size of a single collision domain"},{"key":"D","text":"A hub forwards frames, and a switch forwards only packets"}],"answer":["C"]},{"number":25,"text":"[SP26 · Q25] Which protocol uses unencrypted communication and transmits passwords in plaintext?","options":[{"key":"A","text":"HTTPS"},{"key":"B","text":"SSH"},{"key":"C","text":"Telnet"},{"key":"D","text":"SNMPV3"}],"answer":["C"]},{"number":26,"text":"[SP26 · Q26] Which command will provide information about the status of all interfaces including the number of giants, runts, and collisions on the interface?","options":[{"key":"A","text":"show interfaces"},{"key":"B","text":"show ip interface brief"},{"key":"C","text":"show history"},{"key":"D","text":"show running-config"}],"answer":["A"]},{"number":27,"text":"[SP26 · Q27] What is the effect of issuing the ip address dhcp command on a router interface?","options":[{"key":"A","text":"Enables the DHCP relay to forward requests to a remote server"},{"key":"B","text":"Assigns a static IP address taken from an existing DHCP pool"},{"key":"C","text":"Converts the interface to DHCP serve"},{"key":"D","text":"Makes the router request an IP address dynamically"},{"key":"E","text":"Restarts the DHCP service to refresh all DHCP configurations"}],"answer":["D"]},{"number":28,"text":"[SP26 · Q28] Which method does not require a server to maintain network address information to know which IPv6 addresses are being used?","options":[{"key":"A","text":"Stateful DHCPV6"},{"key":"B","text":"SLAAC"},{"key":"C","text":"DNS"},{"key":"D","text":"OSPFv3"}],"answer":["B"]},{"number":29,"text":"[SP26 · Q29] Which protocol is specified in RFC 1256 and allows IPv4 hosts to locate routers that provide IP connectivity to other networks?","options":[{"key":"A","text":"HSRP"},{"key":"B","text":"GLBP"},{"key":"C","text":"VRRP"},{"key":"D","text":"IRDP"}],"answer":["D"]},{"number":30,"text":"[SP26 · Q30] Where are normal range VLAN configurations typically stored on a Cisco switch?","options":[{"key":"A","text":"In the running-config file"},{"key":"B","text":"In the startup-config file"},{"key":"C","text":"In the vlan dat file in flash"},{"key":"D","text":"In NVRAM"}],"answer":["C"]},{"number":31,"text":"[SP26 · Q31] Which command is used to configure a Cisco router interface to act as a DHCPv4 client?","options":[{"key":"A","text":"ip helper-address address"},{"key":"B","text":"show ip dhop binding"},{"key":"C","text":"no service dhop"},{"key":"D","text":"ip address dhop"}],"answer":["D"]},{"number":32,"text":"[SP26 · Q32] Which two statements describe a switch port that is configured with PortFast? (Choose two.)","options":[{"key":"A","text":"The switch port immediately transitions from the listening to the forwarding state"},{"key":"B","text":"The switch port immediately transitions from blocking to the forwarding state"},{"key":"C","text":"The switch port sends DHCP requests before transitioning to the forwarding state"},{"key":"D","text":"The switch port immediately processes any BPDUs before transitioning to the forwarding state"},{"key":"E","text":"The switch port should never receive BPDUs"}],"answer":["B","E"]},{"number":33,"text":"[SP26 · Q33] What method is used by a host to verify an IPv6 address is unique on the local network before assigning that address to an interface?","options":[{"key":"A","text":"ARP"},{"key":"B","text":"DAD"},{"key":"C","text":"PING"},{"key":"D","text":"SLAAC"}],"answer":["B"]},{"number":34,"text":"[SP26 · Q34] Which IEEE standard is used for WLAN networks?","options":[{"key":"A","text":"IEEE 802.3"},{"key":"B","text":"IEEE 802.11"},{"key":"C","text":"IEEE 802.15"},{"key":"D","text":"IEEE 802.16"}],"answer":["B"]},{"number":35,"text":"[SP26 · Q35] What is the primary purpose of the Spanning Tree Protocol (STP)?","options":[{"key":"A","text":"To increase network speed"},{"key":"B","text":"To prevent network loops"},{"key":"C","text":"To creat
