U guard on a specific port."},{"key":"B","text":"It manually enables a trunk link."},{"key":"C","text":"It disables an unused port."},{"key":"D","text":"It disables DTP on a non-trunking interface."}],"answer":["D"]},{"number":365,"text":"A network administrator has configured a router for stateless DHCPv6 operation. However , users report that workstations are not receiving DNS server information. Which two router configuration lines should be verified to ensure that stateless DHCPv6 service is properly configured? (Choose two.)","options":[{"key":"A","text":"The domain-name line is included in the ipv6 dhcp pool section."},{"key":"B","text":"The dns-server line is included in the ipv6 dhcp pool section."},{"key":"C","text":"The ipv6 nd other-config-flag is entered for the interface that faces the LAN segment."},{"key":"D","text":"The address prefix line is included in the ipv6 dhcp pool section."},{"key":"E","text":"The ipv6 nd managed-config-flag is entered for the interface that faces the LAN segment."}],"answer":["B","C"]},{"number":366,"text":"A network administrator is configuring a WLAN. Why would the administrator disable the broadcast feature for the SSID?","options":[{"key":"A","text":"to eliminate outsiders scanning for available SSIDs in the area"},{"key":"B","text":"to centralize management of multiple WLANs"},{"key":"C","text":"to facilitate group configuration and management of multiple WLANs through a WLC"},{"key":"D","text":"to provide prioritized service for time-sensitive applications"}],"answer":["A"]},{"number":367,"text":"What action takes place when a frame entering a switch has a unicast destination MAC address that is not in the MAC address table?","options":[{"key":"A","text":"The switch updates the refresh timer for the entry."},{"key":"B","text":"The switch resets the refresh timer on all MAC address table entries."},{"key":"C","text":"The switch replaces the old entry and uses the more current port."},{"key":"D","text":"The switch will forward the frame out all ports except the incoming port."}],"answer":["D"]},{"number":368,"text":"A junior technician was adding a route to a LAN router . A traceroute to a device on the new network revealed a wrong path and unreachable status. What should be done or checked?","options":[{"key":"A","text":"Create a floating static route to that network."},{"key":"B","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"C","text":"Check the configuration of the exit interface on the new static route."},{"key":"D","text":"Verify that the static route to the server is present in the routing table."}],"answer":["C"]},{"number":369,"text":"What is the effect of entering the ip arp inspection vlan 10 configuration command on a switch?","options":[{"key":"A","text":"It specifies the maximum number of L2 addresses allowed on a port."},{"key":"B","text":"It enables DAI on specific switch interfaces previously configured with DHCP snooping."},{"key":"C","text":"It enables DHCP snooping globally on a switch."},{"key":"D","text":"It globally enables BPDU guard on all PortFast-enabled ports."}],"answer":["B"]},{"number":370,"text":"What protocol or technology manages trunk negotiations between switches?","options":[{"key":"A","text":"VTP"},{"key":"B","text":"EtherChannel"},{"key":"C","text":"DTP"},{"key":"D","text":"STP"}],"answer":["C"]},{"number":371,"text":"A network administrator is configuring a WLAN. Why would the administrator apply WPA2 with AES to the WLAN?","options":[{"key":"A","text":"to reduce the risk of unauthorized APs being added to the network"},{"key":"B","text":"to centralize management of multiple WLANs"},{"key":"C","text":"to provide prioritized service for time-sensitive applications"},{"key":"D","text":"to provide privacy and integrity to wireless traffic by using encryption"}],"answer":["D"]},{"number":372,"text":"Users on a LAN are unable to get to a company web server but are able to get elsewhere. What should be done or checked?","options":[{"key":"A","text":"Ensure that the old default route has been removed from the company edge routers."},{"key":"B","text":"Verify that the static route to the server is present in the routing table."},{"key":"C","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"D","text":"Create a floating static route to that network."}],"answer":["B"]},{"number":373,"text":"What IPv6 prefix is designed for link-local communication?","options":[{"key":"A","text":"2001::/3"},{"key":"B","text":"ff00::/8"},{"key":"C","text":"fc::/07"},{"key":"D","text":"fe80::/10"}],"answer":["D"]},{"number":374,"text":"What is the effect of entering the ip dhcp snooping limit rate 6 configuration command on a switch?","options":[{"key":"A","text":"It displays the IP-to-MAC address associations for switch interfaces."},{"key":"B","text":"It enables port security globally on the switch."},{"key":"C","text":"It restricts the number of discovery messages, per second, to be received on the interface."},{"key":"D","text":"It dynamically learns the L2 address and copies it to the running configuration."}],"answer":["C"]},{"number":375,"text":"A network administrator is configuring a WLAN. Why would the administrator change the default DHCP IPv4 addresses on an AP?","options":[{"key":"A","text":"to eliminate outsiders scanning for available SSIDs in the area"},{"key":"B","text":"to reduce the risk of unauthorized APs being added to the network"},{"key":"C","text":"to reduce outsiders intercepting data or accessing the wireless network by using a well-known address range"},{"key":"D","text":"to reduce the risk of interference by external devices such as microwave ovens"}],"answer":["C"]},{"number":376,"text":"What is the effect of entering the ip arp inspection validate src-mac configuration command on a switch?","options":[{"key":"A","text":"It checks the source L2 address in the Ethernet header against the sender L2 address in the ARP body."},{"key":"B","text":"It disables all trunk ports."},{"key":"C","text":"It displays the IP-to-MAC address associations for switch interfaces."},{"key":"D","text":"It enables portfast on a specific switch interface."}],"answer":["A"]},{"number":377,"text":"What protocol or technology is a Cisco proprietary protocol that is automatically enabled on 2960 switches?","options":[{"key":"A","text":"DTP"},{"key":"B","text":"STP"},{"key":"C","text":"VTP"},{"key":"D","text":"EtherChannel"}],"answer":["A"]},{"number":378,"text":"What address and prefix length is used when configuring an IPv6 default static route?","options":[{"key":"A","text":"::/0"},{"key":"B","text":"FF02::1/8"},{"key":"C","text":"0.0.0.0/0"},{"key":"D","text":"::1/128"}],"answer":["A"]},{"number":379,"text":"What are two characteristics of Cisco Express Forwarding (CEF)? (Choose two.)","options":[{"key":"A","text":"When a packet arrives on a router interface, it is forwarded to the control plane where the CPU matches the destination address with a matching routing table entry."},{"key":"B","text":"This is the fastest forwarding mechanism on Cisco routers and multilayer switches."},{"key":"C","text":"With this switching method, flow information for a packet is stored in the fast-switching cache to forward future packets to the same destination without CPU intervention."},{"key":"D","text":"Packets are forwarded based on information in the FIB and an adjacency table."},{"key":"E","text":"When a packet arrives on a router interface, it is forwarded to the control plane where the CPU searches for a match in the fast-switching cache."}],"answer":["B","D"]},{"number":380,"text":"Which term describes the role of a Cisco switch in the 802.1X port-based access control?","options":[{"key":"A","text":"agent"},{"key":"B","text":"supplicant"},{"key":"C","text":"authenticator"},{"key":"D","text":"authentication server"}],"answer":["C"]},{"number":381,"text":"Which Cisco solution helps prevent ARP spoofing and ARP poisoning attacks?","options":[{"key":"A","text":"Dynamic ARP Inspection"},{"key":"B","text":"IP Source Guard"},{"key":"C","text":"DHCP Snooping"},{"key":"D","text":"Port Security"}],"answer":["A"]},{"number":382,"text":"What is an advantage of PVST+?","options":[{"key":"A","text":"PVST+ optimizes performance on the network through autoselection of the root bridge."},{"key":"B","text":"PVST+ reduces bandwidth consumption compared to traditional implementations of STP that use CST."},{"key":"C","text":"PVST+ requires fewer CPU cycles for all the switches in the network."},{"key":"D","text":"PVST+ optimizes performance on the network through load sharing."}],"answer":["D"]},{"number":383,"text":"What protocol or technology uses a standby router to assume packet-forwarding responsibility if the active router fails?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"DTP"},{"key":"C","text":"HSRP"},{"key":"D","text":"VTP"}],"answer":["C"]},{"number":384,"text":"What is the effect of entering the show ip dhcp snooping binding configuration command on a switch?","options":[{"key":"A","text":"It switches a trunk port to access mode."},{"key":"B","text":"It checks the source L2 address in the Ethernet header against the sender L2 address in the ARP body."},{"key":"C","text":"It restricts the number of discovery messages, per second, to be received on the interface."},{"key":"D","text":"It displays the IP-to-MAC address associations for switch interfaces."}],"answer":["D"]},{"number":385,"text":"What action takes place when the source MAC address of a frame entering a switch is in the MAC address table?","options":[{"key":"A","text":"The switch forwards the frame out of the specified port."},{"key":"B","text":"The switch updates the refresh timer for the entry."},{"key":"C","text":"The switch replaces the old entry and uses the more current port."},{"key":"D","text":"The switch adds a MAC address table entry for the destination MAC address and the egress port."}],"answer":["B"]},{"number":386,"text":"A small publishing company has a network design such that when a broadcast is sent on the LAN, 200 devices receive the transmitted broadcast. How can the network administrator reduce the number of devices that receive broadcast traffic?","options":[{"key":"A","text":"Add more switches so that fewer devices are on a particular switch."},{"key":"B","text":"Replace the switches with switches that have more ports per switch. This will allow more devices on a particular switch."},{"key":"C","text":"Segment the LAN into smaller LANs and route between them."},{"key":"D","text":"Replace at least half of the switches with hubs to reduce the size of the broadcast domain."}],"answer":["C"]},{"number":387,"text":"What defines a host route on a Cisco router?","options":[{"key":"A","text":"The link-local address is added automatically to the routing table as an IPv6 host route."},{"key":"B","text":"An IPv4 static host route configuration uses a destination IP address of a specific device and a /32 subnet mask."},{"key":"C","text":"A host route is designated with a C in the routing table."},{"key":"D","text":"A static IPv6 host route must include the interface type and the interface number of the next hop router ."}],"answer":["B"]},{"number":388,"text":"What else is required when configuring an IPv6 static route using a next-hop link-local address?","options":[{"key":"A","text":"administrative distance"},{"key":"B","text":"ip address of the neighbor router"},{"key":"C","text":"network number and subnet mask on the interface of the neighbor router"},{"key":"D","text":"interface number and type"}],"answer":["D"]},{"number":389,"text":"A technician is configuring a wireless network for a small business using a SOHO wireless router . Which two authentication methods are used, if the router is configured with WPA2? (Choose two.)","options":[{"key":"A","text":"personal"},{"key":"B","text":"AES"},{"key":"C","text":"TKIP"},{"key":"D","text":"WEP"},{"key":"E","text":"enterprise"}],"answer":["A","E"]},{"number":390,"text":"Which mitigation technique would prevent rogue servers from providing false IPv6 configuration parameters to clients?","options":[{"key":"A","text":"enabling DHCPv6 Guard"},{"key":"B","text":"enabling RA Guard"},{"key":"C","text":"implementing port security on edge ports"},{"key":"D","text":"disabling CDP on edge ports"}],"answer":["A"]},{"number":391,"text":"A PC has sent an RS message to an IPv6 router attached to the same network. Which two pieces of information will the router send to the client? (Choose two.)","options":[{"key":"A","text":"prefix length"},{"key":"B","text":"subnet mask in dotted decimal notation"},{"key":"C","text":"domain name"},{"key":"D","text":"administrative distance"},{"key":"E","text":"prefix"},{"key":"F","text":"DNS server IP address"}],"answer":["A","E"]},{"number":392,"text":"While attending a conference, participants are using laptops for network connectivity. When a guest speaker attempts to connect to the network, the laptop fails to display any available wireless networks. The access point must be operating in which mode?","options":[{"key":"A","text":"mixed"},{"key":"B","text":"passive"},{"key":"C","text":"active"},{"key":"D","text":"open"}],"answer":["C"]},{"number":393,"text":"Which three components are combined to form a bridge ID?","options":[{"key":"A","text":"extended system ID"},{"key":"B","text":"cost"},{"key":"C","text":"IP address"},{"key":"D","text":"bridge priority"},{"key":"E","text":"MAC address"},{"key":"F","text":"port ID"}],"answer":["A","D","E"]}]}];const $=s=>document.querySelector(s);let setIndex=0,index=0,answers=[],reviewMode=false,studyMode=false,retryMode=false,currentQuestions=[];const rangeActions=$('#rangeActions'),rangeButtons=$('#rangeButtons');let activePart=0;window.selectQuestionPart=function(part){activePart=activePart===part?0:part;loadSet()};const exam=$('#exam');for(let groupName of [...new Set(sets.map(s=>s.group))]){const group=document.createElement('optgroup');group.label=groupName;sets.filter(s=>s.group===groupName).forEach((s)=>{const o=document.createElement('option');o.value=sets.indexOf(s);o.textContent=`${s.title} (${s.questions.length} câu)`;group.append(o)});exam.append(group)}function correctKeys(q){return Array.isArray(q.answer)?q.answer:String(q.answer).split(/[,;\s]+/).filter(Boolean)}function isMulti(q){return correctKeys(q).length>1}function isAnswered(i){const a=answers[i],q=currentQuestions[i];return isMulti(q)?Array.isArray(a)&&a.length>=correctKeys(q).length:a!==null&&a!==undefined}function isCorrect(i){const q=currentQuestions[i],a=answers[i],keys=correctKeys(q);if(isMulti(q))return Array.isArray(a)&&a.length===keys.length&&keys.every(k=>a.includes(k))&&a.every(k=>keys.includes(k));return a===keys[0]}function reviewIndices(){return answers.map((_,i)=>isAnswered(i)?i:-1).filter(i=>i>=0)}function loadSet(){setIndex=+exam.value;index=0;reviewMode=false;retryMode=false;const bank=sets[setIndex],total=bank.questions.length,parts=Math.ceil(total/30);if(activePart>parts)activePart=0;rangeActions.hidden=!total;rangeButtons.innerHTML='';const addPartButton=(part,label)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.classList.toggle('active',activePart===part);b.setAttribute('aria-pressed',String(activePart===part));b.onclick=()=>window.selectQuestionPart(part);rangeButtons.append(b)};addPartButton(0,`Toàn bộ (${total} câu)`);for(let part=1;part<=parts;part++){const start=(part-1)*30,end=Math.min(part*30,total);addPartButton(part,`Phần ${part} (${end-start} câu)`)}currentQuestions=activePart?bank.questions.slice((activePart-1)*30,Math.min(activePart*30,total)):bank.questions.slice();const start=(activePart-1)*30;$('#rangeStatus').textContent=activePart?`Đang làm phần ${activePart} · câu ${start+1}–${start+currentQuestions.length} (${currentQuestions.length} câu)`:`Đang làm toàn bộ đề (${total} câu)`;answers=Array(currentQuestions.length).fill(null);render()}function move(step){const qs=currentQuestions;if(reviewMode){const list=reviewIndices();if(!list.length)return;let pos=list.indexOf(index);if(pos<0)pos=0;pos=Math.max(0,Math.min(list.length-1,pos+step));index=list[pos]}else index=Math.max(0,Math.min(qs.length-1,index+step));render()}function answerDisplay(q){return correctKeys(q).map(k=>k+'. '+(q.options.find(o=>o.key===k)?.text||'')).join(' / ')}function render(){const qs=currentQuestions,q=qs[index],multi=isMulti(q);$('#qcount').textContent=`Câu ${index+1} / ${qs.length}${reviewMode?' • Xem lại':''}`;$('#question').textContent=q.text;$('#options').innerHTML='';$('#questionOptions').innerHTML='';$('#feedback').textContent='';$('#feedback').className='feedback';$('#answerHint').textContent=multi?`(Chọn ${correctKeys(q).length} đáp án)`:'(Chọn một đáp án)';$('#multiHint').textContent=multi?`Câu này có nhiều đáp án đúng. Hãy chọn đủ ${correctKeys(q).length} lựa chọn.`:'';q.options.forEach(o=>{const selected=multi?(Array.isArray(answers[index])&&answers[index].includes(o.key)):answers[index]===o.key;const lab=document.createElement('label');lab.className='opt';if(studyMode&&selected&&isAnswered(index))lab.classList.add(correctKeys(q).includes(o.key)?'correct':'wrong');const input=document.createElement('input');input.type=multi?'checkbox':'radio';input.name=multi?'answer-multi':'answer';input.checked=selected;input.addEventListener('change',()=>choose(o.key));const tx=document.createElement('span');tx.textContent=o.key;lab.append(input,tx);$('#options').append(lab);const qrow=document.createElement('label');qrow.className='qchoice'+(studyMode&&selected&&isAnswered(index)?(correctKeys(q).includes(o.key)?' correct':' wrong'):'');const qinput=document.createElement('input');qinput.type=multi?'checkbox':'radio';qinput.name=multi?'answer-copy-multi':'answer-copy';qinput.checked=selected;qinput.addEventListener('change',()=>choose(o.key));const qt=document.createElement('span');qt.textContent=o.key+'. '+o.text;qrow.append(qinput,qt);$('#questionOptions').append(qrow)});if(isMulti(q)&&Array.isArray(answers[index])&&!isAnswered(index))$('#feedback').textContent=`Đã chọn ${answers[index].length}/${correctKeys(q).length}`;else if(studyMode&&isAnswered(index)){$('#feedback').className='feedback '+(isCorrect(index)?'good':'bad');$('#feedback').textContent=isCorrect(index)?'✓ Chính xác!':'✗ Chưa đúng. Đáp án đúng: '+answerDisplay(q)}$('#status').textContent=isAnswered(index)?'Đã trả lời':'Chưa trả lời';$('#prev').disabled=index===0&&!reviewMode;$('#next').disabled=index===qs.length-1&&!reviewMode;$('#review').disabled=!reviewMode&&!reviewIndices().length;$('#review').textContent=reviewMode?'Thoát xem lại':'Xem lại câu đã làm';$('#questionNav').innerHTML='';qs.forEach((item,i)=>{const b=document.createElement('button'),done=isAnswered(i);b.textContent=i+1;b.className=(done?'done ':'')+(i===index?'current ':'')+(studyMode&&done&&!isCorrect(i)?'wrong':'');b.title=`Câu ${i+1}${done?(studyMode?(isCorrect(i)?' • Đúng':' • Sai'):' • Đã trả lời'):Array.isArray(answers[i])?' • Đang chọn':' • Chưa làm'}`;b.onclick=()=>{index=i;render()};$('#questionNav').append(b)});const done=answers.reduce((n,_,i)=>n+(isAnswered(i)?1:0),0),correct=answers.reduce((n,_,i)=>n+(isAnswered(i)&&isCorrect(i)?1:0),0);$('#bar').style.width=(done/qs.length*100)+'%';$('#progressText').textContent=`${done}/${qs.length}`;$('#score').textContent=studyMode?`Đã làm ${done}/${qs.length} • Đúng ${correct}`:`Đã trả lời ${done}/${qs.length}`;$('#finish').textContent=studyMode?'Kết thúc xem lại':'Kết thúc bài'}function choose(key){const q=currentQuestions[index],multi=isMulti(q);if(multi){let picked=Array.isArray(answers[index])?[...answers[index]]:[];picked=picked.includes(key)?picked.filter(k=>k!==key):[...picked,key];answers[index]=picked;if(studyMode){if(isAnswered(index)&&isCorrect(index)&&index<currentQuestions.length-1)index++;render();return}if(!isAnswered(index)){render();return}if(index<currentQuestions.length-1)index++;render();return}answers[index]=key;if(studyMode){if(isCorrect(index)&&index<currentQuestions.length-1)index++;render();return}if(index<currentQuestions.length-1)index++;render()}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#leftArrow').onclick=()=>move(-1);$('#rightArrow').onclick=()=>move(1);$('#review').onclick=()=>{if(reviewMode)reviewMode=false;else{const list=reviewIndices();if(!list.length)return;reviewMode=true;index=list[0]}render()};$('#reveal').onclick=()=>{const q=currentQuestions[index];$('#feedback').className='feedback good';$('#feedback').textContent='Đáp án: '+answerDisplay(q)};exam.onchange=()=>{activePart=0;loadSet()};$('#mode').onchange=()=>{studyMode=$('#mode').value==='study';loadSet()};$('#finish').onclick=()=>{const qs=currentQuestions,done=answers.reduce((n,_,i)=>n+(isAnswered(i)?1:0),0),correctIndices=answers.map((_,i)=>isAnswered(i)&&isCorrect(i)?i:-1).filter(i=>i>=0),wrongIndices=answers.map((_,i)=>isAnswered(i)&&!isCorrect(i)?i:-1).filter(i=>i>=0),correct=correctIndices.length;$('#summaryTitle').textContent=retryMode?'Kết quả làm lại câu sai':studyMode?'Hoàn thành phiên học':'Kết quả luyện đề';$('#summaryText').textContent=sets[setIndex].title;$('#summaryDone').textContent=`${done}/${qs.length}`;$('#summaryCorrect').textContent=correct;$('#summaryWrong').textContent=wrongIndices.length;$('#summaryUnanswered').textContent=qs.length-done;$('#summaryWrongList').innerHTML=wrongIndices.length?'<b>Câu sai:</b> '+wrongIndices.map(i=>`<span class="wrong-number">${i+1}</span>`).join(' '):'<b>Câu sai:</b> Không có';$('#retryWrong').hidden=studyMode||wrongIndices.length===0;$('#retryWrong').textContent=`Làm lại câu sai (${wrongIndices.length})`;$('#summary').classList.add('show')};$('#closeSummary').onclick=()=>$('#summary').classList.remove('show');$('#retryWrong').onclick=()=>{const wrong=currentQuestions.filter((_,i)=>isAnswered(i)&&!isCorrect(i));if(!wrong.length)return;currentQuestions=wrong;answers=Array(currentQuestions.length).fill(null);index=0;reviewMode=false;retryMode=true;$('#summary').classList.remove('show');render()};$('#restart').onclick=()=>{$('#summary').classList.remove('show');loadSet()};loadSet();window.addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const a=document.activeElement;if(a&&(a.tagName==='SELECT'||a.tagName==='TEXTAREA'||a.isContentEditable||(a.tagName==='INPUT'&&!['radio','checkbox'].includes(a.type))))return;e.preventDefault();const step=e.key==='ArrowLeft'?-1:1;if(typeof move==='function'){move(step)}else{const qs=currentQuestions,next=Math.max(0,Math.min(qs.length-1,index+step));if(next!==index){index=next;render()}}});
