ey":"A","text":"Ensure that the wireless SSID is chosen."},{"key":"B","text":"Ensure that the correct network media is selected."},{"key":"C","text":"Ensure that the NIC is configured for the proper frequency."},{"key":"D","text":"Ensure that the laptop antenna is attached."},{"key":"E","text":"Ensure that the wireless NIC is enabled."}],"answer":["A","E"]},{"number":22,"text":"Which FHRP allows load balancing between a group of redundant routers?","options":[{"key":"A","text":"HSRP"},{"key":"B","text":"GLBP"},{"key":"C","text":"VRRP"},{"key":"D","text":"IRDP"}],"answer":["B"]},{"number":23,"text":"Which port state will switch ports immediately transition to when configured for PortFast?","options":[{"key":"A","text":"forwarding"},{"key":"B","text":"blocking"},{"key":"C","text":"listening"},{"key":"D","text":"learning"}],"answer":["A"]},{"number":24,"text":"Which address does a DHCPv4 server target when sending a DHCPOFFER message to a client that makes an address request?","options":[{"key":"A","text":"client hardware address"},{"key":"B","text":"client IP address"},{"key":"C","text":"broadcast MAC address"},{"key":"D","text":"gateway IP address"}],"answer":["A"]},{"number":25,"text":"Which protocol could be used by a company to monitor devices such as a wireless LAN controller (WLC)?","options":[{"key":"A","text":"SSH"},{"key":"B","text":"NTP"},{"key":"C","text":"PAT"},{"key":"D","text":"SNMP"}],"answer":["D"]},{"number":26,"text":"Which feature of 802.11n wireless access points allows them to transmit data at faster speeds than previous versions of 802.11 Wi-Fi standards did?","options":[{"key":"A","text":"SPS"},{"key":"B","text":"WPS"},{"key":"C","text":"MITM"},{"key":"D","text":"MIMO"}],"answer":["D"]},{"number":27,"text":"Which two statements are correct? (Choose two.)","options":[{"key":"A","text":"Half duplex has only one channel."},{"key":"B","text":"Full duplex increases the effective bandwidth."},{"key":"C","text":"Full duplex allows both ends to transmit and receive simultaneously."},{"key":"D","text":"Full duplex offers 100 percent potential use of the bandwidth."},{"key":"E","text":"All modern NICS support both half-duplex and full-duplex communication"}],"answer":["B","C"]},{"number":28,"text":"Which three IOS troubleshooting commands can help to isolate problems with a static route? (Choose three.)","options":[{"key":"A","text":"show version"},{"key":"B","text":"show arp"},{"key":"C","text":"show ip interface brief"},{"key":"D","text":"show ip route"},{"key":"E","text":"ping"}],"answer":["C","D","E"]},{"number":29,"text":"In which memory location are the VLAN configurations of normal range VLANs stored on a Catalyst switch?","options":[{"key":"A","text":"ROM"},{"key":"B","text":"flash"},{"key":"C","text":"NVRAM"},{"key":"D","text":"RAM"}],"answer":["B"]},{"number":30,"text":"Which frequency band SSID name should users with time-sensitive applications connect to?","options":[{"key":"A","text":"The 2.4 GHz band, because it is less crowded than the 5 GHz band."},{"key":"B","text":"The 2.4 GHz band, because it has more channels than the 5 GHz band."},{"key":"C","text":"The 2.4 GHz band, because the channel is likely interference-free."},{"key":"D","text":"The 5 GHz band, because it has more channels than the 2.4 GHz band."}],"answer":["D"]},{"number":31,"text":"Which IEEE 802.11 standard operates in both the 2.4 GHz and 5 GHz frequency bands?","options":[{"key":"A","text":"802.11a"},{"key":"B","text":"802.11b"},{"key":"C","text":"802.11g"},{"key":"D","text":"802.11n"}],"answer":["D"]},{"number":32,"text":"If more than one DHCP server is available on the local network, in which order will DHCP messages be sent between a host and a DHCP server?","options":[{"key":"A","text":"acknowledgment, request, offer, discover"},{"key":"B","text":"request, discover, offer, acknowledgment"},{"key":"C","text":"discover, offer, request, acknowledgment"},{"key":"D","text":"request, acknowledgment, discover, offer"}],"answer":["C"]},{"number":33,"text":"Which command should be configured on a router interface to set the router as a stateful DHCPv6 client?","options":[{"key":"A","text":"ipv6 address dhcp"},{"key":"B","text":"ipv6 address autoconfigure"},{"key":"C","text":"ipv6 enable"},{"key":"D","text":"ipv6 dhcp server stateful"}],"answer":["A"]},{"number":34,"text":"What is a recommended best practice when dealing with the native VLAN?","options":[{"key":"A","text":"Use port security."},{"key":"B","text":"Turn off DTP."},{"key":"C","text":"Assign it to an unused VLAN."},{"key":"D","text":"Assign the same VLAN number as the management VLAN."}],"answer":["C"]},{"number":35,"text":"Why would a floating static route be configured with an administrative distance that is higher than the administrative distance of a dynamic routing protocol that is running on the same router?","options":[{"key":"A","text":"to be used as a backup route"},{"key":"B","text":"to load-balance the traffic"},{"key":"C","text":"to act as a gateway of last resort"},{"key":"D","text":"to be the priority route in the routing table"}],"answer":["A"]},{"number":36,"text":"Which type of address does a switch use to build the MAC address table?","options":[{"key":"A","text":"source IP address"},{"key":"B","text":"source MAC address"},{"key":"C","text":"destination MAC address"},{"key":"D","text":"destination IP address"}],"answer":["B"]},{"number":37,"text":"In a network where the DHCP server is on a different subnet than the client, which configuration allows the router to relay DHCP requests to the DHCP server?","options":[{"key":"A","text":"ip dhcp helper-address"},{"key":"B","text":"ip helper-address"},{"key":"C","text":"ip dhcp relay-address"},{"key":"D","text":"ip relay-helper-address"}],"answer":["B"]},{"number":38,"text":"What is accomplished by the ip dhcp excluded-address 10.10.4.1 10.10.4.5 command?","options":[{"key":"A","text":"The DHCP server will ignore all traffic from clients with IPv4 addresses 10.10.4.1 to 10.10.4.5."},{"key":"B","text":"The DHCP server will not issue IPv4 addresses ranging from 10.10.4.1 to 10.10.4.5."},{"key":"C","text":"Traffic destined for 10.10.4.1 to 10.10.4.5 will be denied."},{"key":"D","text":"Traffic from clients with IPv4 addresses 10.10.4.1 to 10.10.4.5 will be denied."}],"answer":["B"]},{"number":39,"text":"True or False? In the 802.1X standard, the client attempting to access the network is referred to as the supplicant.","options":[{"key":"A","text":"false"},{"key":"B","text":"true"}],"answer":["B"]},{"number":40,"text":"Which tasks can be accomplished by using the command history feature? (Choose two.)","options":[{"key":"A","text":"View a list of commands entered in a previous session."},{"key":"B","text":"Recall up to 15 command lines by default."},{"key":"C","text":"Set the command history buffer size."},{"key":"D","text":"Recall previously entered commands."},{"key":"E","text":"Save command lines in a log file for future reference."}],"answer":["C","D"]},{"number":41,"text":"What is the purpose of setting the native VLAN separate from data VLANs?","options":[{"key":"A","text":"A separate VLAN should be used to carry uncommon untagged frames to avoid bandwidth contention on data VLANS."},{"key":"B","text":"The security of management frames that are carried in the native VLAN can be enhanced."},{"key":"C","text":"The native VLAN is for carrying VLAN management traffic only."},{"key":"D","text":"The native VLAN is for routers and switches to exchange their management information, so it should be different from data VLANS."}],"answer":["B"]},{"number":42,"text":"What does the letter C mean next to an entry in the output of the show ip route command?","options":[{"key":"A","text":"It identifies a network that is learned through EIGRP"},{"key":"B","text":"It identifies a network that is directly connected to the router."},{"key":"C","text":"It identifies a network that is learned through OSPF."},{"key":"D","text":"It identifies a network that is a static route."}],"answer":["B"]},{"number":43,"text":"Which two statements describe a switch port that is configured with PortFast? (Choose two.)","options":[{"key":"A","text":"The switch port immediately transitions from the listening to the forwarding state."},{"key":"B","text":"The switch port immediately transitions from blocking to the forwarding state."},{"key":"C","text":"The switch port sends DHCP requests before transitioning to the forwarding state"},{"key":"D","text":"The switch port immediately processes any BPDUs before transitioning to the forwarding state."},{"key":"E","text":"The switch port should never receive BPDUs."}],"answer":["B","E"]},{"number":44,"text":"Which Layer 2 attack will result in legitimate users not getting valid IP addresses?","options":[{"key":"A","text":"ARP spoofing"},{"key":"B","text":"DHCP starvation"},{"key":"C","text":"IP address spoofing"},{"key":"D","text":"MAC address flooding"}],"answer":["B"]},{"number":45,"text":"Which command will provide information about the status of all interfaces including the number of giants, runts, and collisions on the interface?","options":[{"key":"A","text":"show interfaces"},{"key":"B","text":"show ip interface brief"},{"key":"C","text":"show history"},{"key":"D","text":"show running-config"}],"answer":["A"]},{"number":46,"text":"Which AAA component is responsible for controlling who is permitted to access the network?","options":[{"key":"A","text":"Authentication"},{"key":"B","text":"Authorization"},{"key":"C","text":"Accounting"},{"key":"D","text":"All of other choices"}],"answer":["A"]},{"number":47,"text":"Where are dynamically learned MAC addresses stored when sticky learning is enabled with the switchport port-security mac-address sticky command?","options":[{"key":"A","text":"flash"},{"key":"B","text":"NVRAM"},{"key":"C","text":"RAM"},{"key":"D","text":"ROM"}],"answer":["C"]},{"number":48,"text":"A network administrator is entering the command ipv6 unicast-routing to start configuring DHCPv6 operation on a router. Which statement describes the function of this command?","options":[{"key":"A","text":"It is required for enabling DNS service in DHCPv6 configurations."},{"key":"B","text":"It is required for sending ICMPv6 RA messages."},{"key":"C","text":"It is required to configure stateless DHCPv6 server on the router."},{"key":"D","text":"It is required to configure stateful DHCPv6 server on the router."}],"answer":["B"]},{"number":49,"text":"When a router learns that multiple paths are available to a destination network from the same routing protocol, which factor is considered by a router to choose the best path to forward a packet?","options":[{"key":"A","text":"the reliability value of the neighboring routers"},{"key":"B","text":"the fastest bandwidth of exiting interfaces"},{"key":"C","text":"the lowest metric"},{"key":"D","text":"the order of paths on the routing table"}],"answer":["C"]},{"number":50,"text":"What is one way to correct a spanning tree failure?","options":[{"key":"A","text":"Replace the cables on failed STP links."},{"key":"B","text":"Manually remove redundant links in the switched network."},{"key":"C","text":"Insert redundant links to replace the failed STP links."},{"key":"D","text":"Replace all instances of STP with RSTP."}],"answer":["B"]}]},{"id":"NWC303_COMBINED","title":"IT Exam + 6 đề • 692 câu","group":"Gộp tổng hợp","questions":[{"number":1,"text":"[IT Exam · Q1] What is the first action in the boot sequence when a switch is powered on?","options":[{"key":"A","text":"load the default Cisco IOS software"},{"key":"B","text":"load boot loader software"},{"key":"C","text":"low-level CPU initialization"},{"key":"D","text":"load a power-on self-test program"}],"answer":["D"]},{"number":2,"text":"[IT Exam · Q2] What must an administrator have in order to reset a lost password on a router?","options":[{"key":"A","text":"a TFTP server"},{"key":"B","text":"a crossover cable"},{"key":"C","text":"access to another router"},{"key":"D","text":"physical access to the router"}],"answer":["D"]},{"number":3,"text":"[IT Exam · Q3] When configuring a switch for SSH access, what other command that is associated with the login local command is required to be entered on the switch?","options":[{"key":"A","text":"enable secret password"},{"key":"B","text":"password password"},{"key":"C","text":"username username secret secret"},{"key":"D","text":"login block-for seconds attempts number within*seconds*"}],"answer":["C"]},{"number":4,"text":"[IT Exam · Q4] Which command displays information about the auto-MDIX setting for a specific interface?","options":[{"key":"A","text":"show interfaces"},{"key":"B","text":"show controllers"},{"key":"C","text":"show processes"},{"key":"D","text":"show running-config"}],"answer":["B"]},{"number":5,"text":"[IT Exam · Q5] If one end of an Ethernet connection is configured for full duplex and the other end of the connection is configured for half duplex, where would late collisions be observed?","options":[{"key":"A","text":"on both ends of the connection"},{"key":"B","text":"on the full-duplex end of the connection"},{"key":"C","text":"only on serial interfaces"},{"key":"D","text":"on the half-duplex end of the connection"}],"answer":["D"]},{"number":6,"text":"[IT Exam · Q6] Which command is used to set the BOOT environment variable that defines where to find the IOS image file on a switch?","options":[{"key":"A","text":"config-register"},{"key":"B","text":"boot system"},{"key":"C","text":"boot loader"},{"key":"D","text":"confreg"}],"answer":["B"]},{"number":7,"text":"[IT Exam · Q7] What does a switch use to locate and load the IOS image?","options":[{"key":"A","text":"BOOT environment variable"},{"key":"B","text":"IOS image file"},{"key":"C","text":"POST"},{"key":"D","text":"startup-config"},{"key":"E","text":"NVRAM"}],"answer":["A"]},{"number":8,"text":"[IT Exam · Q8] Which protocol adds security to remote connections?","options":[{"key":"A","text":"FTP"},{"key":"B","text":"HTTP"},{"key":"C","text":"NetBEUI"},{"key":"D","text":"POP"},{"key":"E","text":"SSH"}],"answer":["E"]},{"number":9,"text":"[IT Exam · Q9] What is a characteristic of an IPv4 loopback interface on a Cisco IOS router?","options":[{"key":"A","text":"The no shutdown command is required to place this interface in an UP state."},{"key":"B","text":"It is a logical interface internal to the router ."},{"key":"C","text":"Only one loopback interface can be enabled on a router ."},{"key":"D","text":"It is assigned to a physical port and can be connected to other devices."}],"answer":["B"]},{"number":10,"text":"[IT Exam · Q10] What is the minimum Ethernet frame size that will not be discarded by the receiver as a runt frame?","options":[{"key":"A","text":"64 bytes"},{"key":"B","text":"512 bytes"},{"key":"C","text":"1024 bytes"},{"key":"D","text":"1500 bytes"}],"answer":["A"]},{"number":11,"text":"[IT Exam · Q11] After which step of the switch bootup sequence is the boot loader executed?","options":[{"key":"A","text":"after CPU initialization"},{"key":"B","text":"after IOS localization"},{"key":"C","text":"after flash file system initialization"},{"key":"D","text":"after POST execution"}],"answer":["D"]},{"number":12,"text":"[IT Exam · Q12] Which impact does adding a Layer 2 switch have on a network?","options":[{"key":"A","text":"an increase in the number of dropped frames"},{"key":"B","text":"an increase in the size of the broadcast domain"},{"key":"C","text":"an increase in the number of network collisions"},{"key":"D","text":"an increase in the size of the collision domain"}],"answer":["B"]},{"number":13,"text":"[IT Exam · Q13] Which characteristic describes cut-through switching?","options":[{"key":"A","text":"Error-free fragments are forwarded, so switching occurs with lower latency."},{"key":"B","text":"Frames are forwarded without any error checking."},{"key":"C","text":"Only outgoing frames are checked for errors."},{"key":"D","text":"Buffering is used to support different Ethernet speeds."}],"answer":["B"]},{"number":14,"text":"[IT Exam · Q14] What is the significant difference between a hub and a Layer 2 LAN switch?","options":[{"key":"A","text":"A hub extends a collision domain, and a switch divides collision domains."},{"key":"B","text":"A hub divides collision domains, and a switch divides broadcast domains."},{"key":"C","text":"Each port of a hub is a collision domain, and each port of a switch is a broadcast domain."},{"key":"D","text":"A hub forwards frames, and a switch forwards only packets."}],"answer":["A"]},{"number":15,"text":"[IT Exam · Q15] Which statement is correct about Ethernet switch frame forwarding decisions?","options":[{"key":"A","text":"Frame forwarding decisions are based on MAC address and port mappings in the CAM table."},{"key":"B","text":"Cut-through frame forwarding ensures that invalid frames are always dropped."},{"key":"C","text":"Only frames with a broadcast destination address are forwarded out all active switch ports."},{"key":"D","text":"Unicast frames are always forwarded regardless of the destination MAC address."}],"answer":["A"]},{"number":16,"text":"[IT Exam · Q16] How do switch buffers affect network performance?","options":[{"key":"A","text":"They provide error checking on the data received."},{"key":"B","text":"They store frames received, thus preventing premature frame discarding when network congestion occurs."},{"key":"C","text":"They provide extra memory for a particular port if autonegotiation of speed or duplex fails."},{"key":"D","text":"They hold data temporarily when a collision occurs until normal data transmission resumes."}],"answer":["B"]},{"number":17,"text":"[IT Exam · Q17] Which switch characteristic helps keep traffic local and alleviates network congestion?","options":[{"key":"A","text":"high port density"},{"key":"B","text":"fast port speed"},{"key":"C","text":"large frame buffers"},{"key":"D","text":"fast internal switching"}],"answer":["A"]},{"number":18,"text":"[IT Exam · Q18] Which switch component reduces the amount of packet handling time inside the switch?","options":[{"key":"A","text":"ASIC"},{"key":"B","text":"dual processors"},{"key":"C","text":"large buffer size"},{"key":"D","text":"store-and-forward RAM"}],"answer":["A"]},{"number":19,"text":"[IT Exam · Q19] What information is added to the switch table from incoming frames?","options":[{"key":"A","text":"source MAC address and incoming port number"},{"key":"B","text":"destination MAC address and incoming port number"},{"key":"C","text":"source IP address and incoming port number"},{"key":"D","text":"destination IP address and incoming port number"}],"answer":["A"]},{"number":20,"text":"[IT Exam · Q20] Which switching method ensures that the incoming frame is error-free before forwarding?","options":[{"key":"A","text":"cut-through"},{"key":"B","text":"FCS"},{"key":"C","text":"fragment free"},{"key":"D","text":"store-and-forward"}],"answer":["D"]},{"number":21,"text":"[IT Exam · Q21] Under which two occasions should an administrator disable DTP while managing a local area network? (Choose two.)","options":[{"key":"A","text":"when connecting a Cisco switch to a non-Cisco switch"},{"key":"B","text":"when a neighbor switch uses a DTP mode of dynamic auto"},{"key":"C","text":"when a neighbor switch uses a DTP mode of dynamic desirable"},{"key":"D","text":"on links that should not be trunking"},{"key":"E","text":"on links that should dynamically attempt trunking"}],"answer":["A","D"]},{"number":22,"text":"[IT Exam · Q22] Which two characteristics describe the native VLAN? (Choose two.)","options":[{"key":"A","text":"Designed to carry traffic that is generated by users, this type of VLAN is also known as the default VLAN."},{"key":"B","text":"The native VLAN traffic will be untagged across the trunk link."},{"key":"C","text":"This VLAN is necessary for remote management of a switch."},{"key":"D","text":"High priority traffic, such as voice traffic, uses the native VLAN."},{"key":"E","text":"The native VLAN provides a common identifier to both ends of a trunk."}],"answer":["B","E"]},{"number":23,"text":"[IT Exam · Q23] On a switch that is configured with multiple VLANs, which command will remove only VLAN 100 from the switch?","options":[{"key":"A","text":"Switch# delete flash:vlan.dat"},{"key":"B","text":"Switch(config-if)# no switchport access vlan 100"},{"key":"C","text":"Switch(config-if)# no switchport trunk allowed vlan 100"},{"key":"D","text":"Switch(config)# no vlan 100"}],"answer":["D"]},{"number":24,"text":"[IT Exam · Q24] A network contains multiple VLANs spanning multiple switches. What happens when a device in VLAN 20 sends a broadcast Ethernet frame?","options":[{"key":"A","text":"All devices in all VLANs see the frame."},{"key":"B","text":"Devices in VLAN 20 and the management VLAN see the frame."},{"key":"C","text":"Only devices in VLAN 20 see the frame."},{"key":"D","text":"Only devices that are connected to the local switch see the frame."}],"answer":["C"]},{"number":25,"text":"[IT Exam · Q25] What happens to switch ports after the VLAN to which they are assigned is deleted?","options":[{"key":"A","text":"The ports are disabled."},{"key":"B","text":"The ports are placed in trunk mode."},{"key":"C","text":"The ports are assigned to VLAN1, the default VLAN."},{"key":"D","text":"The ports stop communicating with the attached devices."}],"answer":["D"]},{"number":26,"text":"[IT Exam · Q26] Port Fa0/11 on a switch is assigned to VLAN 30. If the command no switchport access vlan 30 is entered on the Fa0/11 interface, what will happen?","options":[{"key":"A","text":"Port Fa0/11 will be shutdown."},{"key":"B","text":"An error message would be displayed."},{"key":"C","text":"Port Fa0/11 will be returned to VLAN 1."},{"key":"D","text":"VLAN 30 will be deleted."}],"answer":["C"]},{"number":27,"text":"[IT Exam · Q27] Which command displays the encapsulation type, the voice VLAN ID, and the access mode VLAN for the Fa0/1 interface?","options":[{"key":"A","text":"show vlan brief"},{"key":"B","text":"show interfaces Fa0/1 switchport"},{"key":"C","text":"show mac address-table interface Fa0/1"},{"key":"D","text":"show interfaces trunk"}],"answer":["B"]},{"number":28,"text":"[IT Exam · Q28] Refer to the exhibit. A technician is programming switch SW3 to manage voice and data traffic through port Fa0/20. What, if anything, is wrong with the configuration? [EXHIBIT IN SOURCE PDF: consult original page for diagram.]","options":[{"key":"A","text":"There is nothing wrong with the configuration."},{"key":"B","text":"Interface Fa0/20 can only have one VLAN assigned."},{"key":"C","text":"The mls qos trust cos command should reference VLAN 35."},{"key":"D","text":"The command used to assign the voice VLAN to the switch port is incorrect."}],"answer":["D"]},{"number":29,"text":"[IT Exam · Q29] Which four steps are needed to configure a voice VLAN on a switch port? (Choose four).","options":[{"key":"A","text":"Configure the interface as an IEEE 802.1Q trunk."},{"key":"B","text":"Assign the voice VLAN to the switch port."},{"key":"C","text":"Activate spanning-tree PortFast on the interface."},{"key":"D","text":"Ensure that voice traffic is trusted and tagged with a CoS priority value."},{"key":"E","text":"Add a voice VLAN."},{"key":"F","text":"Configure the switch port interface with subinterfaces."},{"key":"G","text":"Assign a data VLAN to the switch port."},{"key":"H","text":"Configure the switch port in access mode."}],"answer":["B","D","E","H"]},{"number":30,"text":"[IT Exam · Q30] A high school uses VLAN15 for the laboratory network and VLAN30 for the faculty network. What is required to enable communication between these two VLANs while using the router-on-a-stick approach?","options":[{"key":"A","text":"A multilayer switch is needed."},{"key":"B","text":"A router with at least two LAN interfaces is needed."},{"key":"C","text":"Two groups of switches are needed, each with ports that are configured for one VLAN."},{"key":"D","text":"A switch with a port that is configured as a trunk is needed when connecting to the router ."}],"answer":["D"]},{"number":31,"text":"[IT Exam · Q31] When routing a large number of VLANs, what are two disadvantages of using the router-on-a-stick inter-VLAN routing method rather than the multilayer switch inter-VLAN routing method? (Choose two.)","options":[{"key":"A","text":"Multiple SVIs are needed."},{"key":"B","text":"A dedicated router is required."},{"key":"C","text":"Router-on-a-stick requires subinterfaces to be configured on the same subnets."},{"key":"D","text":"Router-on-a-stick requires multiple physical interfaces on a router ."},{"key":"E","text":"Multiple subinterfaces may impact the traffic flow speed."}],"answer":["B","E"]},{"number":32,"text":"[IT Exam · Q32] What is a characteristic of a routed port on a Layer 3 switch?","options":[{"key":"A","text":"It supports trunking."},{"key":"B","text":"It is not assigned to a VLAN."},{"key":"C","text":"It is commonly used as a WAN link."},{"key":"D","text":"It cannot have an IP address assigned to it."}],"answer":["B"]},{"number":33,"text":"[IT Exam · Q33] A technician is configuring a new Cisco 2960 switch. What is the effect of issuing the BranchSw(config-if)# mdix auto command?","options":[{"key":"A","text":"It automatically adjusts the port to allow device connections to use either a straight-through or a crossover cable."},{"key":"B","text":"It applies an IPv4 address to the virtual interface."},{"key":"C","text":"It applies an IPv6 address to the virtual interface."},{"key":"D","text":"It permits an IPv6 address to be configured on a switch physical interface."},{"key":"E","text":"It updates the MAC address table for the associated port."}],"answer":["A"]},{"number":34,"text":"[IT Exam · Q34] A technician is configuring a new Cisco 2960 switch. What is the effect of issuing the BranchSw(config-if)# ip address 172.18.33.88 255.255.255.0 command?","options":[{"key":"A","text":"It applies an IPv4 address to the virtual interface."},{"key":"B","text":"It applies an IPv6 address to the virtual interface."},{"key":"C","text":"It activates a virtual or physical switch interface."},{"key":"D","text":"It permits an IPv6 address to be configured on a switch physical interface."},{"key":"E","text":"It updates the MAC address table for the associated port."}],"answer":null},{"number":35,"text":"[IT Exam · Q35] A technician is configuring a new Cisco 2960 switch. What is the effect of issuing the BranchSw# configure terminal command?","options":[{"key":"A","text":"It enters the global configuration mode."},{"key":"B","text":"It enters configuration mode for a switch virtual interface."},{"key":"C","text":"It applies an IPv4 address to the virtual interface."},{"key":"D","text":"It updates the MAC address table for the associated port."},{"key":"E","text":"It permits an IPv6 address to be configured on a switch physical interface."}],"answer":["A"]},{"number":36,"text":"[IT Exam · Q36] A technician is configuring a new Cisco 2960 switch. What is the effect of issuing the BranchSw(config-if)# shutdown command?","options":[{"key":"A","text":"It disables a virtual or physical switch interface."},{"key":"B","text":"It saves the running configuration to NVRAM."},{"key":"C","text":"It activates a virtual or physical switch interface."},{"key":"D","text":"It updates the MAC address table for the associated port."},{"key":"E","text":"It saves the startup configuration to the running configuration."}],"answer":["A"]},{"number":37,"text":"[IT Exam · Q37] A technician is configuring a new Cisco 2960 switch. What is the effect of issuing the Branch- Sw(config-if)# ipv6 address 2001:db8:a2b4:88::1/64 command?","options":[{"key":"A","text":"It applies an IPv6 address to the virtual interface."},{"key":"B","text":"It activates a virtual or physical switch interface."},{"key":"C","text":"It applies an IPv4 address to the virtual interface."},{"key":"D","text":"It permits an IPv6 address to be configured on a switch physical interface."},{"key":"E","text":"It updates the MAC address table for the associated port."}],"answer":["A"]},{"number":38,"text":"[IT Exam · Q38] A technician is configuring a new Cisco 2960 switch. What is the effect of issuing the BranchSw(config-if)# exit command?","options":[{"key":"A","text":"It returns to global configuration mode."},{"key":"B","text":"It returns to privileged mode."},{"key":"C","text":"It configures the default gateway for the switch."},{"key":"D","text":"It enters user mode."},{"key":"E","text":"It saves the startup configuration to the running configuration."}],"answer":null},{"number":39,"text":"[IT Exam · Q39] A technician is configuring a new Cisco 2960 switch. What is the effect of issuing the BranchSw> enable command?","options":[{"key":"A","text":"It enters privileged mode."},{"key":"B","text":"It enters the global configuration mode."},{"key":"C","text":"It enters configuration mode for a switch virtual interface."},{"key":"D","text":"It updates the MAC address table for the associated port."},{"key":"E","text":"It permits an IPv6 address to be configured on a switch physical interface."}],"answer":["A"]},{"number":40,"text":"[IT Exam · Q40] A technician is configuring a new Cisco 2960 switch. What is the effect of issuing the BranchSw(con- fig-if)# duplex full command?","options":[{"key":"A","text":"It allows data to flow in both directions at the same time on the interface."},{"key":"B","text":"It allows data to flow in only one direction at a time on the interface"},{"key":"C","text":"It automatically adjusts the port to allow device connections to use either a straight-through or a crossover cable."},{"key":"D","text":"It configures the switch as the default gateway."},{"key":"E","text":"It encrypts user-mode passwords when users connect remotely."}],"answer":["A"]},{"number":41,"text":"[IT Exam · Q41] What type of VLAN should not carry voice and network management traffic?","options":[{"key":"A","text":"data VLAN"},{"key":"B","text":"voice VLAN"},{"key":"C","text":"management VLAN"},{"key":"D","text":"security VLAN"}],"answer":["A"]},{"number":42,"text":"[IT Exam · Q42] What type of VLAN is designed to reserve bandwidth to ensure IP Phone quality?","options":[{"key":"A","text":"voice VLAN"},{"key":"B","text":"trunk VLAN"},{"key":"C","text":"security VLAN"},{"key":"D","text":"management VLAN"}],"answer":["A"]},{"number":43,"text":"[IT Exam · Q43] What type of VLAN is initially the management VLAN?","options":[{"key":"A","text":"default VLAN"},{"key":"B","text":"native VLAN"},{"key":"C","text":"data VLAN"},{"key":"D","text":"management VLAN"}],"answer":["A"]},{"number":44,"text":"[IT Exam · Q44] What type of VLAN is designed to have a delay of less than 150 ms across the network?","options":[{"key":"A","text":"voice VLAN"},{"key":"B","text":"desirable VLAN"},{"key":"C","text":"trunk VLAN"},{"key":"D","text":"security VLAN"}],"answer":["A"]},{"number":45,"text":"[IT Exam · Q45] What type of VLAN is used to separate the network into groups of users or devices?","options":[{"key":"A","text":"data VLAN"},{"key":"B","text":"management VLAN"},{"key":"C","text":"voice VLAN"},{"key":"D","text":"native VLAN"}],"answer":["A"]},{"number":46,"text":"[IT Exam · Q46] What type of VLAN supports untagged traffic?","options":[{"key":"A","text":"native VLAN"},{"key":"B","text":"voice VLAN"},{"key":"C","text":"security VLAN"},{"key":"D","text":"management VLAN"}],"answer":["A"]},{"number":47,"text":"[IT Exam · Q47] Which solution would help a college alleviate network congestion due to collisions?","options":[{"key":"A","text":"a firewall that connects to two Internet providers"},{"key":"B","text":"a high port density switch"},{"key":"C","text":"a router with two Ethernet ports"},{"key":"D","text":"a router with three Ethernet ports"}],"answer":["B"]},{"number":48,"text":"[IT Exam · Q48] Which two statements are correct with respect to SVI inter-VLAN routing? (Choose two.)","options":[{"key":"A","text":"Switching packets is faster with SVI."},{"key":"B","text":"There is no need for a connection to a router ."},{"key":"C","text":"Virtual interfaces support subinterfaces."},{"key":"D","text":"SVIs can be bundled into EtherChannels."},{"key":"E","text":"SVIs eliminate the need for a default gateway in the hosts."}],"answer":["A","B"]},{"number":49,"text":"[IT Exam · Q49] Which type of VLAN is used to designate which traffic is untagged when crossing a trunk port?","options":[{"key":"A","text":"data"},{"key":"B","text":"default"},{"key":"C","text":"native"},{"key":"D","text":"management"}],"answer":["C"]},{"number":50,"text":"[IT Exam · Q50] A network administrator issues the show vlan brief command while troubleshooting a user support ticket. What output will be displayed?","options":[{"key":"A","text":"the VLAN assignment and membership for device MAC addresses"},{"key":"B","text":"the VLAN assignment and membership for all switch ports"},{"key":"C","text":"the VLAN assignment and trunking encapsulation"},{"key":"D","text":"the VLAN assignment and native VLAN"}],"answer":["B"]},{"number":51,"text":"[IT Exam · Q51] What type of VLAN is configured specifically for network traffic such as SSH, Telnet, HTTPS, HHTP , and SNMP?","options":[{"key":"A","text":"voice VLAN"},{"key":"B","text":"management VLAN"},{"key":"C","text":"native VLAN"},{"key":"D","text":"security VLAN"}],"answer":["B"]},{"number":52,"text":"[IT Exam · Q52] What additional information is contained in the 12-bit extended system ID of a BPDU?","options":[{"key":"A","text":"MAC address"},{"key":"B","text":"VLAN ID"},{"key":"C","text":"IP address"},{"key":"D","text":"port ID"}],"answer":["B"]},{"number":53,"text":"[IT Exam · Q53] During the implementation of Spanning Tree Protocol, all switches are rebooted by the network administrator . What is the first step of the spanning-tree election process?","options":[{"key":"A","text":"Each switch with a lower root ID than its neighbor will not send BPDUs."},{"key":"B","text":"All the switches send out BPDUs advertising themselves as the root bridge."},{"key":"C","text":"Each switch determines the best path to forward traffic."},{"key":"D","text":"Each switch determines what port to block to prevent a loop from occurring."}],"answer":["B"]},{"number":54,"text":"[IT Exam · Q54] Which STP port role is adopted by a switch port if there is no other port with a lower cost to the root bridge?","options":[{"key":"A","text":"designated port"},{"key":"B","text":"root port"},{"key":"C","text":"alternate"},{"key":"D","text":"disabled port"}],"answer":["B"]},{"number":55,"text":"[IT Exam · Q55] Which two concepts relate to a switch port that is intended to have only end devices attached and intended never to be used to connect to another switch? (Choose two.)","options":[{"key":"A","text":"bridge ID"},{"key":"B","text":"edge port"},{"key":"C","text":"extended system ID"},{"key":"D","text":"PortFast"},{"key":"E","text":"PVST+"}],"answer":["B","D"]},{"number":56,"text":"[IT Exam · Q56] Which three components are combined to form a bridge ID?","options":[{"key":"A","text":"extended system ID"},{"key":"B","text":"cost"},{"key":"C","text":"IP address"},{"key":"D","text":"bridge priority"},{"key":"E","text":"MAC address"},{"key":"F","text":"port ID"}],"answer":["A","D","E"]},{"number":57,"text":"[IT Exam · Q57] In which two port states does a switch learn MAC addresses and process BPDUs in a PVST network? (Choose two.)","options":[{"key":"A","text":"disabled"},{"key":"B","text":"forwarding"},{"key":"C","text":"listening"},{"key":"D","text":"blocking"},{"key":"E","text":"learning"}],"answer":["B","E"]},{"number":58,"text":"[IT Exam · Q58] If no bridge priority is configured in PVST, which criteria is considered when electing the root bridge?","options":[{"key":"A","text":"lowest MAC address"},{"key":"B","text":"lowest IP address"},{"key":"C","text":"highest IP address"},{"key":"D","text":"highest MAC address"}],"answer":["A"]},{"number":59,"text":"[IT Exam · Q59] When the show spanning-tree vlan 33 command is issued on a switch, three ports are shown in the forwarding state. In which two port roles could these interfaces function while in the forwarding state? (Choose two.)","options":[{"key":"A","text":"alternate"},{"key":"B","text":"designated"},{"key":"C","text":"disabled"},{"key":"D","text":"blocked"},{"key":"E","text":"root"}],"answer":["B","E"]},{"number":60,"text":"[IT Exam · Q60] What is the function of STP in a scalable network?","options":[{"key":"A","text":"It decreases the size of the failure domain to contain the impact of failures."},{"key":"B","text":"It protects the edge of the enterprise network from malicious activity."},{"key":"C","text":"It combines multiple switch trunk links to act as one logical link for increased bandwidth."},{"key":"D","text":"It disables redundant paths to eliminate Layer 2 loops."}],"answer":["D"]},{"number":61,"text":"[IT Exam · Q61] What is a characteristic of spanning tree?","options":[{"key":"A","text":"It is enabled by default on Cisco switches."},{"key":"B","text":"It is used to discover information about an adjacent Cisco device."},{"key":"C","text":"It has a TTL mechanism that works at Layer 2."},{"key":"D","text":"It prevents propagation of Layer 2 broadcast frames."}],"answer":["A"]},{"number":62,"text":"[IT Exam · Q62] Which spanning tree standard supports only one root bridge so that traffic from all VLANs flows over the same path?","options":[{"key":"A","text":"PVST+"},{"key":"B","text":"802.1D"},{"key":"C","text":"MST"},{"key":"D","text":"Rapid PVST"}],"answer":["B"]},{"number":63,"text":"[IT Exam · Q63] What is the purpose of the Spanning Tree Protocol (STP)?","options":[{"key":"A","text":"creates smaller collision domains"},{"key":"B","text":"prevents routing loops on a router"},{"key":"C","text":"prevents Layer 2 loops"},{"key":"D","text":"allows Cisco devices to exchange routing table updates"},{"key":"E","text":"creates smaller broadcast domains"}],"answer":["C"]},{"number":64,"text":"[IT Exam · Q64] What is the value used to determine which port on a non-root bridge will become a root port in a STP network?","options":[{"key":"A","text":"the path cost"},{"key":"B","text":"the highest MAC address of all the ports in the switch"},{"key":"C","text":"the lowest MAC address of all the ports in the switch"},{"key":"D","text":"the VTP revision number"}],"answer":["A"]},{"number":65,"text":"[IT Exam · Q65] What are two drawbacks to turning spanning tree off and having multiple paths through the Layer 2 switch network? (Choose two.)","options":[{"key":"A","text":"The MAC address table becomes unstable."},{"key":"B","text":"The switch acts like a hub."},{"key":"C","text":"Port security becomes unstable."},{"key":"D","text":"Broadcast frames are transmitted indefinitely."},{"key":"E","text":"Port security shuts down all of the ports that have attached devices."}],"answer":["A","D"]},{"number":66,"text":"[IT Exam · Q66] A small company network has six interconnected Layer 2 switches. Currently all switches are using the default bridge priority value. Which value can be used to configure the bridge priority of one of the switches to ensure that it becomes the root bridge in this design?","options":[{"key":"A","text":"1"},{"key":"B","text":"28672"},{"key":"C","text":"32768"},{"key":"D","text":"34816"},{"key":"E","text":"61440"}],"answer":["B"]},{"number":67,"text":"[IT Exam · Q67] Which statement is true regarding the use of PAgP to create EtherChannels?","options":[{"key":"A","text":"It requires full duplex."},{"key":"B","text":"It increases the number of ports that are participating in spanning tree."},{"key":"C","text":"It requires more physical links than LACP does."},{"key":"D","text":"It mandates that an even number of ports (2, 4, 6, etc.) be used for aggregation."},{"key":"E","text":"It is Cisco proprietary."}],"answer":["E"]},{"number":68,"text":"[IT Exam · Q68] What are two requirements to be able to configure an EtherChannel between two switches? (Choose two.)","options":[{"key":"A","text":"All the interfaces need to work at the same speed."},{"key":"B","text":"All interfaces need to be assigned to different VLANs."},{"key":"C","text":"Different allowed ranges of VLANs must exist on each end."},{"key":"D","text":"All the interfaces need to be working in the same duplex mode."},{"key":"E","text":"The interfaces that are involved need to be contiguous on the switch."}],"answer":["A","D"]},{"number":69,"text":"[IT Exam · Q69] Which two parameters must match on the ports of two switches to create a PAgP EtherChannel between the switches? (Choose two.)","options":[{"key":"A","text":"port ID"},{"key":"B","text":"PAgP mode"},{"key":"C","text":"MAC address"},{"key":"D","text":"speed"},{"key":"E","text":"VLAN information"}],"answer":["D","E"]},{"number":70,"text":"[IT Exam · Q70] A network administrator configured an EtherChannel link with three interfaces between two switches. What is the result if one of the three interfaces is down?","options":[{"key":"A","text":"The remaining two interfaces continue to load balance traffic."},{"key":"B","text":"The remaining two interfaces become separate links between the two switches."},{"key":"C","text":"One interface becomes an active link for data traffic and the other becomes a backup link."},{"key":"D","text":"The EtherChannel fails."}],"answer":["A"]},{"number":71,"text":"[IT Exam · Q71] A network administrator is configuring an Ether- Channel link between switches SW1 and SW2 by using the command SW1(config-if-range)# channel-group 1 mode auto . Which command must be used on SW2 to enable this EtherChannel?","options":[{"key":"A","text":"SW2(config-if-range)# channel-group 1 mode passive"},{"key":"B","text":"SW2(config-if-range)# channel-group 1 mode desirable"},{"key":"C","text":"SW2(config-if-range)# channel-group 1 mode on"},{"key":"D","text":"SW2(config-if-range)# channel-group 1 mode active"}],"answer":["B"]},{"number":72,"text":"[IT Exam · Q72] Which technology is an open protocol standard that allows switches to automatically bundle physical ports into a single logical link?","options":[{"key":"A","text":"PAgP"},{"key":"B","text":"LACP"},{"key":"C","text":"Multilink PPP"},{"key":"D","text":"DTP"}],"answer":["B"]},{"number":73,"text":"[IT Exam · Q73] What is a requirement to configure a trunking EtherChannel between two switches?","options":[{"key":"A","text":"The allowed range of VLANs must be the same on both switches."},{"key":"B","text":"The participating interfaces must be assigned the same VLAN number on both switches."},{"key":"C","text":"The participating interfaces must be physically contiguous on a switch."},{"key":"D","text":"The participating interfaces must be on the same module on a switch."}],"answer":["A"]},{"number":74,"text":"[IT Exam · Q74] What are two advantages of using LACP? (Choose two.)","options":[{"key":"A","text":"It allows directly connected switches to negotiate an EtherChannel link."},{"key":"B","text":"It eliminates the need for configuring trunk interfaces when deploying VLANs on multiple switches."},{"key":"C","text":"It decreases the amount of configuration that is needed on a switch."},{"key":"D","text":"It provides a simulated environment for testing link aggregation."},{"key":"E","text":"It allows the use of multivendor devices."},{"key":"F","text":"LACP allows Fast Ethernet and Gigabit Ethernet interfaces to be mixed within a single EtherChannel."}],"answer":["A","E"]},{"number":75,"text":"[IT Exam · Q75] A switch is configured to run STP . What term describes a non-root port that is permitted to forward traffic on the network?","options":[{"key":"A","text":"root port"},{"key":"B","text":"designated port"},{"key":"C","text":"alternate port"},{"key":"D","text":"disabled"}],"answer":["B"]},{"number":76,"text":"[IT Exam · Q76] What are two advantages of EtherChannel? (Choose two.)","options":[{"key":"A","text":"Spanning Tree Protocol views the physical links in an EtherChannel as one logical connection."},{"key":"B","text":"Load balancing occurs between links configured as different EtherChannels."},{"key":"C","text":"Configuring the EtherChannel interface provides consistency in the configuration of the physical links."},{"key":"D","text":"Spanning Tree Protocol ensures redundancy by transitioning failed interfaces in an EtherChannel to a forwarding state."},{"key":"E","text":"EtherChannel uses upgraded physical links to provide increased bandwidth."}],"answer":["A","B"]},{"number":77,"text":"[IT Exam · Q77] A set of switches is being connected in a LAN topology. Which STP bridge priority value will make it least likely for the switch to be selected as the root?","options":[{"key":"A","text":"65535"},{"key":"B","text":"4096"},{"key":"C","text":"32768"},{"key":"D","text":"61440"}],"answer":["D"]},{"number":78,"text":"[IT Exam · Q78] In which two PVST+ port states are MAC addresses learned? (Choose two.)","options":[{"key":"A","text":"learning"},{"key":"B","text":"forwarding"},{"key":"C","text":"disabled"},{"key":"D","text":"listening"},{"key":"E","text":"blocking"}],"answer":["A","B"]},{"number":79,"text":"[IT Exam · Q79] Which port role is assigned to the switch port that has the lowest cost to reach the root bridge?","options":[{"key":"A","text":"designated port"},{"key":"B","text":"disabled port"},{"key":"C","text":"root port"},{"key":"D","text":"non-designated port"}],"answer":["C"]},{"number":80,"text":"[IT Exam · Q80] A switch is configured to run STP . What term describes the switch port closest, in terms of overall cost, to the root bridge?","options":[{"key":"A","text":"root port"},{"key":"B","text":"designated port"},{"key":"C","text":"alternate port"},{"key":"D","text":"disabled"}],"answer":null},{"number":81,"text":"[IT Exam · Q81] A switch is configured to run STP . What term describes a field used to specify a VLAN ID?","options":[{"key":"A","text":"extended system ID"},{"key":"B","text":"port ID"},{"key":"C","text":"bridge priority"},{"key":"D","text":"bridge ID"}],"answer":["A"]},{"number":82,"text":"[IT Exam · Q82] A switch is configured to run STP . What term describes the reference point for all path calculations?","options":[{"key":"A","text":"root bridge"},{"key":"B","text":"root port"},{"key":"C","text":"designated port"},{"key":"D","text":"alternate port"}],"answer":["A"]},{"number":83,"text":"[IT Exam · Q83] A switch is configured to run STP . What term describes a field that has a default value of 32,768 and is the initial deciding factor when electing a root bridge?","options":[{"key":"A","text":"bridge priority"},{"key":"B","text":"MAC Address"},{"key":"C","text":"extended system ID"},{"key":"D","text":"bridge ID"}],"answer":null},{"number":84,"text":"[IT Exam · Q84] Which statement describes an EtherChannel implementation?","options":[{"key":"A","text":"EtherChannel operates only at Layer 2."},{"key":"B","text":"PAgP cannot be used in conjunction with Ether- Channel."},{"key":"C","text":"A trunked port can be part of an EtherChannel bundle."},{"key":"D","text":"EtherChannel can support up to a maximum of ten separate links."}],"answer":["C"]},{"number":85,"text":"[IT Exam · Q85] Which statement describes a characteristic of EtherChannel?","options":[{"key":"A","text":"It can combine up to a maximum of 4 physical links."},{"key":"B","text":"It can bundle mixed types of 100 Mb/s and 1Gb/s Ethernet links."},{"key":"C","text":"It consists of multiple parallel links between a switch and a router ."},{"key":"D","text":"It is made by combining multiple physical links that are seen as one link between two switches."}],"answer":["D"]},{"number":86,"text":"[IT Exam · Q86] Which two channel group modes would place an interface in a negotiating state using PAgP? (Choose two.)","options":[{"key":"A","text":"on"},{"key":"B","text":"desirable"},{"key":"C","text":"active"},{"key":"D","text":"auto"},{"key":"E","text":"passive"}],"answer":["B","D"]},{"number":87,"text":"[IT Exam · Q87] Which mode configuration setting would allow formation of an EtherChannel link between switches SW1 and SW2 without sending negotiation traffic?","options":[{"key":"A","text":"SW1: on SW2: on"},{"key":"B","text":"SW1: desirable SW2: desirable"},{"key":"C","text":"SW1: auto SW2: auto trunking enabled on both switches"},{"key":"D","text":"SW1: auto SW2: auto PortFast enabled on both switches"},{"key":"E","text":"SW1: passive SW2: active"}],"answer":["A"]},{"number":88,"text":"[IT Exam · Q88] When EtherChannel is configured, which mode will force an interface into a port channel without exchanging aggregation protocol packets?","options":[{"key":"A","text":"active"},{"key":"B","text":"auto"},{"key":"C","text":"on"},{"key":"D","text":"desirable"}],"answer":["C"]},{"number":89,"text":"[IT Exam · Q89] What are two load-balancing methods in the Ether- Channel technology? (Choose two.)","options":[{"key":"A","text":"combination of source port and IP to destination port and IP"},{"key":"B","text":"source IP to destination IP"},{"key":"C","text":"source port to destination port"},{"key":"D","text":"combination of source MAC and IP to destination MAC and IP"},{"key":"E","text":"source MAC to destination MAC"}],"answer":["B","E"]},{"number":90,"text":"[IT Exam · Q90] Which protocol provides up to 16 instances of RSTP , combines many VLANs with the same physical and logical topology into a common RSTP instance, and provides support for PortFast, BPDU guard, BPDU filter , root guard, and loop guard?","options":[{"key":"A","text":"STP"},{"key":"B","text":"Rapid PVST+"},{"key":"C","text":"PVST+"},{"key":"D","text":"MST"}],"answer":["D"]},{"number":91,"text":"[IT Exam · Q91] What is the outcome of a Layer 2 broadcast storm?","options":[{"key":"A","text":"Routers will take over the forwarding of frames as switches become congested."},{"key":"B","text":"New traffic is discarded by the switch because it is unable to be processed."},{"key":"C","text":"CSMA/CD will cause each host to continue transmitting frames."},{"key":"D","text":"ARP broadcast requests are returned to the transmitting host."}],"answer":["B"]},{"number":92,"text":"[IT Exam · Q92] Which two network design features require Spanning Tree Protocol (STP) to ensure correct network operation? (Choose two.)","options":[{"key":"A","text":"static default routes"},{"key":"B","text":"implementing VLANs to contain broadcasts"},{"key":"C","text":"redundant links between Layer 2 switches"},{"key":"D","text":"link-state dynamic routing that provides redundant routes"},{"key":"E","text":"removing single points of failure with multiple Layer 2 switches"}],"answer":["C","E"]},{"number":93,"text":"[IT Exam · Q93] A network administrator has configured an Ether- Channel between two switches that are connected via four trunk links. If the physical interface for one of the trunk links changes to a down state, what happens to the EtherChannel?","options":[{"key":"A","text":"Spanning Tree Protocol will transition the failed physical interface into forwarding mode."},{"key":"B","text":"Spanning Tree Protocol will recalculate the remaining trunk links."},{"key":"C","text":"The EtherChannel will transition to a down state."},{"key":"D","text":"The EtherChannel will remain functional."}],"answer":["D"]},{"number":94,"text":"[IT Exam · Q94] A DHCP-enabled client PC has just booted. During which two steps will the client PC use broadcast messages when communicating with a DHCP server? (Choose two.)","options":[{"key":"A","text":"DHCPDISCOVER"},{"key":"B","text":"DHCPACK"},{"key":"C","text":"DHCPOFFER"},{"key":"D","text":"DHCPREQUEST"},{"key":"E","text":"DHCPNAK"}],"answer":["A","D"]},{"number":95,"text":"[IT Exam · Q95] An administrator issues the commands: Router(config)# interface g0/1 Router(config-if)# ip address dhcp What is the administrator trying to achieve?","options":[{"key":"A","text":"configuring the router to act as a DHCPv4 server"},{"key":"B","text":"configuring the router to obtain IP parameters from a DHCPv4 server"},{"key":"C","text":"configuring the router to act as a relay agent"},{"key":"D","text":"configuring the router to resolve IP address conflicts"}],"answer":["B"]},{"number":96,"text":"[IT Exam · Q96] When a client is requesting an initial address lease from a DHCP server , why is the DHCPREQUEST message sent as a broadcast?","options":[{"key":"A","text":"The client does not yet know the IP address of the DHCP server that sent the offer ."},{"key":"B","text":"The DHCP server may be on a different subnet, so the request must be sent as a broadcast."},{"key":"C","text":"The client does not have a MAC address assigned yet, so it cannot send a unicast message at Layer 2."},{"key":"D","text":"The client may have received offers from multiple servers, and the broadcast serves to implicitly decline those other offers."}],"answer":["D"]},{"number":97,"text":"[IT Exam · Q97] Which DHCP IPv4 message contains the following information? Destination address: 255.255.255.255 Client IPv4 address: 0.0.0.0 Default gateway address: 0.0.0.0 Subnet mask: 0.0.0.0","options":[{"key":"A","text":"DHCPACK"},{"key":"B","text":"DHCPDISCOVER"},{"key":"C","text":"DHCPOFFER"},{"key":"D","text":"DHCPREQUEST"}],"answer":["B"]},{"number":98,"text":"[IT Exam · Q98] Which protocol automates assignment of IP addresses on a network, and which port number does it use? (Choose two.)","options":[{"key":"A","text":"DHCP"},{"key":"B","text":"DNS"},{"key":"C","text":"SMB"},{"key":"D","text":"53"},{"key":"E","text":"67"},{"key":"F","text":"80"}],"answer":["A","E"]},{"number":99,"text":"[IT Exam · Q99] Which message does an IPv4 host use to reply when it receives a DHCPOFFER message from a DHCP server?","options":[{"key":"A","text":"DHCPOFFER"},{"key":"B","text":"DHCPDISCOVER"},{"key":"C","text":"DHCPREQUEST"},{"key":"D","text":"DHCPACK"}],"answer":["C"]},{"number":100,"text":"[IT Exam · Q100] Which command, when issued in the interface configuration mode of a router , enables the interface to acquire an IPv4 address automatically from an ISP , when that link to the ISP is enabled?","options":[{"key":"A","text":"service dhcp"},{"key":"B","text":"ip address dhcp"},{"key":"C","text":"ip helper-address"},{"key":"D","text":"ip dhcp pool"}],"answer":["B"]},{"number":101,"text":"[IT Exam · Q101] Which kind of message is sent by a DHCP client when its IP address lease has expired?","options":[{"key":"A","text":"a DHCPDISCOVER unicast message"},{"key":"B","text":"a DHCPREQUEST broadcast message"},{"key":"C","text":"a DHCPREQUEST unicast message"},{"key":"D","text":"a DHCPDISCOVER broadcast message"}],"answer":["C"]},{"number":102,"text":"[IT Exam · Q102] A host PC is attempting to lease an address through DHCP . What message is sent by the server to let the client know it is able to use the provided IP information?","options":[{"key":"A","text":"DHCPDISCOVER"},{"key":"B","text":"DHCPOFFER"},{"key":"C","text":"DHCPREQUEST"},{"key":"D","text":"DHCPACK"},{"key":"E","text":"DHCPNACK"}],"answer":["D"]},{"number":103,"text":"[IT Exam · Q103] What is one indication that a Windows computer did not receive an IPv4 address from a DHCP server?","options":[{"key":"A","text":"The computer cannot ping 127.0.0.1."},{"key":"B","text":"The computer receives an IP address that starts with 169.254."},{"key":"C","text":"Windows displays a DHCP timeout message."},{"key":"D","text":"The computer cannot ping other devices on the same network with IP addresses in the 169.254.0.0/16 range."}],"answer":["B"]},{"number":104,"text":"[IT Exam · Q104] Which DHCPv4 message will a client send to accept an IPv4 address that is offered by a DHCP server?","options":[{"key":"A","text":"broadcast DHCPACK"},{"key":"B","text":"broadcast DHCPREQUEST"},{"key":"C","text":"unicast DHCPACK"},{"key":"D","text":"unicast DHCPREQUEST"}],"answer":["B"]},{"number":105,"text":"[IT Exam · Q105] A small coffee shop is offering free Wi-Fi to customers. The network includes a wireless router and a DSL modem that is connected to the local phone company. What method is typically used to configure the connection to the phone company?","options":[{"key":"A","text":"Set the WAN connection in the wireless router as a DHCP client."},{"key":"B","text":"Set the connection between the wireless router and the DSL modem as a private IP network."},{"key":"C","text":"Set the DSL modem as a DHCP client to get a public IP address from the wireless router ."},{"key":"D","text":"Set the DSL modem as a DHCP client to the phone company and a DHCP server for the internal connection."}],"answer":["A"]},{"number":106,"text":"[IT Exam · Q106] A company uses DHCP to manage IP address deployment for employee workstations. The IT department deploys multiple DHCP servers in the data center and uses DHCP relay agents to facilitate the DHCP requests from workstations. Which two UDP ports are used to forward DHCP traffic? (Choose two.)","options":[{"key":"A","text":"23"},{"key":"B","text":"53"},{"key":"C","text":"67"},{"key":"D","text":"68"},{"key":"E","text":"80"}],"answer":["C","D"]},{"number":107,"text":"[IT Exam · Q107] A client device on an Ethernet segment needs an IP address in order to communicate on the network. A DHCP server with IP address 192.168.1.1 has been configured and enabled on the network. How will a client device obtain a usable IP address for this network?","options":[{"key":"A","text":"Send a DHCPACK packet to the default gateway address."},{"key":"B","text":"Use a statically configured IP address from the pool of IP addresses that is offered by the DHCP server ."},{"key":"C","text":"Send a DHCPDISCOVER message to physical ad- dress FF-FF-FF-FF-FF-FF."},{"key":"D","text":"Send a DHCPREQUEST packet to IP address 255.255.255.255."}],"answer":["C"]},{"number":108,"text":"[IT Exam · Q108] What is an advantage of configuring a Cisco router as a relay agent?","options":[{"key":"A","text":"It can provide relay services for multiple UDP services."},{"key":"B","text":"It reduces the response time from a DHCP server ."},{"key":"C","text":"It can forward both broadcast and multicast messages on behalf of clients."},{"key":"D","text":"It will allow DHCPDISCOVER messages to pass without alteration."}],"answer":["A"]},{"number":109,"text":"[IT Exam · Q109] Which statement is true about DHCP operation?","options":[{"key":"A","text":"When a device that is configured to use DHCP boots, the client broadcasts a DHCPDISCOVER message to identify any available DHCP servers on the network."},{"key":"B","text":"A client must wait for lease expiration before it sends another DHCPREQUEST message."},{"key":"C","text":"If the client receives several DHCPOFFER messages from different servers, it sends a unicast DHCPRE- QUEST message to the server from which it chooses to obtain the IP information."},{"key":"D","text":"The DHCPDISCOVER message contains the IP ad- dress and subnet mask to be assigned, the IP address of the DNS server , and the IP address of the default gateway."}],"answer":["A"]},{"number":110,"text":"[IT Exam · Q110] A network administrator configures a router to send RA messages with M flag as 0 and O flag as 1. Which statement describes the effect of this configuration when a PC tries to configure its IPv6 address?","options":[{"key":"A","text":"It should contact a DHCPv6 server for the prefix, the prefix-length information, and an interface ID that is both random and unique."},{"key":"B","text":"It should use the information that is contained in the RA message and contact a DHCPv6 server for additional information."},{"key":"C","text":"It should use the information that is contained in the RA message exclusively."},{"key":"D","text":"It should contact a DHCPv6 server for all the information that it needs."}],"answer":["B"]},{"number":111,"text":"[IT Exam · Q111] A company uses the SLAAC method to configure IPv6 addresses for the employee workstations. Which address will a client use as its default gateway?","options":[{"key":"A","text":"the global unicast address of the router interface that is attached to the network"},{"key":"B","text":"the unique local address of the router interface that is attached to the network"},{"key":"C","text":"the all-routers multicast address"},{"key":"D","text":"the link-local address of the router interface that is attached to the network"}],"answer":["D"]},{"number":112,"text":"[IT Exam · Q112] A network administrator is analyzing the features that are supported by different first-hop router redundancy protocols. Which statement describes a feature that is associated with HSRP?","options":[{"key":"A","text":"HSRP uses active and standby routers."},{"key":"B","text":"HSRP is nonproprietary."},{"key":"C","text":"It allows load balancing between a group of redundant routers."},{"key":"D","text":"It uses ICMP messages in order to assign the default gateway to hosts."}],"answer":["A"]},{"number":113,"text":"[IT Exam · Q113] Which FHRP implementation is a Cisco-proprietary protocol that suppports IPv4 load sharing?","options":[{"key":"A","text":"IRDP"},{"key":"B","text":"GLBP"},{"key":"C","text":"VRRPv3"},{"key":"D","text":"GLBP for IPv6"}],"answer":["B"]},{"number":114,"text":"[IT Exam · Q114] The address pool of a DHCP server is configured with 10.92.71.0/25. The network administrator reserves 8 IP addresses for servers. How many IP addresses are left in the pool to be assigned to other hosts?","options":[{"key":"A","text":"122"},{"key":"B","text":"118"},{"key":"C","text":"119"},{"key":"D","text":"108"},{"key":"E","text":"116"}],"answer":["B"]},{"number":115,"text":"[IT Exam · Q115] After a host has generated an IPv6 address by using the DHCPv6 or SLAAC process, how does the host verify that the address is unique and therefore usable?","options":[{"key":"A","text":"The host sends an ICMPv6 echo request message to the DHCPv6 or SLAAC-learned address and if no reply is returned, the address is considered unique."},{"key":"B","text":"The host sends an ICMPv6 neighbor solicitation message to the DHCP or SLAAC-learned address and if no neighbor advertisement is returned, the address is considered unique."},{"key":"C","text":"The host checks the local neighbor cache for the learned address and if the address is not cached, it it considered unique."},{"key":"D","text":"The host sends an ARP broadcast to the local link and if no hosts send a reply, the address is considered unique."}],"answer":["B"]},{"number":116,"text":"[IT Exam · Q116] Which statement describes HSRP?","options":[{"key":"A","text":"It is used within a group of routers for selecting an active device and a standby device to provide gateway services to a LAN."},{"key":"B","text":"It uses ICMP to allow IPv4 hosts to locate routers that provide IPv4 connectivity to remote IP networks."},{"key":"C","text":"If the virtual router master fails, one router is elected as the virtual router master with the other routers acting as backups."},{"key":"D","text":"It is an open standard protocol."}],"answer":["A"]},{"number":117,"text":"[IT Exam · Q117] The address pool of a DHCP server is configured with 192.168.234.0/27. The network administrator reserves 22 IP addresses for IP phones. How many IP addresses are left in the pool to be assigned to other hosts?","options":[{"key":"A","text":"10"},{"key":"B","text":"0"},{"key":"C","text":"8"},{"key":"D","text":"21"},{"key":"E","text":"18"}],"answer":["C"]},{"number":118,"text":"[IT Exam · Q118] A company uses DHCP servers to dynamically assign IPv4 addresses to employee workstations. The address lease duration is set as 5 days. An employee returns to the office after an absence of one week. When the employee boots the workstation, it sends a message to obtain an IP address. Which Layer 2 and Layer 3 destination addresses will the message contain?","options":[{"key":"A","text":"both MAC and IPv4 addresses of the DHCP server"},{"key":"B","text":"FF-FF-FF-FF-FF-FF and IPv4 address of the DHCP server"},{"key":"C","text":"FF-FF-FF-FF-FF-FF and 255.255.255.255"},{"key":"D","text":"MAC address of the DHCP server and 255.255.255.255"}],"answer":["C"]},{"number":119,"text":"[IT Exam · Q119] Which command will allow a network administrator to check the IP address that is assigned to a particular MAC address?","options":[{"key":"A","text":"Router# show running-config I section_dhcp"},{"key":"B","text":"Router# show ip dhcp server statistics"},{"key":"C","text":"Router# show ip dhcp binding"},{"key":"D","text":"Router# show ip dhcp pool"}],"answer":["C"]},{"number":120,"text":"[IT Exam · Q120] What is the reason that an ISP commonly assigns a DHCP address to a wireless router in a SOHO environment?","options":[{"key":"A","text":"better network performance"},{"key":"B","text":"better connectivity"},{"key":"C","text":"easy IP address management"},{"key":"D","text":"easy configuration on ISP firewall"}],"answer":["C"]},{"number":121,"text":"[IT Exam · Q121] What information can be verified through the show ip dhcp binding command?","options":[{"key":"A","text":"the IPv4 addresses that are assigned to hosts by the DHCP server"},{"key":"B","text":"that DHCPv4 discover messages are still being received by the DHCP server"},{"key":"C","text":"the IPv4 addresses that have been excluded from the DHCPv4 pool"},{"key":"D","text":"the number of IP addresses remaining in the DHCP pool"}],"answer":["A"]},{"number":122,"text":"[IT Exam · Q122] What is the result of a network technician issuing the command ip dhcp excluded-address 10.0.15.1 10.0.15.15 on a Cisco router?","options":[{"key":"A","text":"The Cisco router will exclude only the 10.0.15.1 and 10.0.15.15 IP addresses from being leased to DHCP clients."},{"key":"B","text":"The Cisco router will exclude 15 IP addresses from being leased to DHCP clients."},{"key":"C","text":"The Cisco router will automatically create a DHCP pool using a /28 mask."},{"key":"D","text":"The Cisco router will allow only the specified IP addresses to be leased to clients."}],"answer":["B"]},{"number":123,"text":"[IT Exam · Q123] Which FHRP implementation is a Cisco-proprietary protocol that suppports IPv6 load balancing?","options":[{"key":"A","text":"GLBP"},{"key":"B","text":"GLBP for IPv6"},{"key":"C","text":"VRRPv3"},{"key":"D","text":"VRRPv2"}],"answer":["B"]},{"number":124,"text":"[IT Exam · Q124] What is a result when the DHCP servers are not operational in a network?","options":[{"key":"A","text":"Workstations are assigned with the IP address 127.0.0.1."},{"key":"B","text":"Workstations are assigned with IP addresses in the 10.0.0.0/8 network."},{"key":"C","text":"Workstations are assigned with IP addresses in the 169.254.0.0/16 network."},{"key":"D","text":"Workstations are assigned with the IP address 0.0.0.0."}],"answer":["C"]},{"number":125,"text":"[IT Exam · Q125] A company uses the method SLAAC to configure IPv6 addresses for the workstations of the employees. A network administrator configured the IPv6 address on the LAN interface of the router . The interface status is UP . However , the workstations on the LAN segment did not obtain the correct prefix and prefix length. What else should be configured on the router that is attached to the LAN segment for the workstations to obtain the information?","options":[{"key":"A","text":"R1(config)# ipv6 dhcp pool"},{"key":"B","text":"R1(config-if)# ipv6 enable"},{"key":"C","text":"R1(config)# ipv6 unicast-routing"},{"key":"D","text":"R1(config-if)# ipv6 nd other-config-flag"}],"answer":["C"]},{"number":126,"text":"[IT Exam · Q126] Which FHRP implementation is a nonproprietary protocol which relies on ICMP to provide IPv4 redundancy?","options":[{"key":"A","text":"VRRPv3"},{"key":"B","text":"GLBP for IPv6"},{"key":"C","text":"IRDP"},{"key":"D","text":"GLBP"}],"answer":["C"]},{"number":127,"text":"[IT Exam · Q127] Which FHRP implementation is Cisco-proprietary and permits only one router in a group to forward IPv6 packets?","options":[{"key":"A","text":"VRRPv3"},{"key":"B","text":"HSRP"},{"key":"C","text":"HSRP for IPv6"},{"key":"D","text":"VRRPv2"}],"answer":["C"]},{"number":128,"text":"[IT Exam · Q128] Which FHRP implementation is a nonproprietary IPv4-only election protocol which has one master router per group?","options":[{"key":"A","text":"HSRP for IPv6"},{"key":"B","text":"GLBP"},{"key":"C","text":"VRRPv2"},{"key":"D","text":"VRRPv3"}],"answer":["C"]},{"number":129,"text":"[IT Exam · Q129] The address pool of a DHCP server is configured with 172.18.93.0/25. The network administrator reserves 10 IP addresses for web servers. How many IP addresses are left in the pool to be assigned to other hosts?","options":[{"key":"A","text":"106"},{"key":"B","text":"117"},{"key":"C","text":"114"},{"key":"D","text":"120"},{"key":"E","text":"116"}],"answer":["E"]},{"number":130,"text":"[IT Exam · Q130] The address pool of a DHCP server is configured with 10.3.2.0/24. The network administrator reserves 3 IP addresses for printers. How many IP addresses are left in the pool to be assigned to other hosts?","options":[{"key":"A","text":"252"},{"key":"B","text":"241"},{"key":"C","text":"255"},{"key":"D","text":"249"},{"key":"E","text":"251"}],"answer":null},{"number":131,"text":"[IT Exam · Q131] The address pool of a DHCP server is configured with 172.23.143.0/26. The network administrator reserves 14 IP addresses for file servers. How many IP addresses are left in the pool to be assigned to other hosts?","options":[{"key":"A","text":"58"},{"key":"B","text":"48"},{"key":"C","text":"50"},{"key":"D","text":"61"},{"key":"E","text":"40"}],"answer":["B"]},{"number":132,"text":"[IT Exam · Q132] The address pool of a DHCP server is configured with 10.7.30.0/24. The network administrator reserves 5 IP addresses for printers. How many IP addresses are left in the pool to be assigned to other hosts?","options":[{"key":"A","text":"253"},{"key":"B","text":"239"},{"key":"C","text":"249"},{"key":"D","text":"250"},{"key":"E","text":"247"}],"answer":["C"]},{"number":133,"text":"[IT Exam · Q133] Which FHRP implementation is a nonproprietary IPv4-only election protocol with limited scalability?","options":[{"key":"A","text":"VRRPv2"},{"key":"B","text":"GLBP"},{"key":"C","text":"GLBP for IPv6"},{"key":"D","text":"IRDP"}],"answer":["A"]},{"number":134,"text":"[IT Exam · Q134] The address pool of a DHCP server is configured with 192.168.184.0/26. The network administrator reserves 18 IP addresses for access points. How many IP addresses are left in the pool to be assigned to other hosts?","options":[{"key":"A","text":"57"},{"key":"B","text":"44"},{"key":"C","text":"54"},{"key":"D","text":"36"},{"key":"E","text":"46"}],"answer":["B"]},{"number":135,"text":"[IT Exam · Q135] The address pool of a DHCP server is configured with 10.19.44.0/24. The network administrator reserves 3 IP addresses for servers. How many IP addresses are left in the pool to be assigned to other hosts?","options":[{"key":"A","text":"255"},{"key":"B","text":"252"},{"key":"C","text":"241"},{"key":"D","text":"251"},{"key":"E","text":"249"}],"answer":["D"]},{"number":136,"text":"[IT Exam · Q136] The address pool of a DHCP server is configured with 10.19.44.0/24. The network administrator reserves 6 IP addresses for servers. How many IP addresses are left in the pool to be assigned to other hosts?","options":[{"key":"A","text":"246"},{"key":"B","text":"252"},{"key":"C","text":"249"},{"key":"D","text":"248"},{"key":"E","text":"238"}],"answer":["D"]},{"number":137,"text":"[IT Exam · Q137] The address pool of a DHCP server is configured with 172.21.121.0/25. The network administrator reserves 12 IP addresses for web servers. How many IP addresses are left in the pool to be assigned to other hosts?","options":[{"key":"A","text":"115"},{"key":"B","text":"114"},{"key":"C","text":"118"},{"key":"D","text":"104"},{"key":"E","text":"112"}],"answer":["B"]},{"number":138,"text":"[IT Exam · Q138] Which Layer 2 attack will result in legitimate users not getting valid IP addresses?","options":[{"key":"A","text":"ARP spoofing"},{"key":"B","text":"DHCP starvation"},{"key":"C","text":"IP address spoofing"},{"key":"D","text":"MAC address flooding"}],"answer":["B"]},{"number":139,"text":"[IT Exam · Q139] What mitigation plan is best for thwarting a DoS attack that is creating a MAC address table overflow?","options":[{"key":"A","text":"Disable DTP ."},{"key":"B","text":"Disable STP ."},{"key":"C","text":"Enable port security."},{"key":"D","text":"Place unused ports in an unused VLAN."}],"answer":["C"]},{"number":140,"text":"[IT Exam · Q140] Which three Cisco products focus on endpoint security solutions? (Choose three.)","options":[{"key":"A","text":"IPS Sensor Appliance"},{"key":"B","text":"Web Security Appliance"},{"key":"C","text":"Email Security Appliance"},{"key":"D","text":"SSL/IPsec VPN Appliance"},{"key":"E","text":"Adaptive Security Appliance"},{"key":"F","text":"NAC Appliance"}],"answer":["B","C","F"]},{"number":141,"text":"[IT Exam · Q141] True or False? In the 802.1X standard, the client attempting to access the network is referred to as the supplicant.","options":[{"key":"A","text":"true"},{"key":"B","text":"false"}],"answer":["A"]},{"number":142,"text":"[IT Exam · Q142] Which authentication method stores usernames and passwords in the router and is ideal for small networks?","options":[{"key":"A","text":"server-based AAA over TACACS+"},{"key":"B","text":"local AAA over RADIUS"},{"key":"C","text":"server-based AAA"},{"key":"D","text":"local AAA over TACACS+"},{"key":"E","text":"local AAA"},{"key":"F","text":"server-based AAA over RADIUS"}],"answer":["E"]},{"number":143,"text":"[IT Exam · Q143] What represents a best practice concerning discovery protocols such as CDP and LLDP on network devices?","options":[{"key":"A","text":"Enable CDP on edge devices, and enable LLDP on interior devices."},{"key":"B","text":"Use the open standard LLDP rather than CDP ."},{"key":"C","text":"Use the default router settings for CDP and LLDP ."},{"key":"D","text":"Disable both protocols on all interfaces where they are not required."}],"answer":["D"]},{"number":144,"text":"[IT Exam · Q144] Which protocol should be used to mitigate the vulnerability of using Telnet to remotely manage network devices?","options":[{"key":"A","text":"SNMP"},{"key":"B","text":"TFTP"},{"key":"C","text":"SSH"},{"key":"D","text":"SCP"}],"answer":["C"]},{"number":145,"text":"[IT Exam · Q145] Which statement describes the behavior of a switch when the MAC address table is full?","options":[{"key":"A","text":"It treats frames as unknown unicast and floods all incoming frames to all ports on the switch."},{"key":"B","text":"It treats frames as unknown unicast and floods all incoming frames to all ports across multiple switches."},{"key":"C","text":"It treats frames as unknown unicast and floods all incoming frames to all ports within the local VLAN."},{"key":"D","text":"It treats frames as unknown unicast and floods all incoming frames to all ports within the collision domain."}],"answer":["C"]},{"number":146,"text":"[IT Exam · Q146] What device is considered a supplicant during the 802.1X authentication process?","options":[{"key":"A","text":"the router that is serving as the default gateway"},{"key":"B","text":"the authentication server that is performing client authentication"},{"key":"C","text":"the client that is requesting authentication"},{"key":"D","text":"the switch that is controlling network access"}],"answer":["C"]},{"number":147,"text":"[IT Exam · Q147] Which type of VLAN-hopping attack may be prevented by designating an unused VLAN as the native VLAN?","options":[{"key":"A","text":"DHCP spoofing"},{"key":"B","text":"DHCP starvation"},{"key":"C","text":"VLAN double-tagging"},{"key":"D","text":"DTP spoofing"}],"answer":["C"]},{"number":148,"text":"[IT Exam · Q148] A network administrator is configuring DAI on a switch with the command ip arp inspection validate src-mac. What is the purpose of this configuration command?","options":[{"key":"A","text":"It checks the source MAC address in the Ethernet header against the user-configured ARP ACLs."},{"key":"B","text":"It checks the source MAC address in the Ethernet header against the MAC address table."},{"key":"C","text":"It checks the source MAC address in the Ethernet header against the sender MAC address in the ARP body."},{"key":"D","text":"It checks the source MAC address in the Ethernet header against the target MAC address in the ARP body."}],"answer":["C"]},{"number":149,"text":"[IT Exam · Q149] Which two commands can be used to enable BPDU guard on a switch? (Choose two.)","options":[{"key":"A","text":"S1(config)# spanning-tree bpduguard default"},{"key":"B","text":"S1(config-if)# spanning-tree portfast bpduguard"},{"key":"C","text":"S1(config)# spanning-tree portfast bpduguard default"},{"key":"D","text":"S1(config-if)# enable spanning-tree bpduguard"},{"key":"E","text":"S1(config-if)# spanning-tree bpduguard enable"}],"answer":["C","E"]},{"number":150,"text":"[IT Exam · Q150] As part of the new security policy, all switches on the network are configured to automatically learn MAC addresses for each port. All running configurations are saved at the start and close of every business day. A severe thunderstorm causes an extended power outage several hours after the close of business. When the switches are brought back online, the dynamically learned MAC addresses are retained. Which port security configuration enabled this?","options":[{"key":"A","text":"auto secure MAC addresses"},{"key":"B","text":"dynamic secure MAC addresses"},{"key":"C","text":"static secure MAC addresses"},{"key":"D","text":"sticky secure MAC addresses"}],"answer":["D"]},{"number":151,"text":"[IT Exam · Q151] Which type of management frame may regularly be broadcast by an AP?","options":[{"key":"A","text":"authentication"},{"key":"B","text":"probe request"},{"key":"C","text":"probe response"},{"key":"D","text":"beacon"}],"answer":["D"]},{"number":152,"text":"[IT Exam · Q152] What are the two methods that are used by a wireless NIC to discover an AP? (Choose two.)","options":[{"key":"A","text":"delivering a broadcast frame"},{"key":"B","text":"receiving a broadcast beacon frame"},{"key":"C","text":"initiating a three-way handshake"},{"key":"D","text":"sending an ARP request"},{"key":"E","text":"transmitting a probe request"}],"answer":["B","E"]},{"number":153,"text":"[IT Exam · Q153] A technician is configuring the channel on a wireless router to either 1, 6, or 11. What is the purpose of adjusting the channel?","options":[{"key":"A","text":"to enable different 802.11 standards"},{"key":"B","text":"to avoid interference from nearby wireless devices"},{"key":"C","text":"to disable broadcasting of the SSID"},{"key":"D","text":"to provide stronger security modes"}],"answer":["B"]},{"number":154,"text":"[IT Exam · Q154] While attending a conference, participants are using laptops for network connectivity. When a guest speaker attempts to connect to the network, the laptop fails to display any available wireless networks. The access point must be operating in which mode?","options":[{"key":"A","text":"mixed"},{"key":"B","text":"passive"},{"key":"C","text":"active"},{"key":"D","text":"open"}],"answer":["C"]},{"number":155,"text":"[IT Exam · Q155] A network administrator is required to upgrade wireless access to end users in a building. To provide data rates up to 1.3 Gb/s and still be backward compatible with older devices, which wireless standard should be implemented?","options":[{"key":"A","text":"802.11n"},{"key":"B","text":"802.11ac"},{"key":"C","text":"802.11g"},{"key":"D","text":"802.11b"}],"answer":["B"]},{"number":156,"text":"[IT Exam · Q156] A technician is about to install and configure a wireless network at a small branch office. What is the first security measure the technician should apply immediately upon powering up the wireless router?","options":
