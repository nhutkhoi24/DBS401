[{"key":"A","text":"Enable MAC address filtering on the wireless router ."},{"key":"B","text":"Configure encryption on the wireless router and the connected wireless devices."},{"key":"C","text":"Change the default user-name and password of the wireless router ."},{"key":"D","text":"Disable the wireless network SSID broadcast."}],"answer":["C"]},{"number":157,"text":"[IT Exam · Q157] On a Cisco 3504 WLC dashboard, which option provides access to the full menu of features?","options":[{"key":"A","text":"Access Points"},{"key":"B","text":"Network Summary"},{"key":"C","text":"Advanced"},{"key":"D","text":"Rogues"}],"answer":["C"]},{"number":158,"text":"[IT Exam · Q158] Which step is required before creating a new WLAN on a Cisco 3500 series WLC?","options":[{"key":"A","text":"Create a new SSID."},{"key":"B","text":"Build or have an SNMP server available."},{"key":"C","text":"Build or have a RADIUS server available."},{"key":"D","text":"Create a new VLAN interface."}],"answer":["D"]},{"number":159,"text":"[IT Exam · Q159] To improve performance the network engineer decides to configure a 5 Ghz frequency band SSID and train users to use that SSID for streaming media services. Why might this solution improve the wireless network performance for that type of service?","options":[{"key":"A","text":"Requiring the users to switch to the 5 GHz band for streaming media is inconvenient and will result in fewer users accessing these services."},{"key":"B","text":"The 5 GHz band has more channels and is less crowded than the 2.4 GHz band, which makes it more suited to streaming multimedia."},{"key":"C","text":"The 5 GHz band has a greater range and is therefore likely to be interference-free."},{"key":"D","text":"The only users that can switch to the 5 GHz band will be those with the latest wireless NICs, which will reduce usage."}],"answer":["B"]},{"number":160,"text":"[IT Exam · Q160] A network administrator is configuring a RA- DIUS server connection on a Cisco 3500 series WLC. The configuration requires a shared secret password. What is the purpose for the shared secret password?","options":[{"key":"A","text":"It is used by the RADIUS server to authenticate WLAN users."},{"key":"B","text":"It is used to authenticate and encrypt user data on the WLAN."},{"key":"C","text":"It is used to encrypt the messages between the WLC and the RADIUS server ."},{"key":"D","text":"It allows users to authenticate and access the WLAN."}],"answer":["C"]},{"number":161,"text":"[IT Exam · Q161] Which three parameters would need to be changed if best practices are being implemented for a home wireless AP? (Choose three.)","options":[{"key":"A","text":"wireless client operating system password"},{"key":"B","text":"antenna frequency"},{"key":"C","text":"wireless network password"},{"key":"D","text":"wireless beacon time"},{"key":"E","text":"AP password"},{"key":"F","text":"SSID"}],"answer":["C","E","F"]},{"number":162,"text":"[IT Exam · Q162] Which access control component, implementation, or protocol is based upon usernames and passwords?","options":[{"key":"A","text":"802.1X"},{"key":"B","text":"accounting"},{"key":"C","text":"authentication"},{"key":"D","text":"authorization"}],"answer":["C"]},{"number":163,"text":"[IT Exam · Q163] Which type of wireless network is based on the 802.11 standard and a 2.4-GHz or 5-GHz radio frequency?","options":[{"key":"A","text":"wireless metropolitan-area network"},{"key":"B","text":"wireless wide-area network"},{"key":"C","text":"wireless local-area network"},{"key":"D","text":"wireless personal-area network"}],"answer":["C"]},{"number":164,"text":"[IT Exam · Q164] Which two Cisco solutions help prevent DHCP starvation attacks? (Choose two.)","options":[{"key":"A","text":"DHCP Snooping"},{"key":"B","text":"IP Source Guard"},{"key":"C","text":"Dynamic ARP Inspection"},{"key":"D","text":"Port Security"},{"key":"E","text":"Web Security Appliance"}],"answer":["A","D"]},{"number":165,"text":"[IT Exam · Q165] What are three techniques for mitigating VLAN attacks? (Choose three.)","options":[{"key":"A","text":"Enable trunking manually."},{"key":"B","text":"Disable DTP ."},{"key":"C","text":"Enable Source Guard."},{"key":"D","text":"Set the native VLAN to an unused VLAN."},{"key":"E","text":"Use private VLANs."},{"key":"F","text":"Enable BPDU guard."}],"answer":["A","B","D"]},{"number":166,"text":"[IT Exam · Q166] A network administrator of a college is configuring the WLAN user authentication process. Wireless users are required to enter username and password credentials that will be verified by a server . Which server would provide such service?","options":[{"key":"A","text":"AAA"},{"key":"B","text":"NAT"},{"key":"C","text":"RADIUS"},{"key":"D","text":"SNMP"}],"answer":["C"]},{"number":167,"text":"[IT Exam · Q167] A technician is troubleshooting a slow WLAN that consists of 802.11b and 802.11g devices . A new 802.11n/ac dual-band router has been deployed on the network to replace the old 802.11g router . What can the technician do to address the slow wireless speed?","options":[{"key":"A","text":"Split the wireless traffic between the 802.11n 2.4 GHz band and the 5 GHz band."},{"key":"B","text":"Update the firmware on the new router ."},{"key":"C","text":"Configure devices to use a different channel."},{"key":"D","text":"Change the SSID."}],"answer":["A"]},{"number":168,"text":"[IT Exam · Q168] The company handbook states that employees cannot have microwave ovens in their offices. Instead, all employees must use the microwave ovens located in the employee cafeteria. What wireless security risk is the company trying to avoid?","options":[{"key":"A","text":"improperly configured devices"},{"key":"B","text":"rogue access points"},{"key":"C","text":"accidental interference"},{"key":"D","text":"interception of data"}],"answer":["C"]},{"number":169,"text":"[IT Exam · Q169] What is the function provided by CAPWAP protocol in a corporate wireless network?","options":[{"key":"A","text":"CAPWAP creates a tunnel on Transmission Control Protocol (TCP) ports in order to allow a WLC to configure an autonomous access point."},{"key":"B","text":"CAPWAP provides the encapsulation and forwarding of wireless user traffic between an access point and a wireless LAN controller ."},{"key":"C","text":"CAPWAP provides connectivity between an access point using IPv6 addressing and a wireless client using IPv4 addressing."},{"key":"D","text":"CAPWAP provides the encryption of wireless user traffic between an access point and a wireless client."}],"answer":["B"]},{"number":170,"text":"[IT Exam · Q170] What are two protocols that are used by AAA to authenticate users against a central database of usernames and password? (Choose two.)","options":[{"key":"A","text":"SSH"},{"key":"B","text":"HTTPS"},{"key":"C","text":"TACACS+"},{"key":"D","text":"RADIUS"},{"key":"E","text":"CHAP"},{"key":"F","text":"NTP"}],"answer":["C","D"]},{"number":171,"text":"[IT Exam · Q171] What is the result of a DHCP starvation attack?","options":[{"key":"A","text":"The attacker provides incorrect DNS and default gateway information to clients."},{"key":"B","text":"The IP addresses assigned to legitimate clients are hijacked."},{"key":"C","text":"Clients receive IP address assignments from a rogue DHCP server ."},{"key":"D","text":"Legitimate clients are unable to lease IP addresses."}],"answer":["D"]},{"number":172,"text":"[IT Exam · Q172] Which feature or configuration on a switch makes it vulnerable to VLAN double-tagging attacks?","options":[{"key":"A","text":"the limited size of content-addressable memory space"},{"key":"B","text":"the automatic trunking port feature enabled for all ports by default"},{"key":"C","text":"the native VLAN of the trunking port being the same as a user VLAN"},{"key":"D","text":"mixed duplex mode enabled for all ports by default"}],"answer":["C"]},{"number":173,"text":"[IT Exam · Q173] Which component of AAA allows an administrator to track individuals who access network resources and any changes that are made to those resources?","options":[{"key":"A","text":"authentication"},{"key":"B","text":"accounting"},{"key":"C","text":"accessibility"},{"key":"D","text":"authorization"}],"answer":["B"]},{"number":174,"text":"[IT Exam · Q174] An IT security specialist enables port security on a switch port of a Cisco switch. What is the default violation mode in use until the switch port is configured to use a different violation mode?","options":[{"key":"A","text":"shutdown"},{"key":"B","text":"disabled"},{"key":"C","text":"restrict"},{"key":"D","text":"protect"}],"answer":["A"]},{"number":175,"text":"[IT Exam · Q175] A laptop cannot connect to a wireless access point. Which two troubleshooting steps should be taken first? (Choose two.)","options":[{"key":"A","text":"Ensure that the correct network media is selected."},{"key":"B","text":"Ensure that the laptop antenna is attached."},{"key":"C","text":"Ensure that the wireless NIC is enabled."},{"key":"D","text":"Ensure that the wireless SSID is chosen."},{"key":"E","text":"Ensure that the NIC is configured for the proper frequency."}],"answer":["C","D"]},{"number":176,"text":"[IT Exam · Q176] What is an advantage of SSID cloaking?","options":[{"key":"A","text":"Clients will have to manually identify the SSID to connect to the network."},{"key":"B","text":"It is the best way to secure a wireless network."},{"key":"C","text":"SSIDs are very difficult to discover because APs do not broadcast them."},{"key":"D","text":"It provides free Internet access in public locations where knowing the SSID is of no concern."}],"answer":["A"]},{"number":177,"text":"[IT Exam · Q177] What is a wireless security mode that requires a RADIUS server to authenticate wireless users?","options":[{"key":"A","text":"personal"},{"key":"B","text":"shared key"},{"key":"C","text":"enterprise"},{"key":"D","text":"WEP"}],"answer":["C"]},{"number":178,"text":"[IT Exam · Q178] A company has recently implemented an 802.11n wireless network. Some users are complaining that the wireless network is too slow. Which solution is the best method to enhance the performance of the wireless network?","options":[{"key":"A","text":"Disable DHCP on the access point and assign static addresses to the wireless clients."},{"key":"B","text":"Upgrade the firmware on the wireless access point."},{"key":"C","text":"Split the traffic between the 2.4 GHz and 5 GHz frequency bands."},{"key":"D","text":"Replace the wireless NICs on the computers that are experiencing slow connections."}],"answer":["C"]},{"number":179,"text":"[IT Exam · Q179] Which protocol can be used to monitor the network?","options":[{"key":"A","text":"DHCP"},{"key":"B","text":"SNMP"},{"key":"C","text":"RADIUS"},{"key":"D","text":"AAA"}],"answer":["B"]},{"number":180,"text":"[IT Exam · Q180] A network administrator deploys a wireless router in a small law firm. Employee laptops join the WLAN and receive IP addresses in the 10.0.10.0/24 network. Which service is used on the wireless router to allow the employee laptops to access the internet?","options":[{"key":"A","text":"DHCP"},{"key":"B","text":"RADIUS"},{"key":"C","text":"DNS"},{"key":"D","text":"NAT"}],"answer":["D"]},{"number":181,"text":"[IT Exam · Q181] Which service can be used on a wireless router to prioritize network traffic among different types of applications so that voice and video data are prioritized over email and web data?","options":[{"key":"A","text":"QoS"},{"key":"B","text":"DNS"},{"key":"C","text":"DHCP"},{"key":"D","text":"NAT"}],"answer":["A"]},{"number":182,"text":"[IT Exam · Q182] Which access control component, implementation, or protocol is based on device roles of supplicant, authenticator , and authentication server?","options":[{"key":"A","text":"accounting"},{"key":"B","text":"authentication"},{"key":"C","text":"authorization"},{"key":"D","text":"802.1X"}],"answer":["D"]},{"number":183,"text":"[IT Exam · Q183] Which type of wireless network is suitable for national and global communications?","options":[{"key":"A","text":"wireless metropolitan-area network"},{"key":"B","text":"wireless local-area network"},{"key":"C","text":"wireless personal-area network"},{"key":"D","text":"wireless wide-area network"}],"answer":["D"]},{"number":184,"text":"[IT Exam · Q184] Which feature on a switch makes it vulnerable to VLAN hopping attacks?","options":[{"key":"A","text":"the mixed duplex mode enabled for all ports by default"},{"key":"B","text":"the limited size of content-addressable memory space"},{"key":"C","text":"mixed port bandwidth support enabled for all ports by default"},{"key":"D","text":"the automatic trunking port feature enabled for all ports by default"}],"answer":["D"]},{"number":185,"text":"[IT Exam · Q185] Which component of AAA is used to determine which resources a user can access and which operations the user is allowed to perform?","options":[{"key":"A","text":"accounting"},{"key":"B","text":"authentication"},{"key":"C","text":"auditing"},{"key":"D","text":"authorization"}],"answer":["D"]},{"number":186,"text":"[IT Exam · Q186] A network administrator enters the following commands on the switch SW1. SW1(config)# interface range fa0/5 - 10 SW1(config-if)# ip dhcp snooping limit rate 6 What is the effect after these commands are entered?","options":[{"key":"A","text":"If any of the FastEthernet ports 5 through 10 receive more than 6 DHCP messages per second, the port will be shut down."},{"key":"B","text":"FastEthernet ports 5 through 10 can receive up to 6 DHCP messages per second of any type."},{"key":"C","text":"If any of the FastEthernet ports 5 through 10 receive more than 6 DHCP messages per second, the port will continue to operate and an error message will be sent to the network administrator ."},{"key":"D","text":"FastEthernet ports 5 through 10 can receive up to 6 DHCP discovery messages per second."}],"answer":["D"]},{"number":187,"text":"[IT Exam · Q187] A network administrator is configuring port security on a Cisco switch. The company security policy specifies that when a violation occurs, packets with unknown source addresses should be dropped and no notification should be sent. Which violation mode should be configured on the interfaces?","options":[{"key":"A","text":"off"},{"key":"B","text":"restrict"},{"key":"C","text":"protect"},{"key":"D","text":"shutdown"}],"answer":["C"]},{"number":188,"text":"[IT Exam · Q188] A network administrator is working to improve WLAN performance on a dual-band wireless router . What is a simple way to achieve a split-the-traffic result?","options":[{"key":"A","text":"Add a Wi-Fi range extender to the WLAN and set the AP and the range extender to serve different bands."},{"key":"B","text":"Check and keep the firmware of the wireless router updated."},{"key":"C","text":"Make sure that different SSIDs are used for the 2.4 GHz and 5 GHz bands."},{"key":"D","text":"Require all wireless devices to use the 802.11n standard."}],"answer":["C"]},{"number":189,"text":"[IT Exam · Q189] Which access control component, implementation, or protocol controls what users can do on the network?","options":[{"key":"A","text":"accounting"},{"key":"B","text":"802.1X"},{"key":"C","text":"authorization"},{"key":"D","text":"authentication"}],"answer":["C"]},{"number":190,"text":"[IT Exam · Q190] Which type of wireless network is suitable for providing wireless access to a city or district?","options":[{"key":"A","text":"wireless wide-area network"},{"key":"B","text":"wireless personal-area network"},{"key":"C","text":"wireless local-area network"},{"key":"D","text":"wireless metropolitan-area network"}],"answer":["D"]},{"number":191,"text":"[IT Exam · Q191] On a Cisco 3504 WLC Summary page ( Advanced > Summary ), which tab allows a network administrator to access and configure a WLAN for a specific security option such as WPA2?","options":[{"key":"A","text":"MANAGEMENT"},{"key":"B","text":"WIRELESS"},{"key":"C","text":"WLANs"},{"key":"D","text":"SECURITY"}],"answer":["C"]},{"number":192,"text":"[IT Exam · Q192] What type of wireless antenna is best suited for providing coverage in large open spaces, such as hallways or large conference rooms?","options":[{"key":"A","text":"Yagi"},{"key":"B","text":"omnidirectional"},{"key":"C","text":"dish"},{"key":"D","text":"directional"}],"answer":["B"]},{"number":193,"text":"[IT Exam · Q193] What security benefit is gained from enabling BPDU guard on PortFast enabled interfaces?","options":[{"key":"A","text":"preventing buffer overflow attacks"},{"key":"B","text":"preventing rogue switches from being added to the network"},{"key":"C","text":"protecting against Layer 2 loops"},{"key":"D","text":"enforcing the placement of root bridges"}],"answer":["B"]},{"number":194,"text":"[IT Exam · Q194] Which access control component, implementation, or protocol logs EXEC and configuration commands configured by a user?","options":[{"key":"A","text":"authentication"},{"key":"B","text":"authorization"},{"key":"C","text":"802.1X"},{"key":"D","text":"accounting"}],"answer":["D"]},{"number":195,"text":"[IT Exam · Q195] Which type of wireless network uses transmitters to provide coverage over an extensive geographic area?","options":[{"key":"A","text":"wireless metropolitan-area network"},{"key":"B","text":"wireless local-area network"},{"key":"C","text":"wireless personal-area network"},{"key":"D","text":"wireless wide-area network"}],"answer":["D"]},{"number":196,"text":"[IT Exam · Q196] Which access control component, implementation, or protocol controls who is permitted to access a network?","options":[{"key":"A","text":"authorization"},{"key":"B","text":"802.1X"},{"key":"C","text":"accounting"},{"key":"D","text":"authentication"}],"answer":null},{"number":197,"text":"[IT Exam · Q197] What two IEEE 802.11 wireless standards operate only in the 5 GHz range? (Choose two.)","options":[{"key":"A","text":"802.11g"},{"key":"B","text":"802.11ad"},{"key":"C","text":"802.11ac"},{"key":"D","text":"802.11a"},{"key":"E","text":"802.11n"},{"key":"F","text":"802.11b"}],"answer":["C","D"]},{"number":198,"text":"[IT Exam · Q198] Which type of wireless network uses low powered transmitters for a short-range network, usually 20 to 30 ft. (6 to 9 meters)?","options":[{"key":"A","text":"wireless metropolitan-area network"},{"key":"B","text":"wireless personal-area network"},{"key":"C","text":"wireless local-area network"},{"key":"D","text":"wireless wide-area network"}],"answer":["B"]},{"number":199,"text":"[IT Exam · Q199] Which wireless network topology would be used by network engineers to provide a wireless network for an entire college building?","options":[{"key":"A","text":"ad hoc"},{"key":"B","text":"hotspot"},{"key":"C","text":"infrastructure"},{"key":"D","text":"mixed mode"}],"answer":["C"]},{"number":200,"text":"[IT Exam · Q200] Which type of wireless network uses transmitters to provide wireless service over a large urban region?","options":[{"key":"A","text":"wireless wide-area network"},{"key":"B","text":"wireless personal-area network"},{"key":"C","text":"wireless metropolitan-area network"},{"key":"D","text":"wireless local-area network."}],"answer":["C"]},{"number":201,"text":"[IT Exam · Q201] Which type of wireless network is suitable for use in a home or office?","options":[{"key":"A","text":"wireless wide-area network"},{"key":"B","text":"wireless personal-area network"},{"key":"C","text":"wireless local-area network"},{"key":"D","text":"wireless metropolitan-area network"}],"answer":["C"]},{"number":202,"text":"[IT Exam · Q202] Which access control component, implementation, or protocol indicates success or failure of a client-requested service with a PASS or FAIL message?","options":[{"key":"A","text":"accounting"},{"key":"B","text":"authentication"},{"key":"C","text":"802.1X"},{"key":"D","text":"authorization"}],"answer":["D"]},{"number":203,"text":"[IT Exam · Q203] Which type of wireless network often makes use of devices mounted on buildings?","options":[{"key":"A","text":"wireless local-area network"},{"key":"B","text":"wireless metropolitan-area network"},{"key":"C","text":"wireless personal-area network"},{"key":"D","text":"wireless wide-area network"}],"answer":["B"]},{"number":204,"text":"[IT Exam · Q204] Which access control component, implementation, or protocol collects and reports usage data?","options":[{"key":"A","text":"accounting"},{"key":"B","text":"authentication"},{"key":"C","text":"authorization"},{"key":"D","text":"802.1X"}],"answer":["A"]},{"number":205,"text":"[IT Exam · Q205] Which access control component, implementation, or protocol audits what users actions are performed on the network?","options":[{"key":"A","text":"Accounting"},{"key":"B","text":"Authorization"},{"key":"C","text":"Authentication"},{"key":"D","text":"802.1X"}],"answer":["A"]},{"number":206,"text":"[IT Exam · Q206] Which type of wireless network commonly uses Bluetooth or ZigBee devices?","options":[{"key":"A","text":"wireless wide-area network"},{"key":"B","text":"wireless personal-area network"},{"key":"C","text":"wireless local-area network"},{"key":"D","text":"wireless metropolitan-area network"}],"answer":["B"]},{"number":207,"text":"[IT Exam · Q207] Which access control component, implementation, or protocol is implemented either locally or as a server-based solution?","options":[{"key":"A","text":"authorization"},{"key":"B","text":"802.1X"},{"key":"C","text":"accounting"},{"key":"D","text":"authentication"}],"answer":["D"]},{"number":208,"text":"[IT Exam · Q208] A technician is troubleshooting a slow WLAN and decides to use the split-the-traffic approach. Which two parameters would have to be configured to do this? (Choose two.)","options":[{"key":"A","text":"Configure the 5 GHz band for streaming multimedia and time sensitive traffic."},{"key":"B","text":"Configure the security mode to WPA Personal TKIP/AES for one network and WPA2 Personal AES for the other network."},{"key":"C","text":"Configure the 2.4 GHz band for basic internet traffic that is not time sensitive."},{"key":"D","text":"Configure the security mode to WPA Personal TKIP/AES for both networks."},{"key":"E","text":"Configure a common SSID for both split networks."}],"answer":["A","C"]},{"number":209,"text":"[IT Exam · Q209] Which access control component, implementation, or protocol restricts LAN access through publicly accessible switch ports?","options":[{"key":"A","text":"802.1X"},{"key":"B","text":"authorization"},{"key":"C","text":"accounting"},{"key":"D","text":"authentication"}],"answer":["A"]},{"number":210,"text":"[IT Exam · Q210] A network administrator is required to upgrade wireless access to end users in a building. To provide data rates up to 1.3Gb/s and still be backward compatible with older devices, which wireless standard should be implemented?","options":[{"key":"A","text":"802.11g"},{"key":"B","text":"802.11n"},{"key":"C","text":"802.11ac"},{"key":"D","text":"802.11b"}],"answer":["C"]},{"number":211,"text":"[IT Exam · Q211] Which feature on a Cisco router permits the forwarding of traffic for which there is no specific route?","options":[{"key":"A","text":"next-hop"},{"key":"B","text":"gateway of last resort"},{"key":"C","text":"route source"},{"key":"D","text":"outgoing interface"}],"answer":["B"]},{"number":212,"text":"[IT Exam · Q212] Which three advantages are provided by static routing? (Choose three.)","options":[{"key":"A","text":"Static routing does not advertise over the network, thus providing better security."},{"key":"B","text":"Configuration of static routes is error-free."},{"key":"C","text":"Static routes scale well as the network grows."},{"key":"D","text":"Static routing typically uses less network bandwidth and fewer CPU operations than dynamic routing does."},{"key":"E","text":"The path a static route uses to send data is known."},{"key":"F","text":"No intervention is required to maintain changing route information."}],"answer":["A","D","E"]},{"number":213,"text":"[IT Exam · Q213] What are two functions of dynamic routing protocols? (Choose two.)","options":[{"key":"A","text":"to maintain routing tables"},{"key":"B","text":"to assure low router overhead"},{"key":"C","text":"to avoid exposing network information"},{"key":"D","text":"to discover the network"},{"key":"E","text":"to choose the path that is specified by the administrator"}],"answer":["A","D"]},{"number":214,"text":"[IT Exam · Q214] What is an advantage of using dynamic routing protocols instead of static routing?","options":[{"key":"A","text":"easier to implement"},{"key":"B","text":"more secure in controlling routing updates"},{"key":"C","text":"fewer router resource overhead requirements"},{"key":"D","text":"ability to actively search for new routes if the current path becomes unavailable"}],"answer":["D"]},{"number":215,"text":"[IT Exam · Q215] What happens to a static route entry in a routing table when the outgoing interface associated with that route goes into the down state?","options":[{"key":"A","text":"The static route is removed from the routing table."},{"key":"B","text":"The router polls neighbors for a replacement route."},{"key":"C","text":"The router automatically redirects the static route to use another interface."},{"key":"D","text":"The static route remains in the table because it was defined as static."}],"answer":["A"]},{"number":216,"text":"[IT Exam · Q216] What is a characteristic of a static route that matches all packets?","options":[{"key":"A","text":"It uses a single network address to send multiple static routes to one destination address."},{"key":"B","text":"It identifies the gateway IP address to which the router sends all IP packets for which it does not have a learned or static route."},{"key":"C","text":"It backs up a route already discovered by a dynamic routing protocol."},{"key":"D","text":"It is configured with a higher administrative distance than the original dynamic routing protocol has."}],"answer":["B"]},{"number":217,"text":"[IT Exam · Q217] When would it be more beneficial to use a dynamic routing protocol instead of static routing?","options":[{"key":"A","text":"in an organization where routers suffer from performance issues"},{"key":"B","text":"on a stub network that has a single exit point"},{"key":"C","text":"in an organization with a smaller network that is not expected to grow in size"},{"key":"D","text":"on a network where there is a lot of topology changes"}],"answer":["D"]},{"number":218,"text":"[IT Exam · Q218] Which route would be used to forward a packet with a source IP address of 192.168.10.1 and a destination IP address of 10.1.1.1?","options":[{"key":"A","text":"C 192.168.10.0/30 is directly connected, GigabitEthernet0/1"},{"key":"B","text":"O 10.1.1.0/24 [110/65] via 192.168.200.2, 00:01:20, Serial0/1/0"},{"key":"C","text":"S* 0.0.0.0/0 [1/0] via 172.16.1.1"},{"key":"D","text":"S 10.1.0.0/16 is directly connected, GigabitEthernet0/0"}],"answer":["B"]},{"number":219,"text":"[IT Exam · Q219] Which value in a routing table represents trustworthiness and is used by the router to determine which route to install into the routing table when there are multiple routes toward the same destination?","options":[{"key":"A","text":"administrative distance"},{"key":"B","text":"metric"},{"key":"C","text":"outgoing interface"},{"key":"D","text":"routing protocol"}],"answer":["A"]},{"number":220,"text":"[IT Exam · Q220] On which two routers would a default static route be configured? (Choose two.)","options":[{"key":"A","text":"any router where a backup route to dynamic routing is needed for reliability"},{"key":"B","text":"the router that serves as the gateway of last resort"},{"key":"C","text":"any router running an IOS prior to 12.0"},{"key":"D","text":"stub router connection to the rest of the corporate or campus network"},{"key":"E","text":"edge router connection to the ISP"}],"answer":["D","E"]},{"number":221,"text":"[IT Exam · Q221] What is a characteristic of a floating static route?","options":[{"key":"A","text":"When it is configured, it creates a gateway of last resort."},{"key":"B","text":"It is used to provide load balancing between static routes."},{"key":"C","text":"It is simply a static route with 0.0.0.0/0 as the destination IPv4 address."},{"key":"D","text":"It is configured with a higher administrative distance than the original dynamic routing protocol has."}],"answer":["D"]},{"number":222,"text":"[IT Exam · Q222] What network prefix and prefix-length combination is used to create a default static route that will match any IPv6 destination?","options":[{"key":"A","text":"FFFF::/128"},{"key":"B","text":"::1/64"},{"key":"C","text":"::/128"},{"key":"D","text":"::/0"}],"answer":null},{"number":223,"text":"[IT Exam · Q223] Consider the following command: ip route 192.168.10.0 255.255.255.0 10.10.10.2 5 What does the 5 at the end of the command signify?","options":[{"key":"A","text":"exit interface"},{"key":"B","text":"maximum number of hops to the 192.168.10.0/24 network"},{"key":"C","text":"metric"},{"key":"D","text":"administrative distance"}],"answer":["D"]},{"number":224,"text":"[IT Exam · Q224] An administrator issues the ipv6 route 2001:db8:acad:1::/32 gigabitethernet0/0 2001:db8:acad:6::1 100 command on a router . What administrative distance is assigned to this route?","options":[{"key":"A","text":"0"},{"key":"B","text":"1"},{"key":"C","text":"32"},{"key":"D","text":"100"}],"answer":["D"]},{"number":225,"text":"[IT Exam · Q225] What characteristic completes the following statement?When an IPv6 static route is configured, the next-hop address can be ......","options":[{"key":"A","text":"a destination host route with a /128 prefix."},{"key":"B","text":"the \"show ipv6 route static\" command."},{"key":"C","text":"an IPv6 link-local address on the adjacent router ."},{"key":"D","text":"the interface type and interface number ."}],"answer":["C"]},{"number":226,"text":"[IT Exam · Q226] What two pieces of information are needed in a fully specified static route to eliminate recursive lookups? (Choose two.)","options":[{"key":"A","text":"the interface ID of the next-hop neighbor"},{"key":"B","text":"the interface ID exit interface"},{"key":"C","text":"the IP address of the exit interface"},{"key":"D","text":"the IP address of the next-hop neighbor"},{"key":"E","text":"the administrative distance for the destination network"}],"answer":["B","D"]},{"number":227,"text":"[IT Exam · Q227] What route would have the lowest administrative distance?","options":[{"key":"A","text":"a route received through the OSPF routing protocol"},{"key":"B","text":"a directly connected network"},{"key":"C","text":"a static route"},{"key":"D","text":"a route received through the EIGRP routing protocol"}],"answer":null},{"number":228,"text":"[IT Exam · Q228] What characteristic completes the following statement?When an IPv6 static route is configured, as a backup route to a static route in the routing table, the \"distance\" command is used with ......","options":[{"key":"A","text":"the \"show ipv6 route static\" command."},{"key":"B","text":"an administrative distance of 2."},{"key":"C","text":"a destination host route with a /128 prefix."},{"key":"D","text":"the interface type and interface number ."}],"answer":["B"]},{"number":229,"text":"[IT Exam · Q229] A router has used the OSPF protocol to learn a route to the 172.16.32.0/19 network. Which command will implement a backup floating static route to this network?","options":[{"key":"A","text":"ip route 172.16.0.0 255.255.224.0 S0/0/0 100"},{"key":"B","text":"ip route 172.16.0.0 255.255.240.0 S0/0/0 200"},{"key":"C","text":"ip route 172.16.32.0 255.255.224.0 S0/0/0 200"},{"key":"D","text":"ip route 172.16.32.0 255.255.0.0 S0/0/0 100"}],"answer":["C"]},{"number":230,"text":"[IT Exam · Q230] Consider the following command: ip route 192.168.10.0 255.255.255.0 10.10.10.2 5 How would an administrator test this configuration?","options":[{"key":"A","text":"Delete the default gateway route on the router ."},{"key":"B","text":"Manually shut down the router interface used as a primary route."},{"key":"C","text":"Ping from the 192.168.10.0 network to the 10.10.10.2 address."},{"key":"D","text":"Ping any valid address on the 192.168.10.0/24 network."}],"answer":["B"]},{"number":231,"text":"[IT Exam · Q231] Refer to the exhibit. Which type of IPv6 static route is configured in the exhibit? ipv6 route 2001:0DB8::/32 2001:0DB8:3000::1 [EXHIBIT IN SOURCE PDF: consult original page for diagram.]","options":[{"key":"A","text":"floating static route"},{"key":"B","text":"fully specified static route"},{"key":"C","text":"recursive static route"},{"key":"D","text":"directly attached static route"}],"answer":["C"]},{"number":232,"text":"[IT Exam · Q232] What characteristic completes the following statement?When an IPv6 static route is configured, it is first necessary to configure ......","options":[{"key":"A","text":"the next-hop address of two different adjacent routers."},{"key":"B","text":"the \"ipv6 unicast-routing\" command."},{"key":"C","text":"an IPv6 link-local address on the adjacent router ."},{"key":"D","text":"an administrative distance of 2."}],"answer":["B"]},{"number":233,"text":"[IT Exam · Q233] Consider the following command: ip route 192.168.10.0 255.255.255.0 10.10.10.2 5 Which route would have to go down in order for this static route to appear in the routing table?","options":[{"key":"A","text":"a default route"},{"key":"B","text":"a static route to the 192.168.10.0/24 network"},{"key":"C","text":"an OSPF-learned route to the 192.168.10.0/24 network"},{"key":"D","text":"an EIGRP-learned route to the 192.168.10.0/24 network"}],"answer":["B"]},{"number":234,"text":"[IT Exam · Q234] What are two advantages of static routing over dynamic routing? (Choose two.)","options":[{"key":"A","text":"Static routing is more secure because it does not advertise over the network."},{"key":"B","text":"Static routing scales well with expanding networks."},{"key":"C","text":"Static routing requires very little knowledge of the network for correct implementation."},{"key":"D","text":"Static routing uses fewer router resources than dynamic routing."},{"key":"E","text":"Static routing is relatively easy to configure for large networks."}],"answer":["A","D"]},{"number":235,"text":"[IT Exam · Q235] What characteristic completes the following statement?When an IPv6 static route is configured, it is possible that the same IPv6 link-local address is used for ...","options":[{"key":"A","text":"a destination host route with a /128 prefix."},{"key":"B","text":"the \"ipv6 unicast-routing\" command."},{"key":"C","text":"the next-hop address of two different adjacent routers."},{"key":"D","text":"an administrative distance of 2."}],"answer":["C"]},{"number":236,"text":"[IT Exam · Q236] A network administrator configures the interface fa0/0 on the router R1 with the command ip address 172.16.1.254 255.255.255.0. However , when the administrator issues the command show ip route, the routing table does not show the directly connected network. What is the possible cause of the problem?","options":[{"key":"A","text":"The subnet mask is incorrect for the IPv4 address."},{"key":"B","text":"The configuration needs to be saved first."},{"key":"C","text":"The interface fa0/0 has not been activated."},{"key":"D","text":"No packets with a destination network of 172.16.1.0 have been sent to R1."}],"answer":["C"]},{"number":237,"text":"[IT Exam · Q237] What characteristic completes the following statement?When an IPv6 static route is configured, a fully-specified configuration should be used with ...","options":[{"key":"A","text":"::/0."},{"key":"B","text":"the \"ipv6 unicast-routing\" command."},{"key":"C","text":"the next-hop address of two different adjacent routers."},{"key":"D","text":"a directly connected multiaccess network."}],"answer":["D"]},{"number":238,"text":"[IT Exam · Q238] What characteristic completes the following statement?When an IPv6 static route is configured, the installation of the route can be verified with ......","options":[{"key":"A","text":"a destination host route with a /128 prefix."},{"key":"B","text":"the interface type and interface number ."},{"key":"C","text":"the \"show ipv6 route static\" command."},{"key":"D","text":"an administrative distance of 2."}],"answer":["C"]},{"number":239,"text":"[IT Exam · Q239] A network administrator configures the interface fa0/0 on the router R1 with the command ip address 172.16.1.254 255.255.255.0 . However , when the ad- ministrator issues the command show ip route , the routing table does not show the directly connected network. What is the possible cause of the problem?","options":[{"key":"A","text":"The subnet mask is incorrect for the IPv4 address."},{"key":"B","text":"No packets with a destination network of 172.16.1.0 have been sent to R1."},{"key":"C","text":"The configuration needs to be saved first."},{"key":"D","text":"The interface fa0/0 has not been activated."}],"answer":["D"]},{"number":240,"text":"[IT Exam · Q240] Ipv6 route 2001:0DB8::/32 2001:0DB8:3000::1Which static route is configured here?","options":[{"key":"A","text":"Floating static"},{"key":"B","text":"Recursive static"},{"key":"C","text":"Directly attached static"},{"key":"D","text":"Fully specified static"}],"answer":["B"]},{"number":241,"text":"[IT Exam · Q241] A network administrator is using the router-on-a-stick method to configure inter-VLAN routing. Switch port Gi1/1 is used to connect to the router . Which command should be entered to prepare this port for the task?","options":[{"key":"A","text":"Switch(config)# interface gigabitethernet 1/1 Switch(config-if)# spanning-tree vlan 1"},{"key":"B","text":"Switch(config)# interface gigabitethernet 1/1 Switch(config-if)# spanning-tree portfast"},{"key":"C","text":"Switch(config)# interface gigabitethernet 1/1 Switch(config-if)# switchport mode trunk"},{"key":"D","text":"Switch(config)# interface gigabitethernet 1/1 Switch(config-if)# switchport access vlan 1"}],"answer":["C"]},{"number":242,"text":"[IT Exam · Q242] An employee connects wirelessly to the company network using a cell phone. The employee then configures the cell phone to act as a wireless access point that will allow new employees to connect to the company network. Which type of security threat best describes this situation?","options":[{"key":"A","text":"cracking"},{"key":"B","text":"denial of service"},{"key":"C","text":"rogue access point"},{"key":"D","text":"spoofing"}],"answer":["C"]},{"number":243,"text":"[IT Exam · Q243] Which combination of WLAN authentication and encryption is recommended as a best practice for home users?","options":[{"key":"A","text":"WPA2 and AES"},{"key":"B","text":"WEP and RC4"},{"key":"C","text":"WPA and PSK"},{"key":"D","text":"EAP and AES"},{"key":"E","text":"WEP and TKIP"}],"answer":["A"]},{"number":244,"text":"[IT Exam · Q244] What are the two methods that a wireless NIC can use to discover an AP? (Choose two.)","options":[{"key":"A","text":"transmitting a probe request"},{"key":"B","text":"sending an ARP request broadcast"},{"key":"C","text":"receiving a broadcast beacon frame"},{"key":"D","text":"initiating a three-way handshake"},{"key":"E","text":"sending a multicast frame"}],"answer":["A","C"]},{"number":245,"text":"[IT Exam · Q245] What address and prefix length is used when configuring an IPv6 default static route?","options":[{"key":"A","text":"::/0"},{"key":"B","text":"::1/128"},{"key":"C","text":"0.0.0.0/0"},{"key":"D","text":"FF02::1/8"}],"answer":["A"]},{"number":246,"text":"[IT Exam · Q246] Which statement describes the behavior of a switch when the MAC address table is full?","options":[{"key":"A","text":"It treats frames as unknown unicast and floods all incoming frames to all ports on the switch."},{"key":"B","text":"It treats frames as unknown unicast and floods all incoming frames to all ports across multiple switches."},{"key":"C","text":"It treats frames as unknown unicast and floods all incoming frames to all ports within the local VLAN."},{"key":"D","text":"It treats frames as unknown unicast and floods all incoming frames to all ports within the collision domain."}],"answer":["C"]},{"number":247,"text":"[IT Exam · Q247] Which term describes the role of a Cisco switch in the 802.1X port-based access control?","options":[{"key":"A","text":"agent"},{"key":"B","text":"supplicant"},{"key":"C","text":"authenticator"},{"key":"D","text":"authentication server"}],"answer":["C"]},{"number":248,"text":"[IT Exam · Q248] What is a result of connecting two or more switches together?","options":[{"key":"A","text":"The number of broadcast domains is increased."},{"key":"B","text":"The size of the broadcast domain is increased."},{"key":"C","text":"The number of collision domains is reduced."},{"key":"D","text":"The size of the collision domain is increased."}],"answer":["B"]},{"number":249,"text":"[IT Exam · Q249] A small publishing company has a network design such that when a broadcast is sent on the LAN, 200 devices receive the transmitted broadcast. How can the network administrator reduce the number of devices that receive broadcast traffic?","options":[{"key":"A","text":"Add more switches so that fewer devices are on a particular switch."},{"key":"B","text":"Replace the switches with switches that have more ports per switch. This will allow more devices on a particular switch."},{"key":"C","text":"Segment the LAN into smaller LANs and route between them."},{"key":"D","text":"Replace at least half of the switches with hubs to reduce the size of the broadcast domain."}],"answer":["C"]},{"number":250,"text":"[IT Exam · Q250] What are two switch characteristics that could help alleviate network congestion? (Choose two.)","options":[{"key":"A","text":"fast internal switching"},{"key":"B","text":"large frame buffers"},{"key":"C","text":"store-and-forward switching"},{"key":"D","text":"low port density"},{"key":"E","text":"frame check sequence (FCS) check"}],"answer":["A","B"]},{"number":251,"text":"[IT Exam · Q251] A network engineer is configuring a LAN with a redundant first hop to make better use of the available network resources. Which protocol should the engineer implement?","options":[{"key":"A","text":"FHRP"},{"key":"B","text":"GLBP"},{"key":"C","text":"HSRP"},{"key":"D","text":"VRRP"}],"answer":["B"]},{"number":252,"text":"[IT Exam · Q252] After sticky learning of MAC addresses is enabled, what action is needed to prevent dynamically learned MAC addresses from being lost in the event that an associated interface goes down?","options":[{"key":"A","text":"Reboot the switch."},{"key":"B","text":"Copy the running configuration to the startup configuration."},{"key":"C","text":"Shut down the interface then enable it again with the no shutdown command."},{"key":"D","text":"Configure port security for violation protect mode."}],"answer":["B"]},{"number":253,"text":"[IT Exam · Q253] A small coffee shop is offering free Wi-Fi to customers. The network includes a wireless router and a DSL modem that is connected to the local phone company. What method is typically used to configure the connection to the phone company?","options":[{"key":"A","text":"Set the WAN connection in the wireless router as a DHCP client."},{"key":"B","text":"Set the connection between the wireless router and the DSL modem as a private IP network."},{"key":"C","text":"Set the DSL modem as a DHCP client to get a public IP address from the wireless router ."},{"key":"D","text":"Set the DSL modem as a DHCP client to the phone company and a DHCP server for the internal connection."}],"answer":["A"]},{"number":254,"text":"[IT Exam · Q254] Which three components are combined to form a bridge ID?","options":[{"key":"A","text":"MAC address"},{"key":"B","text":"extended system ID"},{"key":"C","text":"IP address"},{"key":"D","text":"cost"},{"key":"E","text":"bridge priority"},{"key":"F","text":"port ID"}],"answer":["A","B","E"]},{"number":255,"text":"[IT Exam · Q255] What is an advantage of PVST+?","options":[{"key":"A","text":"PVST+ requires fewer CPU cycles for all the switches in the network."},{"key":"B","text":"PVST+ reduces bandwidth consumption compared to traditional implementations of STP that use CST."},{"key":"C","text":"PVST+ optimizes performance on the network through autoselection of the root bridge."},{"key":"D","text":"PVST+ optimizes performance on the network through load sharing."}],"answer":["D"]},{"number":256,"text":"[IT Exam · Q256] Which problem is evident if the show ip interface command shows that the interface is down and the line protocol is down?","options":[{"key":"A","text":"An encapsulation mismatch has occurred."},{"key":"B","text":"A cable has not been attached to the port."},{"key":"C","text":"The no shutdown command has not been issued on the interface."},{"key":"D","text":"There is an IP address conflict with the configured address on the interface."}],"answer":["B"]},{"number":257,"text":"[IT Exam · Q257] A technician is configuring a new Cisco 2960 switch. What is the effect of issuing the BranchSw(config)#interface VLAN88 command?","options":[{"key":"A","text":"It updates the MAC address table for the associated port."},{"key":"B","text":"It applies an IPv4 address to the virtual interface."},{"key":"C","text":"It permits an IPv6 address to be configured on a switch physical interface."},{"key":"D","text":"It applies an IPv6 address to the virtual interface."},{"key":"E","text":"It enters configuration mode for a switch virtual interface."}],"answer":["E"]},{"number":258,"text":"[IT Exam · Q258] In what situation would a Layer 2 switch have an IP address configured?","options":[{"key":"A","text":"when the Layer 2 switch is using a routed port"},{"key":"B","text":"when the Layer 2 switch needs to be remotely managed"},{"key":"C","text":"when the Layer 2 switch is the default gateway of user traffic"},{"key":"D","text":"when the Layer 2 switch needs to forward user traffic to another device"}],"answer":["B"]},{"number":259,"text":"[IT Exam · Q259] Which command would create a valid IPv6 default route?","options":[{"key":"A","text":"ipv6 route ::/0 2001:db8:acad:2::a"},{"key":"B","text":"ipv6 route ::/0 fe80::1"},{"key":"C","text":"ipv6 route ::/128 2001:db8:acad:1::1"},{"key":"D","text":"ipv6 route 2001:db8:acad:1::/64 ::1"}],"answer":["A"]},{"number":260,"text":"[IT Exam · Q260] A junior technician was adding a route to a LAN router . A traceroute to a device on the new network revealed a wrong path and unreachable status. What should be done or checked?","options":[{"key":"A","text":"Create a floating static route to that network."},{"key":"B","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"C","text":"Check the configuration of the exit interface on the new static route."},{"key":"D","text":"Verify that the static route to the server is present in the routing table."}],"answer":["C"]},{"number":261,"text":"[IT Exam · Q261] Which command will start the process to bundle two physical interfaces to create an EtherChannel group via LACP?","options":[{"key":"A","text":"channel-group 2 mode auto"},{"key":"B","text":"interface port-channel 2"},{"key":"C","text":"channel-group 1 mode desirable"},{"key":"D","text":"interface range GigabitEthernet 0/4 - 5"}],"answer":["D"]},{"number":262,"text":"[IT Exam · Q262] Which type of traffic is designed for a native VLAN?","options":[{"key":"A","text":"management"},{"key":"B","text":"user-generated"},{"key":"C","text":"tagged"},{"key":"D","text":"untagged"}],"answer":["D"]},{"number":263,"text":"[IT Exam · Q263] What type of VLAN is configured specifically for network traffic such as SSH, Telnet, HTTPS, HTTP , and SNMP?","options":[{"key":"A","text":"management VLAN"},{"key":"B","text":"security VLAN"},{"key":"C","text":"trunk VLAN"},{"key":"D","text":"voice VLAN"}],"answer":["A"]},{"number":264,"text":"[IT Exam · Q264] A network administrator is implementing DHCPv6 for the company. The administrator configures a router to send RA messages with M flag as 1 by using the interface command ipv6 nd managed-config-flag . What effect will this configuration have on the operation of the clients?","options":[{"key":"A","text":"Clients must use the information that is contained in RA messages."},{"key":"B","text":"Clients must use all configuration information that is provided by a DHCPv6 server ."},{"key":"C","text":"Clients must use the prefix and prefix length that are provided by a DHCPv6 server and generate a random interface ID."},{"key":"D","text":"Clients must use the prefix and prefix length that are provided by RA messages and obtain additional information from a DHCPv6 server ."}],"answer":["B"]},{"number":265,"text":"[IT Exam · Q265] On which port should Dynamic ARP Inspection (DAI) be configured on a switch?","options":[{"key":"A","text":"access ports only"},{"key":"B","text":"any untrusted port"},{"key":"C","text":"an uplink port to another switch"},{"key":"D","text":"on any port where DHCP snooping is disabled"}],"answer":["C"]},{"number":266,"text":"[IT Exam · Q266] Which Cisco solution helps prevent ARP spoofing and ARP poisoning attacks?","options":[{"key":"A","text":"Dynamic ARP Inspection"},{"key":"B","text":"IP Source Guard"},{"key":"C","text":"DHCP Snooping"},{"key":"D","text":"Port Security"}],"answer":["A"]},{"number":267,"text":"[IT Exam · Q267] What is the reason for disabling SSID broadcasting and changing the default SSID on a wireless access point?","options":[{"key":"A","text":"Wireless clients must then have the SSID manually configured to connect to the wireless network."},{"key":"B","text":"Disabling SSID broadcasting frees up radio frequency bandwidth and increases the data throughput of the access point."},{"key":"C","text":"Anyone with the default SSID can gain access to the access point and change the configuration."},{"key":"D","text":"The access point stops broadcasting its own MAC address, thus preventing unauthorized wireless clients from connecting to the network."}],"answer":["A"]},{"number":268,"text":"[IT Exam · Q268] What are two characteristics of Cisco Express Forwarding (CEF)? (Choose two.)","options":[{"key":"A","text":"When a packet arrives on a router interface, it is forwarded to the control plane where the CPU searches for a match in the fast-switching cache."},{"key":"B","text":"This is the fastest forwarding mechanism on Cisco routers and multilayer switches."},{"key":"C","text":"With this switching method, flow information for a packet is stored in the fast-switching cache to forward future packets to the same destination without CPU intervention."},{"key":"D","text":"When a packet arrives on a router interface, it is forwarded to the control plane where the CPU matches the destination address with a matching routing table entry."},{"key":"E","text":"Packets are forwarded based on information in the FIB and an adjacency table."}],"answer":null},{"number":269,"text":"[IT Exam · Q269] A network administrator of a college is configuring WLAN security with WPA2 Enterprise authentication. Which server is required when deploying this type of authentication?","options":[{"key":"A","text":"AAA"},{"key":"B","text":"RADIUS"},{"key":"C","text":"DHCP"},{"key":"D","text":"SNMP"}],"answer":["B"]},{"number":270,"text":"[IT Exam · Q270] What is a potential issue when using the WLC to upgrade and deploy the latest firmware image to all APs?","options":[{"key":"A","text":"Usernames and passwords must be manually entered into the AP so that WLAN authentication continues during the upgrade."},{"key":"B","text":"Only one of the two bands would work at a time."},{"key":"C","text":"Users will not be able to use the WLAN."},{"key":"D","text":"Old 802.11 standards may not be supported anymore."}],"answer":["C"]},{"number":271,"text":"[IT Exam · Q271] A network administrator is configuring a WLC to provide WLAN access to users in an office building. When testing the newly created WLAN, the administrator does not see the SSID from a wireless device. What is a possible cause?","options":[{"key":"A","text":"The WLAN security setting is incorrect."},{"key":"B","text":"The APs have not been configured for the new WLAN."},{"key":"C","text":"The new WLAN needs to be enabled."},{"key":"D","text":"The RADUIS server is not operational."}],"answer":["C"]},{"number":272,"text":"[IT Exam · Q272] What is the best way to prevent a VLAN hopping attack?","options":[{"key":"A","text":"Disable trunk negotiation for trunk ports and statically set nontrunk ports as access ports."},{"key":"B","text":"Disable STP on all nontrunk ports."},{"key":"C","text":"Use VLAN 1 as the native VLAN on trunk ports."},{"key":"D","text":"Use ISL encapsulation on all trunk links."}],"answer":null},{"number":273,"text":"[IT Exam · Q273] Which option shows a correctly configured IPv4 default static route?","options":[{"key":"A","text":"ip route 0.0.0.0 255.255.255.0 S0/0/0"},{"key":"B","text":"ip route 0.0.0.0 0.0.0.0 S0/0/0"},{"key":"C","text":"ip route 0.0.0.0 255.255.255.255 S0/0/0"},{"key":"D","text":"ip route 0.0.0.0 255.0.0.0 S0/0/0"}],"answer":["B"]},{"number":274,"text":"[IT Exam · Q274] What is a method to launch a VLAN hopping attack?","options":[{"key":"A","text":"introducing a rogue switch and enabling trunking"},{"key":"B","text":"sending spoofed native VLAN information"},{"key":"C","text":"sending spoofed IP addresses from the attacking host"},{"key":"D","text":"flooding the switch with MAC addresses"}],"answer":["A"]},{"number":275,"text":"[IT Exam · Q275] A cybersecurity analyst is using the macof tool to evaluate configurations of switches deployed in the backbone network of an organization. Which type of LAN attack is the analyst targeting during this evaluation?","options":[{"key":"A","text":"VLAN hopping"},{"key":"B","text":"DHCP spoofing"},{"key":"C","text":"MAC address table overflow"},{"key":"D","text":"VLAN double-tagging"}],"answer":null},{"number":276,"text":"[IT Exam · Q276] Which statement is correct about how a Layer 2 switch determines how to forward frames?","options":[{"key":"A","text":"Frame forwarding decisions are based on MAC address and port mappings in the CAM table."},{"key":"B","text":"Only frames with a broadcast destination address are forwarded out all active switch ports."},{"key":"C","text":"Unicast frames are always forwarded regardless of the destination MAC address."},{"key":"D","text":"Cut-through frame forwarding ensures that invalid frames are always dropped."}],"answer":["A"]},{"number":277,"text":"[IT Exam · Q277] Which statement describes a result after multiple Cisco LAN switches are interconnected?","options":[{"key":"A","text":"The broadcast domain expands to all switches."},{"key":"B","text":"One collision domain exists per switch."},{"key":"C","text":"There is one broadcast domain and one collision domain per switch."},{"key":"D","text":"Frame collisions increase on the segments connecting the switches."},{"key":"E","text":"Unicast frames are always forwarded regardless of the destination MAC address."}],"answer":["A"]},{"number":278,"text":"[IT Exam · Q278] An administrator is trying to remove configurations from a switch. After using the command erase startup-config and reloading the switch, the administrator finds that VLANs 10 and 100 still exist on the switch. Why were these VLANs not removed?","options":[{"key":"A","text":"Because these VLANs are stored in a file that is called vlan.dat that is located in flash memory, this file must be manually deleted."},{"key":"B","text":"These VLANs cannot be deleted unless the switch is in VTP client mode."},{"key":"C","text":"These VLANs are default VLANs that cannot be removed."},{"key":"D","text":"These VLANs can only be removed from the switch by using the no vlan 10 and no vlan 100 commands."}],"answer":["A"]},{"number":279,"text":"[IT Exam · Q279] What is a secure configuration option for remote access to a network device?","options":[{"key":"A","text":"Configure an ACL and apply it to the VTY lines."},{"key":"B","text":"Configure 802.1x."},{"key":"C","text":"Configure SSH."},{"key":"D","text":"Configure Telnet."}],"answer":["C"]},{"number":280,"text":"[IT Exam · Q280] Which wireless encryption method is the most secure?","options":[{"key":"A","text":"WPA2 with AES"},{"key":"B","text":"WPA2 with TKIP"},{"key":"C","text":"WEP"},{"key":"D","text":"WPA"}],"answer":["A"]},{"number":281,"text":"[IT Exam · Q281] After attaching four PCs to the switch ports, configuring the SSID and setting authentication properties for a small office network, a technician successfully tests the connectivity of all PCs that are connected to the switch and WLAN. A firewall is then configured on the device prior to connecting it to the Internet. What type of network device includes all of the described features?","options":[{"key":"A","text":"firewall appliance"},{"key":"B","text":"wireless router"},{"key":"C","text":"switch"},{"key":"D","text":"standalone wireless access point"}],"answer":["B"]},{"number":282,"text":"[IT Exam · Q282] What protocol or technology disables redundant paths to eliminate Layer 2 loops?","options":[{"key":"A","text":"VTP"},{"key":"B","text":"STP"},{"key":"C","text":"EtherChannel"},{"key":"D","text":"DTP"}],"answer":["B"]},{"number":283,"text":"[IT Exam · Q283] Which two VTP modes allow for the creation, modification, and deletion of VLANs on the local switch? (Choose two.)","options":[{"key":"A","text":"client"},{"key":"B","text":"master"},{"key":"C","text":"distribution"},{"key":"D","text":"slave"},{"key":"E","text":"server"},{"key":"F","text":"transparent"}],"answer":["E","F"]},{"number":284,"text":"[IT Exam · Q284] Which three steps should be taken before moving a Cisco switch to a new VTP management domain? (Choose three.)","options":[{"key":"A","text":"Configure the switch with the name of the new management domain."},{"key":"B","text":"Reset the VTP counters to allow the switch to synchronize with the other switches in the domain."},{"key":"C","text":"Configure the VTP server in the domain to recognize the BID of the new switch."},{"key":"D","text":"Download the VTP database from the VTP server in the new domain."},{"key":"E","text":"Select the correct VTP mode and version."},{"key":"F","text":"Reboot the switch."}],"answer":["A","E","F"]},{"number":285,"text":"[IT Exam · Q285] A network administrator is preparing the implementation of Rapid PVST+ on a production network. How are the Rapid PVST+ link types determined on the switch interfaces?","options":[{"key":"A","text":"Link types can only be configured on access ports configured with a single VLAN."},{"key":"B","text":"Link types can only be determined if PortFast has been configured."},{"key":"C","text":"Link types are determined automatically."},{"key":"D","text":"Link types must be configured with specific port configuration commands."}],"answer":["C"]},{"number":286,"text":"[IT Exam · Q286] How will a router handle static routing differently if Cisco Express Forwarding is disabled?","options":[{"key":"A","text":"It will not perform recursive lookups."},{"key":"B","text":"Ethernet multiaccess interfaces will require fully specified static routes to avoid routing inconsistencies."},{"key":"C","text":"Static routes that use an exit interface will be unnecessary."},{"key":"D","text":"Serial point-to-point interfaces will require fully specified static routes to avoid routing inconsistencies."}],"answer":["B"]},{"number":287,"text":"[IT Exam · Q287] Compared with dynamic routes, what are two advantages of using static routes on a router? (Choose two.)","options":[{"key":"A","text":"They improve netw ork security."},{"key":"B","text":"They take less time to converge when the network topology changes."},{"key":"C","text":"They improve the efficiency of discovering neighboring networks."},{"key":"D","text":"They use fewer router resources."}],"answer":["A","D"]},{"number":288,"text":"[IT Exam · Q288] What is the effect of entering the spanning-tree portfast configuration command on a switch?","options":[{"key":"A","text":"It disables an unused port."},{"key":"B","text":"It disables all trunk ports."},{"key":"C","text":"It enables portfast on a specific switch interface."},{"key":"D","text":"It checks the source L2 address in the Ethernet header against the sender L2 address in the ARP body."}],"answer":["C"]},{"number":289,"text":"[IT Exam · Q289] What is the IPv6 prefix that is used for link-local addresses?","options":[{"key":"A","text":"FF01::/8"},{"key":"B","text":"2001::/3"},{"key":"C","text":"FC00::/7"},{"key":"D","text":"FE80::/10"}],"answer":["D"]},{"number":290,"text":"[IT Exam · Q290] Which two statements are characteristics of routed ports on a multilayer switch? (Choose two.)","options":[{"key":"A","text":"In a switched network, they are mostly configured between switches at the core and distribution layers."},{"key":"B","text":"The interface vlan command has to be entered to create a VLAN on routed ports."},{"key":"C","text":"They support subinterfaces, like interfaces on the Cisco IOS routers."},{"key":"D","text":"They are used for point-to-multipoint links."},{"key":"E","text":"They are not associated with a particular VLAN."}],"answer":["A","E"]},{"number":291,"text":"[IT Exam · Q291] Successful inter-VLAN routing has been operating on a network with multiple VLANs across multiple switches for some time. When an inter-switch trunk link fails and Spanning Tree Protocol brings up a back- up trunk link, it is reported that hosts on two VLANs can access some, but not all the network resources that could be accessed previously. Hosts on all other VLANS do not have this problem. What is the most likely cause of this problem?","options":[{"key":"A","text":"The protected edge port function on the backup trunk interfaces has been disabled."},{"key":"B","text":"The allowed VLANs on the backup link were not configured correctly."},{"key":"C","text":"Dynamic Trunking Protocol on the link has failed."},{"key":"D","text":"Inter-VLAN routing also failed when the trunk link failed."}],"answer":["A"]},{"number":292,"text":"[IT Exam · Q292] Which command will start the process to bundle two physical interfaces to create an EtherChannel group via LACP?","options":[{"key":"A","text":"interface port-channel 2"},{"key":"B","text":"channel-group 1 mode desirable"},{"key":"C","text":"interface range GigabitEthernet 0/4 - 5"},{"key":"D","text":"channel-group 2 mode auto"}],"answer":["C"]},{"number":293,"text":"[IT Exam · Q293] What action takes place when a frame entering a switch has a multicast destination MAC address?","options":[{"key":"A","text":"The switch will forward the frame out all ports except the incoming port."},{"key":"B","text":"The switch forwards the frame out of the specified port."},{"key":"C","text":"The switch adds a MAC address table entry mapping for the destination MAC address and the ingress port."},{"key":"D","text":"The switch replaces the old entry and uses the more current port."}],"answer":["A"]},{"number":294,"text":"[IT Exam · Q294] A junior technician was adding a route to a LAN router . A traceroute to a device on the new network revealed a wrong path and unreachable status. What should be done or checked?","options":[{"key":"A","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"B","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"C","text":"Create a floating static route to that network."},{"key":"D","text":"Check the configuration of the exit interface on the new static route."}],"answer":["D"]},{"number":295,"text":"[IT Exam · Q295] Select the three PAgP channel establishment modes. (Choose three.)","options":[{"key":"A","text":"auto"},{"key":"B","text":"default"},{"key":"C","text":"passive"},{"key":"D","text":"desirable"},{"key":"E","text":"extended"},{"key":"F","text":"on"}],"answer":["A","D","F"]},{"number":296,"text":"[IT Exam · Q296] A static route has been configured on a router . However , the destination network no longer exists. What should an administrator do to remove the static route from the routing table?","options":[{"key":"A","text":"Remove the route using the no ip route command."},{"key":"B","text":"Change the administrative distance for that route."},{"key":"C","text":"Change the routing metric for that route."},{"key":"D","text":"Nothing. The static route will go away on its own."}],"answer":["A"]},{"number":297,"text":"[IT Exam · Q297] What two default wireless router settings can affect network security? (Choose two.)","options":[{"key":"A","text":"The SSID is broadcast."},{"key":"B","text":"MAC address filtering is enabled."},{"key":"C","text":"WEP encryption is enabled."},{"key":"D","text":"The wireless channel is automatically selected."},{"key":"E","text":"A well-known administrator password is set."}],"answer":["A","E"]},{"number":298,"text":"[IT Exam · Q298] What is the common term given to SNMP log messages that are generated by network devices and sent to the SNMP server?","options":[{"key":"A","text":"traps"},{"key":"B","text":"acknowledgments"},{"key":"C","text":"auditing"},{"key":"D","text":"warnings"}],"answer":["A"]},{"number":299,"text":"[IT Exam · Q299] A network administrator is adding a new WLAN on a Cisco 3500 series WLC. Which tab should the administrator use to create a new VLAN interface to be used for the new WLAN?","options":[{"key":"A","text":"WIRELESS"},{"key":"B","text":"MANAGEMENT"},{"key":"C","text":"CONTROLLER"},{"key":"D","text":"WLANs"}],"answer":["C"]},{"number":300,"text":"[IT Exam · Q300] A network administrator is configuring a WLAN. Why would the administrator change the default DHCP IPv4 addresses on an AP?","options":[{"key":"A","text":"to restrict access to the WLAN by authorized, authenticated users only"},{"key":"B","text":"to monitor the operation of the wireless network"},{"key":"C","text":"to reduce outsiders intercepting data or accessing the wireless network by using a well-known address range"},{"key":"D","text":"to reduce the risk of interference by external devices such as microwave ovens"}],"answer":["C"]},{"number":301,"text":"[IT Exam · Q301] Which two functions are performed by a WLC when using split media access control (MAC)? (Choose two.)","options":[{"key":"A","text":"packet acknowledgments and retransmissions"},{"key":"B","text":"frame queuing and packet prioritization"},{"key":"C","text":"beacons and probe responses"},{"key":"D","text":"frame translation to other protocols"},{"key":"E","text":"association and re-association of roaming clients"}],"answer":["D","E"]},{"number":302,"text":"[IT Exam · Q302] On what switch ports should BPDU guard be enabled to enhance STP stability?","options":[{"key":"A","text":"all PortFast-enabled ports"},{"key":"B","text":"only ports that are elected as designated ports"},{"key":"C","text":"only ports that attach to a neighboring switch"},{"key":"D","text":"all trunk ports that are not root ports"}],"answer":["A"]},{"number":303,"text":"[IT Exam · Q303] Which network attack is mitigated by enabling BPDU guard?","options":[{"key":"A","text":"rogue switches on a network"},{"key":"B","text":"CAM table overflow attacks"},{"key":"C","text":"MAC address spoofing"},{"key":"D","text":"rogue DHCP servers on a network"}],"answer":["A"]},{"number":304,"text":"[IT Exam · Q304] Why is DHCP snooping required when using the Dynamic ARP Inspection feature?","options":[{"key":"A","text":"It relies on the settings of trusted and untrusted ports set by DHCP snooping."},{"key":"B","text":"It uses the MAC address table to verify the default gateway IP address."},{"key":"C","text":"It redirects ARP requests to the DHCP server for verification."},{"key":"D","text":"It uses the MAC-address-to-IP-address binding database to validate an ARP packet."}],"answer":["D"]},{"number":305,"text":"[IT Exam · Q305] A network administrator is configuring a new Cisco switch for remote management access. Which three items must be configured on the switch for the task? (Choose three.)","options":[{"key":"A","text":"IP address"},{"key":"B","text":"VTP domain"},{"key":"C","text":"vty lines"},{"key":"D","text":"default VLAN"},{"key":"E","text":"default gateway"},{"key":"F","text":"loopback address"}],"answer":["A","C","E"]},{"number":306,"text":"[IT Exam · Q306] A technician is troubleshooting a slow WLAN and decides to use the split-the-traffic approach. Which two parameters would have to be configured to do this? (Choose two.)","options":[{"key":"A","text":"Configure the 5 GHz band for streaming multimedia and time sensitive traffic."},{"key":"B","text":"Configure the security mode to WPA Personal TKIP/AES for one network and WPA2 Personal AES for the other network"},{"key":"C","text":"Configure the 2.4 GHz band for basic internet traffic that is not time sensitive."},{"key":"D","text":"Configure the security mode to WPA Personal TKIP/AES for both networks."},{"key":"E","text":"Configure a common SSID for both split networks."}],"answer":["A","C"]},{"number":307,"text":"[IT Exam · Q307] A company has just switched to a new ISP . The ISP has completed and checked the connection from its site to the company. However , employees at the company are not able to access the internet. What should be done or checked?","options":[{"key":"A","text":"Verify that the static route to the server is present in the routing table."},{"key":"B","text":"Check the configuration on the floating static route and adjust the AD."},{"key":"C","text":"Ensure that the old default route has been removed from the company edge routers."},{"key":"D","text":"Create a floating static route to that network."}],"answer":["C"]},{"number":308,"text":"[IT Exam · Q308] Which information does a switch use to populate the MAC address table?","options":[{"key":"A","text":"the destination MAC address and the incoming port"},{"key":"B","text":"the destination MAC address and the outgoing port"},{"key":"C","text":"the source and destination MAC addresses and the incoming port"},{"key":"D","text":"the source and destination MAC addresses and the outgoing port"},{"key":"E","text":"the source MAC address and the incoming port"},{"key":"F","text":"the source MAC address and the outgoing port"}],"answer":["E"]},{"number":309,"text":"[IT Exam · Q309] Which type of static route is configured with a greater administrative distance to provide a backup route to a route learned from a dynamic routing protocol?","options":[{"key":"A","text":"floating static route"},{"key":"B","text":"default static route"},{"key":"C","text":"summary static route"},{"key":"D","text":"standard static route"}],"answer":["A"]},{"number":310,"text":"[IT Exam · Q310] What action takes place when a frame entering a switch has a unicast destination MAC address appearing in the MAC address table?","options":[{"key":"A","text":"The switch updates the refresh timer for the entry."},{"key":"B","text":"The switch forwards the frame out of the specified port."},{"key":"C","text":"The switch purges the entire MAC address table."},{"key":"D","text":"The switch replaces the old entry and uses the more current port."}],"answer":["B"]},{"number":311,"text":"[IT Exam · Q311] What protocol or technology allows data to transmit over redundant switch links?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"DTP"},{"key":"C","text":"STP"},{"key":"D","text":"VTP"}],"answer":["A"]},{"number":312,"text":"[IT Exam · Q312] What is the effect of entering the shutdown configuration command on a switch?","options":[{"key":"A","text":"It enables BPDU guard on a specific port."},{"key":"B","text":"It disables an unused port."},{"key":"C","text":"It enables portfast on a specific switch interface."},{"key":"D","text":"It disables DTP on a non-trunking interface."}],"answer":["B"]},{"number":313,"text":"[IT Exam · Q313] What would be the primary reason an attacker would launch a MAC address overflow attack?","options":[{"key":"A","text":"so that the switch stops forwarding traffic"},{"key":"B","text":"so that legitimate hosts cannot obtain a MAC address"},{"key":"C","text":"so that the attacker can see frames that are destined for other hosts"},{"key":"D","text":"so that the attacker can execute arbitrary code on the switch"}],"answer":["C"]},{"number":314,"text":"[IT Exam · Q314] During the AAA process, when will authorization be implemented?","options":[{"key":"A","text":"Immediately after successful authentication against an AAA data source"},{"key":"B","text":"Immediately after AAA accounting and auditing receives detailed reports"},{"key":"C","text":"Immediately after an AAA client sends authentication information to a centralized server"},{"key":"D","text":"Immediately after the determination of which resources a user can access"}],"answer":["A"]},{"number":315,"text":"[IT Exam · Q315] A company security policy requires that all MAC addressing be dynamically learned and added to both the MAC address table and the running configuration on each switch. Which port security configuration will accomplish this?","options":[{"key":"A","text":"auto secure MAC addresses"},{"key":"B","text":"dynamic secure MAC addresses"},{"key":"C","text":"static secure MAC addresses"},{"key":"D","text":"sticky secure MAC addresses"}],"answer":["D"]},{"number":316,"text":"[IT Exam · Q316] Which three Wi-Fi standards operate in the 2.4GHz range of frequencies? (Choose three.)","options":[{"key":"A","text":"802.11a"},{"key":"B","text":"802.11b"},{"key":"C","text":"802.11g"},{"key":"D","text":"802.11n"},{"key":"E","text":"802.11ac"}],"answer":["B","C","D"]},{"number":317,"text":"[IT Exam · Q317] To obtain an overview of the spanning tree status of a switched network, a network engineer issues the show spanning-tree command on a switch. Which two items of information will this command display? (Choose two.)","options":[{"key":"A","text":"The root bridge BID."},{"key":"B","text":"The role of the ports in all VLANs."},{"key":"C","text":"The status of native VLAN ports."},{"key":"D","text":"The number of broadcasts received on each root port."},{"key":"E","text":"The IP address of the management VLAN interface."}],"answer":["A","B"]},{"number":318,"text":"[IT Exam · Q318] Which method of IPv6 prefix assignment relies on the prefix contained in RA messages?","options":[{"key":"A","text":"EUI-64"},{"key":"B","text":"SLAAC"},{"key":"C","text":"static"},{"key":"D","text":"stateful DHCPv6"}],"answer":["B"]},{"number":319,"text":"[IT Exam · Q319] Which two protocols are used to provide server-based AAA authentication? (Choose two.)","options":[{"key":"A","text":"802.1x"},{"key":"B","text":"SSH"},{"key":"C","text":"SNMP"},{"key":"D","text":"TACACS+"},{"key":"E","text":"RADIUS"}],"answer":["D","E"]},{"number":320,"text":"[IT Exam · Q320] A network administrator is configuring a WLAN. Why would the administrator disable the broadcast feature for the SSID?","options":[{"key":"A","text":"to eliminate outsiders scanning for available SSIDs in the area"},{"key":"B","text":"to reduce the risk of interference by external devices such as microwave ovens"},{"key":"C","text":"to reduce the risk of unauthorized APs being added to the network"},{"key":"D","text":"to provide privacy and integrity to wireless traffic by using encryption"}],"answer":null},{"number":321,"text":"[IT Exam · Q321] Which mitigation technique would prevent rogue servers from providing false IP configuration parameters to clients?","options":[{"key":"A","text":"implementing port security"},{"key":"B","text":"turning on DHCP snooping"},{"key":"C","text":"disabling CDP on edge ports"},{"key":"D","text":"implementing port-security on edge ports"}],"answer":["B"]},{"number":322,"text":"[IT Exam · Q322] A network administrator configures the port security feature on a switch. The security policy specifies that each access port should allow up to two MAC addresses. When the maximum number of MAC addresses is reached, a frame with the unknown source MAC address is dropped and a notification is sent to the syslog server . Which security violation mode should be configured for each access port?","options":[{"key":"A","text":"shutdown"},{"key":"B","text":"restrict"},{"key":"C","text":"warning"},{"key":"D","text":"protect"}],"answer":["B"]},{"number":323,"text":"[IT Exam · Q323] What protocol or technology defines a group of routers, one of them defined as active and another one as standby?","options":[{"key":"A","text":"EtherChannel"},{"key":"B","text":"VTP"},{"key":"C","text":"HSRP"},{"key":"D","text":"DTP"}],"answer":["C"]},{"number":324,"text":"[IT Exam · Q324] Which three pairs of trunking modes will establish a functional trunk link between two Cisco switches? (Choose three.)","options":[{"key":"A","text":"dynamic auto - dynamic auto"},{"key":"B","text":"access - trunk"},{"key":"C","text":"dynamic desirable - trunk"},{"key":"D","text":"access - dynamic auto"},{"key":"E","text":"dynamic desirable - dynamic desirable"},{"key":"F","text":"dynamic desirable - dynamic auto"}],"answer":["C","E","F"]},{"number":325,"text":"[IT Exam · Q325] A technician is configuring a router for a small company with multiple WLANs and doesn't need the complexity of a dynamic routing protocol. What should be done or checked?","options":[{"key":"A","text":"Verify that there is not a default route in any of the edge router routing tables."},{"key":"B","text":"Create static routes to all internal networks and a default route to the internet."},{"key":"C","text":"Create extra static routes to the same location with an AD of 1."},{"key":"D","text":"Check the statistics on the default route for oversaturation."}],"answer":["B"]},{"number":326,"text":"[IT Exam · Q326] A company is deploying a wireless network in the distribution facility in a Boston suburb. The warehouse is quite large and it requires multiple access points to be used. Because some of the company devices still operate at 2.4GHz, the network administrator decides to deploy the 802.11g standard. Which channel assignments on the multiple access points will make sure that the wireless channels are not overlapping?","options":[{"key":"A","text":"channels 1, 5, and 9"},{"key":"B","text":"channels 1, 6, and 11"},{"key":"C","text":"channels 1, 7, and 13"},{"key":"D","text":"channels 2, 6, and 10"}],"answer":["B"]},{"number":327,"text":"[IT Exam · Q327] A network administrator of a small advertising company is configuring WLAN security by using the WPA2 PSK method. Which credential do office users need in order to connect their laptops to the WLAN?","options":[{"key":"A","text":"the company username and password through Active Directory service"},{"key":"B","text":"a key that matches the key on the AP"},{"key":"C","text":"a user passphrase"},{"key":"D","text":"a username and password configured on the AP"}],"answer":["B"]},{"number":328,"text":"[IT Exam · Q328] What mitigation plan is best for thwarting a DoS attack that is creating a MAC address table overflow?","options":[{"key":"A","text":"Disable DTP ."},{"key":"B","text":"Disable STP ."},{"key":"C","text":"Enable port security."},{"key":"D","text":"Place unused ports in an unused VLAN."}],"answer":["C"]},{"number":329,"text":"[IT Exam · Q329] Why might this solution improve the wireless network performance for that type of service?","options":[{"key":"A","text":"Requiring the users to switch to the 5 GHz band for streaming media is inconvenient and will result in fewer users accessing these services."},{"key":"B","text":"The 5 GHz band has more channels and is less crowded than the 2.4 GHz band, which makes it more suited to streaming multimedia."},{"key":"C","text":"The 5 GHz band has a greater range and is therefore likely to be interference-free."},{"key":"D","text":"The only users that can switch to the 5 GHz band will be those with the lat
