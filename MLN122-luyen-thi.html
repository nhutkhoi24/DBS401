const sets=[{"id":"FA25_C1FE","title":"FA25 • Câu 1","group":"Bộ đề","questions":[{"number":1,"text":"Đảng Cộng sản Việt Nam luôn nhấn mạnh tâm quan trọng của việc xây dựng nền kinh tế như thế nào?","options":[{"key":"A","text":"Mở cửa"},{"key":"B","text":"Độc lập, tự chủ"},{"key":"C","text":"Hội nhập kinh tế quốc tế"},{"key":"D","text":"Có tính cạnh tranh"}],"answer":["B"]},{"number":2,"text":"Hàng hóa sức lao động ra đời phải dựa trên:","options":[{"key":"A","text":"Ba điều kiện"},{"key":"B","text":"Một điều kiện"},{"key":"C","text":"Hai điều kiện"}],"answer":["C"]},{"number":3,"text":"Lao động trừu tượng tao ra yếu tố nào?","options":[{"key":"A","text":"Giá trị của hàng hoá"},{"key":"B","text":"Giá trị sử dụng của hàng hoá"},{"key":"C","text":"Tiên lương"},{"key":"D","text":"Lợi nhuận cho tư bản"}],"answer":["A"]},{"number":4,"text":"Giá tri cá biệt của hàng hoá do:","options":[{"key":"A","text":"Hao phí lao động cá biệt của người sản xuất quyết định"},{"key":"B","text":"Hao phí lao động cá biệt của người sản xuất nhiều hàng hoá quyết định"},{"key":"C","text":"Hao phí lao động của ngành quyết định"},{"key":"D","text":"Hao phí lao động xã hội cần thiết quyết định"}],"answer":["A"]},{"number":5,"text":"Giá trị sử dung của hàng hóa phản ánh:","options":[{"key":"A","text":"Tính chất tu nhân của hàng hóa"},{"key":"B","text":"Tính chất xã hội của hàng hóa"},{"key":"C","text":"Cả tính chất tư nhân và tinh chất xã hội của hàng hóa"},{"key":"D","text":"Lao động trừu tượng của người sản xuất"}],"answer":["A"]},{"number":6,"text":"Giá trị xã hội của hàng hoá công nghiệp và nông nghiệp giống nhau ở chỗ dựa trên:","options":[{"key":"A","text":"Hao phí lao động xã hội cần thiết"},{"key":"B","text":"Hao phí lao động xã hội trong điều kiện sản xuất trung bình"},{"key":"C","text":"Hao phí lao động xã hội trong điều kiện sản xuất khó khăn nhất"}],"answer":["A"]},{"number":7,"text":"Liên kết các doanh nghiệp theo cùng một ngành là theo hình thức:","options":[{"key":"A","text":"Liên kết dọc"},{"key":"B","text":"Liên kết ngang"},{"key":"C","text":"Ca liên kết dọc và liên kết ngang"},{"key":"D","text":"Liên kết đa ngành"}],"answer":["B"]},{"number":8,"text":"Chế độ tham dự của tư bản tài chính được thiết lập do:","options":[{"key":"A","text":"Số cổ phiếu khống chế"},{"key":"B","text":"Lợi nhuận"},{"key":"C","text":"Lợi tức"}],"answer":["A"]},{"number":9,"text":"Những đặc điểm kinh tế cơ bản nhất của chủ nghĩa tư bản độc quyền bao gồm:","options":[{"key":"A","text":"Tập trung sản xuất cùng với các tổ chức độc quyền; tư bản tài chính; xuất khẩu tư bản; sự phân chia thế giới về lãnh thổ giữa các nước đế quốc"},{"key":"B","text":"Tập trung sản xuất cùng với các tổ chức độc quyền; tư bản tài chính; sự phân chia thị trường thế giới giữa các tổ chức độc quyền; sự phân chia thế giới về lãnh thổ giữa các nước đế quốc"},{"key":"C","text":"Tập trung sản xuất cùng với các tổ chức độc quyền; xuất khẩu tư ban; sự phân chia thị trường thế giới giữa các tổ chức độc quyền; sự phân chia thế giới về lãnh thổ giữa các nước đế quốc"},{"key":"D","text":"Tập trung sản xuất cùng với các tổ chức độc quyền; tư bản tài chính; xuất khẩu tư bản; sự phân chia thị trường thé giới giữa các tổ chức độc quyền; sự phân chia thé giới về lãnh thổ giữa các nước dé quốc"}],"answer":["D"]},{"number":10,"text":"Về kinh tế, xuất khẩu tư bản nhà nước thường hướng vào:","options":[{"key":"A","text":"Ngành kết cấu hạ tầng"},{"key":"B","text":"Ngành có vốn chu chuyển nhanh"},{"key":"C","text":"Ngành công nghệ mới"}],"answer":["A"]},{"number":11,"text":"Các tổ chức độc quyền sử dụng giá cả độc quyền để:","options":[{"key":"A","text":"Củng cố vai trò của tổ chức độc quyền"},{"key":"B","text":"Chiếm đoạt giá tri thặng dư của người khác"},{"key":"C","text":"Gây thiệt hại cho các đối thủ cạnh tranh"}],"answer":["B"]},{"number":12,"text":"Đâu là giới hạn phát triển của chủ nghĩa tư ban?","options":[{"key":"A","text":"Mục đích của nền sản xuất tư bản chủ nghĩa vẫn tập trung chủ yếu vì lợi ích của thiểu số giai cấp tư sản"},{"key":"B","text":"Thúc đẩy lực lượng sản xuất phát triển nhanh chóng"},{"key":"C","text":"Chuyển nền sản xuất nhỏ thành nền sản xuất lớn hiện đại"},{"key":"D","text":"Thực hiện xã hội hoá sản xuất"}],"answer":["A"]},{"number":13,"text":"Nguyên nhân dẫn tới hình thành các tổ chức độc quyền đa ngành đó là:","options":[{"key":"A","text":"Cạnh tranh gay gắt và đối phó với luật chống độc quyền"},{"key":"B","text":"Canh tranh giữa các ngành và canh tranh đa quốc gia"},{"key":"C","text":"Thu lợi nhuận kinh doanh từ chứng khoán"},{"key":"D","text":"Đối phó với luật chống độc quyền ở các quốc gia"}],"answer":["A"]},{"number":14,"text":"Trong cơ chế của độc quyền nhà nước trong chủ nghĩa tư bản thì:","options":[{"key":"A","text":"Nhà nước phụ thuộc vào tổ chức độc quyền"},{"key":"B","text":"Nhà nước không phụ thuộc vào tổ chức độc quyền"},{"key":"C","text":"Tổ chức độc quyền phụ thuộc vào nhà nước."},{"key":"D","text":"Tổ chức độc quyền và nhà nước cạnh tranh gay gắt với nhau"}],"answer":["A"]},{"number":15,"text":"Lý luận kinh tế chính trị của C. Mác va Ph. Angghen được cô đọng và tập trung trong tác phẩm nào?","options":[{"key":"A","text":"Tư bản"},{"key":"B","text":"Bản thảo kinh tế - triết học"},{"key":"C","text":"Lược thảo phê phán khoa kinh tế chính trị"},{"key":"D","text":"Tuyên ngôn của Đảng Cộng sản"}],"answer":["A"]},{"number":16,"text":"Chức năng nào của kinh tế chính trị Mác - Lénin thé hiện sự vận dung đúng các quy luật kinh tế khách quan thông qua điều chỉnh hành vi cá nhân hoặc các chính sách kinh tế sẽ góp phần thúc đẩy kinh tế - xã hội phát triển theo hướng tiến bộ?","options":[{"key":"A","text":"Chức năng thực tiễn"},{"key":"B","text":"Chức năng nhận thức"},{"key":"C","text":"Chức năng tư tưởng"},{"key":"D","text":"Chức năng phương pháp luận"}],"answer":["A"]},{"number":17,"text":"Ở Việt Nam cũng như trên thế giới sử dung thuật ngữ “cách mạng công nghiệp lần thứ tư” với hàm ý gi?","options":[{"key":"A","text":"Sự thay đổi về lượng trong lực lượng sản xuất của nền kinh tế thế giới"},{"key":"B","text":"Su thay đổi về chất trong lực lượng sản xuất của nền kinh tế thế giới"},{"key":"C","text":"Sự thay đổi về chất trong quan hệ sản xuất của nền kinh tế thế giới"},{"key":"D","text":"Sự thay đổi căn bản, toàn diện trong đời sống, sản xuất của nền kinh tế thế giới"}],"answer":["B"]},{"number":18,"text":"Hệ thống lý luận kinh tế chính trị đầu tién nghiên cứu về sản xuất tư bản chủ nghĩa là:","options":[{"key":"A","text":"Chủ nghĩa trọng thương"},{"key":"B","text":"Chủ nghĩa trọng nông"},{"key":"C","text":"Kinh tế chính trị cổ điển"},{"key":"D","text":"Kinh tế chính trị cổ điển Anh"}],"answer":["A"]},{"number":19,"text":"Đại Hội X của Đảng chỉ rõ mục tiêu đẩy mạnh công nghiệp hoá, hiện đại hoá cần:","options":[{"key":"A","text":"Gắn với phát triển kinh tế tri thức; coi kinh tế tri thúc là yếu tố quan trọng của nền kinh tế và của công nghiệp hóa, hiện đại hóa"},{"key":"B","text":"Gắn với nền kinh tế thị trường định hướng tư bản chủ nghĩa"},{"key":"G","text":"Gắn với nên kinh tế khép kín"},{"key":"D","text":"Gắn với nền kinh tế thị trường, thực hiện chiến lược hàng xuất khẩu"}],"answer":["A"]},{"number":20,"text":"Yếu tố nào quyết định đến sự hình thành của cách mạng công nghiệp gì?","options":[{"key":"A","text":"Sự phát triển vượt bậc của quan hệ sản xuất"},{"key":"B","text":"Phương thức sản xuất mới ra đời"},{"key":"C","text":"Sự phát triển nhảy vọt về trình độ của tư liệu lao động"},{"key":"D","text":"Các phát minh sáng chế của các nhà khoa học trên mọi lĩnh vực"}],"answer":["C"]},{"number":21,"text":"Đến nay thế giới trải qua bao nhiêu cuộc cách mang công nghiệp?","options":[{"key":"A","text":"Bốn cuộc cách mang công nghiệp"},{"key":"B","text":"Ba cuộc cách mạng công nghiệp"},{"key":"C","text":"Hai cuộc cách mang công nghiệp"},{"key":"D","text":"Năm cuộc cách mang công nghiệp"}],"answer":["A"]},{"number":22,"text":"Quan điểm về “xây dựng nền kinh tế tự chủ phải dựa trên cơ sở làm chủ công nghệ va ch ân, thì nhà tư bản có thu được giá tri thặng dư hay không?","options":[{"key":"A","text":"Có"},{"key":"B","text":"Không"},{"key":"C","text":"Bị lỗ vốn"},{"key":"D","text":"Hòa vốn"}],"answer":["A"]},{"number":39,"text":"Trong lĩnh vực chính trị, các chính phụ nghị viện tư sản hiện dai được tổ chức giống với mô hình nào?","options":[{"key":"A","text":"Công ty cổ phần tư bản chủ nghĩa"},{"key":"B","text":"Công ty trách nhiệm hữu hạn 1 thành viên"},{"key":"C","text":"Công ty hợp doanh"},{"key":"D","text":"Doanh nghiệp tư nhân"}],"answer":["A"]},{"number":40,"text":"Hình thức cơ ban của địa tô tư bản chủ nghĩa là gì?","options":[{"key":"A","text":"Địa tô chênh lệch I, Địa tô chênh lệch II"},{"key":"B","text":"Địa tô tuyệt đối, địa tô độc quyền"},{"key":"C","text":"Địa tô chênh lệch, địa tô tuyệt đối; địa tô độc quyền"},{"key":"D","text":"Địa tô chênh lệch, địa tô độc quyền"}],"answer":["C"]},{"number":41,"text":"Thế nao là tư bản cho vay?","options":[{"key":"A","text":"Là tư bản hàng hóa mà người chủ của nó nhường cho người khác sử dung ở trong một thời gian nhất định để thu lợi tức"},{"key":"B","text":"Là tư bản tiền tệ mà người chủ của nó nhường cho người khác sử dụng ở trong một thời gian nhất định để thu lợi tức"},{"key":"C","text":"Là tư bản tiền tệ mà người chủ của nó nhường cho người khác sử dung ở trong một thời gian nhất định để thu lợi nhuận"},{"key":"D","text":"Là tư bản sản xuất mà người chủ của nó nhường cho người khác sử dụng ở trong một thời gian nhất định để thu lợi tức"}],"answer":["B"]},{"number":42,"text":"Tiền công thực tế là:","options":[{"key":"A","text":"Tiền công được biểu hiện bằng số lượng hàng hóa tiêu dùng và dịch vụ mà công nhân mua được bằng tiên công danh nghĩa của mình"},{"key":"B","text":"Tiền công được biểu hiện bằng số lượng hàng hóa tiêu dùng và dịch vụ mà công nhân mua được bằng tiền công thực tế của mình"},{"key":"G","text":"Tiền công được biểu hiện bằng số tư liệu sản xuất và tiêu dùng và dịch vụ mà công nhân mua được bằng tiền công thực tế của mình"}],"answer":["B"]},{"number":43,"text":"Vai trò của các bộ phận tư bản trong tích lũy tư bản được xác định bằng phạm trù:","options":[{"key":"A","text":"Cấu tạo kỹ thuật của tư bản"},{"key":"B","text":"Cấu tạo hữu cơ của tư bản"},{"key":"C","text":"Cấu tao giá trị của tu bản"}],"answer":["B"]},{"number":44,"text":"Sức lao động trở thành hàng hoá một cách phổ biến từ khi nào?","options":[{"key":"A","text":"Từ khi có chủ nghĩa tư bản"},{"key":"B","text":"Từ khi có sản xuất hàng hoá"},{"key":"C","text":"Từ khi có kinh tế thị trường"},{"key":"D","text":"Từ khi lao động ra đời"}],"answer":["A"]},{"number":45,"text":"Chi phí thực tế của xã hội để sản xuất hang hoá là:","options":[{"key":"A","text":"Chi phí lao động sống và lao động quá khứ"},{"key":"B","text":"Chi phí tuq bản bất biến và tư bản khả biến"},{"key":"C","text":"Chi phí sức lao động của toàn xã hội"}],"answer":["A"]},{"number":46,"text":"Về mặt lượng giữa p' và m’ thì:","options":[{"key":"A","text":"p’ luôn nhỏ hơn m'"},{"key":"B","text":"p’ luôn lớn hơn m'"},{"key":"C","text":"p’ bằng m'"}],"answer":["A"]},{"number":47,"text":"Trong lich sử phát triển nền sản xuất xã hội, tiền dé nào là quan trong nhất cho sự ra đời va phát triển của nên kinh tế thị trường?","options":[{"key":"A","text":"Sản xuất"},{"key":"B","text":"Trao đổi hàng hóa"},{"key":"C","text":"Thị trường"},{"key":"D","text":"Sản xuất và trao đổi hàng hóa"}],"answer":["D"]},{"number":48,"text":"Kinh tế thị trường xuất hiện lần đầu tiên ở xã hội nao?","options":[{"key":"A","text":"Phong kiến"},{"key":"B","text":"Chiếm hữu nô lệ"},{"key":"C","text":"Tư bản chủ nghĩa"},{"key":"D","text":"Xã hội chủ nghĩa"}],"answer":["C"]},{"number":49,"text":"Khi phân chia thể chế theo các yếu tố cấu thành lĩnh vực cốt lõi của xã hội, thé chế được phân loại là: (chon nhiều phương án 3)","options":[{"key":"A","text":"Thể chế chính trị"},{"key":"B","text":"Thế chế kinh tế"},{"key":"C","text":"Thể chế văn hóa"},{"key":"D","text":"Thể chế xã hội"}],"answer":["A","B","D"]},{"number":50,"text":"Một trong những đặc điểm chủ yếu của bất ky xã hội nào lấy thi trường làm phương tiện có tinh cơ sở dé phân phối các nguồn lực kinh tế là gì ?","options":[{"key":"A","text":"Có hệ thống pháp quy kiện toàn và sự quản lý vĩ mô của Nhà nước"},{"key":"B","text":"Có hệ thống pháp quy kiện toàn và sự quản lý vi mô của Nhà nước"},{"key":"C","text":"Có hệ thống pháp quy kiện toàn và sự quản lý văn hóa xã hội của Nhà nước"},{"key":"D","text":"Có hệ thống pháp quy kiện toàn và sự quản lý kinh tế, giáo dục của Nhà nước"}],"answer":["A"]},{"number":51,"text":"Đảng ta khẳng định: “Nền kinh tế thi trường đính hướng xã hội chủ nghĩa ở nước ta là nên kinh tế hang hoá nhiều thành phần, vận hành theo cơ chế thị trường, có sự quản lý của Nhà nước, dưới sự lãnh đạo của Đảng Cộng sản” từ Đại hội nào?","options":[{"key":"A","text":"Đại hội XI (2011)"},{"key":"B","text":"Đại hội X (2006)"},{"key":"C","text":"Đại hội VI (1986)"},{"key":"D","text":"Đại hội V (1982)"}],"answer":["A"]},{"number":52,"text":"Đặc điểm nao dưới đây không phải của kinh tế thi trường?","options":[{"key":"A","text":"Kinh tế thị trường là kinh tế hàng hoá phát triển cao"},{"key":"B","text":"Kinh tế thị trường lấy khoa học công nghệ hiện đại lam cơ sở"},{"key":"C","text":"Kinh tế thị trường chỉ có thể phát triển mạnh ở xã hội phong kiến"},{"key":"D","text":"Kinh tế thị trường đạt đến trình độ cao trong chủ nghĩa tu bản"}],"answer":["C"]},{"number":53,"text":"Quan điểm “đổi mới phải luôn luôn quán triệt quan điểm “dân là gốc” vi lợi ich của nhân dân, dựa vào nhân dân, phát huy vai trò làm chủ, tinh than trách nhiệm, sức sáng tạo và mọi nguồn lực của nhân dân; phát huy sức mạnh đại đoàn kết dân tộc” được đưa ra trong đại hội nào?","options":[{"key":"A","text":"Đại hội đảng X"},{"key":"B","text":"Đại hội đảng XI"},{"key":"C","text":"Đại hội đảng XII"},{"key":"D","text":"Đại hội dang XIII"}],"answer":["C"]},{"number":54,"text":"Công cụ quản lý vĩ mô của nhà nước trong nền kinh tế thị trường định hướng xã hội chủ nghĩa là?","options":[{"key":"A","text":"Kế hoạch và thị trường, hệ thống pháp luật, các công cụ tài chinh-tién tệ, công cụ điều tiết kinh tế đối ngoại"},{"key":"B","text":"Kế hoạch và thị trường, kinh tế tư nhân, quản lý tiền tệ"},{"key":"C","text":"Thuế, kinh tế tư nhân, kinh tế tập thể"},{"key":"D","text":"Hệ thống các chính sách kinh tế và xã hội"}],"answer":["A"]},{"number":55,"text":"Xây dựng nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam nhằm thực hiện mục tiêu gi?","options":[{"key":"A","text":"Dân giàu, nước mạnh, dân chủ, công bằng, văn minh"},{"key":"B","text":"Dân giàu, nước mạnh, công bằng, dân chủ, văn minh"},{"key":"C","text":"Dân giàu, nước mạnh, văn minh, công bằng, dân chủ"},{"key":"D","text":"Dân giàu, nước mạnh, dân chủ, văn minh, công bằng"}],"answer":["A"]},{"number":56,"text":"Tu tưởng kinh tế đầu tiên của giai cấp tư san trong giai đoạn phương thức san xuất phong kiến tan rã và chủ nghĩa tư bản ra đời đó là:","options":[{"key":"A","text":"Chủ nghĩa trọng thương"},{"key":"B","text":"Chủ nghĩa trọng nông"},{"key":"C","text":"Kinh tế chính trị cổ điển Anh"},{"key":"D","text":"Kinh tế chính trị của Karl Marx"}],"answer":["A"]},{"number":57,"text":"Lý thuyết bàn tay vô hình của Adam Smith được hiểu là gi? (chon 3 phương án đúng)","options":[{"key":"A","text":"Người bán và người mua, phân bố nguồn lực kinh tế đạt được hiệu quả xã hội lồn nhất mà không cần sự can thiệp của chính phủ"},{"key":"B","text":"Mô tả khả năng của cơ chế thị trường trong việc điều chỉnh cung cầu trên thị trường."},{"key":"C","text":"Các cá nhân tham gia muốn tối đa hóa lợi nhuận cho mình"},{"key":"D","text":"Mọi người đều bị bàn tay vô hình dẫn tới kết quả làm lợi cho chính mình"}],"answer":["A","B","C"]},{"number":58,"text":"Công thức về giá tri hang hóa G = c + (v+m). Trong đó (v+m) là bộ phận giá tri mới của hàng hoá, do hao phi lao động tạo ra. Vậy c là biểu hiện của giá trị nào?","options":[{"key":"A","text":"Là giá trị của những tư liệu sản xuất đã được tiêu dùng, là bộ phận lao động quá khú đã được kết tinh trong máy móc, nguyên, nhiên, vật liệu"},{"key":"B","text":"Là giá trị của những tư liệu lao động đã được tiêu hao, là bộ phận lao động quá khú đã được kết tinh trong lao động sản xuất"},{"key":"C","text":"Là tư bản khả biến điều kiện cần thiết để quá trình tạo ra giá trị thăng du được diễn ra"},{"key":"D","text":"Là tư bản ứng trước điều kiện cần để đầu tư và tái sản xuất và mở rộng quy mô sản xuất"}],"answer":["A"]},{"number":59,"text":"Mọi tu ban đều biểu hiện dưới dang tiên, nhưng tiền không phải là tu bản. Vay khi nào tiền trở thành tu ban?","options":[{"key":"A","text":"Tiền biến thành tư bản khi được dùng để mang lại giá trị thăng dư."},{"key":"B","text":"Tiền biến thành tư bản khi được dùng để mang lại địa vị làm chủ nhà tư bản."},{"key":"G","text":"Tiền biến thành tư bản khi được dùng dé mang lại giá trị chung cho toàn xã hội."},{"key":"D","text":"Tiền biến thành tư bản khi được dùng với vai trò là một phương tiện thanh toán."}],"answer":["A"]},{"number":60,"text":"Su khác biệt về mục tiêu giữa kinh tế thị trường định hướng xã hội chủ nghĩa với kinh tế thi trường tư bản chủ nghĩa là gì? (lựa chọn ba đáp án)","options":[{"key":"A","text":"Hướng tới phát triển lực lượng sản xuất."},{"key":"B","text":"Xây dựng cơ sở vật chất - kỹ thuật của chủ nghĩa xã hội."},{"key":"C","text":"Xây dựng chế độ sở hữu - công hữu mọi tư liệu sản xuất."},{"key":"D","text":"Nâng cao đời sống nhân dân, thực hiện “dân giàu, nước mạnh, dân chủ, công bằng, văn minh”"}],"answer":["A","B","D"]}]},{"id":"Su25_Bl5","title":"SU25 • Bài 5","group":"Bộ đề","questions":[{"number":1,"text":"Nguyên nhân nào quyết định nhất dẫn đến sự sụp đổ của Liên Xô và hệ thống XHCN ở Đông Âu?","options":[{"key":"A","text":"Cơ chế kế hoạch hoá tập trung mệnh lệnh"},{"key":"B","text":"Sự tiến bộ kỹ thuật không đồng bộ"},{"key":"C","text":"Sản xuất không đi đôi với tiêu dùng"},{"key":"D","text":"Công nghiệp hoá nhanh"}],"answer":["A"]},{"number":2,"text":"Đâu không phải là mục đích của hội nhập kinh tế quốc tế?","options":[{"key":"A","text":"Thu hút vốn đầu tư nước ngoài, thu hút công nghệ hiện đại"},{"key":"B","text":"Học hỏi kinh nghiệm quản lý tiên tiến của thế giới"},{"key":"C","text":"Khai thác thị trường thế giới để tiêu thụ các sản phẩm mà nước ta có nhiều lợi thế và khả năng cạnh tranh cao"},{"key":"D","text":"Đầu tư tư bản trực tiếp thu lợi nhuận ở nước ngoài"}],"answer":["D"]},{"number":3,"text":"Nội dung công cuộc đại phân công lao động xã hội lần thứ hai là gì?","options":[{"key":"A","text":"Đại công nghiệp tách khỏi nông nghiệp"},{"key":"B","text":"Trồng trọt tách khỏi chăn nuôi"},{"key":"C","text":"Ngành thương nghiệp ra đời"},{"key":"D","text":"Thủ công nghiệp tách khỏi nông nghiệp"}],"answer":["D"]},{"number":4,"text":"Nội dung công cuộc đại phân công lao động xã hội lần thứ ba là gì?","options":[{"key":"A","text":"Đại công nghiệp tách khỏi nông nghiệp"},{"key":"B","text":"Trồng trọt tách khỏi chăn nuôi"},{"key":"C","text":"Ngành thương nghiệp ra đời"},{"key":"D","text":"Thủ công nghiệp tách khỏi nông nghiệp"}],"answer":["C"]},{"number":5,"text":"Nội dung cơ bản của cách mạng công nghiệp lần thứ nhất đó là:","options":[{"key":"A","text":"Chuyển từ lao động thủ công sang lao động máy móc"},{"key":"B","text":"Chuyến từ lao động thủ công sang sử dụng động cơ điện"},{"key":"C","text":"Chuyển từ lao động máy móc sang lao động sử dụng năng lượng điện và động cơ điện"},{"key":"D","text":"Chuyển từ lao động cơ khí máy móc lên tự động hóa sản xuất."}],"answer":["A"]},{"number":6,"text":"Việt Nam trở thành thành viên chính thức của tổ chức thương mại thế giới WTO khi nào?","options":[{"key":"A","text":"2007"},{"key":"B","text":"2006"},{"key":"C","text":"2005"},{"key":"D","text":"2008"}],"answer":["A"]},{"number":7,"text":"Nghiên cứu về cách mạng công nghiệp lần thứ nhất, C. Mác đã khái quát tính quy luật của cách mạng công nghiệp qua mấy giai đoạn phát triển?","options":[{"key":"A","text":"Một giai đoạn"},{"key":"B","text":"Hai giai đoạn"},{"key":"C","text":"Ba giai đoạn"},{"key":"D","text":"Bốn giai đoạn"}],"answer":["C"]},{"number":8,"text":"Nguồn gốc nào không đúng với nguồn vốn công nghiệp hóa ở các nước tư bản cổ điển?","options":[{"key":"A","text":"Cướp bóc thuộc địa"},{"key":"B","text":"Khai thác lao động làm thuê"},{"key":"C","text":"Làm phá sản những người sản xuất nhỏ trong nông nghiệp"},{"key":"D","text":"Đi vay nhà nước"}],"answer":["D"]},{"number":9,"text":"Mô hình công nghiệp hoá của Nhật Bản và các nước công nghiệp mới gọi tắt là gì?","options":[{"key":"A","text":"NICS"},{"key":"B","text":"TNCS"},{"key":"C","text":"OECD"},{"key":"D","text":"FPT"}],"answer":["A"]},{"number":10,"text":"Cách mạng công nghiệp lần thứ nhất khởi phát ở quốc gia nào?","options":[{"key":"A","text":"Anh"},{"key":"B","text":"Pháp"},{"key":"C","text":"Hy lạp"},{"key":"D","text":"Đức"}],"answer":["A"]},{"number":11,"text":"Tiến hành công nghiệp hoá theo kiểu rút ngắn so với các nước đi trước đặc biệt chúng ta cần thực hiện yêu cầu nào?","options":[{"key":"A","text":"Phát triển kinh tế và công nghiệp phải có sự nhảy vọt và không cần thực hiện tuần tự"},{"key":"B","text":"Coi trọng phát triển giáo dục và đào tạo, khoa học và công nghệ, xem đây là nền tảng và động lực cho công nghiệp hóa, hiện đại hóa"},{"key":"C","text":"Phát triển kinh tế trí thức được dời lại trong giai đoạn sau"},{"key":"D","text":"Ưu tiên phát triển công nghiệp nặng một cách hợp lý trên cơ sở phát triển nông nghiệp và công nghiệp nhẹ"}],"answer":["B"]},{"number":12,"text":"Công nghiệp hoá ở Anh (cuộc cách mạng công nghiệp lần thứ nhất) bắt nguồn từ ngành nào?","options":[{"key":"A","text":"Công nghiệp nhẹ"},{"key":"B","text":"Công nghiệp nặng"},{"key":"C","text":"Dịch vụ"},{"key":"D","text":"Sản xuất vũ khí"}],"answer":["A"]},{"number":13,"text":"\"Khoa học và công nghệ sẽ có bước tiến nhảy vọt. Kinh tế tri thức có vai trò ngày càng nổi bật trong quá trình phát triển lực lượng sản xuất\" được nhận định trong đại hội mấy của Đảng?","options":[{"key":"A","text":"Đại hội VIII"},{"key":"B","text":"Đại hội IX"},{"key":"C","text":"Đại hội X"},{"key":"D","text":"Đại hội XI"}],"answer":["B"]},{"number":14,"text":"Đại Hội X của Đảng chỉ rõ mục tiêu đấy mạnh công nghiệp hoá, hiện đại hoá cần:","options":[{"key":"A","text":"Gắn với phát triển kinh tế tri thức; coi kinh tế tri thức là yếu tố quan trọng của nền kinh tế và của công nghiệp hóa, hiện đại hóa"},{"key":"B","text":"Gần với nền kinh tế thị trường định hướng tư bản chủ nghĩa"},{"key":"C","text":"Gần với nền kinh tế khép kín"},{"key":"D","text":"Gắn với nền kinh tế thị trường, thực hiện chiến lược hàng xuất khẩu"}],"answer":["A"]},{"number":15,"text":"Kinh tế chính trị Mác - Lênin đã kế thừa và phát triển trực tiếp những thành tựu của:","options":[{"key":"A","text":"Kinh tế chính trị cổ điển Anh"},{"key":"B","text":"Chủ nghĩa trọng thương"},{"key":"C","text":"Chủ nghĩa trọng nông"},{"key":"D","text":"Kinh tế chính trị tầm thường"}],"answer":["A"]},{"number":16,"text":"Hệ thống lý luận kinh tế chính trị đầu tiên nghiên cứu về sản xuất tư bản chủ nghĩa là:","options":[{"key":"A","text":"Chủ nghĩa trọng thương"},{"key":"B","text":"Chủ nghĩa trọng nông"},{"key":"C","text":"Kinh tế chính trị cổ điển"},{"key":"D","text":"Kinh tế chính trị cổ điển Anh"}],"answer":["A"]},{"number":17,"text":"Đối tượng nghiên cứu của kinh tế chính trị Mác - Lênin được hiểu là:","options":[{"key":"A","text":"Các quan hệ xã hội của sản xuất và trao đổi"},{"key":"B","text":"Các quan hệ giữa lực lượng sản xuất và quan hệ sản xuất"},{"key":"C","text":"Các quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng"},{"key":"D","text":"Những biểu hiện vật chất của lực lượng sản xuất"}],"answer":["A"]},{"number":18,"text":"Kinh tế chính trị cổ điển Anh được hình thành và phát triển từ cuối thế kỷ XVIII đến nửa đầu thế kỷ XIX, mở đầu bằng các quan điểm lý luận của nhà kinh tế chính trị học nào sau đây?","options":[{"key":"A","text":"David Ricardo"},{"key":"B","text":"Adam Smith"},{"key":"C","text":"William Petty"},{"key":"D","text":"Thomas Mun"}],"answer":["C"]},{"number":19,"text":"Mục đích nghiên cứu ở cấp độ cao nhất của kinh tế chính trị Mác - Lênin là gì?","options":[{"key":"A","text":"Nhằm phát hiện ra các quy luật chi phối quan hệ giữa người và người trong sản xuất và trao đổi"},{"key":"B","text":"Nhằm phát hiện ra các quy luật chi phối quan hệ giữa người và xã hội trong sản xuất và trao đổi"},{"key":"C","text":"Nhằm phát hiện ra các quy luật chi phối quan hệ giữa người và người trong sản xuất và tiêu dùng"},{"key":"D","text":"Nhằm phát hiện ra các quy luật chi phối quan hệ giữa người và hàng hoá trong sản xuất và tiêu dùng"}],"answer":["A"]},{"number":20,"text":"Đâu là một trong những nguyên nhân dẫn đến sự sụp đổ của Liên Xô và Đông Âu?","options":[{"key":"A","text":"cơ chế kế hoạch hóa tập trung mệnh lệnh"},{"key":"B","text":"công nghiệp hóa quá nhanh"},{"key":"C","text":"công nghiệp hóa không gắn với hiện đại hóa"},{"key":"D","text":"sản xuất không đi đôi với tiêu dùng"}],"answer":["A"]},{"number":21,"text":"Liên kết các doanh nghiệp theo cùng một ngành là theo hình thức:","options":[{"key":"A","text":"Liên kết dọc"},{"key":"B","text":"Liên kết ngang"},{"key":"C","text":"Cả liên kết dọc và liên kết ngang"},{"key":"D","text":"Liên kết đa ngành"}],"answer":["B"]},{"number":22,"text":"Những biểu hiện của độc quyền nhà nước trong chủ nghĩa tư bản là:","options":[{"key":"A","text":"Sự kết hợp nhân sự giữa tổ chức độc quyền cùng với nhà nước; sự hình thành, phát triển của sở hữu nhà nước"},{"key":"B","text":"Sự kết hợp về nhân sự giữa tổ chức độc quyền cùng với nhà nước; sự hình thành, phát triển của sở hữu nhà nước; sự điều tiết kinh tế của nhà nước tư sản."},{"key":"C","text":"Sự kết hợp về nhân sự giữa tổ chức độc quyền cùng với nhà nước; sự hình thành, phát triển của sở hữu nhà nước; sự điều tiết kinh tế đối ngoại của nhà nước tư sản."},{"key":"D","text":"Sự kết hợp về nhân sự giữa tổ chức độc quyền với nhà nước; sự điều tiết kinh tế của nhà nước tư sản."}],"answer":["B"]},{"number":23,"text":"Sự phát triển của các tổ chức độc quyền trong ngân hàng đã làm thay đổi quan hệ giữa ngân hàng và các doanh nghiệp công nghiệp đó là:","options":[{"key":"A","text":"Từ trung gian thanh toán trở thành khống chế mọi hoạt động kinh tế - xã hội"},{"key":"B","text":"Từ trung gian thanh toán trở thành cổ đông của các doanh nghiệp nhà nước"},{"key":"C","text":"Từ hoạt động cho vay trở thành hoạt động khống chế doanh tư nhân"},{"key":"D","text":"Từ hoạt động cho vay trở thành chi phối các doanh nghiệp"}],"answer":["A"]},{"number":24,"text":"Về kinh tế, xuất khẩu tư bản nhà nước nhằm mục đích gì?","options":[{"key":"A","text":"Tạo môi trường thuận lợi cho xuất khẩu tư bản tư nhân."},{"key":"B","text":"Tạo điều kiện cho các nước nhập khẩu tư bản phát triển"},{"key":"C","text":"Khống chế kinh tế các nước nhập khẩu tư bản."},{"key":"D","text":"Tạo điều kiện phát triển thị trường tự do"}],"answer":["A"]},{"number":25,"text":"Nhận định nào sau đây là sai?","options":[{"key":"A","text":"Consortium là hình thức tổ chức độc quyền theo liên kết dọc"},{"key":"B","text":"Trust là tổ chức độc quyền cao hơn Syndicate"},{"key":"C","text":"Các tổ chức độc quyền mở rộng ra nhiều ngành khác nhau là phát triển theo kiểu liên kết dọc"},{"key":"D","text":"Các nhà tư bản tham gia Cartel vẫn độc lập về sản xuất nhưng mất độc lập về lưu thông"}],"answer":["C"]},{"number":26,"text":"Sở hữu độc quyền nhà nước là sự kết hợp của:","options":[{"key":"A","text":"Sở hữu nhà nước và sở hữu độc quyền tư nhân"},{"key":"B","text":"Sở hữu của liên minh các tập đoàn độc quyền"},{"key":"C","text":"Sở hữu của liên minh các nhà nước tư sản"},{"key":"D","text":"Sở hữu nhà nước ở chính quốc và thuộc địa"}],"answer":["A"]},{"number":27,"text":"Hình thức độc quyền nào thống nhất việc sản xuất, tiêu thụ, tài vụ đều do một ban quản trị quản lý?","options":[{"key":"A","text":"Cartel"},{"key":"B","text":"Syndicate"},{"key":"C","text":"Trust"},{"key":"D","text":"Consortium"}],"answer":["C"]},{"number":28,"text":"Về mặt lịch sử, các hình thức tổ chức độc quyền cơ bản từ thấp đến cao đó là:","options":[{"key":"A","text":"Cartel-Syndicate - Trust - Consortium"},{"key":"B","text":"Cartel - Trust - Syndicate - Consortium"},{"key":"C","text":"Trust-Cartel Syndicate Consortium"},{"key":"D","text":"Trust-Syndicate - Cartel – Consortium"}],"answer":["A"]},{"number":29,"text":"Mọi hình thức lạm phát đều làm tăng điều gì?","options":[{"key":"A","text":"Giá cả của hàng hóa"},{"key":"B","text":"Giá trị của hàng hóa"},{"key":"C","text":"Giá trị sử dụng của hàng hóa"},{"key":"D","text":"Giá trị thặng dư của hàng hóa"}],"answer":["A"]},{"number":30,"text":"Giá trị cá biệt của hàng hoá do:","options":[{"key":"A","text":"Hao phí lao động cá biệt của người sản xuất quyết định"},{"key":"B","text":"Hao phí lao động cá biệt của người sản xuất nhiều hàng hoá quyết định"},{"key":"C","text":"Hao phí lao động của ngành quyết định"},{"key":"D","text":"Hao phí lao động xã hội cần thiết quyết định"}],"answer":["A"]},{"number":31,"text":"Yếu tố quyết định đến giá cả hàng hoá là:","options":[{"key":"A","text":"Giá trị của hàng hoá"},{"key":"B","text":"Quan hệ cung cầu về hàng hoá"},{"key":"C","text":"Giá trị sử dụng của hàng hoá"},{"key":"D","text":"Giá trị của đồng tiền"}],"answer":["A"]},{"number":32,"text":"Tỷ lệ giữa lao động phức tạp và lao động giản đơn tăng lên có ảnh hưởng như thế nào đến lượng giá trị được tạo ra trong một đơn vị thời gian?","options":[{"key":"A","text":"Tăng lên"},{"key":"B","text":"Giữ nguyên hoặc Không đổi"},{"key":"C","text":"Giảm xuống"},{"key":"D","text":"Không ảnh hưởng"}],"answer":["A"]},{"number":33,"text":"Số lượng tiên cần thiết trong lưu thông có mối quan hệ thế nào với tổng số giá cả hàng hóa được đưa ra thị trường và tốc độ lưu thông của tiền tệ?","options":[{"key":"A","text":"Tỉ lệ thuận với tổng giá cả hàng hóa đưa ra thị trường và tốc độ lưu thông tiền tệ"},{"key":"B","text":"Tỉ lệ nghịch với tổng giá cả hàng hóa đưa ra thị trường và tốc độ lưu thông tiền tệ"},{"key":"C","text":"Tỉ lệ thuận với tổng giá cả hàng hóa đưa ra thị trường và tỉ lệ nghịch với tốc độ lưu thông tiền tệ"},{"key":"D","text":"Tỉ lệ nghịch với tổng giá hàng hóa cả đưa ra thị trường và tỉ lệ thuận với tốc độ lưu thông tiền tệ"}],"answer":["C"]},{"number":34,"text":"Mệnh đề nào sau đây là ý không đúng về lao động phức tạp?","options":[{"key":"A","text":"Lao động phức tạp là lao động được tiến hành trong điều kiện cường độ lao động cao."},{"key":"B","text":"Lao động phức tạp là lao động trải qua đào tạo, huấn luyện."},{"key":"C","text":"Trong cùng một thời gian lao động, lao động phức tạp tạo ra nhiều giá trị hơn lao động giản đơn."},{"key":"D","text":"Lao động phức tạp là bội số của lao động giản đơn."}],"answer":["A"]},{"number":35,"text":"Phương hướng cơ bản, lâu dài để tăng sản phẩm xã hội là gì?","options":[{"key":"A","text":"Tăng năng suất lao động"},{"key":"B","text":"Tăng cường độ lao động"},{"key":"C","text":"Kéo dài thời gian lao động"},{"key":"D","text":"Mở rộng quy mô sản xuất, khai thác tài nguyên thiên nhiên"}],"answer":["A"]},{"number":36,"text":"Xét về giá trị của hàng hóa, hàng hóa càng khan hiếm thì dẫn đến điều gì?","options":[{"key":"A","text":"Giá trị của nó càng cao"},{"key":"B","text":"Giá cả của nó càng cao"},{"key":"C","text":"Cả giá trị và giá cả của hàng hóa càng cao"},{"key":"D","text":"Giá trị của nó càng giảm"}],"answer":["B"]},{"number":37,"text":"Phương pháp tạo ra giá trị thặng dư tuyệt đối là gì?","options":[{"key":"A","text":"Kéo dài thời gian lao động thặng dư khi thời gian lao động tất yếu, năng suất lao động và giá trị sức lao động không đổi"},{"key":"B","text":"Kéo dài thời gian lao động tất yếu khi thời gian lao động thặng dư, năng suất lao động và giá trị sức lao động không đối"},{"key":"C","text":"Rút ngắn thời gian lao động thặng dư khi thời gian lao động tất yếu, năng suất lao động và giá trị sức lao động không đối"},{"key":"D","text":"Rút ngắn thời gian lao động tất yếu khi thời gian lao động thặng dư, năng suất lao động và giá trị sức lao động không đổi"}],"answer":["A"]},{"number":38,"text":"Theo công thức chung của tư bản thì T' được tính như thế nào?","options":[{"key":"A","text":"T' = T + t(t > 0)"},{"key":"B","text":"T' = T + t(t < 0)"},{"key":"C","text":"T' = T + t(t >= 0)"},{"key":"D","text":"T' = T + t(t <= 0)"}],"answer":["A"]},{"number":39,"text":"Địa tô tuyệt đối được hiểu là gì?","options":[{"key":"A","text":"Loại địa tô mà tất cả các nhà tư bản kinh doanh nông nghiệp đều phải nộp cho địa chủ, cho dù ruộng đất là tốt hay xấu"},{"key":"B","text":"Phần giá trị thặng dư còn lại sau khi đã khấu trừ đi phần lợi nhuận bình quân mà các nhà tư bản kính doanh nông nghiệp phải nộp cho địa chủ"},{"key":"C","text":"Lợi nhuận siêu ngạch dôi ra ngoài lợi nhuận bình quân"},{"key":"D","text":"Giá đất ngoài thị trường"}],"answer":["A"]},{"number":40,"text":"Cạnh tranh trong nội bộ ngành dẫn đến hình thành điều gì?","options":[{"key":"A","text":"Giá cả sản xuất"},{"key":"B","text":"Giá trị thị trường"},{"key":"C","text":"Giá cả hàng hóa"},{"key":"D","text":"Giá trị thặng dư"}],"answer":["B"]},{"number":41,"text":"Quá trình lưu thông tư bản là:","options":[{"key":"A","text":"Tuần hoàn và chu chuyển giá trị hàng hóa"},{"key":"B","text":"Tuần hoàn và chu chuyển tư bản"},{"key":"C","text":"Tuần hoàn và chu chuyển hàng hóa"},{"key":"D","text":"Tuần hoàn và tích lũy tư bản"}],"answer":["B"]},{"number":42,"text":"Lượng lợi nhuận có thể là:","options":[{"key":"A","text":"Bằng hoặc thấp hơn lượng giá trị thặng dư"},{"key":"B","text":"Cao hơn hoặc thấp hơn lượng giá trị thặng dư"},{"key":"C","text":"Bằng, cao hơn hoặc thấp hơn lượng giá trị thặng dư"},{"key":"D","text":"Bằng, hoặc cao hơn lượng giá trị thặng dư"}],"answer":["C"]},{"number":43,"text":"Đại hội nào đã xác định kinh tế thị trường định hướng xã hội chủ nghĩa là \"một kiểu tổ chức kinh tế vừa tuân theo quy luật của kinh tế thị trường vừa dưa trên cơ sở và chịu sự dẫn dắt chi phối bởi các nguyên tắc và bản chất của chủ nghĩa xã hội?","options":[{"key":"A","text":"Đại hội Đảng toàn quốc lần thứ VI"},{"key":"B","text":"Đại hội Đảng toàn quốc lần thứ VII"},{"key":"C","text":"Đại hội Đảng toàn quốc lần thứ VIII"},{"key":"D","text":"Đại hội Đảng toàn quốc lần thứ IX"}],"answer":["D"]},{"number":44,"text":"Hoàn thiện hệ thống luật pháp, cơ chế, chính sách cho hoạt động và phát triển lành mạnh của thị trường chứng khoán, tăng tính minh bạch chống các giao dịch phi pháp, các hành vi rửa tiền là thuộc về:","options":[{"key":"A","text":"Thống nhất nhận thức về nền kinh tế thị trường định hướng XHCN"},{"key":"B","text":"Hoàn thiện thể chế về sở hữu và các thành phần kinh tế, loại hình doanh nghiệp và các tổ chức sản xuất kinh doanh"},{"key":"C","text":"Hoàn thiện thể chế đảm bảo đồng bộ các yếu tố thị trường và phát triển đồng bộ các loại thị trường"},{"key":"D","text":"Hoàn thiện thể chế và vai trò lãnh đạo của Đảng"}],"answer":["C"]},{"number":45,"text":"Nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam có tính chất:","options":[{"key":"A","text":"Phổ biến và đặc thù"},{"key":"B","text":"Phổ biến và cách mạng"},{"key":"C","text":"Phổ biến và riêng biệt"},{"key":"D","text":"Phổ biến và đại chúng"}],"answer":["A"]},{"number":46,"text":"Trong nền kinh tế thị trường định hướng xã hội chủ nghĩa, thành phần kinh tế nào giữ vai trò chủ đạo?","options":[{"key":"A","text":"Thành phần kinh tế nhà nước"},{"key":"B","text":"Thành phần kinh tế tư nhân"},{"key":"C","text":"Thành phần kinh tế tập thể"},{"key":"D","text":"Thành phần kinh tế có vốn đầu tư nước ngoài"}],"answer":["A"]},{"number":47,"text":"Xét về trình độ phát triển, kinh tế thị trường ở Việt Nam bao gồm nhiều cấp độ:","options":[{"key":"A","text":"Sản xuất hàng hóa nhỏ, kinh tế thị trường sơ khai, kinh tế thị trường hiện đại đan xen"},{"key":"B","text":"Sản xuất hàng hóa lớn, kinh thế thị trường sơ khai, kinh tế thị trường đan xen"},{"key":"C","text":"Sản xuất hàng hóa nhỏ, kinh tế thị trường hoàn thiện, kinh tế thị trường hiện đại"},{"key":"D","text":"Sản xuất hàng hóa lớn, kinh tế thị trường hoàn thiện, kinh tế thị trường hiện đại đan xen"}],"answer":["A"]},{"number":48,"text":"Trong nền kinh tế thị trường, thị trường KHÔNG thực hiện vai trò nào sau đây?","options":[{"key":"A","text":"Thực hiện giá trị hàng hóa"},{"key":"B","text":"Phân bố tư liệu sản xuất"},{"key":"C","text":"Điều tiết nguồn lực cho sản xuất"},{"key":"D","text":"Hoạch định chính sách kinh tế"}],"answer":["D"]},{"number":49,"text":"Trong lịch sử phát triển nền sản xuất xã hội, tiền đề nào là quan trọng nhất cho sự ra đời và phát triển của nền kinh tế thị trường?","options":[{"key":"A","text":"Sản xuất"},{"key":"B","text":"Trao đổi hàng hóa"},{"key":"C","text":"Thị trường"},{"key":"D","text":"Sản xuất và trao đổi hàng hóa"}],"answer":["D"]},{"number":50,"text":"Cho ví dụ: nhà tư bản đầu tư 50 USD để mua nguyên vật liệu dệt vải, tốn 5 USD cho hao mòn máy móc để dệt được 10 mét vải từ nguyên liệu trên, 15 USD để trả công cho công nhân làm việc trong 8 giờ theo thoả thuận, nhưng sau 4 giờ thì công nhân đã làm xong 10 mét vài. Để giá trị thặng dư được tạo ra 15 USD, nhà tư bản cần làm gì?","options":[{"key":"A","text":"Đầu tư thêm 50 USD cho nguyên liệu, 5 USD cho hao mòn máy móc và bắt công nhân làm thêm 4 giờ nữa như thoả thuận"},{"key":"B","text":"Ngay từ thời điểm làm xong 4 giờ thì giá trị thặng dư được tạo ra rồi"},{"key":"C","text":"Nhà tư bản cần bắt công nhân tăng ca 4 giờ nữa bên cạnh 8 giờ thoả thuận"},{"key":"D","text":"Nhà tư bản yêu cầu công nhân tăng ca thêm 6 giờ nữa để tạo ra giá trị mới"}],"answer":["A"]},{"number":51,"text":"Loại tiền nào được hiểu là phương tiện thanh toán mà giá trị hay sức mua của nó với tư cách là tiền vượt = phí sản xuất ra nó hay giá trị của nó khi dùng vào việc khác, chứ không dùng làm tiền?","options":[{"key":"A","text":"Tiền quy ước"},{"key":"B","text":"Tiên tượng trưng"},{"key":"C","text":"Tiên ghi nợ"},{"key":"D","text":"Tiên vàng"}],"answer":["A"]},{"number":52,"text":"Tại sao việc phát triển kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam là tất yếu khách quan? Chọn 2 đáp án.","options":[{"key":"A","text":"Kinh tế thị trường có thể tự hình thành khi có các điều kiện khách quan."},{"key":"B","text":"Kinh tế thị trường tư bản chủ nghĩa là mô hình tối ưu nhất cho mọi quốc gia."},{"key":"C","text":"Kinh tế thị trường là động lực thúc đẩy lực lượng sản xuất phát triển nhanh và hiệu quả."},{"key":"D","text":"Kinh tế thị trường giúp Việt Nam độc lập hoàn toàn khỏi các quy luật của thị trường toàn cầu."}],"answer":["A"]},{"number":53,"text":"Lựa chọn đáp án đúng nhất: Mong muốn dân giàu, nước mạnh, dân chủ, công bằng, văn minh là mong muốn chung của ai?","options":[{"key":"A","text":"Chỉ các quốc gia phát triển"},{"key":"B","text":"Chỉ các quốc gia đang phát triển"},{"key":"C","text":"Các nước xã hội chủ nghĩa mới giành được chủ quyền dân tộc"},{"key":"D","text":"Tất cả các quốc gia trên thế giới"}],"answer":["D"]},{"number":54,"text":"Người phát minh ra con thoi - một cải tiến của khung dệt và là một đóng góp quan trọng cho cách mạng công nghiệp lần thứ nhất là:","options":[{"key":"A","text":"John Kay (1704-1779)"},{"key":"B","text":"Richard Arkwright (1732-1792)"},{"key":"C","text":"Edmund Cartwright (1743-1823)"},{"key":"D","text":"James Watt (1736-1891)"}],"answer":["A"]},{"number":55,"text":"Điều gì xảy ra nếu cung thấp hơn cầu?","options":[{"key":"A","text":"Giá cả cao hơn giá trị"},{"key":"B","text":"Giá cả thấp hơn giá trị"},{"key":"C","text":"Hàng hoá tạo ra được tăng cao giá bán"},{"key":"D","text":"Hàng hoá phong phú"}],"answer":["A"]},{"number":56,"text":"Tư bản khả biến tồn tại dưới hình thức nào?","options":[{"key":"A","text":"Tiền lương phải trả cho người lao động"},{"key":"B","text":"Nguyên liệu, vật liệu, máy móc, sức lao động"},{"key":"C","text":"Hàng hoá, sức lao động"},{"key":"D","text":"Vật liệu, máy móc, tiền công trả cho công nhân"}],"answer":["A"]},{"number":57,"text":"Theo C.Mác có một loại hàng hoá đặc biệt mà khi sử dụng nó thì giá trị của nó không những được bảo tồn mà còn tạo ra những giá trị mới lớn hơn giá trị bản thân nó. Hàng hoá đó là gì?","options":[{"key":"A","text":"Hàng hoá sức lao động"},{"key":"B","text":"Thức ăn"},{"key":"C","text":"Dịch vụ chăm sóc sức khoẻ"},{"key":"D","text":"Nước uống"}],"answer":["A"]},{"number":58,"text":"Công thức chung của tư bản là:","options":[{"key":"A","text":"H-T-H"},{"key":"B","text":"T-H-T"},{"key":"C","text":"T-H-T'"},{"key":"D","text":"H-T-H'"}],"answer":["C"]},{"number":59,"text":"Kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam thành phần kinh tế nào giữ vai trò là một động lực quan trọng thúc đẩy phát triển kinh tế?","options":[{"key":"A","text":"Thành phần kinh tế tư nhân"},{"key":"B","text":"Thành phần kinh tế nhà nước"},{"key":"C","text":"Thành phần kinh tế tập thể"},{"key":"D","text":"Thành phần kinh tế có vốn đầu tư nước ngoài"}],"answer":["A"]}]},{"id":"SU25_C1_FE","title":"SU25 • Câu 1","group":"Bộ đề","questions":[{"number":1,"text":"Hệ thống lý luận kinh tế chính trị đầu tiên nghiên cứu về sản xuất tu ban chủ nghĩa là:","options":[{"key":"A","text":"Chủ nghĩa trọng thương"},{"key":"B","text":"Chủ nghĩa trọng nông"},{"key":"C","text":"Kinh tế chính trị cổ điển"},{"key":"D","text":"Kinh tế chính trị cổ điển Anh"}],"answer":["A"]},{"number":2,"text":"Cách mạng công nghiệp lần thứ ba diễn ra trong giai đoạn nào?","options":[{"key":"A","text":"Từ đầu thập niên 50 của thé ky XX đến cuối thé kỷ XX"},{"key":"B","text":"Từ đầu thập niên 60 của thế ky XX đến cuối thé ky XX"},{"key":"C","text":"Từ đầu thập niên 70 của thé ky XX đến cuối thế kỷ XX"},{"key":"D","text":"Từ đầu thập niên 80 của thế kỷ XX đến cuối thế kỷ XX"}],"answer":["B"]},{"number":3,"text":"Quá trình công nghiệp hóa của các nước tư bản cổ điển diễn ra trong thời gian khoảng bao nhiêu năm?","options":[{"key":"A","text":"Từ 60 - 80 năm"},{"key":"B","text":"Từ 50- 70 năm"},{"key":"C","text":"Từ 60 -90 năm"},{"key":"D","text":"Từ 50 - 80 năm"}],"answer":["A"]},{"number":4,"text":"Điền vào chỗ trống: C. Mác va Ph. Angghen đã nhận xét rằng: “Giai cấp tu sản, trong quá trình thống trị giai cấp chưa day một thé ky, đã tạo ra những... nhiều hơn và đồ sộ hơn... của tất cả các thé hệ trước kia gộp lại”","options":[{"key":"A","text":"Lực lượng sản xuất... lực lượng sản xuất"},{"key":"B","text":"Quan hệ sản xuất... quan hệ sản xuất"},{"key":"C","text":"Của cai... của cải"},{"key":"D","text":"Vật chất... vật chất"}],"answer":["A"]},{"number":5,"text":"Nội dung cơ bản của cách mang công nghiệp lần thứ nhất đó là:","options":[{"key":"A","text":"Chuyển từ lao động thủ công sang lao động máy móc"},{"key":"B","text":"Chuyển tử lao động thủ công sang sử dụng động cơ điện"},{"key":"C","text":"Chuyển từ lao động máy móc sang lao động sử dụng năng lượng điện và đông cơ điện"}],"answer":["A"]},{"number":6,"text":"Quan điểm nào dưới đây không phải là đặc trưng chủ yếu của quá trình công nghiệp hóa, hiện đại hóa ở Việt Nam ?","options":[{"key":"A","text":"Công nghiệp hóa, hiện đại hóa gắn liền với phát triển công nghiệp nặng"},{"key":"B","text":"Công nghiệp hóa, hiện đại hóa trong điều kiện nền kinh tế thị trường, định hướng xã hội chủ nghĩa"},{"key":"C","text":"Công nghiệp hóa, hiện đại hóa trong bối cảnh toàn cầu hóa kinh tế quốc tế"},{"key":"D","text":"Công nghiệp hóa, hiện đại hóa theo định hướng xã hội chủ nghĩa"}],"answer":["A"]},{"number":7,"text":"Nghiên cứu về cách mang công nghiệp lần thứ nhất, C. Mác đã khái quát tính quy luật của cách mang công nghiệp qua mấy giai đoạn phát triển?","options":[{"key":"A","text":"Một giai đoạn"},{"key":"B","text":"Hai giai đoạn"},{"key":"C","text":"Ba giai đoạn"},{"key":"D","text":"Bốn giai đoạn"}],"answer":["C"]},{"number":8,"text":"“Khoa học và công nghệ sẽ có bước tiến nhảy vot. Kinh tế tri thức có vai trò ngày càng nổi bật trong quá trình phát triển lực lượng sản xuất” được nhận định trong đại hội mấy của Đảng?","options":[{"key":"A","text":"Đại hội VIII"},{"key":"B","text":"Đại hội IX"},{"key":"C","text":"Đại hội X"},{"key":"D","text":"Đại hội XI"}],"answer":["B"]},{"number":9,"text":"Cách mang công nghiệp lần thứ nhất khởi phát ở quốc gia nao?","options":[{"key":"A","text":"Anh"},{"key":"B","text":"Pháp"},{"key":"C","text":"Hy lap"},{"key":"D","text":"Đức"}],"answer":["A"]},{"number":10,"text":"Cách mang công nghiệp lần thứ tu sé làm mất di lợi thé của các nước dang phát triển về vấn dé gi?","options":[{"key":"A","text":"Tài nguyên thiên nhiên, nhân công giá rẻ"},{"key":"B","text":"Khoáng sản, sức lao động"},{"key":"C","text":"Khoa học công nghệ, nhân công chất lượng cao"}],"answer":["A"]},{"number":11,"text":"Chon phương án sai: vai trò của cách mang công nghiệp đối với sự phát triển đó là:","options":[{"key":"A","text":"Thúc đẩy sự phát triển của lực lượng sản xuất"},{"key":"B","text":"Thúc đẩy các quan hệ sản xuất mới ra đời"},{"key":"C","text":"Thúc đẩy hoàn thiện quan hệ sản xuất"},{"key":"D","text":"Thúc đẩy đổi mới phương thức quản trị phát triển"}],"answer":["B"]},{"number":12,"text":"Cách mạng công nghiệp lần thứ hai đã tao ra những tiến bộ vượt bậc trong lĩnh vực nào?","options":[{"key":"A","text":"Giao thông vận tải và thông tin liên lạc"},{"key":"B","text":"Kết cấu ha fang và viễn thông"},{"key":"C","text":"Năng lượng điện và năng lượng hóa thạch"},{"key":"D","text":"Tất cả phương án trên"}],"answer":["D"]},{"number":13,"text":"Ở Việt Nam cũng như trên thế giới sử dung thuật ngữ “cách mang công nghiệp lần thứ tu” với hàm ý gi?","options":[{"key":"A","text":"Sự thay đổi về lượng trong lực lượng sản xuất của nền kinh tế thế giới"},{"key":"B","text":"Sự thay đổi về chất trong lực lượng sản xuất của nền kinh tế thế giới"},{"key":"C","text":"Sự thay đổi về chất trong quan hệ sản xuất của nền kinh tế thế giới"},{"key":"D","text":"Sự thay đổi căn bản, toàn diện trong đời sống, sản xuất của nền kinh tế thế giới"}],"answer":["B"]},{"number":14,"text":"Kinh tế tri thức là:","options":[{"key":"A","text":"Nền kinh tế trong đó có sự sản sinh ra, phổ cập và sử dụng tri thức giữ vai trò quyết định nhất đối với sự phát triển kinh tế, tạo ra của cải, nâng cao chất lượng cuộc sống"},{"key":"B","text":"Nền kinh tế áp dụng khoa học kỹ thuật vào sản xuất"},{"key":"C","text":"Nân kinh tế phát triển giáo dục đào tạo và xem đây là nên tảng, động lực cho công nghiệp hoá, hiện đại hoá"},{"key":"D","text":"Nền kinh tế sử dụng tri thức trong sản xuất là phổ biến, vì thế cần đẩy mạnh dua sinh viên đi du học ở các nước phát triển"}],"answer":["A"]},{"number":15,"text":"Mô hình công nghiệp hóa kiểu Liên Xô được bắt đầu trong thời gian nào?","options":[{"key":"A","text":"Từ đầu những năm 1920"},{"key":"B","text":"Từ đầu những năm 1930"},{"key":"C","text":"Từ đầu những năm 1940"},{"key":"D","text":"Sau năm 1945"}],"answer":["B"]},{"number":16,"text":"Điền vào chỗ trống dé hoàn thành câu sau: “Chính trị kinh tế hoc tuyệt nhiên không nghiên cứu sự sản xuất, mà nghiên cứu những quan hệ xã hội giữa..... trong sản xuất, nghiên cứu chế độ xã hội của sản xuất”.","options":[{"key":"A","text":"Người với người"},{"key":"B","text":"Con người với tiên tệ"},{"key":"C","text":"Con người với xã hội"},{"key":"D","text":"Người với hàng hoá"}],"answer":["A"]},{"number":17,"text":"Chức năng nào của kinh tế chính trị Mác - Lénin thé hiện sự vận dung đúng các quy luật kinh tế khách quan thông qua điều chỉnh hành vi cá nhân hoặc các chính sách kinh tế sẽ góp phần thúc đẩy kinh tế - xã hội phát triển theo hướng tiến bộ?","options":[{"key":"A","text":"Chức năng thực tiễn"},{"key":"B","text":"Chức năng nhận thức"},{"key":"C","text":"Chức năng tư tưởng"},{"key":"D","text":"Chức năng phương pháp luận"}],"answer":["A"]},{"number":18,"text":"Phương pháp nghiên cứu kinh tế chính tri Mac - Lênin phù hợp nhất đó là:","options":[{"key":"A","text":"Trừu tượng hóa khoa hoc"},{"key":"B","text":"Phân tích và tổng hợp"},{"key":"C","text":"Quy nạp diễn dịch"},{"key":"D","text":"Khảo sát, tổng kết thực tiễn"}],"answer":["A"]},{"number":19,"text":"Những đóng góp to lớn của kinh tế chính trị cổ điển Anh vào ly luận kinh tế chính trị của nhân loại đó là:","options":[{"key":"A","text":"Rút ra kết luận giá trị là do hao phí lao động tạo ra"},{"key":"B","text":"Rút ra được bản chất bóc lột của chủ nghĩa tư bản"},{"key":"C","text":"Khái quát đúng mục dich của chủ nghĩa tư bản là lợi nhuận"},{"key":"D","text":"Luận giải về nhiều phạm trù kinh tế như giá trị, sản phẩm ròng, tư bản, tiền lương..."}],"answer":["A"]},{"number":20,"text":"Trên giác độ kinh tế chính tri, mục tiêu cuối cling của xuất khẩu tư bản là:","options":[{"key":"A","text":"Chiếm đoạt giá trị thặng dư và các nguồn lợi khác ở nước nhập khẩu tư bản"},{"key":"B","text":"Thực hiện giá trị và chiếm các nguồn lợi khác của nước nhập khẩu tư bản"},{"key":"C","text":"Giúp đồ các nước nhập khẩu tư ban phát triển."}],"answer":["A"]},{"number":21,"text":"Độc quyền được hiểu là:","options":[{"key":"A","text":"Liên minh giữa các doanh nghiệp lớn, có khả năng thâu tóm việc sản xuất và tiêu thụ một số loại hàng hóa, có khả năng định ra giá cả độc quyền, nhằm thu lợi nhuận độc quyền cao"},{"key":"B","text":"Liên minh giữa các doanh nghiệp vừa và nhỏ, có khả năng thâu tóm việc sản xuất và tiêu thụ một số loại hàng hóa, có khả năng định ra giá cả độc quyền, nhằm thu lợi nhuân độc quyền cao"},{"key":"C","text":"Liên minh giữa các tổ chức cá nhân và nhà nước, có khả năng thâu tóm việc sản xuất và tiêu thụ một số loại hàng hóa, có khả năng định ra giá cả độc quyền, nhằm thu lợi nhuận độc quyền cao"}],"answer":["A"]},{"number":22,"text":"Trong co cấu của độc quyền nha nước trong chủ nghĩa tu bản, thì nhà nước đã trở thành:","options":[{"key":"A","text":"Tập thể tư bản khổng lồ"},{"key":"B","text":"Bộ máy độc quyền phục vụ lợi ích nhà tư bản"},{"key":"C","text":"Chủ sở hữu toàn bộ doanh nghiệp tư nhân"},{"key":"D","text":"Một doanh nghiệp tư nhân"}],"answer":["A"]},{"number":23,"text":"Sở hữu độc quyền nhà nước là sự kết hợp của những hình thức nao?","options":[{"key":"A","text":"Sở hữu nhà nước và sở hữu tư nhân chủ nghĩa tư bản"},{"key":"B","text":"Sở hữu nhà nước và sở hữu độc quyền tư nhân"},{"key":"C","text":"Sở hữu nhà nước tư sản"},{"key":"D","text":"Sở hữu của nhiều nước tư bản"}],"answer":["B"]},{"number":24,"text":"Nhận định “tự do cạnh tranh dé ra tập trung sản xuất và su tập trung sản xuất này, phát triển tdi một mức độ nhất định, lại dẫn tới độc quyền” là của ai?","options":[{"key":"A","text":"C. Mac"},{"key":"B","text":"Ph. Angghen"},{"key":"C","text":"V.1. Lénin"},{"key":"D","text":"Staline"}],"answer":["C"]},{"number":25,"text":"Co chế thị trường có sự điều tiết của nhà nước nhằm phục vụ lợi ich của ai?","options":[{"key":"A","text":"Chủ nghĩa tư bản độc quyền"},{"key":"B","text":"Nhà nước dân chủ"},{"key":"C","text":"Các công ty tài chính"},{"key":"D","text":"Nhân dân lao động"}],"answer":["A"]},{"number":26,"text":"Mức độ giàu có của xã hội phụ thuộc chủ yếu vào:","options":[{"key":"A","text":"Trình độ khoa học công nghệ"},{"key":"B","text":"Tài nguyên thiên nhiên"},{"key":"C","text":"Khối lượng sản phẩm thặng dư"},{"key":"D","text":"Quy mô nền kinh tế"}],"answer":["C"]},{"number":27,"text":"Trong chủ nghĩa tu ban ngày nay, các trùm tài chính thống trị nên kinh tế thông qua:","options":[{"key":"A","text":"Kết hợp \"chế độ tham du\" với \"chế độ uỷ nhiệm”"},{"key":"B","text":"Chế độ tham dự"},{"key":"C","text":"Chế độ uy nhiệm"}],"answer":["A"]},{"number":28,"text":"Su hình thành độc quyền dựa trên các nguyên nhân nao sau đây?","options":[{"key":"A","text":"Sự phát triển của lực lượng sản xuất thúc đẩy các tổ chức độc quyền; cạnh tranh; khủng hoảng sự phát triển của hệ thống tín dụng"},{"key":"B","text":"Sự phát triển của quan hệ sản xuất thúc đẩy các tổ chức độc quyền; cạnh tranh; khủng hoảng sự phát triển của hệ thống tín dụng"},{"key":"C","text":"Sự phát triển của phương thức sản xuất tư ban chủ nghĩa thúc đẩy các tổ chức độc quyền; cạnh tranh; k "},{"key":"C","text":"Sáu chức năng"},{"key":"D","text":"Bảy chức năng"}],"answer":["B"]},{"number":34,"text":"Mệnh đề nào sau đây là ý không đúng về lao động phức tap?","options":[{"key":"A","text":"Lao động phức tạp là lao động trí tuệ của người lao động có trình độ cao"},{"key":"B","text":"Lao động phúc tạp là lao động trải qua đào tạo, huấn luyện"},{"key":"C","text":"Trong cùng một thời gian lao động, lao động phức tạp tạo ra nhiều giá trị hơn lao động giản đơn."}],"answer":["A"]},{"number":35,"text":"Thế nào là lao động trừu tượng?","options":[{"key":"A","text":"Là hoạt động có mục đích, có ý thức của con người"},{"key":"B","text":"Là những lao động ngành nghề tạo ra của cải"},{"key":"C","text":"Là sự hao phí sức lao động nói chung của người sản xuất hàng hóa"},{"key":"D","text":"Là lao động sản xuất nếu coi đó là sự hao phí sức lao động nói chung của con người"}],"answer":["C"]},{"number":36,"text":"Thế nào là lao động cụ thé?","options":[{"key":"A","text":"Là những lao động có thể quan sát được, nhìn thấy được"},{"key":"B","text":"Là những lao động ngành nghề"},{"key":"C","text":"Là hoạt động có mục dich của con người"},{"key":"D","text":"Là những lao động ngành nghề cụ thể, có mục đích riêng, có đối tượng riêng, thao tác riêng và kết quả riêng"}],"answer":["D"]},{"number":37,"text":"Lượng giá tri của đơn vi hàng hoá thay đổi:","options":[{"key":"A","text":"Tỷ lệ nghịch với năng suất lao động, không phụ thuộc vào cường độ lao động"},{"key":"B","text":"Ty lệ thuận với năng suất lao động"},{"key":"C","text":"Tỷ lệ nghịch với cường độ lao động"}],"answer":["A"]},{"number":38,"text":"Bản chất tiên công trong chủ nghĩa tư bản là:","options":[{"key":"A","text":"Hình thức biểu hiện bằng tiền của giá trị sức lao động"},{"key":"B","text":"Hình thức biểu hiện bằng tiền của giá cả sức lao động"},{"key":"C","text":"Hình thức biểu hiện bằng tiền của giá trị lao động"},{"key":"D","text":"Hình thức biểu hiện bằng tiền của giá cả của lao động"}],"answer":["B"]},{"number":39,"text":"Trên phương diện kinh tế chính tri, tai sản xuất là:","options":[{"key":"A","text":"Là quá trình sản xuất được lặp đi lặp lại và phục hồi không ngừng"},{"key":"B","text":"Là quá trình sản xuất liên tục"},{"key":"C","text":"Là sự khôi phục lại sản xuất"}],"answer":["A"]},{"number":40,"text":"Công thức chung của tư ban là gi?","options":[{"key":"A","text":"T-H-T'"},{"key":"B","text":"T-H-T"},{"key":"C","text":"H-T-H"},{"key":"D","text":"T-H-H-T"}],"answer":["A"]},{"number":41,"text":"Sự khác nhau giữa địa tô tuyệt đối và địa tô chênh lệch đó là:","options":[{"key":"A","text":"Độc quyền kinh doanh ruộng đã theo kiểu tư bản chủ nghĩa là nguyên nhân sinh ra địa tô chênh lệch, còn độc quyền tư hữu về ruộng đất là nguyên nhân sinh ra địa tô tuyệt đối"},{"key":"B","text":"Độc quyền sở hữu đất đã theo kiểu tư bản chủ nghĩa là nguyên nhân sinh ra địa tô chênh lệch, còn độc quyền tư hữu về ruộng đất là nguyên nhân sinh ra địa tô tuyệt đối"},{"key":"C","text":"Độc quyền kinh doanh ruộng đã theo kiểu tư bản chủ nghĩa là nguyên nhân sinh ra địa tô chênh lệch, còn độc quyền sử dụng về ruộng đất là nguyên nhân sinh ra địa tô tuyệt đối"}],"answer":["A"]},{"number":42,"text":"Mức độ bóc lột của nhà tư bản được tính bằng:","options":[{"key":"A","text":"Tỷ suất lợi nhuận"},{"key":"B","text":"Tỷ suất giá trị thặng dư"},{"key":"C","text":"Tỷ suất lợi nhuận bình quân"}],"answer":["B"]},{"number":43,"text":"Khi nào tiền tệ biến thành tư bản?","options":[{"key":"A","text":"Sức lao động trở thành hàng hóa"},{"key":"B","text":"Dùng tiền để buôn bán mua rẻ, bán đắt"},{"key":"C","text":"Có lượng tiền tệ đủ lớn"},{"key":"D","text":"Tiền đưa vào dự trữ"}],"answer":["A"]},{"number":44,"text":"Quá trình sản xuất tư bản là quá trình sản xuất:","options":[{"key":"A","text":"Giá trị sử dụng"},{"key":"B","text":"Giá trị thặng dư"},{"key":"C","text":"Giá trị trao đổi"}],"answer":["B"]},{"number":45,"text":"Phương pháp tao ra giá trị thặng dư tuyệt đối là gì?","options":[{"key":"A","text":"Kéo dài thời gian lao động thặng dư khi thời gian lao động tất yếu, năng suất lao động và giá trị sức lao động không đổi"},{"key":"B","text":"Kéo dài thời gian lao động tất yếu khi thời gian lao động thang dư, năng suất lao động và giá trị sức lao động không đổi"},{"key":"C","text":"Rút ngắn thời gian lao động thăng dư khi thời gian lao động tất yếu, năng suất lao động và giá trị súc lao động không đổi"},{"key":"D","text":"Rút ngắn thời gian lao động tất yếu khi thời gian lao động thang dư, năng suất lao động và giá trị sức lao động không đổi"}],"answer":["A"]},{"number":46,"text":"Các nhân tố anh hướng tới tỷ suất lợi nhuận đó là:","options":[{"key":"A","text":"Tỷ suất giá trị thặng dư, tốc độ chu chuyển tư ban, cấu tạo hữu cơ của tư bản, tiết kiệm tu ban bất biến"},{"key":"B","text":"Ty suất lợi tức, tốc độc chu chuyển tu bản, cấu tạo hữu cơ của tư bản, tiết kiệm tu bản bất biến"},{"key":"C","text":"Khối lượng giá trị thặng dư, tỷ suất giá trị thang du, cấu tạo hữu cơ của tư bản, tiết kiệm tu bản bất biến"},{"key":"D","text":"Khối lượng giá tri thặng dư, tỷ suất lợi tức, tỷ suất giá trị thang dư, tốc độ chu chuyển của tư bản"}],"answer":["A"]},{"number":47,"text":"Tinh định hướng xã hội chủ nghĩa của nền kinh tế thi trường Việt Nam được thé hiện ở khía cạnh nào?","options":[{"key":"A","text":"Là nền kinh tế thị trường có sự quản lý của nha nước xã hôi chủ nghĩa, do Dang Cộng sản Việt Nam lãnh"},{"key":"B","text":"Thực hiện phân phối theo kết quả lao động"},{"key":"C","text":"Là nền kinh tế mà trong đó việc xác lập thể chế sở hữu, phân phối, quản trị kinh doanh của các chủ thể cũng như quản lý nhà nước hướng tới xác lập những giá trị cốt lõi về xã hội"},{"key":"D","text":"Là nền kinh tế phát thuy được trí tuệ và nguồn lực của toàn dân"},{"key":"E","text":"Tất cả phương án"}],"answer":["E"]},{"number":48,"text":"Đại hội nào đã xác định kinh tế thị trường định hướng xã hội chủ nghĩa là “một kiểu tổ chức kinh tế vừa tuân theo quy luật của kinh tế thị trường vừa dưa trên cơ sở và chịu sự dẫn dắt chi phối bởi các nguyên tắc và bản chất của chủ nghĩa xã hội?","options":[{"key":"A","text":"Đại hội Đảng toàn quốc lần thứ VI"},{"key":"B","text":"Đại hội Đảng toàn quốc lần thứ VII"},{"key":"C","text":"Đại hội Đảng toàn quốc lần thứ VIII"},{"key":"D","text":"Đại hội Đảng toàn quốc lần thứ IX"}],"answer":["D"]},{"number":49,"text":"Tu duy của Đảng về kinh tế thị trường là:","options":[{"key":"A","text":"Có thể và cần thiết sử dụng kinh tế thị trường để xây dựng chủ nghĩa xã hội ở nước ta"},{"key":"B","text":"Có thể và không cần thiết sử dụng kinh tế thị trường để xây dựng chủ nghĩa xã hội ở nước ta"},{"key":"G","text":"Không thể và không cấn thiết sử dụng kinh tế thị trường để xây dựng chủ nghĩa xã hội ở nước ta"},{"key":"D","text":"Kinh tế thị trường là cái riêng có của chủ nghĩa tư bản"}],"answer":["A"]},{"number":50,"text":"Trong nền kinh tế thị trường định hướng xã hội chủ nghĩa, thành phần kinh tế nào giữ vai trò chủ đạo?","options":[{"key":"A","text":"Thành phần kinh tế nhà nước"},{"key":"B","text":"Thành phan kinh tế tu nhân"},{"key":"C","text":"Thành phần kinh tế tập thé"},{"key":"D","text":"Thành phần kinh tế có vốn đầu tư nước ngoài"}],"answer":["A"]},{"number":51,"text":"Kinh tế thị trường đã có mầm mống từ trong xã hội nào?","options":[{"key":"A","text":"Phong kiến"},{"key":"B","text":"Chiếm hữu nô lệ"},{"key":"C","text":"Tư bản chủ nghĩa"},{"key":"D","text":"Xã hội chủ nghĩa"}],"answer":["B"]},{"number":52,"text":"Trong nền kinh tế thi trường định hướng xã hội chủ nghĩa, thành phan kinh tế mới nào xuất hiện ở nước ta?","options":[{"key":"A","text":"Thanh phan kinh tế có vốn dau tư nước ngoai"},{"key":"B","text":"Không có thành phần kinh tế mới xuất hiện"},{"key":"C","text":"Thành phần kinh tế tập thể"},{"key":"D","text":"Thành phần kinh tế nhà nước"}],"answer":["A"]},{"number":53,"text":"Trong lich sử phát triển nền sản xuất xã hội, tiền dé nào là quan trong nhất cho sự ra đời va phát triển của nên kinh tế thị trường?","options":[{"key":"A","text":"Sản xuất"},{"key":"B","text":"Trao đổi hàng hóa"},{"key":"C","text":"Thị trường"},{"key":"D","text":"Sản xuất và trao đổi hàng hóa"}],"answer":["D"]},{"number":54,"text":"Quan điểm “đổi mới phải luôn luôn quán triệt quan điểm “dân là gốc” vi lợi ich của nhân dân, dựa vào nhân dân, phát huy vai trò làm chủ, tinh than trách nhiệm, sức sáng tạo và mọi nguồn lực của nhân dân; phát huy sức mạnh đại đoàn kết dân tộc” được đưa ra trong đại hội nào?","options":[{"key":"A","text":"Đại hội đảng X"},{"key":"B","text":"Đại hội đảng XI"},{"key":"C","text":"Đại hội đảng XII"},{"key":"D","text":"Đại hội dang XIII"}],"answer":["C"]},{"number":55,"text":"Hoàn thiện hệ thống luật pháp, cư chế, chính sách cho hoạt động và phát triển lành mạnh của thị trường chứng khoán, tăng tính minh bạch chống các giao dịch phi pháp, các hành vi rửa tiền là thuộc về:","options":[{"key":"A","text":"Thống nhất nhận thức về nền kinh tế thị trường định hướng XHCN"},{"key":"B","text":"Hoàn thiện thể chế về sở hữu và các thành phần kinh tế, loại hình doanh nghiệp và các tổ chức sản xuất kinh doanh"},{"key":"C","text":"Hoàn thiện thể chế đảm bảo đồng bộ các yếu tố thị trường và phát triển đồng bộ các loại thị trường"},{"key":"D","text":"Hoàn thiện thể chế và vai trò lãnh đạo của Đảng"}],"answer":["C"]},{"number":56,"text":"Mô hình kinh tế thị trường định hướng xã hội chủ nghĩa ở nước ta lần đầu tiên được Đảng đua ra tại Đại hội nao?","options":[{"key":"A","text":"Đại hội IX (2001)"},{"key":"B","text":"Đại hội X (2006)"},{"key":"C","text":"Đại hội XI (2011)"},{"key":"D","text":"Đại hội V (1982)"}],"answer":["A"]},{"number":57,"text":"Theo nghĩa trừu tượng, thị trường được hiểu như thế nào?","options":[{"key":"A","text":"Là nơi diễn ra hành vi trao đổi, mua bán hàng hoá giữa các chủ thể kinh tế với nhau"},{"key":"B","text":"Là tổng thể các yếu tố kinh tế vận động theo quy luật của thị trường ©. Là nơi người bán quyết định giá cả, người mua chỉ được quyền lựa chon"},{"key":"D","text":"Là tổng hoà các mi quan hệ liên quan đến trao đổi, mua bán hàng hoá, dịch vụ trong xã hội"}],"answer":["D"]},{"number":58,"text":"Cho ví dụ: nha tu bản đầu tu 50 USD để mua nguyên vật liệu dệt vai, tốn 5 USD cho hao mòn may móc để dệt được 10 mét vải từ nguyên liệu trên, 15 USD để trả công cho công nhân làm việc trong 8 giờ theo thoả thuận, nhưng sau 4 giờ thì công nhân đã làm xong 10 mét vải. Để giá trị thăng dư được tạo ra 15 USD, nhà tư bản cần làm gì?","options":[{"key":"A","text":"Đầu tư thêm 50 USD cho nguyên liệu, 5 USD cho hao mòn máy móc và bắt công nhân làm thêm 4 giờ nữa như thoả thuận"},{"key":"B","text":"Ngay từ thời điểm làm xong 4 giờ thì giá trị thang dư được tạo ra rồi"},{"key":"C","text":"Nhà tư bản cần bắt công nhân tăng ca 4 giờ nữa bên cạnh 8 giờ thoả thuận"},{"key":"D","text":"Nhà tư bản yêu cầu công nhân tăng ca thêm 6 giờ nữa để tạo ra giá trị mới"}],"answer":["A"]},{"number":59,"text":"Hình thức độc quyền dưới dạng Cartel được phổ biến ở Châu Âu vào thời gian nào?","options":[{"key":"A","text":"Đầu thế kỷ XIX"},{"key":"B","text":"Giữa thế kỷ XIX"},{"key":"C","text":"Cuối thế kỷ XIX"},{"key":"D","text":"Đầu thế kỷ XX"}],"answer":["C"]},{"number":60,"text":"Tư tưởng kinh tế đầu tiên của giai cấp tư sản trong giai đoạn phương thức sản xuất phong kiến tan rã va chủ nghĩa tư bản ra đời đó là:","options":[{"key":"A","text":"Chủ nghĩa trọng thương"},{"key":"B","text":"Chủ nghĩa trọng nông"},{"key":"C","text":"Kinh tế chính trị cổ điển Anh"},{"key":"D","text":"Kinh tế chính trị của Karl Marx"}],"answer":["A"]}]},{"id":"SU25_C2_FE","title":"SU25 • Câu 2","group":"Bộ đề","questions":[{"number":1,"text":"Ai là người dua kinh tế chính trị trở thành môn khoa hoc có tính hệ thống với các phạm trù và khái niệm chuyên ngành?","options":[{"key":"A","text":"Adam Smith"},{"key":"B","text":"David Ricardo"},{"key":"C","text":"Karl Marx"},{"key":"D","text":"Willian Stafford"}],"answer":["A"]},{"number":2,"text":"Tiến hành công nghiệp hoá theo kiểu rút ngắn so với các nước đi trước đặc biệt chúng ta cần thực hiện yêu cầu nào?","options":[{"key":"A","text":"Phát triển kinh tế và công nghiệp phải có sự nhảy vọt và không cần thực hiện tuần tự"},{"key":"B","text":"Coi trong phát triển giáo duc và đào tạo, khoa học và công nghệ, xem đây là nền tảng va động lực cho công nghiệp hóa, hiện đại hóa"},{"key":"C","text":"Phát triển kinh tế trí thức được dời lại trong giai đoạn sau"},{"key":"D","text":"Ưu tiên phát triển công nghiệp năng một cách hợp lý trên cơ sở phát triển nông nghiệp và công nghiệp nhẹ"}],"answer":["B"]},{"number":3,"text":"Công nghiệp hóa ở nước Anh bắt nguồn tử ngành nào?","options":[{"key":"A","text":"Công nghiệp dệt"},{"key":"B","text":"Công nghiệp cơ khí chế tạo"},{"key":"C","text":"Công nghiệp khai khoáng"},{"key":"D","text":"Công nghiệp đóng tàu"}],"answer":["A"]},{"number":4,"text":"Yéu tố nào quyết định đến sự hình thành của cách mang công nghiệp gì?","options":[{"key":"A","text":"Sự phát triển vượt bậc của quan hệ sản xuất"},{"key":"B","text":"Phương thức sản xuất mới ra đời"},{"key":"C","text":"Sự phát triển nhảy vọt về trình độ của tư liệu lao động"},{"key":"D","text":"Các phát minh sáng chế của các nhà khoa học trên mọi lĩnh vực"}],"answer":["C"]},{"number":5,"text":"Đâu không phải nằm trong tính tất yếu khách quan của công nghiệp hóa, hiện đại hóa ở Việt Nam?","options":[{"key":"A","text":"Từ yêu cầu phải xây dựng cơ sở vật chất- kỹ thuật của chủ nghĩa xã hội"},{"key":"B","text":"Từ yêu cầu phải rút ngắn khoảng cách tụt lùi về kinh tế, kĩ thuật, công nghệ giữa nước ta với các nước trong khu vực và quốc tế"},{"key":"C","text":"Từ yêu cầu cần phải tạo ra năng suất lao động xã hội cao, bảo đảm cho sự tồn tại và phát triển của chủ nghĩa xã hội"},{"key":"D","text":"Từ yêu cầu của thế chế chính trị của Việt Nam"}],"answer":["D"]},{"number":6,"text":"Nguyên nhân nào quyết định nhất dẫn đến su sụp đổ của Liên Xô và hệ thống XHCN ở Đông Âu?","options":[{"key":"A","text":"Cơ chế kế hoạch hoá tập trung mệnh lệnh"},{"key":"B","text":"Su tiến bộ kỹ thuật không đồng bộ"},{"key":"C","text":"Sản xuất không di đôi với tiêu dùng"},{"key":"D","text":"Công nghiệp hoá nhanh"}],"answer":["A"]},{"number":7,"text":"Việt Nam gia nhập tổ chức ASEAN khi nào?","options":[{"key":"A","text":"1995"},{"key":"B","text":"1996"},{"key":"C","text":"1993"},{"key":"D","text":"1997"}],"answer":["A"]},{"number":8,"text":"Công nghiệp hoá, hiện dai hoá đất nước phải bao đảm mục dich gi?","options":[{"key":"A","text":"Xây dựng nền kinh tế khép kín và hướng nội"},{"key":"B","text":"Xây dựng nền kinh tế độc lập tự chủ"},{"key":"C","text":"Xây dựng nền kinh tế phải dựa vào sự giúp đỡ và lệ thuộc vào các nước tư bản"},{"key":"D","text":"Xây dựng nền kinh tế mở nhưng chỉ giao lưu hợp tác với các nước xã hội chủ nghĩa"}],"answer":["B"]},{"number":9,"text":"Đặc trưng của cách mang công nghiệp lần thứ hai đó là:","options":[{"key":"A","text":"Sử dụng năng lượng điện và đông cơ điện, để tạo ra dây chuyền sản xuất có tính chuyên môn hóa cao"},{"key":"B","text":"Sử dụng năng lượng điện và máy hơi nước để cơ khí hóa sản xuất"},{"key":"C","text":"Sử dụng năng lượng hơi nước, để cơ khí hóa sản xuất"},{"key":"D","text":"Sử dụng công nghệ thông tin và máy tính để tự động hóa sản xuất"}],"answer":["A"]},{"number":10,"text":"Quan điểm về “xây dựng nền kinh tế tự chủ phải dựa trên cơ sở làm chủ công nghệ va chủ động, tích cực hội nhập, đa dạng hóa thị trường, nâng cao khả năng thích ứng của nền kinh tế” được đưa ra trong chiến lược phát triển kinh tế - xã hội ở giai đoạn nào?","options":[{"key":"A","text":"Chiến lược phát triển kinh tế - xã hội 2001 -2010"},{"key":"B","text":"Chiến lược phát triển kinh tế - xã hội 2011 -2020"},{"key":"C","text":"Chiến lược phát triển kinh tế - xã hội 2021 -2030"},{"key":"D","text":"Chiến lược phát triển kinh tế - xã hội 2016-2021"}],"answer":["C"]},{"number":11,"text":"Cách mang công nghiệp lần thứ hai diễn ra trong giai đoạn nào?","options":[{"key":"A","text":"Từ nửa cuối thế kỷ XIX đến đầu thế kỷ XX"},{"key":"B","text":"Từ nửa đầu thé ky XIX đến cuối thé ky XIX"},{"key":"C","text":"Từ nửa đầu thế kỷ XX để nữa cuối thế kỷ XX"},{"key":"D","text":"Từ nửa cuối thé kỷ XIX đến nửa cuối thé ky XX"}],"answer":["A"]},{"number":12,"text":"Đâu không phải là mục dich của hội nhập kinh tế quốc tế?","options":[{"key":"A","text":"Thu hút vốn đầu tư nước ngoài, thu hút công nghệ hiện đại"},{"key":"B","text":"Học hỏi kinh nghiệm quản lý tiên tiến của thé giới"},{"key":"C","text":"Khai thác thị trường thế giới để tiêu thụ các sản phẩm mà nước ta có nhiều lợi thé và khả năng cạnh tranh cao"},{"key":"D","text":"Đầu tư tư bản trực tiếp thu lợi nhuận ở nước ngoài"}],"answer":["D"]},{"number":13,"text":"Cách mang công nghiệp lần thứ nhất diễn ra trong thời gian nào?","options":[{"key":"A","text":"Từ giữa thế kỷ XV đến giữa thế kỷ XIX"},{"key":"B","text":"Từ giữa thế kỷ XVI đến giữa thế kỷ XVII"},{"key":"C","text":"Từ giữa thé ky XVIII đến giữa thé ky XIX"},{"key":"D","text":"Từ giữa thé ky XIX đến giữa thé ky XX"}],"answer":["C"]},{"number":14,"text":"Tiến hành công nghiệp hoá theo kiểu rút ngắn so với các nước di trước, đặc biệt như Việt Nam cần thực hiện yêu cầu nào?","options":[{"key":"A","text":"Phát triển kinh tế và công nghiệp phải có sự nhảy vọt và không cần thực hiện tuần tự"},{"key":"B","text":"Coi trong phát triển giáo dục và đào tạo, khoa học và công nghệ, xem đây là nên tảng và động lực cho công nghiệp hóa, hiện đại hóa"},{"key":"C","text":"Phát triển kinh tế tri thức được dời lại trong giai đoạn sau"},{"key":"D","text":"Uu tiên phát triển công nghiệp nang một cách hợp lý trên cơ sở phát triển nông nghiệp và công nghiệp nhẹ."}],"answer":["B"]},{"number":15,"text":"Mỗi cuộc cách mạng công nghiệp xuất hiện đều có sự phát triển nhảy vọt về:","options":[{"key":"A","text":"Tư liệu lao động"},{"key":"B","text":"Tư liệu sinh hoạt"},{"key":"C","text":"Tu liệu tiêu dùng"},{"key":"D","text":"Các phát minh sáng chế"}],"answer":["A"]},{"number":16,"text":"Thuật ngữ \"Kinh tế chí n lực kinh tế là:","options":[{"key":"A","text":"Các chủ thể kinh tế có tính độc lập, nghĩa là có quyền tự chủ trong sản xuất, kinh doanh, lỗ lãi tự chịu a  rig chủ thể kinh tế không có tinh độc lập, nghĩ là không có quyền tu chủ trong sản xuất, kinh doanh, lỗ lãi chịu"},{"key":"C","text":"Các chủ thể kinh tế có tính độc lập, nghĩa là có quyền quyết định lỗ lãi"},{"key":"D","text":"Các chủ thể kinh tế có tính độc lập, nghĩa là có quyền làm bất cứ những gì họ muốn"}],"answer":["A"]},{"number":56,"text":"Người phát minh ra con thoi - một cải tiến của khung dệt va là một đóng góp quan trong cho cách mạng công nghiệp lần thứ nhất là:","options":[{"key":"A","text":"John Kay (1704 - 1779)"},{"key":"B","text":"Richard Arkwright (1732 - 1792)"},{"key":"C","text":"Edmund Cartwright (1743 - 1823)"},{"key":"D","text":"James Watt (1736 - 1891)"}],"answer":["A"]},{"number":57,"text":"Cứ 100 công nhân thì tao ra giá tri mới là 500.000 USD, tư bản kha biến cho mỗi công nhân là 1.000 USD(tháng. Để tạo ra được giá trị mới 1.200.000 USD thì cần lượng công nhân là bao nhiêu, biết rằng tiền lương cho mỗi công nhân không đổi và trình độ bóc lột tăng thêm 100%.","options":[{"key":"A","text":"Số công nhân là 200 người"},{"key":"B","text":"Số công nhân là 100 người"},{"key":"C","text":"Số công nhân là 500 người"},{"key":"D","text":"Số công nhân là 50 người"}],"answer":["A"]},{"number":58,"text":"Điển vào chỗ trống: Theo Karl Marx, kinh tế chính trị học tư sản cổ điển Anh bắt đầu từ... và kết thúc ở...","options":[{"key":"A","text":"William Petty..David Ricardo"},{"key":"B","text":"William Petty..Adam Smith"},{"key":"C","text":"Adam Smith... David Ricardo"},{"key":"D","text":"Adam Smith.. Thomas Malthus"}],"answer":["A"]},{"number":59,"text":"Quan điểm cho rang, xã hội loài người phát triển dựa theo những quy luật tự nhiên thuộc về trường phái nào?","options":[{"key":"A","text":"Chủ nghĩa trọng thương"},{"key":"B","text":"Chủ nghĩa trọng nông"},{"key":"C","text":"Kinh tế chính trị cổ điển A
