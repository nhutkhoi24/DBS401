 trò quyết định, kinh tế tư nhân giữ vai trò là một động lực quan trọng"},{"key":"C","text":"Kinh tế tư nhân giữ vai trò chủ đạo, kinh tế nhà nước giữ vai trò là một động lực quan trọng"},{"key":"D","text":"Kinh tế tư nhân giữ vai trò then chốt, kinh tế nhà nước giữ vai trò quyết định"}],"answer":["A"]},{"number":56,"text":"là người đề xuất ra ba loại thương nghiệp (trao đổi tự nhiên, trao đổi tiền tệ, trao đổi thông qua mục đích làm âu) và hai loại kinh doanh (kinh tế, sản xuất của cải)?","options":[{"key":"A","text":"Aristoteles"},{"key":"B","text":"Platon"},{"key":"C","text":"Xenophon"},{"key":"D","text":"Karl Marx"}],"answer":["A"]},{"number":57,"text":"Loại tiền nào được hiểu là phương tiện thanh toán mà giá trị hay sức mua của nó với tư cách là tiền vượt xa chỉ phí sản xuất ra nó hay giá trị của nó khi dùng vào việc khác, chứ không dùng làm tiền?","options":[{"key":"A","text":"Tiền quy ước"},{"key":"B","text":"Tiền tượng trưng"},{"key":"C","text":"Tiên ghi nợ"},{"key":"D","text":"Tiền vàng"}],"answer":["A"]},{"number":58,"text":"Lý thuyết bàn tay vô hình của Adam Smith được hiểu là gì? (chọn 3 phương án đúng)","options":[{"key":"A","text":"Người bán và người mua, phân bố nguồn lực kinh tế đạt được hiệu quả xã hội lớn nhất mà không cần sự can thiệp của chính phủ"},{"key":"B","text":"Mô tả khả năng của cơ chế thị trường trong việc điều chỉnh cung cầu trên thị trường."},{"key":"C","text":"Các cá nhân tham gia muốn tối đa hóa lợi nhuận cho mình"},{"key":"D","text":"Mọi người đều bị bàn tay vô hình dẫn tới kết quả làm lợi cho chính mình"}],"answer":["A","B","C"]},{"number":59,"text":"Để sản xuất ra 1000 đôi dép, công ty đầu tư 100000 USD cho nguyên liệu, vật liệu, 5000 USD cho hao mòn máy móc. Công ty đó trả 5000 USD cho công nhân, trình độ bóc lột đạt 200%. Tính giá trị (W) của 10000 đôi dép công ty sản xuất ra?","options":[{"key":"A","text":"W = 120000USD"},{"key":"B","text":"W = 110000USD"},{"key":"C","text":"W = 115000USD"},{"key":"D","text":"W = 100000USD"}],"answer":["A"]},{"number":60,"text":"Tổ chức Hợp tác và Phát triển kinh tế gọi tắt là gì?","options":[{"key":"A","text":"OECD"},{"key":"B","text":"TNCS"},{"key":"C","text":"GDP"},{"key":"D","text":"FTA"}],"answer":["A"]}]},{"id":"SU26 - RE","title":"SU26 • Thi lại","group":"Bộ đề","questions":[{"number":1,"text":"Lĩnh vực nghiên cứu trọng tâm của chủ nghĩa trọng thương là gì?","options":[{"key":"A","text":"Lĩnh vực lưu thông"},{"key":"B","text":"Lĩnh vực sản xuất"},{"key":"C","text":"Lĩnh vực thuế"},{"key":"D","text":"Lĩnh vực tiền lương"}],"answer":["A"]},{"number":2,"text":"Phương thức sản xuất tư bản chủ nghĩa hình thành và thay thế cho phương thức sản sản xuất nào?","options":[{"key":"A","text":"Phương thức sản xuất phong kiến"},{"key":"B","text":"Phương thức sản xuất chiếm hữu nô lệ"},{"key":"C","text":"Phương thức sản xuất cộng sản nguyên thuỷ"},{"key":"D","text":"Phương thức sản xuất cộng sản chủ nghĩa"}],"answer":["A"]},{"number":3,"text":"Kinh tế chính trị cổ điển Anh được hình thành và phát triển từ cuối thế kỷ XVIII đến nửa đầu thế kỷ XIX, mỡ đầu bằng các quan điểm lý luận của nhà kinh tế chính trị học nào sau đây?","options":[{"key":"A","text":"David Ricardo"},{"key":"B","text":"Adam Smith"},{"key":"C","text":"William Petty"},{"key":"D","text":"Thomas Mun"}],"answer":["C"]},{"number":4,"text":"Lý luận kinh tế chính trị của C. Mác và Ph. Ăngghen được cô đọng và tập trung trong tác phẩm nào?","options":[{"key":"A","text":"Tư bản"},{"key":"B","text":"Bản thảo kinh tế - triết học"},{"key":"C","text":"Lược thảo phê phản khoa kinh tế chính trị"},{"key":"D","text":"Tuyên ngôn của Đảng Cộng sản"}],"answer":["A"]},{"number":5,"text":"Chức năng nào của kinh tế chính trị Mác - Lênin thể hiện sự vận dụng đúng các quy luật kinh tế khách quan thông qua điều chỉnh hành vi cá nhân hoặc các chính sách kinh tế sẽ góp phần thúc đẩy kinh tế - xã hội phát triển theo hướng tiến bộ?","options":[{"key":"A","text":"Chức năng thực tiễn"},{"key":"B","text":"Chức năng nhận thức"},{"key":"C","text":"Chức năng tư tường"},{"key":"D","text":"Chức năng phương pháp luận"}],"answer":["A"]},{"number":6,"text":"Hai hàng hoá trao đổi được với nhau vì lí do gì?","options":[{"key":"A","text":"Chúng cùng là sản phẩm của lao động"},{"key":"B","text":"Có lượng thời gian hao phí lao động cần thiết để sản xuất ra chúng bằng nhau"},{"key":"C","text":"Các phương án trả lời đều đúng"},{"key":"D","text":"Chúng có cùng giá trị sử dụng"}],"answer":["C"]},{"number":7,"text":"Nền kinh tế hàng hoá có thể hình thành và phát triển khi có các điều kiện nào?","options":[{"key":"A","text":"Phân công lao động xã hội và sự tách biệt về mặt kinh tế của các chủ thể sản xuất."},{"key":"B","text":"Của cải dư thừa"},{"key":"C","text":"Khi có chế độ tư hữu xuất hiện"},{"key":"D","text":"Sự tách biệt về mặt kinh tế của các chủ thể sản xuất"}],"answer":["A"]},{"number":8,"text":"Phương hướng cơ bản, lâu dài để tăng sản phẩm xã hội là gì?","options":[{"key":"A","text":"Tăng năng suất lao động"},{"key":"B","text":"Tăng cường độ lao động"},{"key":"C","text":"Kéo dài thời gian lao động"},{"key":"D","text":"Mở rộng quy mô sản xuất, khai thác tài nguyên thiên nhiên"}],"answer":["A"]},{"number":9,"text":"Tiên tệ ra đời là do nhu cầu gì?","options":[{"key":"A","text":"Nhu cầu sản xuất hàng hóa và trao đổi hàng hóa"},{"key":"B","text":"Nhu cầu lưu thông hàng hóa"},{"key":"C","text":"Nhu cầu lưu thông tiền tệ"},{"key":"D","text":"Nhu cầu sản xuất giá trị"}],"answer":["A"]},{"number":10,"text":"Hoạt động nào của con người được coi là cơ bản nhất và là cơ sở của đời sống xã hội?","options":[{"key":"A","text":"Hoạt động sản xuất của cải vật chất"},{"key":"B","text":"Hoạt động nghệ thuật, thể thao"},{"key":"C","text":"Hoạt động chính trị"},{"key":"D","text":"Hoạt động kinh tế của xã hội"}],"answer":["A"]},{"number":11,"text":"Khi nào xuất hiện hình thái tiền tệ?","options":[{"key":"A","text":"Khi sản xuất và trao đổi đã phát triển"},{"key":"B","text":"Khi vật ngang giá chung được cố định ở vàng, bạc"},{"key":"C","text":"Khi không còn quan hệ trao đổi trực tiếp, có một thứ hàng làm trung gian trong trao đổi"},{"key":"D","text":"Khi nhu cầu trao đổi vượt quá phạm vi quốc gia"}],"answer":["B"]},{"number":12,"text":"Tiền tệ là bánh xe vĩ đại của lưu thông. Câu nói này là của ai và theo anh (chị) nó có đúng không?","options":[{"key":"A","text":"A. Smith và là câu nói đúng"},{"key":"B","text":"Đ. Ricacđô và là câu nói đúng"},{"key":"C","text":"C. Mác và là câu nói đúng"},{"key":"D","text":"D. Ricacđô và là câu nói sai"}],"answer":["A"]},{"number":13,"text":"Nguyên nhân của bản chất khủng hoảng kinh tế chủ nghĩa tư bản là gì?","options":[{"key":"A","text":"Bắt nguồn từ mâu thuẫn của bản chất của chủ nghĩa tư bản"},{"key":"B","text":"Do sản xuất không có kế hoạch"},{"key":"C","text":"Do chạy theo lợi nhuận"},{"key":"D","text":"Do nhà nước can thiệp quá mức"}],"answer":["A"]},{"number":14,"text":"Tư bản cố định có vai trò gì?","options":[{"key":"A","text":"Là nguồn gốc của giá trị thặng dư"},{"key":"B","text":"Là điều kiện để tăng năng suất lao động"},{"key":"C","text":"Các phương án trả lời đều sai"},{"key":"D","text":"Là hệ quả của quá trình bóc lột"}],"answer":["B"]},{"number":15,"text":"Tuần hoàn tư bản là sự vận động của tư bản lần lượt trải qua ba giai đoạn dưới hình thái nào?","options":[{"key":"A","text":"Tư bản tiền tệ - tư bản sản xuất - tư bản hàng hoá"},{"key":"B","text":"Tư bản sản xuất - tư bản hàng hoá - tư bản tiền tệ"},{"key":"C","text":"Tư bản hàng hoá - tư bản sản xuất - tư bản tiền tệ"},{"key":"D","text":"Tư bản tiền tệ - tư bản hàng hoá - tư bản sản xuất"}],"answer":["A"]},{"number":16,"text":"Khủng hoảng kinh tế chủ nghĩa tư bản là gì?","options":[{"key":"A","text":"Chủ quan"},{"key":"B","text":"Tất yếu khách quan"},{"key":"C","text":"Nhất thời"},{"key":"D","text":"Có tính thời điểm"}],"answer":["B"]},{"number":17,"text":"Cấu tạo hữu cơ của tư bản được kí hiệu là gì?","options":[{"key":"A","text":"c/v"},{"key":"B","text":"T/T"},{"key":"C","text":"m/v"},{"key":"D","text":"CH/ch"}],"answer":["A"]},{"number":18,"text":"Khi sử dụng hàng hóa sức lao động sẽ tạo ra giá trị như thế nào?","options":[{"key":"A","text":"Giá trị môi bằng giá trị bản thân nó"},{"key":"B","text":"Giá trị môi lớn hơn giá trị bản thân nó"},{"key":"C","text":"Giá trị mới nhỏ hơn giá trị bản thân nó"},{"key":"D","text":"Giá trị sử dụng môi nhỏ hơn giá trị sử dụng bản thân nó"}],"answer":["B"]},{"number":19,"text":"Tăng trưởng kinh tế là gì?","options":[{"key":"A","text":"Tăng năng suất lao động"},{"key":"B","text":"Tăng GDP và GNP trong một thời kỳ nhất định"},{"key":"C","text":"Tăng hiệu quả của sản xuất"},{"key":"D","text":"Tăng lãi suất ngân hàng"}],"answer":["B"]},{"number":20,"text":"Phạm trù lợi nhuận chẳng qua chỉ là một hình thái thần bí hóa của giá trị thặng dư, nguyên nhân của việc này xuất phát từ đâu? (chọn nhiều đáp án)","options":[{"key":"A","text":"Sự hình thành chi phí sản xuất tư bản chủ nghĩa đã xóa nhòa sự khác nhau giữa c (tư bản bất biến) và v (tư bản khả biến)"},{"key":"B","text":"Do chi phí sản xuất tư bản chủ nghĩa luôn nhỏ hơn chi phí sản xuất thực tế"},{"key":"C","text":"Sự hình thành của giá trị thặng dư và chi phí sản xuất tư bản chủ nghĩa"},{"key":"D","text":"Chi phí sản xuất tư bản chủ nghĩa luôn luôn nhỏ hơn giá của của hàng hóa bán ra"}],"answer":["A","B","D"]},{"number":21,"text":"Sở hữu độc quyền nhà nước là sự kết hợp của các hình thức sở hữu nào?","options":[{"key":"A","text":"Sở hữu nhà nước và sở hữu độc quyền tư nhân"},{"key":"B","text":"Sở hữu của liên minh các tập đoàn độc quyền"},{"key":"C","text":"Sở hữu của liên minh các nhà nước tư sản"},{"key":"D","text":"Sở hữu nhà nước ở chính quốc và thuộc địa"}],"answer":["A"]},{"number":22,"text":"Trong giai đoạn chủ nghĩa tư bản độc quyền, ngoài sự cạnh tranh giữa những người sản xuất nhỏ, giữa những nhà tư bản vừa và nhỏ như trong giai đoạn chủ nghĩa tư bản cạnh tranh tự do, mà còn có thêm các loại cạnh tranh nào? (chọn nhiều đáp án)","options":[{"key":"A","text":"cạnh tranh giữa các tổ chức độc quyền với các xí nghiệp ngoài độc quyền"},{"key":"B","text":"Cạnh tranh giữa các tổ chức độc quyền với nhau"},{"key":"C","text":"Cạnh tranh trong nội bộ các tổ chức độc quyền"},{"key":"D","text":"Cạnh tranh giữa các tổ chức tư bản độc quyền nhà nước với nhau"}],"answer":["A","B","C"]},{"number":23,"text":"Giá cả ruộng đất phụ thuộc các nhân tố nào?","options":[{"key":"A","text":"Mức địa tô của đất"},{"key":"B","text":"Độ màu mỡ của đất"},{"key":"C","text":"Vị trí của đất"},{"key":"D","text":"Kỳ vọng của người mua"}],"answer":["A"]},{"number":24,"text":"Sự ra đời của CNTB độc quyền nhà nước nhằm mục đích gì?","options":[{"key":"A","text":"Phục vụ lợi ích của tổ chức độc quyền tư nhân và cứu nguy cho chủ nghĩa tư bản"},{"key":"B","text":"Phục vụ lợi ích của tổ chức độc quyền tư nhân"},{"key":"C","text":"Phục vụ lợi ích của nhà nước tư sản"},{"key":"D","text":"Phục vụ cho lợi ích chung của toàn xã hội"}],"answer":["A"]},{"number":25,"text":"Những tác động tiêu cực của độc quyền đối với nền kinh tế thị trường đó là gì? (chọn nhiều đáp án)","options":[{"key":"A","text":"Làm cho cạnh tranh không hoàn hảo gây thiệt hại cho người tiêu dùng và xã hội"},{"key":"B","text":"Kìm hãm sự tiến bộ của khoa học kỹ thuật từ đó kìm hãm sự phát triển kinh tế"},{"key":"C","text":"Gây ra hiện tượng phân hóa giàu nghèo"},{"key":"D","text":"Gây ra chiến tranh"}],"answer":["A","B","C"]},{"number":26,"text":"Vì sao trong chủ nghĩa tư bản độc quyền, cạnh tranh không bị thủ tiêu?","options":[{"key":"A","text":"Vì cạnh tranh là quy luật khách quan của kinh tế hàng hoá"},{"key":"B","text":"Vì tổ chức độc quyền cạnh tranh với các công ty ngoài độc quyền"},{"key":"C","text":"Vì các xí nghiệp trong nội bộ tổ chức độc quyền cạnh tranh với nhau"},{"key":"D","text":"Không có cạnh tranh"}],"answer":["A"]},{"number":27,"text":"Nhân tố nào là cơ bản thúc đấy chủ nghĩa tư bản ra đời nhanh chóng?","options":[{"key":"A","text":"Tích luỹ nguyên thuỷ"},{"key":"B","text":"Sự phát triển mạnh mẽ của phương tiện giao thông vận tải nhờ đó mở rộng giao lưu buôn bán quốc tế"},{"key":"C","text":"Sự tác động của quy luật giá trị"},{"key":"D","text":"Sự điều tiết của nhà nước tư sản"}],"answer":["A"]},{"number":28,"text":"\"Tư bản tài chính là kết quả của sự hợp nhất giữa tư bản ngân hàng của một số ít ngân hàng độc quyền lôn nhất, với tư bản của những liên minh độc quyền các nhà công nghiệp.\" Câu nói trên của ai?","options":[{"key":"A","text":"C. Mác"},{"key":"B","text":"Ph. Ăngghen"},{"key":"C","text":"V. I. Lênin"},{"key":"D","text":"Hồ Chí Minh"}],"answer":["C"]},{"number":29,"text":"Sự phát triển của các tổ chức độc quyền trong ngân hàng đã làm thay đổi quan hệ giữa ngân hàng và các doanh nghiệp công nghiệp như thế nào?","options":[{"key":"A","text":"Từ trung gian thanh toán trở thành khống chế mọi hoạt động kinh tế - xã hội"},{"key":"B","text":"Từ trung gian thanh toán trở thành cổ đông của các doanh nghiệp nhà nước"},{"key":"C","text":"Từ hoạt động cho vay trở thành hoạt động khống chế doanh tư nhân"},{"key":"D","text":"Từ hoạt động cho vay trở thành chi phối các doanh nghiệp"}],"answer":["A"]},{"number":30,"text":"Quan điểm \"đổi mới phải luôn luôn quán triệt quan điểm “dân là gốc\" vì lợi ích của nhân dân, dựa vào nhân dân, phát huy vai trò làm chủ, tinh thần trách nhiệm, sức sáng tạo và mọi nguồn lực của nhân dân; phát huy sức mạnh đại đoàn kết dân tộc\" được đưa ra trong đại hội nào?","options":[{"key":"A","text":"Đại hội đảng X"},{"key":"B","text":"Đại hội đảng XI"},{"key":"C","text":"Đại hội đảng XII"},{"key":"D","text":"Đại hội đảng XIII"}],"answer":["C"]},{"number":31,"text":"Đại hội nào của Đảng Cộng sản Việt Nam đề cập đến sự cần thiết đổi mới cơ chế quản lý kinh tế?","options":[{"key":"A","text":"Đại hội đảng V"},{"key":"B","text":"Đại hội đảng VI"},{"key":"C","text":"Đại hội đảng VII"},{"key":"D","text":"Đại hội đảng VIII"}],"answer":["B"]},{"number":32,"text":"Thể chế được hiểu là gì?","options":[{"key":"A","text":"Những quy tắc, pháp luật, bộ máy quản lí và cơ chế vận hành nhằm điều chỉnh các hoạt động của con người trong 1 chế độ xã hội"},{"key":"B","text":"Luật chơi chính thức và phi chính thức được đặt ra đối với các chủ thể tham gia hoạt động trong nền kinh tế của một quốc gia trong một giai đoạn lịch sử nhất định"},{"key":"C","text":"Được cấu thành bởi hệ thống các bộ phận khác nhau mà mỗi bộ phận cũng là một hệ thống phức tạp gồm nhiều yếu tố"},{"key":"D","text":"Quy luật vận động và phát triển của một cộng đồng xã hội"}],"answer":["A"]},{"number":33,"text":"Mô hình kinh tế thị trường định hướng xã hội chủ nghĩa ở nước ta được chính thức nêu ra ở Đại hội nào của Đảng Cộng sản Việt Nam?","options":[{"key":"A","text":"Đại hội VI"},{"key":"B","text":"Đại hội VIII"},{"key":"C","text":"Đại hội IX"},{"key":"D","text":"Đại hội X"}],"answer":["C"]},{"number":34,"text":"Trong lịch sử phát triển nền sản xuất xã hội, tiền đề nào là quan trọng nhất cho sự ra đời và phát triển của nền kinh tế thị trường?","options":[{"key":"A","text":"Sản xuất"},{"key":"B","text":"Trao đổi hàng hóa"},{"key":"C","text":"Thị trường"},{"key":"D","text":"Sản xuất và trao đổi hàng hóa"}],"answer":["D"]},{"number":35,"text":"Phân chia theo tiêu chí cấu trúc của các tổ chức tham gia xã hội, thể chế được chia thành các thể chế nào?","options":[{"key":"A","text":"Thế chế công, thể chế tư"},{"key":"B","text":"Thế chế nhà nước, thể chế tư bản tư nhân"},{"key":"C","text":"Thể chế nước trong và ngoài nước"},{"key":"D","text":"Thể chế chính trị và thể chế kinh tế"}],"answer":["B"]},{"number":36,"text":"Về vị trí lịch sử, kinh tế thị trường có đặc điểm gì?","options":[{"key":"A","text":"Do chủ nghĩa tư bản sinh ra"},{"key":"B","text":"Là nền kinh tế hàng hoá phát triển cao"},{"key":"C","text":"Tôn tại chủ quan trong thời kỳ quá độ lên chủ nghĩa xã hội"},{"key":"D","text":"Là sản phẩm riêng của chủ nghĩa tư bản"}],"answer":["B"]},{"number":37,"text":"Nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam có tính chất gì?","options":[{"key":"A","text":"Phổ biến và đặc thù"},{"key":"B","text":"Phổ biến và cách mạng"},{"key":"C","text":"Phổ biến và riêng biệt"},{"key":"D","text":"Phổ biến và đại chúng"}],"answer":["A"]},{"number":38,"text":"Xây dựng nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam nhằm thực hiện mục tiêu gì?","options":[{"key":"A","text":"Dân giàu, nước mạnh, dân chủ, công bằng, văn minh"},{"key":"B","text":"Dân giàu, nước mạnh, công bằng, dân chủ, văn minh"},{"key":"C","text":"Dân giàu, nước mạnh, văn minh, công bằng, dân chủ"},{"key":"D","text":"Dân giàu, nước mạnh, dân chủ, văn minh, công bằng"}],"answer":["A"]},{"number":39,"text":"Công nghiệp hoá, hiện đại hoá đất nước phải bảo đảm mục đích gì?","options":[{"key":"A","text":"Xây dựng nền kinh tế khép kín và hướng nội"},{"key":"B","text":"Xây dựng nền kinh tế độc lập tự chủ"},{"key":"C","text":"Xây dựng nền kinh tế phải dựa vào sự giúp đỡ và lệ thuộc vào các nước tư bản"},{"key":"D","text":"Xây dựng nền kinh tế mở nhưng chỉ giao lưu hợp tác với các nước xã hội chủ nghĩa"}],"answer":["B"]},{"number":40,"text":"Tiến hành công nghiệp hoá theo kiểu rút ngắn so với các nước đi trước đặc biệt chúng ta cần thực hiện yêu cầu nào?","options":[{"key":"A","text":"Phát triển kinh tế và công nghiệp phải có sự nhảy vọt và không cần thực hiện tuần tự"},{"key":"B","text":"Coi trọng phát triển giáo dục và đào tạo, khoa học và công nghệ, xem đây là nền tảng và động lực cho công nghiệp hóa, hiện đại hóa"},{"key":"C","text":"Phát triển kinh tế trí thức được dời lại trong giai đoạn sau"},{"key":"D","text":"Ưu tiên phát triển công nghiệp nặng một cách hợp lý trên cơ sở phát triển nông nghiệp và công nghiệp nhẹ"}],"answer":["B"]},{"number":41,"text":"Quan điểm về “xây dựng nền kinh tế tự chủ phải dựa trên cơ sở làm chủ công nghệ và chủ động, tích cực hội nhập, đa dạng hóa thị trường, nâng cao khả năng thích ứng của nền kinh tế\" được đưa ra trong chiến lược phát triển kinh tế - xã hội ở giai đoạn nào?","options":[{"key":"A","text":"Chiến lược phát triển kinh tế - xã hội 2001-2010"},{"key":"B","text":"Chiến lược phát triển kinh tế - xã hội 2011-2020"},{"key":"C","text":"Chiến lược phát triển kinh tế - xã hội 2021-2030"},{"key":"D","text":"Chiến lược phát triển kinh tế - xã hội 2016-2021"}],"answer":["C"]},{"number":42,"text":"Cách mạng công nghiệp lần thứ nhất diễn ra trong thời gian nào?","options":[{"key":"A","text":"Từ giữa thế kỷ XV đến giữa thế kỷ XIX"},{"key":"B","text":"Từ giữa thế kỷ XVI đến giữa thế kỷ XVII"},{"key":"C","text":"Từ giữa thế kỷ XVIII đến giữa thế kỷ XIX"},{"key":"D","text":"Từ giữa thế kỷ XIX đến giữa thế kỷ XX"}],"answer":["C"]},{"number":43,"text":"Khi nghiên cứu về cách mạng công nghiệp lần thứ nhất, C. Mác đã khái quát tính quy luật của các mạng công nghiệp qua các giai đoạn phát triển đó là gì?","options":[{"key":"A","text":"Hiệp tác đơn giản, lao động thủ công, lao động phức tạp"},{"key":"B","text":"Hiệp tác đơn giản, công trường thủ công, công nghiệp hóa"},{"key":"C","text":"Hiệp tác đơn giản, sản xuất thủ công, sản xuất hiện đại"},{"key":"D","text":"Hiệp tác đơn giản, công trường thủ công, đại công nghiệp"}],"answer":["D"]},{"number":44,"text":"Yếu tố nào quyết định đến sự hình thành của cách mạng công nghiệp gì?","options":[{"key":"A","text":"Sự phát triển vượt bậc của quan hệ sản xuất"},{"key":"B","text":"Phương thức sản xuất mới ra đời"},{"key":"C","text":"Sự phát triển nhảy vọt về trình độ của tư liệu lao động"},{"key":"D","text":"Các phát minh sáng chế của các nhà khoa học trên mọi lĩnh vực"}],"answer":["C"]},{"number":45,"text":"Mỗi cuộc cách mạng công nghiệp xuất hiện đều có sự phát triển nhảy vọt về điều gì?","options":[{"key":"A","text":"Tư liệu lao động"},{"key":"B","text":"Tư liệu sinh hoạt"},{"key":"C","text":"Tư liệu tiêu dùng"},{"key":"D","text":"Các phát minh sáng chế"}],"answer":["A"]},{"number":46,"text":"Điền vào chỗ trống: C. Mác và Ph. Ăngghen đã nhận xét rằng: \"Giai cấp tư sản, trong quá trình thống trị giai cấp chưa đầy một thế kỷ, đã tạo ra những... nhiều hơn và đồ sộ hơn.... của tất cả các thế hệ trước kia gộp lại\"","options":[{"key":"A","text":"Lực lượng sản xuất... lực lượng sản xuất"},{"key":"B","text":"Quan hệ sản xuất... quan hệ sản xuất"},{"key":"C","text":"Của cải... của cải"},{"key":"D","text":"Vật chất... vật chất"}],"answer":["A"]},{"number":47,"text":"Nội dung công cuộc đại phân công lao động xã hội lần thứ hai là gì?","options":[{"key":"A","text":"Đại công nghiệp tách khỏi nông nghiệp"},{"key":"B","text":"Trồng trọt tách khỏi chăn nuôi"},{"key":"C","text":"Ngành thương nghiệp ra đời"},{"key":"D","text":"Thủ công nghiệp tách khỏi nông nghiệp"}],"answer":["D"]},{"number":48,"text":"Nội dung công cuộc đại phân công lao động xã hội lần thứ ba là gì?","options":[{"key":"A","text":"Đại công nghiệp tách khỏi nông nghiệp"},{"key":"B","text":"Trồng trọt tách khỏi chăn nuôi"},{"key":"C","text":"Ngành thương nghiệp ra đời"},{"key":"D","text":"Thủ công nghiệp tách khỏi nông nghiệp"}],"answer":["C"]},{"number":49,"text":"Đảng Cộng sản Việt Nam luôn nhấn mạnh tầm quan trọng của việc xây dựng nền kinh tế như thế nào?","options":[{"key":"A","text":"Mỡ của"},{"key":"B","text":"Độc lập, tự chủ"},{"key":"C","text":"Hội nhập kinh tế quốc tế"},{"key":"D","text":"Có tính cạnh tranh"}],"answer":["B"]},{"number":50,"text":"Cách mạng công nghiệp lần thứ ba diễn ra trong giai đoạn nào?","options":[{"key":"A","text":"Từ đầu thập niên 50 của thế kỷ XX đến cuối thế kỷ XX"},{"key":"B","text":"Từ đầu thập niên 60 của thế kỷ XX đến cuối thế kỷ XX"},{"key":"C","text":"Từ đầu thập niên 70 của thế kỷ XX đến cuối thế kỷ XX"},{"key":"D","text":"Từ đầu thập niên 80 của thế kỷ XX đến cuối thế kỷ XX"}],"answer":["A"]},{"number":51,"text":"Ở Việt Nam cũng như trên thế giới sử dụng thuật ngữ “cách mạng công nghiệp lần thứ tư với hàm ý gì?","options":[{"key":"A","text":"Sự thay đổi về lượng trong lực lượng sản xuất của nền kinh tế thế giới"},{"key":"B","text":"Sự thay đổi về chất trong lực lượng sản xuất của nền kinh tế thế giới"},{"key":"C","text":"Sự thay đổi về chất trong quan hệ sản xuất của nền kinh tế thế giới"},{"key":"D","text":"Sự thay đổi căn bản, toàn diện trong đời sống, sản xuất của nền kinh tế thế giới"}],"answer":["B"]},{"number":52,"text":"Nguồn gốc nào không đúng với nguồn vốn công nghiệp hóa ở các nước tư bản cổ điển?","options":[{"key":"A","text":"Cướp bóc thuộc địa"},{"key":"B","text":"Khai thác lao động làm thuê"},{"key":"C","text":"Làm phá sản những người sản xuất nhỏ trong nông nghiệp"},{"key":"D","text":"Đi vay nhà nước"}],"answer":["D"]},{"number":53,"text":"Mục đích xuyên suốt của kinh tế chính trị Mác - Lênin là gì? (lựa chọn ba đáp án)","options":[{"key":"A","text":"Hướng đến việc thúc đẩy sự giàu có."},{"key":"B","text":"Hướng tới xác lập vị thế kinh tế trong văn hóa xã hội."},{"key":"C","text":"Cung cấp cơ sở khoa học góp phần thúc đẩy trình độ văn minh."},{"key":"D","text":"Phát triển toàn diện của xã hội."}],"answer":["A","C","D"]},{"number":54,"text":"Lý thuyết bàn tay vô hình của Adam Smith được hiểu là gì? (chọn 3 phương án đúng)","options":[{"key":"A","text":"Người bán và người mua, phân bố nguồn lực kinh tế đạt được hiệu quả xã hội lớn nhất mà không cần sự can thiệp của chính phủ"},{"key":"B","text":"Mô tả khả năng của cơ chế thị trường trong việc điều chỉnh cung cầu trên thị trường."},{"key":"C","text":"Các cá nhân tham gia muốn tối đa hóa lợi nhuận cho mình"},{"key":"D","text":"Mọi người đều bị bàn tay vô hình dẫn tới kết quả làm lợi cho chính mình"}],"answer":["A","B","C"]},{"number":55,"text":"Đâu là các đại diện tiêu biểu của trường phái kinh tế chính trị cổ điển Anh?","options":[{"key":"A","text":"William Petty, A. Smith, David Ricardo"},{"key":"B","text":"Pierr Boisguillebrt, Francois Quesney, Jacques Turgot"},{"key":"C","text":"Willian Stafford, Thomas Mun, Gasparo Scaruffi"},{"key":"D","text":"Antonso Serra, A. Montchrétien, Francois Quesney"}],"answer":["A"]},{"number":56,"text":"Sản xuất hàng hoá là gì?","options":[{"key":"A","text":"Kiểu tổ chức kinh tế mà sản phẩm làm ra được mang ra trao đổi, mua bán trên thị trường để thỏa mãn nhu cầu của xã hội"},{"key":"B","text":"Kiều tổ chức kinh tế mà sản phẩm làm ra phải tuân thủ các quy luật của thị trường nhằm thỏa mãn nhu cầu của xã hội"},{"key":"C","text":"Kiều tổ chức kinh tế do các quy luật sản xuất và lưu thông quyết định nhằm thỏa mãn nhu cầu của thị trường"},{"key":"D","text":"Kiểu tổ chức kinh tế mà ở đó nhà nước đóng vai trò chi phối, quyết định để có lợi tối đa cho toàn xã hội"}],"answer":["A"]},{"number":57,"text":"Ai là người đề xuất ra ba loại thương nghiệp (trao đổi tự nhiên, trao đổi tiền tệ, trao đổi thông qua mục đích làm giàu) và hai loại kinh doanh (kinh tế, sản xuất của cải)?","options":[{"key":"A","text":"Aristoteles"},{"key":"B","text":"Platon"},{"key":"C","text":"Xenophon"},{"key":"D","text":"Karl Marx"}],"answer":["A"]},{"number":58,"text":"Loại tiền nào có giá trị danh nghĩa (sức mua) vượt xa giá trị thực của vật liệu làm ra nó?","options":[{"key":"A","text":"Tiền vàng"},{"key":"B","text":"Tiền tượng trưng"},{"key":"C","text":"Tiên ghi nợ"},{"key":"D","text":"Tiền điện từ"}],"answer":["B"]}]},{"id":"CH1","title":"Chương 1 • Đối Tượng, Phương Pháp Chức Năng","group":"Ôn theo chương","questions":[{"number":1,"text":"Vì sao trong CNTB độc quyền thì cạnh tranh không bị thủ tiêu?","options":[{"key":"A","text":"Vì cạnh tranh là quy luật của kinh tế."},{"key":"B","text":"Vì cạnh tranh là quy luật khách quan của kinh tế hàng hóa."},{"key":"C","text":"Vì tổ chức độc quyền cạnh tranh với các công ty ngoài độc quyền."},{"key":"D","text":"Vì các xí nghiệp trong nội bộ tổ chức độc quyền cạnh tranh với nhau."}],"answer":["B"]},{"number":2,"text":"Cách mạng công nghiệp lần thứ 2 diễn ra trong giai đoạn nào?","options":[{"key":"A","text":"Nửa cuối thế kỷ 19 đầu thế kỷ 20."},{"key":"B","text":"Nửa đầu thế kỷ 19 đến cuối thế kỷ 19."},{"key":"C","text":"Nửa đầu thế kỷ 20 đến cuối thế kỷ 20."},{"key":"D","text":"Nửa cuối thế kỷ 19 đế ]},{"number":35,"text":"Chủ thể tư nhân khi xuất khẩu tư bản thường đầu tư vào lĩnh vực:","options":[{"key":"A","text":"Có vòng quay tư bản ngắn thu được lợi nhuận độc quyền cao."},{"key":"B","text":"Các ngành thuộc kết cấu hạ tầng."},{"key":"C","text":"Các ngành có số nhân công lớn và nguyên liệu dồi dào."},{"key":"D","text":"Ba nhận định trên."}],"answer":["A"]},{"number":36,"text":"Xuất khẩu tư bản làm thay đổi quan hệ sản xuất tư bản chủ nghĩa như thế nào?","options":[{"key":"A","text":"Mâu thuẫn giữa giai cấp tư sản và giai cấp công nhân trong nước ngày càng xoa dịu."},{"key":"B","text":"Tư bản tài chính tăng cường sự thống trị bóc lột nô dịch trên phạm vi toàn cầu."},{"key":"C","text":"Giảm bớt căng thẳng trong xã hội, tạo đà cho phát triển lớn mạnh của CNTB."},{"key":"D","text":"CNTB tăng cường xuất khẩu tư bản để giảm khoảng cách phát triển giữa các quốc gia."}],"answer":["B"]}]},{"id":"CH5","title":"Chương 5 • Kinh Tế Thị Trường Định Hướng Xã Hội Chủ Nghĩa","group":"Ôn theo chương","questions":[{"number":1,"text":"Điều kiện ra đời của kinh tế thị trường là:","options":[{"key":"A","text":"Lực lượng sản xuất phát triển và xã hội hóa các quan hệ kinh tế."},{"key":"B","text":"Nhu cầu trao đổi hàng hóa giữa các quốc gia với nhau."},{"key":"C","text":"Sự ra đời của tiền tệ làm cho sản xuất hàng hóa phát triển."},{"key":"D","text":"Các chính sách của nhà nước để thúc đẩy nền kinh tế phát triển."}],"answer":["A"]},{"number":2,"text":"Kinh tế thị trường là “…” gắn thị trường trong nước quan hệ mật thiết với thị trường quốc tế. Từ còn thiếu là?","options":[{"key":"A","text":"Nền kinh tế mở."},{"key":"B","text":"Nền kinh tế tập trung."},{"key":"C","text":"Nền kinh tế quy mô nhỏ."},{"key":"D","text":"Nền kinh tế khép kín."}],"answer":["A"]},{"number":3,"text":"Phương án nào sai (hiểu là không phải) là đặc trưng chung của nền kinh tế thị trường?","options":[{"key":"A","text":"Sự đa dạng của các chủ thể kinh tế với nhiều hình thức sở hữu."},{"key":"B","text":"Kinh tế thị trường là nền kinh tế khép kín tự cung tự cấp."},{"key":"C","text":"Giá cả được hình thành theo nguyên tắc thị trường."},{"key":"D","text":"Thị trường quyết định phân bổ các nguồn lực xã hội."}],"answer":["B"]},{"number":4,"text":"Phương án nào sai (hiểu là không phải) về kinh tế thị trường?","options":[{"key":"A","text":"Kinh tế thị trường là sản phẩm riêng của CNTB."},{"key":"B","text":"Không có nền kinh tế thị trường chung cho mọi quốc gia."},{"key":"C","text":"Kinh tế thị trường là hình thức phát triển cao của kinh tế hàng hóa."},{"key":"D","text":"Kinh tế thị trường là kết quả phát triển của lực lượng sản xuất."}],"answer":["A"]},{"number":5,"text":"Phương án nào đúng nhất về kinh tế thị trường?","options":[{"key":"A","text":"Kinh tế thị trường là nền kinh tế của CNTB."},{"key":"B","text":"Kinh tế thị trường là mô hình cho mọi quốc gia phải tuân theo."},{"key":"C","text":"Kinh tế thị trường là nền kinh tế hàng hóa phát triển ở trình độ cao."},{"key":"D","text":"Kinh tế thị trường chỉ tồn tại những mặt tích cực"}],"answer":["C"]},{"number":6,"text":"Nền kinh tế thị trường được xây dựng và phát triển ở Việt Nam hiện nay là?","options":[{"key":"A","text":"Nền kinh tế thị trường định hướng XHCN."},{"key":"B","text":"Nền kinh tế thị trường tự do."},{"key":"C","text":"Dân giàu nước mạnh công bằng văn minh."},{"key":"D","text":"Cơ chế thị trường có sự điều tiết của nhà nước."}],"answer":["A"]},{"number":7,"text":"Điền vào chỗ trống: Kinh tế thị trường định hướng XHCN ở Việt Nam là nền kinh tế “1…” theo các quy luật của thị trường đồng thời góp phần hướng tới từng bước xác lập một xã hội mà ở đó dân giàu, nước mạnh “2…” có sự điều tiết của Nhà nước do “3…” lãnh đạo.","options":[{"key":"A","text":"(1) vận hành/(2)dân chủ, công bằng, văn minh/(3)Đảng Cộng sản Việt Nam."},{"key":"B","text":"(1) hoạt động/(2)công bằng, văn minh/(3)Đảng Cộng sản Việt Nam."},{"key":"C","text":"(1) điều hành/(2)dân chủ, công bằng, văn minh/(3)Đảng Cộng sản Việt Nam."},{"key":"D","text":"(1) vận hành/(2)dân chủ, văn minh/(3)Đảng."}],"answer":["A"]},{"number":8,"text":"Nền kinh tế thị trường định hướng XHCN hướng tới xác lập hệ giá trị toàn diện nào?","options":[{"key":"A","text":"Bình đẳng, kế hoạch hóa, dân chủ, công bằng văn minh."},{"key":"B","text":"Tập trung, dân chủ, xã hội hóa, công bằng văn minh."},{"key":"C","text":"Dân giàu, nước mạnh, xã hội dân chủ, công bằng văn minh."},{"key":"D","text":"Tự do sáng tạo, tập trung, công bằng văn minh."}],"answer":["C"]},{"number":9,"text":"Yêu cầu đối với nền kinh tế ở Việt Nam để đạt được định hướng XHCN với hệ giá trị toàn diện dân giàu, nước mạnh, xã hội dân chủ, công bằng văn minh phải:","options":[{"key":"A","text":"Vai trò điều tiết của nhà nước đặt dưới sự lãnh đạo của Đảng Cộng sản Việt Nam."},{"key":"B","text":"Tập trung phát triển các tập đoàn kinh tế tư nhân và thu hút đầu tư nước ngoài."},{"key":"C","text":"Giảm bớt vai trò của nhà nước vào nền kinh tế mà để thị trường tự điều tiết nền kinh tế."},{"key":"D","text":"Tập trung vào xuất khẩu các mặt hàng có thế mạnh và giá trị kinh tế cao hạn chế nhập khẩu."}],"answer":["A"]},{"number":10,"text":"Đại hội Đảng lần thứ mấy là bước ngoặt trong nhận thức của ĐCSVN từ nền kinh tế tập trung quan liêu bao cấp sang phát triển kinh tế hàng hóa nhiều thành phần?","options":[{"key":"A","text":"Đại hội VIII năm 1996."},{"key":"B","text":"Đại hội VII năm 1991."},{"key":"C","text":"Đại hội VI năm 1986."},{"key":"D","text":"Đại hội IX năm 2001."}],"answer":["C"]},{"number":11,"text":"Đại hội VI năm 1986 của Đảng xác định nền kinh tế nước ta có đặc trung như thế nào?","options":[{"key":"A","text":"Là nền kinh tế nhiều thành phần."},{"key":"B","text":"Là nền kinh tế bao cấp."},{"key":"C","text":"Là nền kinh tế kế hoạch hóa tập trung."},{"key":"D","text":"Là nền kinh tế tri thức."}],"answer":["A"]},{"number":12,"text":"Đại hội đại biểu lần IX của ĐCSVN năm 2001 đã có sự phát triển nhận thức về kinh tế thị trường như thế nào?","options":[{"key":"A","text":"Kinh tế thị trường là sản phẩm riêng của CNTB do vậy nước ta không phát triển kinh tế thị trường."},{"key":"B","text":"Kinh tế thị trường định hướng XHCN là mô hình kinh tế tổng quát của thời kỳ quá độ lên CNXH ở nước ta."},{"key":"C","text":"Nền kinh tế thị trường là nền kinh tế hàng hóa phát triển ở trình độ cao do vậy chỉ phát triển kinh tế ở khu vực thành thị."},{"key":"D","text":"Nền kinh tế thị trường chỉ tồn tại ở các cường quốc TBCN không phù hợp với nền kinh tế của nước ta."}],"answer":["B"]},{"number":13,"text":"Phương án nào đúng nhất về mô hình kinh tế thị trường định hướng XHCN ở Việt Nam?","options":[{"key":"A","text":"Là mô hình kinh tế có đầy đủ các đặc trưng của nền kinh tế thị trường TBCN hiện nay."},{"key":"B","text":"Là mô hình kinh tế có đầy đủ các đặc trưng riêng của Việt Nam, phù hợp với sự phát triển của lực lượng sản xuất đồng đều giữa các khu vực."},{"key":"C","text":"Vừa bao hàm đầy đủ các đặc trưng vốn có của nền kinh tế thị trường nói chung vừa có những đặc trưng riêng của Việt Nam."},{"key":"D","text":"Vừa bao hàm các yếu tố tích cực vừa bao hàm các yếu tố tiêu cực do tác động độc quyền và cạnh tranh."}],"answer":["C"]},{"number":14,"text":"Điểm khác biệt giữa kinh tế thị trường định hướng XHCN với kinh tế thị trường TBCN ở chỗ:","options":[{"key":"A","text":"Phát huy vai trò làm chủ của nhân dân."},{"key":"B","text":"Phải tối ưu hóa lợi nhuận bằng mọi giá."},{"key":"C","text":"Phát triển nền kinh tế."},{"key":"D","text":"Đẩy mạnh ứng dụng khoa học công nghệ vào sản xuất."}],"answer":["A"]},{"number":15,"text":"Nền kinh tế thị trường định hướng XHCN ở nước ta hiện nay có sự hoạt động của quy luật giá trị không?","options":[{"key":"A","text":"Có vì quy luật giá trị là quy luật kinh tế cơ bản của sản xuất hàng hóa và phát huy tác động trong các quốc gia TBCN."},{"key":"B","text":"Không vì Việt Nam hiện nay chưa có nền kinh tế thị trường phát triển."},{"key":"C","text":"Có vì quy luật giá trị là quy luật kinh tế cơ bản của sản xuất hàng hóa và hiện nay Việt Nam đang phát triển kinh tế hàng hóa."},{"key":"D","text":"Có vì quy luật giá trị là quy luật kinh tế cơ bản của nền kinh tế bao cấp."}],"answer":["C"]},{"number":16,"text":"Nội dung nào không đúng(nói cách khác là sai) thuộc nội hàm của khái niệm kinh tế thị trường định hướng XHCN theo quan điểm của ĐCS Việt Nam?","options":[{"key":"A","text":"Có những đặc trưng riêng phản ánh điều kiện lịch sử, chính trị, kinh tế xã hội của thế giới."},{"key":"B","text":"Vận hành theo các quy luật của thị trường."},{"key":"C","text":"Có sự điều tiết của nhà nước do ĐCS Việt Nam lãnh đạo."},{"key":"D","text":"Góp phần từng bước xác lập một xã hội dân giàu, nước mạnh, dân chủ, công bằng, văn minh."}],"answer":["A"]},{"number":17,"text":"Kinh tế thị trường định hướng XHCN là nền kinh tế vận hành theo các quy luật:","options":[{"key":"A","text":"Theo các quy luật của thị trường."},{"key":"B","text":"Theo các quy luật của xã hội."},{"key":"C","text":"Theo các quy luật của nhà nước."},{"key":"D","text":"Theo các quy định của pháp luật."}],"answer":["A"]},{"number":18,"text":"Nền kinh tế thị trường mà các quốc gia đang thực hiện để khắc phục những khuyết tật của cơ chế thị trường trong giai đoạn hiện nay là?","options":[{"key":"A","text":"Nền kinh tế thị trường hỗn hợp."},{"key":"B","text":"Nền kinh tế thị trường tự do cạnh tranh."},{"key":"C","text":"Nền kinh tế tư bản độc quyền."},{"key":"D","text":"Nền kinh tế hàng hóa giản đơn."}],"answer":["A"]},{"number":19,"text":"Tại sao Việt Nam phải phát triển kinh tế thị trường định hướng xã hội chủ nghĩa?","options":[{"key":"A","text":"Phát triển kinh tế thị trường định hướng XHCN là phù hợp với xu hướng phát triển khách quan của Việt Nam trong bối cảnh thế giới hiện nay."},{"key":"B","text":"Kinh tế thị trường định hướng XHCN phù hợp nguyện vọng dân giàu nước mạnh dân chủ công bằng văn minh của người dân Việt Nam."},{"key":"C","text":"Do tính ưu việt của kinh tế thị trường trong thúc đẩy phát triển Việt Nam theo định hướng XHCN."},{"key":"D","text":"Ba nhận định trên đúng."}],"answer":["D"]},{"number":20,"text":"Tính ưu việt (hiểu là mặt tích cực) của kinh tế thị trường định hướng XHCN ở nước ta?","options":[{"key":"A","text":"Là phương thức phân bổ nguồn lực hiệu quả."},{"key":"B","text":"Nền kinh tế vận hành năng động."},{"key":"C","text":"Thúc đẩy lực lượng sản xuất phát triển."},{"key":"D","text":"Ba nhận định đúng."}],"answer":["D"]},{"number":21,"text":"Sự phát triển của kinh tế hàng hóa chịu sự chi phối bởi yếu tố nào?","options":[{"key":"A","text":"Các quan hệ sản xuất thống trị của xã hội đó."},{"key":"B","text":"Các quan hệ sản xuất mầm mống của xã hội."},{"key":"C","text":"Các quan hệ sản xuất tàn dư của xã hội cũ."},{"key":"D","text":"Nền tảng kinh tế xã hội của quốc gia đó."}],"answer":["A"]},{"number":22,"text":"Phương án nào sai (Cách hỏi khác là không phải) tính tất yếu khách quan trong phát triển kinh tế thị trường định hướng XHCN ở nước ta?","options":[{"key":"A","text":"Phù hợp với một hình thức sở hữu của Việt Nam."},{"key":"B","text":"Phù hợp với nguyện vọng của người dân Việt Nam."},{"key":"C","text":"Phù hợp với xu hướng phát triển khách quan của Việt Nam."},{"key":"D","text":"Mang tính ưu việt trong thúc đẩy phát triển đối với nước ta."}],"answer":["A"]},{"number":23,"text":"Tính tất yếu khách quan của sự lựa chọn mô hình kinh tế thị trường định hướng XHCN ở nước ta phù hợp như thế nào?","options":[{"key":"A","text":"Phù hợp với sự phát triển tất yếu của lịch sử tư bản."},{"key":"B","text":"Phù hợp với quá trình toàn cầu hóa nền kinh tế nông nghiệp."},{"key":"C","text":"Phù hợp với quá trình phát triển nền kinh tế sang chiều rộng."},{"key":"D","text":"Phù hợp xu thế thời đại và đặc điểm phát triển của dân tộc."}],"answer":["D"]},{"number":24,"text":"Điền vào chỗ trống: Có thể sử dụng “…” làm phương tiện thúc đẩy lực lượng sản xuất phát triển nhanh và hiệu quả trong thời kỳ quá độ lên CNXH.","options":[{"key":"A","text":"Kinh tế thị trường."},{"key":"B","text":"Kinh tế tự cung tự cấp."},{"key":"C","text":"Cơ chế thị trường."},{"key":"D","text":"Khoa học kỹ thuật."}],"answer":["A"]},{"number":25,"text":"Việt Nam quá độ lên CNXH bỏ qua chế độ TBCN là bỏ qua yếu tố nào?","options":[{"key":"A","text":"Những thành tựu khoa học kỹ thuật của CNTB."},{"key":"B","text":"Phương thức quản lý nền kinh tế của CNTB."},{"key":"C","text":"Vị trí thống trị của quan hệ sản xuất TBCN."},{"key":"D","text":"Những thành tựu của kinh tế thị trường."}],"answer":["C"]},{"number":26,"text":"Quá độ lên CNXH của Việt Nam bỏ qua chế độ TBCN thì Việt Nam cần tiếp thu những gì từ phương thức sản xuất TBCN?","options":[{"key":"A","text":"Sự phát triển thành tựu khoa học và công nghệ."},{"key":"B","text":"Cách thức tổ chức quản lý sản xuất."},{"key":"C","text":"Những thành tựu văn minh của CNTB."},{"key":"D","text":"Ba nhận định trên đúng."}],"answer":["D"]},{"number":27,"text":"Nền kinh tế thị trường định hướng XHCN ở Việt Nam có mấy đặc trưng cơ bản?","options":[{"key":"A","text":"Có 3 đặc trưng."},{"key":"B","text":"Có 4 đặc trưng."},{"key":"C","text":"Có 5 đặc trưng."},{"key":"D","text":"Có 6 đặc trưng."}],"answer":["C"]},{"number":28,"text":"Kinh tế thị trường định hướng XHCN hướng tới phát triển lực lượng sản xuất, xây dựng cơ sở vật chất kỹ thuật của CNXH, nâng cao đời sống nhân dân, thực hiện dân giàu, nước mạnh, dân chủ, công bằng, văn minh. Nội dung trên thể hiện đặc trưng nào của kinh tế thị trường định hướng XHCN ở Việt Nam?","options":[{"key":"A","text":"Đặc trưng về mục tiêu."},{"key":"B","text":"Đặc trưng về tăng trưởng kinh tế với công bằng xã hội."},{"key":"C","text":"Đặc trưng về quan hệ sở hữu và thành phần kinh tế."},{"key":"D","text":"Đặc trưng về quan hệ phân phối."}],"answer":["A"]},{"number":29,"text":"Phương án nào đúng nhất về một trong những mục tiêu phát triển kinh tế thị trường định hướng XHCN ở nước ta?","options":[{"key":"A","text":"Nâng cao năng lực cạnh tranh của các doanh nghiệp nước ngoài."},{"key":"B","text":"Tăng cường thu hút đầu tư nước ngoài, chuyển giao công nghệ lạc hậu."},{"key":"C","text":"Giành lợi thế khi tham gia mậu dịch quốc tế, tăng cường nhập khẩu."},{"key":"D","text":"Xây dựng cơ sở vật chất kỹ thuật của CNXH."}],"answer":["D"]},{"number":30,"text":"Sự khác biệt cơ bản của kinh tế thị trường định hướng XHCN ở Việt Nam với kinh tế thị trường TBCN?","options":[{"key":"A","text":"Mục tiêu của kinh tế thị trường định hướng XHCN là dân giàu, nước mạnh, dân chủ, công bằng văn minh."},{"key":"B","text":"Mục tiêu của kinh tế thị trường TBCN là bảo đảm lợi ích của đa số giai cấp công nhân và nhân dân lao động."},{"key":"C","text":"Mục tiêu của kinh tế thị trường định hướng XHCN và kinh tế thị trường TBCN là phát triển lực lượng sản xuất."},{"key":"D","text":"Phương án a và c đúng."}],"answer":["A"]},{"number":31,"text":"Quan hệ giữa con người với con người trong quá trình sản xuất và tái sản xuất xã hội trên cơ sở chiếm hữu nguồn lực của quá trình sản xuất và kết quả lao động tương ứng của quá trình sản xuất hay tái sản xuất ấy trong một điều kiện lịch sử nhất định là nội dung của khái niệm?","options":[{"key":"A","text":"Sở hữu."},{"key":"B","text":"Tư hữu."},{"key":"C","text":"Công hữu."},{"key":"D","text":"Chiếm hữu."}],"answer":["A"]},{"number":32,"text":"Sở hữu bao gồm những nội dung nào?","options":[{"key":"A","text":"Nội dung kinh tế và nội dung chính trị."},{"key":"B","text":"Nội dung kinh tế và nội dung pháp lý."},{"key":"C","text":"Nội dung kinh tế và nội dung xã hội."},{"key":"D","text":"Nội dung kinh tế và nội dung chính trị văn hóa xã hội."}],"answer":["B"]},{"number":33,"text":"Trong văn kiện Đại hội ĐCSVN lần thứ XIII năm 2021, đặc trưng về quan hệ sở hữu và thành phần kinh tế ở nước ta đã xác định?","options":[{"key":"A","text":"Sở hữu công hữu về tư liệu sản xuất với một số thành phần kinh tế."},{"key":"B","text":"Nhiều hình thức sở hữu trong đó sở hữu tư nhân là chủ yếu."},{"key":"C","text":"Sở hữu tư hữu về tư liệu sản xuất, phát triển công nghệ."},{"key":"D","text":"Nhiều hình thức sở hữu và nhiều thành phần kinh tế."}],"answer":["D"]},{"number":34,"text":"Tại sao trong thời kỳ quá độ lên CNXH ở Việt Nam lại tồn tại nhiều thành phần kinh tế?","options":[{"key":"A","text":"Do lực lượng sản xuất phát triển không đồng đều."},{"key":"B","text":"Do quan hệ sản xuất tiến bộ hơn lực lượng sản xuất."},{"key":"C","text":"Tiếp thu kinh nghiệm từ các quốc gia TBCN"},{"key":"D","text":"Do phương hướng mục tiêu mà Đảng đề ra."}],"answer":["A"]},{"number":35,"text":"Theo văn kiện Đại hội ĐCSVN lần thứ XIII năm 2021, nước ta có mấy thành phần kinh tế?","options":[{"key":"A","text":"Có 3 thành phần kinh tế."},{"key":"B","text":"Có 4 (Là Kinh tế nhà nước; kinh tế tập thể; kinh tế tư nhân và kinh tế có vốn đầu tư nước ngoài)"},{"key":"C","text":"Có 5"},{"key":"D","text":"Có 6."}],"answer":["B"]},{"number":36,"text":"Những thành phần kinh tế nào đang hoạt động ở nước ta?","options":[{"key":"A","text":"Kinh tế nhà nước; kinh tế tập thể; kinh tế tư nhân và kinh tế có vốn đầu tư nước ngoài."},{"key":"B","text":"Kinh tế nhà nước; kinh tế tập thể; kinh tế cá thể và kinh tế có vốn đầu tư nước ngoài."},{"key":"C","text":"Kinh tế nhà nước; kinh tế tập thể; kinh tế hộ gia đình và kinh tế có vốn đầu tư nước ngoài."},{"key":"D","text":"Kinh tế nhà nước; kinh tế hợp tác xã; kinh tế tư nhân và kinh tế có vốn đầu tư nước ngoài."}],"answer":["A"]},{"number":37,"text":"Quan điểm của Đảng và Nhà nước ta về phát triển các thành phần kinh tế là?","options":[{"key":"A","text":"Phân biệt hình thức sở hữu và thành phần kinh tế."},{"key":"B","text":"Hoạt động theo cơ chế lợi ích có cạnh tranh."},{"key":"C","text":"Bình đẳng, hợp tác, cạnh tranh cùng phát triển."},{"key":"D","text":"Ưu tiên phát triển thành phần kinh tế nhà nước và kinh tế tập thể."}],"answer":["C"]},{"number":38,"text":"Thành phần kinh tế nào giữ vai trò chủ đạo trong nền kinh tế thị trường định hướng XHCN ở Việt Nam?","options":[{"key":"A","text":"Kinh tế nhà nước."},{"key":"B","text":"Kinh tế tư nhân."},{"key":"C","text":"Kinh tế tập thể."},{"key":"D","text":"Kinh tế có vốn đầu tư nước ngoài."}],"answer":["A"]},{"number":39,"text":"Thành phần kinh tế nào giữ vai trò là động lực quan trọng trong nền kinh tế thị trường định hướng XHCN ở nước ta?","options":[{"key":"A","text":"Kinh tế nhà nước."},{"key":"B","text":"Kinh tế tư nhân."},{"key":"C","text":"Kinh tế tập thể."},{"key":"D","text":"Kinh tế có vốn đầu tư nước ngoài."}],"answer":["B"]},{"number":40,"text":"Những thành phần kinh tế nào là nền tảng vững chắc của nền kinh tế quốc dân ở Việt Nam?","options":[{"key":"A","text":"Kinh tế nhà nước và kinh tế tập thể."},{"key":"B","text":"Kinh tế tập thể và kinh tế tư nhân."},{"key":"C","text":"Kinh tế tư nhân và kinh tế có vốn đầu tư nước ngoài."},{"key":"D","text":"Kinh tế nhà nước và kinh tế tư nhân."}],"answer":["A"]},{"number":41,"text":"Yếu tố nào làm nòng cốt để phát triển một nền kinh tế Việt Nam độc lập tự chủ là?","options":[{"key":"A","text":"Thành phần kinh tế nhà nước; thành phần kinh tế tập thể và thành phần kinh tế tư nhân."},{"key":"B","text":"Thành phần kinh tế nhà nước; thành phần kinh tế tập thể; thành phần kinh tế tư nhân và thành phần kinh tế có vốn đầu tư nước ngoài."},{"key":"C","text":"Thành phần kinh tế nhà nước; thành phần kinh tế tập thể và thành phần kinh tế có vốn đầu tư nước ngoài."}],"answer":["A"]},{"number":42,"text":"Kinh tế tư nhân là một thành phần kinh tế trên cơ sở hợp nhất hai thành phần kinh tế là cá thể tiểu chủ và tư bản tư nhân chính thức được xác nhận trong văn kiện đại hội Đảng toàn quốc lần thứ mấy của Đảng?","options":[{"key":"A","text":"Đại hội X."},{"key":"B","text":"Đại hội XI."},{"key":"C","text":"Đại hội XII."},{"key":"D","text":"Đại hội XIII."}],"answer":["A"]},{"number":43,"text":"Vấn đề có tính nguyên tắc để đảm bảo đúng định hướng XHCN của nền kinh tế thị trường ở nước ta phải do:","options":[{"key":"A","text":"Kinh tế nhà nước phải giữ vai trò chủ đạo."},{"key":"B","text":"Chuyển kinh tế cá thể vào kinh tế tập thể."},{"key":"C","text":"Nhà nước độc quyền trong phát triển kinh tế."},{"key":"D","text":"Hạn chế mở rộng quan hệ sản xuất TBCN."}],"answer":["A"]},{"number":44,"text":"Thành phần kinh tế nào nắm giữ những ngành, lĩnh vực then chốt của nền kinh tế thị trường định hướng XHCN ở Việt Nam?","options":[{"key":"A","text":"Kinh tế nhà nước."},{"key":"B","text":"Kinh tế tư nhân."},{"key":"C","text":"Kinh tế tập thể."},{"key":"D","text":"Kinh tế nhà nước và kinh tế tập thể."}],"answer":["A"]},{"number":45,"text":"Thành phần kinh tế nhà nước bao gồm những bộ phận nào?","options":[{"key":"A","text":"Các doanh nghiệp nhà nước."},{"key":"B","text":"Các tài sản thuộc sở hữu nhà nước."},{"key":"C","text":"Các quỹ dự trữ quốc gia, quỹ bảo hiểm nhà nước."},{"key":"D","text":"Ba nhận định đúng."}],"answer":["D"]},{"number":46,"text":"Hình thức tổ chức nòng cốt của kinh tế tập thể là?","options":[{"key":"A","text":"Hợp tác xã."},{"key":"B","text":"Doanh nghiệp tư nhân."},{"key":"C","text":"Hộ gia đình."},{"key":"D","text":"Các công ty liên doanh."}],"answer":["A"]},{"number":47,"text":"Trong nền kinh tế ở nước ta, các doanh nghiệp FDI thuộc thành phần kinh tế nào?","options":[{"key":"A","text":"Kinh tế nhà nước."},{"key":"B","text":"Kinh tế tư nhân."},{"key":"C","text":"Kinh tế tập thể."},{"key":"D","text":"Kinh tế có vốn đầu tư nước ngoài."}],"answer":["D"]},{"number":48,"text":"Chủ trương phát triển nền kinh tế nhiều thành phần ở nước ta hiện nay là?","options":[{"key":"A","text":"Vai trò quản lý của nhà nước phải được đặt dưới sự lãnh đạo duy nhất là ĐCSVN."},{"key":"B","text":"Tạo động lực cạnh tranh lành mạnh giữa các thành phần kinh tế, khai thác mọi nguồn lực cho sự phát triển chung của đất nước."},{"key":"C","text":"Củng cố các thành phần kinh tế dựa trên chế độ công hữu, khuyến khích các thành phần kinh tế dựa trên sở hữu tư nhân phát triển."},{"key":"D","text":"Ba nhận định trên đúng."}],"answer":["D"]},{"number":49,"text":"Cơ cấu kinh tế nhiều thành phần có vai trò như thế nào đối với sự phát triển ở nước ta?","options":[{"key":"A","text":"Thúc đẩy kinh tế hàng hóa phát triển, khoa học công nghệ phát triển nhanh."},{"key":"B","text":"Làm cho năng suất lao động tăng, kinh tế tăng trưởng nhanh và hiệu quả."},{"key":"C","text":"Cho phép khai thác sử dụng có hiệu quả các yếu tố sản xuất, các nguồn lực và tiềm năng của nền kinh tế."},{"key":"D","text":"Ba nhận định trên đúng."}],"answer":["D"]},{"number":50,"text":"Chủ thể thực hiện chức năng quản lý và thực hành cơ chế quản lý trong nền kinh tế thị trường ở Việt Nam là?","options":[{"key":"A","text":"Nhà nước pháp quyền XHCN."},{"key":"B","text":"Nhà nước XHCN."},{"key":"C","text":"Đảng Cộng sản Việt Nam."},{"key":"D","text":"Các tổ chức đoàn thể."}],"answer":["A"]},{"number":51,"text":"Trong nền kinh tế thị trường định hướng XHCN ở Việt Nam, nhà nước thực hiện quản lý nền kinh tế thông qua các công cụ:","options":[{"key":"A","text":"Pháp luật, chiến lược, kế hoạch, quy hoạch, cơ chế chính sách, công cụ kinh tế trên cơ sở tôn trọng nguyên tắc của thị trường."},{"key":"B","text":"Vận dụng các quy luật của kinh tế thị trường và quy luật của CNXH."},{"key":"C","text":"Pháp luật, chiến lược, kế hoạch, quy hoạch, cơ chế chính sách, công cụ kinh tế và định hướng TBCN."},{"key":"D","text":"Vận hành cơ chế thị trường và đảm bảo định hướng XHCN."}],"answer":["A"]},{"number":52,"text":"Điểm khác biệt về vai trò quản lý của nhà nước trong nền kinh tế thị trường định hướng XHCN ỏ Việt Nam với những nền kinh tế thị trường trên thế giới là?","options":[{"key":"A","text":"Đảng lãnh đạo, nhà nước quản lý, nhân dân làm chủ và giám sát."},{"key":"B","text":"Thực hiện chính sách an sinh xã hội, giảm phân hóa giàu nghèo."},{"key":"C","text":"Nhà nước điều tiết nền kinh tế nhằm khắc phục khuyết tật của thị trường."},{"key":"D","text":"Nhà nước quản lý nền kinh tế bằng chính sách pháp luật và các công cụ kinh tế."}],"answer":["A"]},{"number":53,"text":"ĐCSVN lãnh đạo nền kinh tế thị trường định hướng XHCN qua các yếu tố nào?","options":[{"key":"A","text":"Cương lĩnh, đường lối phát triển kinh tế xã hội và các chủ trương quyết sách lớn."},{"key":"B","text":"Cương lĩnh, pháp luật, kế hoạch cơ chế chính sách và các công cụ kinh tế."},{"key":"C","text":"Các công cụ kinh tế, cơ chế chính sách và cơ chế thị trường."},{"key":"D","text":"Pháp luật, chiến lược, kế hoạch, quy hoạch, cơ chế chính sách và định hướng TBCN."}],"answer":["A"]},{"number":54,"text":"Yếu tố quan trọng bảo đảm tính định hướng XHCN của nền kinh tế thị trường ở Việt Nam là?","options":[{"key":"A","text":"Sự phát triển đa dạng của các thành phần kinh tế."},{"key":"B","text":"Vai trò lãnh đạo duy nhất của ĐCSVN."},{"key":"C","text":"Thừa nhận sự tồn tại khách quan của sở hữu tư nhân."},{"key":"D","text":"Tính ưu việt của kinh tế thị trường mang lại."}],"answer":["B"]},{"number":55,"text":"Tại sao trong nền kinh tế thị trường định hướng XHCN ở nước ta hiện nay lại tồn tại nhiều hình thức phân phối thu nhập?","options":[{"key":"A","text":"Vì có nhiều hình thức sở hữu và nhiều thành phần kinh tế."},{"key":"B","text":"Do tác động của cơ chế thị trường và bản chất của chế độ XHCN."},{"key":"C","text":"Vì còn tồn tại nhiều phương thức kinh doanh."},{"key":"D","text":"Ba nhận định trên đúng."}],"answer":["D"]},{"number":56,"text":"Nền kinh tế thị trường định hướng XHCN ở nước ta hiện nay thực hiện hình thức phân phối đầu vào như thế nào?","options":[{"key":"A","text":"Phân phối công bằng các yếu tố sản xuất, tiếp cận sử dụng các cơ hội và điều kiện phát triển của mọi chủ thể kinh tế."},{"key":"B","text":"Phân phối công bằng các yếu tố phụ trong sản xuất, khuyến khích sử dụng các thành phần kinh tế có vốn đầu tư nước ngoài."},{"key":"C","text":"Tập trung ưu tiên những lĩnh vực, những ngành nghề mang lại lợi nhuận cao hướng tới xuất khẩu."},{"key":"D","text":"Ưu tiên thành phần kinh tế nhà nước và kinh tế tập thể vì đây là thành phần kinh tế quan trọng nòng cốt trong nền kinh tế."}],"answer":["A"]},{"number":57,"text":"Nền kinh tế thị trường định hướng XHCN ở nước ta hiện nay thực hiện hình thức phân phối kết quả đầu ra như thế nào?","options":[{"key":"A","text":"Chủ yếu theo năng lực và khả năng góp vốn của các thành viên vào các hoạt động sản xuất kinh doanh."},{"key":"B","text":"Chủ yếu theo kết quả lao động, hiệu quả kinh tế, theo mức đóng góp vốn cùng các nguồn lực khác và thông qua hệ thống an sinh xã hội, phúc lợi xã hội."},{"key":"C","text":"Chủ yếu theo năng lực tài chính và sở hữu tư nhân về tư liệu sản xuất."},{"key":"D","text":"Chủ yếu theo hiệu quả lao động và hệ thống phúc lợi xã hội và an sinh xã hội."}],"answer":["B"]},{"number":58,"text":"Hình thức phân phối nào phản ánh định hướng XHCN của nền kinh tế thị trường ở Việt Nam?","options":[{"key":"A","text":"Hình thức phân phối theo lao động, hiệu quả kinh tế và phúc lợi xã hội."},{"key":"B","text":"Phân phối theo lao động, hiệu quả kinh doanh và theo đóng góp vốn."},{"key":"C","text":"Phân phối theo sở hữu, theo lao động và hiệu quả kinh tế."},{"key":"D","text":"Phân phối bình quân và phúc lợi xã hội."}],"answer":["A"]},{"number":59,"text":"Khuyến khích làm giàu hợp pháp đi đôi xóa đói giảm nghèo, không để diễn ra chênh lệch quá đáng về mức sống và trình độ phát triển giữa các vùng, các tầng lớp dân cư là chủ trương của Đảng thể hiện rõ ở đặc trưng nào của kinh tế thị trường định hướng XHCN ở Việt Nam?","options":[{"key":"A","text":"Gắn tăng trưởng kinh tế với công bằng xã hội."},{"key":"B","text":"Sở hữu và thành phần kinh tế."},{"key":"C","text":"Cơ chế quản lý nền kinh tế."},{"key":"D","text":"Quan hệ phân phối."}],"answer":["A"]},{"number":60,"text":"Nền kinh tế thị trường định hướng XHCN ở Việt Nam có đặc điểm nổi bật nào?","options":[{"key":"A","text":"Do đang trong quá trình hình thành và phát triển nên còn bộc lộ nhiều yếu kém cần khắc phục và hoàn thiện."},{"key":"B","text":"Do kinh tế nhà nước giữ vai trò chủ đạo cùng với kinh tế tư nhân trở thành nền tảng trong nền kinh tế quốc dân."},{"key":"C","t
