key":"D","text":"Thống nhất là căn bản còn đấu tranh giữa chúng chỉ là tạm thời."}],"answer":["C"]},{"number":269,"text":"Chọn câu trả lời đúng theo quan điểm chủ nghĩa duy vật lịch sử: Trong mối quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng của xã hội:","options":[{"key":"A","text":"Cơ sở hạ tầng quyết định kiến trúc thượng tầng."},{"key":"B","text":"Kiến trúc thượng tầng quyết định cơ sở hạ tầng."},{"key":"C","text":"Chúng có mối quan hệ biện chứng với nhau, trong đó cơ sở hạ tầng quyết định kiến trúc thượng tầng."},{"key":"D","text":"Chúng có mối quan hệ biện chứng với nhau, trong đó kiến trúc thượng tầng quyết định cơ sở hạ tầng."}],"answer":["C"]},{"number":270,"text":"Chọn câu trả lời sai: Trong một hình thái kinh tế xã hội, lực lượng sản xuất có các vai trò sau:","options":[{"key":"A","text":"Là nền tảng vật chất kỹ thuật của xã hội."},{"key":"B","text":"Là nhân tố xét đến cùng quyết định sự hình thành và phát triển của mọi xã hội."},{"key":"C","text":"Tiêu biểu cho bộ mặt xã hội ở mỗi giai đoạn phát triển."}],"answer":["C"]},{"number":271,"text":"Chọn câu trả lời đúng theo quan điểm chủ nghĩa duy vật lịch sử: Người ta…","options":[{"key":"A","text":"Có thể tự do tùy tiện lựa chọn cho mình những quan hệ sản xuất nhất định."},{"key":"B","text":"Không thể lựa chọn cho mình những quan hệ sản xuất được."},{"key":"C","text":"Có thể tự do lựa chọn nhưng không tùy ý lựa chọn cho mình những quan hệ sản xuất nhất định."},{"key":"D","text":"Có thể tự do lựa chọn những quan hệ sản xuất nhất định trong phạm vi tính tất yếu của trình độ phát triển của lực lượng sản xuất hiện thực."}],"answer":["D"]},{"number":272,"text":"Trả lời theo quan điểm duy vật lịch sử. Ý kiến sau đây đúng hay sai? Vì sao? Nhà nước là hiện tượng vĩnh viễn của lịch sử.","options":[{"key":"A","text":"Đúng, vì: Bản chất của con người vốn là tham lam, vị kỷ nên xã hội luôn luôn cần đến quyền lực đặc biệt là nhà nước để điều tiết các quan hệ lợi ích."},{"key":"B","text":"Đúng, vì: Đã là một cộng đồng xã hội thì tất yếu phải có sự quản lý và điều tiết chung của nhà nước."},{"key":"C","text":"Sai, vì: Nguồn gốc ra đời của nhà nước là do mâu thuẫn giai cấp không thể điều hòa được mà giai cấp không phải là hiện tượng vĩnh viễn của lịch sử."},{"key":"D","text":"Sai, vì: Thực tế lịch sử thời nguyên thủy không có tổ chức nhà nước trong kiến trúc thượng tầng của xã hội, còn tương lai của xã hội loài người thế nào thì không thể dự báo chính xác được."}],"answer":["C"]},{"number":273,"text":"Chọn câu trả lời đúng theo quan điểm chủ nghĩa duy vật lịch sử: Nhà nước là yếu tố cơ bản trong kiến trúc thượng tầng của xã hội, nó …","options":[{"key":"A","text":"Luôn luôn có tác động tích cực với cơ sở hạ tầng."},{"key":"B","text":"Luôn luôn có tác động tiêu cực với cơ sở hạ tầng."},{"key":"C","text":"Có thể tác động tích cực hoặc tiêu cực tùy theo từng điều kiện nhất định."},{"key":"D","text":"Không có tác dụng gì tới cơ sở hạ tầng kinh tế mà chỉ có tác dụng tới các yếu tố khác trong bản thân hệ thống kiến trúc thượng tầng."}],"answer":["C"]},{"number":274,"text":"Chọn câu trả lời đúng theo quan điểm chủ nghĩa duy vật lịch sử: Nguồn gốc sâu xa của các cuộc cách mạng là do:","options":[{"key":"A","text":"Quần chúng lao động bị áp bức."},{"key":"B","text":"Quần chúng lao động bị áp bức nặng nề."},{"key":"C","text":"Giai cấp cầm quyền khủng hoảng về đương lối cai trị."},{"key":"D","text":"Mâu thuẫn gay gắt giữa lực lượng sản xuất và quan hệ sản xuất."}],"answer":["D"]},{"number":275,"text":"Chọn câu trả lời đúng theo quan điểm chủ nghĩa duy vật lịch sử: Sự tác động của kiến trúc thượng tầng đối với cơ sở hạ tầng là sự tác động:","options":[{"key":"A","text":"Luôn luôn diễn ra theo chiều tích cực."},{"key":"B","text":"Luôn luôn diễn ra theo chiều tiêu cực."},{"key":"C","text":"Có thể diễn ra theo chiều tích cực hoặc tiêu cực."},{"key":"D","text":"Tiêu cực là cơ bản còn đôi khi là chiều hướng tích cực."}],"answer":["C"]},{"number":276,"text":"Chọn câu trả lời đúng theo quan điểm chủ nghĩa duy vật lịch sử: Yếu tố cơ bản nhất tạo thành điều kiện sinh hoạt vật chất của xã hội là các yếu tố thuộc về:","options":[{"key":"A","text":"Điều kiện tự nhiên."},{"key":"B","text":"Điều kiện dân cư."},{"key":"C","text":"Phương thức sản xuất ra của cải vật chất."},{"key":"D","text":"Không có yếu tố nào là cơ bản nhất mà tùy thuộc các điều kiện lịch sử cụ  thể khác nhau."}],"answer":["C"]},{"number":277,"text":"Chọn phương án đúng theo quan điểm chủ nghĩa duy vật lịch sử: Trong mối quan hệ giữa tồn tại xã hội và ý thức xã hội:","options":[{"key":"A","text":"Suy đến cùng, tồn tại xã hội quyết định ý thức xã hội."},{"key":"B","text":"Suy đến cùng, ý thức xã hội quyết định tồn tại xã hội."},{"key":"C","text":"Tồn tại trong mối quan hệ phụ thuộc vào nhau, không cái nào quyết định cái nào."},{"key":"D","text":"Tùy từng điều kiện mà xem xét cái nào quyết định cái nào."}],"answer":["B"]},{"number":278,"text":"Chọn phương án đúng theo quan điểm chủ nghĩa duy vật lịch sử: Trong mối quan hệ giữa tồn tại xã hội và ý thức xã hội:","options":[{"key":"A","text":"Tồn tại xã hội quyết định ý thức xã hội."},{"key":"B","text":"Ý thức xã hội quyết định tồn tại xã hội."},{"key":"C","text":"Chúng tồn tại trong mối quan hệ biện chứng với nhau, trong đó tồn tại xã hội quyết định ý thức xã hội."},{"key":"D","text":"Chúng tồn tại trong mối quan hệ biện chứng với nhau, không cái nào quyết định cái nào."}],"answer":["C"]},{"number":279,"text":"Chọn câu trả lời đúng: Quan niệm cho rằng – Ý thức xã hội luôn luôn là yếu tố phụ thuộc vào tồn tại xã hội, nó không có tính độc lập tương đối là quan điểm của:","options":[{"key":"A","text":"Chủ nghĩa duy vật."},{"key":"B","text":"Chủ nghĩa duy tâm."},{"key":"C","text":"Chủ nghĩa duy vật siêu hình."},{"key":"D","text":"Chủ nghĩa duy vật lịch sử."}],"answer":["C"]},{"number":280,"text":"Chọn câu trả lời đúng: Quan niệm cho rằng: Tồn tại xã hội quyết định ý thức xã hội, những đồng thời ý thức xã hội lại có tính độc lập tương đối của nó, là quan điểm của:","options":[{"key":"A","text":"Chủ nghĩa duy vật."},{"key":"B","text":"Chủ nghĩa duy tâm."},{"key":"C","text":"Chủ nghĩa duy vật siêu hình."},{"key":"D","text":"Chủ nghĩa duy vật lịch sử."}],"answer":["D"]},{"number":281,"text":"Chọn phương án đúng theo quan điểm chủ nghĩa duy vật lịch sử: Mỗi hình thái kinh tế xã hội đều được cấu thành từ các nhân tố:","options":[{"key":"A","text":"Lực lượng sản xuất, kiến trúc thượng tầng."},{"key":"B","text":"Quan hệ kinh tế, lực lượng sản xuất, kiến trúc thượng tầng."},{"key":"C","text":"Quan hệ sản xuất, kiến trúc thượng tầng."},{"key":"D","text":"Lực lượng sản xuất, quan hệ sản xuất hợp thành cơ cấu kinh tế của xã hội và kiến trúc thượng tầng."}],"answer":["D"]},{"number":282,"text":"Chọn phương án đúng: Quan niệm cho rằng – Suy cho cùng những người sống trong túp lều tranh luôn luôn khác suy nghĩ của những kẻ sống trong cung điện. Là quan điểm của:","options":[{"key":"A","text":"Chủ nghĩa duy vật"},{"key":"B","text":"Chủ nghĩa duy tâm."},{"key":"C","text":"Chủ nghĩa duy vật siêu hình."},{"key":"D","text":"Chủ nghĩa duy vật lịch sử."}],"answer":["C"]},{"number":283,"text":"Chọn câu trả lời đúng nhất theo quan điểm chủ nghĩa duy vật lịch sử: Mỗi hình thái kinh tế xã hội đều được cấu thành từ các nhân tố:","options":[{"key":"A","text":"Lực lượng sản xuất, kiến trúc thượng tầng."},{"key":"B","text":"Quan hệ sản xuất, lực lượng sản xuất, kiến trúc thượng tầng."},{"key":"C","text":"Lực lượng sản xuất, quan hệ sản xuất hợp thành cơ cấu kinh tế của xã hội và kiến trúc thượng tầng."},{"key":"D","text":"Quan hệ sản xuất và kiến trúc thượng tầng."}],"answer":["C"]},{"number":284,"text":"Chọn câu đúng. C.Mác đã xuất phát từ quan hệ nào, coi đó là quan hệ cơ bản nhất để phân tích kết cấu của xã hội?","options":[{"key":"A","text":"Quan hệ chính trị."},{"key":"B","text":"Quan hệ pháp luật."},{"key":"C","text":"Quan hệ con người với giới tự nhiên."},{"key":"D","text":"Quan hệ sản xuất."}],"answer":["D"]},{"number":285,"text":"Điền thêm vào câu dưới đây và xác định đó là luận điểm của ai? Sự phát triển của các hình thái kinh tế xã hội là một quá trình …","options":[{"key":"A","text":"Lịch sử tự nhiên của C.Mác."},{"key":"B","text":"Lịch sử tự nhiên của V.I.Lênin."},{"key":"C","text":"Lịch sử đi lên của Ph.Ăng ghen."},{"key":"D","text":"Lịch sử các dân tộc của Hồ Chí Minh."}],"answer":["A"]},{"number":286,"text":"Chọn câu trả lời đúng nhất theo quan điểm chủ nghĩa duy vật lịch sử: Quá trình lịch sử tự nhiên của sự phát triển các hình thái kinh tế xã hội là quá trình phát triển theo:","options":[{"key":"A","text":"Quy luật của tự nhiên."},{"key":"B","text":"Ý muốn chủ quan của con người."},{"key":"C","text":"Ý niệm tuyệt đối."},{"key":"D","text":"Quy luật khách quan của xã hội."}],"answer":["D"]},{"number":287,"text":"Chọn câu trả lời đúng và đầy đủ nhất từ góc độ thế giới quan, phương pháp luận nhận thức về xã hội: Lý luận hình thái kinh tế xã hội do C.Mác sáng lập ra đã khắc phục được những hạn chế cơ bản nào trong các quan niệm về xã hội đã có trước đây?","options":[{"key":"A","text":"Quan niệm duy tâm và tôn giáo."},{"key":"B","text":"Quan niệm duy vật tầm thường và tôn giáo."},{"key":"C","text":"Quan niệm siêu hình và duy tâm, tôn giáo."},{"key":"D","text":"Quan niệm duy tâm khách quan và tôn giáo, huyền thoại."}],"answer":["C"]},{"number":288,"text":"Chọn câu trả lời đúng theo định nghĩa của V.I.Lênin về giai cấp: Sự khác biệt cơ bản nhất giữa các giai cấp là địa vị của họ trong:","options":[{"key":"A","text":"Quyền lực chính trị."},{"key":"B","text":"Quyền lực nhà nước."},{"key":"C","text":"Quyền lực kinh tế."},{"key":"D","text":"Quyền lực sở hữu tư liệu sản xuất."}],"answer":["D"]},{"number":289,"text":"Chọn câu trả lời đúng theo định nghĩa của V.I.Lênin về giai cấp: Giai cấp là những tập đoàn người to lớn có sự phân biệt về:","options":[{"key":"A","text":"Địa vị của họ trong một hệ thống sản xuất xã hội nhất định trong lịch sử."},{"key":"B","text":"Địa vị cảu họ trong quá trình quản lý và phân phối của cải xã hội."},{"key":"C","text":"Địa vị của họ trong quản lý chính trị, văn hóa xã hội."},{"key":"D","text":"Địa vị của họ trong việc nắm quyền lực nhà nước."}],"answer":["A"]},{"number":290,"text":"Chọn câu trả lời đúng theo quan điểm chủ nghĩa duy vật lịch sử: Đấu tranh giai cấp giữ vai trò là:","options":[{"key":"A","text":"Động lực cơ bản nhất của sự phát triển xã hội."},{"key":"B","text":"Một trong những phương thức và động lực của sự phát triển xã hội ngày nay."},{"key":"C","text":"Một trong những nguồn gốc, động lực quan trọng cảu mọi xã hội."},{"key":"D","text":"Một trong những phương thức, động lực của sự tiến bộ, phát triển xã hội trong điều kiện xã hội có sự phân hóa thành đối kháng giai cấp."}],"answer":["D"]},{"number":291,"text":"Chọn quan niệm đúng về con người theo quan điểm của chủ nghĩa duy vật lịch sử: Bản chất con người là…","options":[{"key":"A","text":"Thiện."},{"key":"B","text":"Ác."},{"key":"C","text":"Không thiện, không ác mà mang bản chất tự nhiên."},{"key":"D","text":"Tổng hòa các mối quan hệ."}],"answer":["D"]},{"number":292,"text":"Chọn quan niệm đúng theo định nghĩa của Ph.Ăngghen: Con người là động vật …","options":[{"key":"A","text":"Biết tư duy."},{"key":"B","text":"Biết ứng xử theo các quy phạm đạo đức."},{"key":"C","text":"Chính trị."},{"key":"D","text":"Biết chế tạo và sử dụng các công cụ lao động."}],"answer":["D"]},{"number":293,"text":"Chọn câu trả lời đúng theo quan điểm của chủ nghĩa duy vật lịch sử: Lực lượng cơ bản nhất trong quần chúng nhân dân là:","options":[{"key":"A","text":"Giai cấp thống trị xã hội."},{"key":"B","text":"Tầng lớp tri thức."},{"key":"C","text":"Người lao động."},{"key":"D","text":"Công nhân và nông dân."}],"answer":["C"]},{"number":294,"text":"Chọn câu trả lời đúng theo quan điểm của chủ nghĩa duy vật lịch sử: Chủ thể sáng tạo chân chính ra lịch sử là:","options":[{"key":"A","text":"Quần chúng nhân dân."},{"key":"B","text":"Các cá nhân kiệt xuất, các vĩ nhân."},{"key":"C","text":"Giai cấp thống trị."},{"key":"D","text":"Tầng lớp trí thức trong xã hội."}],"answer":["A"]},{"number":295,"text":"Chọn câu trả lời đúng theo quan điểm duy tâm xã hội: Lực lượng sáng tạo ra lịch sử là …","options":[{"key":"A","text":"Quần chúng nhân dân lao động."},{"key":"B","text":"Giai cấp thống trị xã hội."},{"key":"C","text":"Các vĩ nhân, những cá nhân kiệt xuất."},{"key":"D","text":"Tầng lớp trí thức."}],"answer":["C"]},{"number":296,"text":"Chọn câu trả lời đúng theo văn kiện của Đảng: Bài học lớn thứ nhất trong Văn kiện Đại hội đại biểu toàn quốc lần thứ VI của Đảng Cộng sản Việt Nam là bài học nào?","options":[{"key":"A","text":"Tôn trọng và hành động theo quy luật khách quan."},{"key":"B","text":"Kết hợp sức mạnh dân tộc với sức mạnh thời đại."},{"key":"C","text":"Nâng cao sức chiến đấu của Đảng."},{"key":"D","text":"Lấy dân làm gốc."}],"answer":["D"]},{"number":297,"text":"Theo quan điểm duy vật lịch sử, ý kiến sau đây ĐÚNG hay SAI vì sao? …Vì quan hệ sản xuất phải phụ thuộc tất yếu vào trình độ phát triển của lực lượng sản xuất, do vậy với bất cứ một sự biến đổi nào trong lực lượng sản xuất cũng ngay lập tức dẫn tới sự biến đổi trong quan hệ sản xuất.","options":[{"key":"A","text":"Đúng, vì: Quan hệ sản xuất phụ thuộc vào lực lượng sản xuất."},{"key":"B","text":"Đúng vì: Quan hệ sản xuất chỉ là hình thức kinh tế của quá trình sản xuất, nó luôn biến đổi cho phù hợp với nội dung vật chất của quá trình đó, tức là lực lượng sản xuất."},{"key":"C","text":"Sai vì: Quan hệ sản xuất phụ thuộc vào lực lượng sản xuất nhưng nó có tính độc lập tương đối."},{"key":"D","text":"Sai vì: Trong thực tế không đúng như vậy."}],"answer":["C"]},{"number":298,"text":"Chọn câu trả lời đúng và đầy đủ: Sản xuất vật chất là hoạt động có …","options":[{"key":"A","text":"Tính khách quan, tính tất yếu, tính xã hội, tính văn hóa và tính mục đích."},{"key":"B","text":"Tính tư duy, tính cộng đồng, tính xã hội, tính văn hóa và tính mục đích."},{"key":"C","text":"Tính khách quan, tính mục đích, tính xã hội, tính lịch sử và tính sáng tạo."},{"key":"D","text":"Tính xã hội, tính tất yếu, tính lịch sử, tính văn hóa và tính mục đích dự thân."}],"answer":["C"]},{"number":299,"text":"Chọn câu trả lời đúng, theo C.Mác các nền kinh tế căn bản phân biệt với nhau bởi:","options":[{"key":"A","text":"Phương thức sản xuất ra của cải vật chất."},{"key":"B","text":"Mục đích của quá trình sản xuất ra của cải vật chất."},{"key":"C","text":"Mục đích tự nhiên của quá trình sản xuất ra của cải vật chất."},{"key":"D","text":"Mục đích xã hội của quá trình sản xuất ra của cải vật chất."}],"answer":["A"]},{"number":300,"text":"Chọn câu trả lời đúng theo quan điểm của chủ nghĩa duy vật lịch sử: Khi xuất hiện mâu thuẫn gay gắt giữa lực lượng sản xuất và quan hệ sản xuất thì:","options":[{"key":"A","text":"Quan hệ sản xuất sẽ tự động thay đổi cho phù hợp với lực lượng sản xuất."},{"key":"B","text":"Quan hệ sản xuất không thay đổi vì nó được bảo vệ bằng quyền lực nhà nước."},{"key":"C","text":"Lực lượng sản xuất tự điều chỉnh cho phù hợp với quan hệ sản xuất."},{"key":"D","text":"Quan hệ sản xuất được thay đổi thông qua những cuộc cải cách và các cuộc cách mạng xã hội."}],"answer":["D"]},{"number":301,"text":"Chọn câu trả lời đúng nhất theo nghiên cứu tư liệu lịch sử: Luận điểm Dĩ dân vi bản (Lấy dân làm gốc) là của ai:","options":[{"key":"A","text":"Mạnh Tử."},{"key":"B","text":"Lão Tử."},{"key":"C","text":"Khổng Tử."},{"key":"D","text":"Hồ Chí Minh."}],"answer":["A"]},{"number":302,"text":"Chọn câu trả lời đúng và đầy đủ: Sự ra đời của quan điểm duy vật về lịch sử do C.Mác sáng lập ra đã khắc phục được những sai lầm căn bản trong việc giải thích xã hội theo:","options":[{"key":"A","text":"Quan điểm duy tâm và tôn giáo."},{"key":"B","text":"Quan điểm duy vật siêu hình và tôn giáo."},{"key":"C","text":"Quan điểm duy tâm và siêu hình."},{"key":"D","text":"Quan điểm duy vật tự nhiên và tầm thường."}],"answer":["C"]},{"number":303,"text":"Nội dung công cuộc đại phân công lao động lần thứ ba là:","options":[{"key":"A","text":"Đại công nghiệp tách khỏi nông nghiệp."},{"key":"B","text":"Trồng trọt tách khỏi chăn nuôi."},{"key":"C","text":"Ngành thương nghiệp ra đời."},{"key":"D","text":"Thủ công nghiệp tách khỏi nông nghiệp."}],"answer":["C"]},{"number":304,"text":"Hàng hóa là gì?","options":[{"key":"A","text":"Là những vật để thỏa mãn nhu cầu tiêu dùng của con người."},{"key":"B","text":"Là hết thảy những vật, những thứ thỏa mãn nhu cầu tiêu dùng của con người và chúng được sản xuất ra để trao đổi, buôn bán."},{"key":"C","text":"Là những vật có giá trị sử dụng cao."},{"key":"D","text":"Là những vật mà trên thị trường luôn khan hiếm."}],"answer":["B"]},{"number":305,"text":"Trong các yếu tố dưới đây, yếu tố nào là nguồn gốc của giá trị hàng hóa?","options":[{"key":"A","text":"Nhà xưởng, máy móc."},{"key":"B","text":"Lao động của con người."},{"key":"C","text":"Đất đai, tài nguyên."},{"key":"D","text":"Kỹ thuật, công nghệ sản xuất."}],"answer":["B"]},{"number":306,"text":"Tỷ lệ giữa lao động phức tạp và lao động giản đơn tăng lên có ảnh hưởng như thế nào đến lượng giá trị được tạo ra trong một đơn vị thời gian?","options":[{"key":"A","text":"Tăng lên."},{"key":"B","text":"Giảm xuống."},{"key":"C","text":"Giữ nguyên không thay đổi."},{"key":"D","text":"Tăng lên nhưng phải gắn với tiến bộ công nghệ."}],"answer":["A"]},{"number":307,"text":"Quy luật căn bản của sản xuất và lưu thông hàng hóa là quy luật nào?","options":[{"key":"A","text":"Quy luật cạnh tranh."},{"key":"B","text":"Quy luật cung – cầu."},{"key":"C","text":"Quy luật lưu thông tiền tệ."},{"key":"D","text":"Quy luật giá trị."}],"answer":["D"]},{"number":308,"text":"Mâu thuẫn căn bản của sản xuất hàng hóa là …","options":[{"key":"A","text":"Mâu thuẫn giữa lao động tư nhân và lao động xã hội."},{"key":"B","text":"Mâu thuẫn giữa lao động cụ thể và lao động trừu tượng."},{"key":"C","text":"Mâu thuẫn giữa giá trị sử dụng và giá trị."},{"key":"D","text":"Mâu thuẫn giữa giá trị và giá cả hàng hóa."}],"answer":["A"]},{"number":309,"text":"Cơ sở tồn tại của quy luật giá trị là …","options":[{"key":"A","text":"Nền sản xuất tư bản chủ nghĩa."},{"key":"B","text":"Nền sản xuất ra của cải vật chất nói chung."},{"key":"C","text":"Nền kinh tế hàng hóa."},{"key":"D","text":"Nền kinh tế thị trường."}],"answer":["C"]},{"number":310,"text":"Phương hướng cơ bản, lâu dài để tăng sản phẩm cho xã hội là?","options":[{"key":"A","text":"Tăng năng suất lao động."},{"key":"B","text":"Tăng cường độ lao động."},{"key":"C","text":"Kéo dài thời gian lao động."},{"key":"D","text":"Mở rộng quy mô sản xuất và nâng cao trình độ khoa học công nghệ."}],"answer":["A","D"]},{"number":311,"text":"Quá trình chuyển đổi nền sản xuất xã hội từ lao động thủ công là chính sang nền sản xuất dựa chủ yếu bằng máy móc nhằm tạo ra năng suất lao động cao là nội dung của khái niệm nào?","options":[{"key":"A","text":"Công nghiệp hóa, hiện đại hóa."},{"key":"B","text":"Công nghiệp hóa."},{"key":"C","text":"Phát triển kinh tế."},{"key":"D","text":"Tăng trưởng kinh tế."}],"answer":["B"]},{"number":312,"text":"Quốc gia nào dưới đây tiêu biểu cho mô hình công nghiệp hóa cổ điển?","options":[{"key":"A","text":"Nhật Bản."},{"key":"B","text":"Anh."},{"key":"C","text":"Hàn Quốc."},{"key":"D","text":"Đức."}],"answer":["B"]},{"number":313,"text":"Hội nhập kinh tế quốc tế của một quốc gia là quá trình quốc gia đó thực hiện gắn kết nền kinh tế của mình với nền kinh tế thế giới dựa trên sự chia sẻ lợi ích đồng thời tuân thủ các chuẩn mực quốc tế chung. Được gọi là?","options":[{"key":"A","text":"Khái niệm hội nhập kinh tế quốc tế."},{"key":"B","text":"Hội nhập kinh tế quốc tế."},{"key":"C","text":"Nội dung hội nhập kinh tế quốc tế."}],"answer":["A"]},{"number":314,"text":"Có mấy nội dung hội nhập kinh tế quốc tế?","options":[{"key":"A","text":"Có 2 nội dung."},{"key":"B","text":"Có 3 nội dung."},{"key":"C","text":"Có 4 nội dung."}],"answer":["A"]},{"number":315,"text":"Một trong những nội dung hội nhập kinh tế quốc tế là phải:","options":[{"key":"A","text":"Hội nhập kinh tế quốc tế là phương thức phát triển phổ biến của các nước nhất là các nước kém phát triển."},{"key":"B","text":"Thực hiện đa dạng hóa các hình thức, các mức độ hội nhập kinh tế quốc tế."},{"key":"C","text":"Tạo điều kiện mở rộng thị trường, tiếp thu khoa học công nghệ vốn, chuyển dịch cơ cấu kinh tế trong nước."},{"key":"D","text":"Tạo điều kiện thúc đẩy hội nhập của các lĩnh vực văn hóa, chính trị, củng cố quốc phòng an ninh."}],"answer":["B"]}]},{"id":"FINAL_SRC","title":"FINAL • Bộ câu hỏi tổng hợp","group":"Bộ đề","questions":[{"number":1,"text":"Biểu hiện mới của sự phân chia thị trường giữa các liên minh độc quyền đó là(NHUNG HOÀNG)","options":[{"key":"A","text":"Hình thành các tổ chức đa quốc gia"},{"key":"B","text":"Hình thành các tổ chức độc quyền trong nhà nước tư bản"},{"key":"C","text":"Hình thành xu hướng khu vực hóa"},{"key":"D","text":"Hình thành xu hướng toàn cầu hóa"}],"answer":["D"]},{"number":2,"text":"Nghiên cứu về cách mạng công nghiệp lần thứ nhất, C. Mác đã khái quát tính quy luật của cách mạng công nghiệp qua mấy giai đoạn phát triển?(NHUNG HOÀNG)","options":[{"key":"A","text":"Một giai đoạn"},{"key":"B","text":"Hai giai đoạn"},{"key":"C","text":"Ba giai đoạn"},{"key":"D","text":"Bốn giai đoạn"}],"answer":["C"]},{"number":3,"text":"Chọn phương án sai vai trò của cách mạng công nghiệp đối với sự phát triển đó là (NHUNG HOÀNG)","options":[{"key":"A","text":"Thúc đẩy sự phát triển của lực lượng sản xuất"},{"key":"B","text":"Thúc đẩy các quan hệ sản xuất mới ra đời"},{"key":"C","text":"Thúc đẩy hoàn thiện quan hệ sản xuất"},{"key":"D","text":"Thúc đẩy đổi mới phương thức quản trị phát triển"}],"answer":["B"]},{"number":4,"text":"Địa tô chênh lệch II thu được trên(NHUNG HOÀNG)","options":[{"key":"A","text":"Ruộng đất đã thâm canh"},{"key":"B","text":"Ruộng đất có độ màu mỡ trung bình"},{"key":"C","text":"Ruộng đất có độ màu mỡ tốt"}],"answer":["A"]},{"number":5,"text":"Kinh tế thị trường đã hình thành trong xã hội nào?(NHUNG HOÀNG)","options":[{"key":"A","text":"Phong kiến"},{"key":"B","text":"Chiếm hữu nô lệ"},{"key":"C","text":"Tư bản chủ nghĩa"},{"key":"D","text":"Xã hội chủ nghĩa"}],"answer":["A"]},{"number":6,"text":"Trong lịch sử phát triển nền sản xuất xã hội, tiền đề nào là quan trọng cho sự ra đời và phát triển của nền kinh tế thị trường?(NHUNG HOÀNG)","options":[{"key":"A","text":"Sản xuất"},{"key":"B","text":"Trao đổi hàng hóa"},{"key":"C","text":"Thị trường"},{"key":"D","text":"Sản xuất và trao đổi hàng hóa"}],"answer":["D"]},{"number":7,"text":"Những đóng góp to lớn của kinh tế chính trị cổ điển Anh vào lý luận kinh tế chính trị của nhân loại đó là(NHUNG HOÀNG)","options":[{"key":"A","text":"Rút ra kết luận giá trị là do hao phí lao động tạo ra"},{"key":"B","text":"Rút ra được bản chất bóc lột của chủ nghĩa tư bản"},{"key":"C","text":"Khái quát đúng mục đích của chủ nghĩa tư bản là lợi nhuận"},{"key":"D","text":"Luận giải về nhiều phạm trù kinh tế như giá trị, sản phẩm rồng, tư bản, tiền lương"}],"answer":["A"]},{"number":8,"text":"Để thực hiện hoàn thiện thể chế kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam cần hoàn thành mấy nhiệm vụ chủ yếu?","options":[{"key":"A","text":"Ba nhiệm vụ"},{"key":"B","text":"Năm nhiệm vụ"},{"key":"C","text":"Sáu nhiệm vụ"},{"key":"D","text":"Chín nhiệm vụ"}],"answer":["B"]},{"number":9,"text":"Quá trình công nghiệp hóa của các nước tư bản cổ điển diễn ra trong thời gian khoảng bao nhiêu năm?(NHUNG HOÀNG)","options":[{"key":"A","text":"Từ 60 - 80 năm"},{"key":"B","text":"Từ 50 - 70 năm"},{"key":"C","text":"Từ 60 - 90 năm"},{"key":"D","text":"Từ 50 - 80 năm"}],"answer":["A"]},{"number":10,"text":"Độc quyền nhà nước trong chủ nghĩa tư bản, sở hữu nhà nước thực hiện chức năng nào?(NHUNG HOÀNG)","options":[{"key":"A","text":"Mở rộng sản xuất tư bản chủ nghĩa"},{"key":"B","text":"Tạo điều kiện cho việc di chuyển tư bản của các tổ chức độc quyền vào các ngành sản xuất kinh doanh khác nhau"},{"key":"C","text":"Làm chỗ dựa cho sự điều tiết kinh tế nhà nước"},{"key":"D","text":"Tất cả phương án trên"}],"answer":["D"]},{"number":11,"text":"Tiền công thực tế là(NHUNG HOÀNG)","options":[{"key":"A","text":"Tiền công được biểu hiện bằng số lượng hàng hóa tiêu dùng và dịch vụ mà công nhân mua được bằng tiền công danh nghĩa của mình"},{"key":"B","text":"Tiền công được biểu hiện bằng số lượng hàng hóa tiêu dùng và dịch vụ mà công nhân mua được bằng tiền công thực tế của mình"},{"key":"C","text":"Tiền công được biểu hiện bằng số tư liệu sản xuất và tiêu dùng và dịch vụ mà công nhân mua được bằng tiền công thực tế của mình"}],"answer":["A"]},{"number":12,"text":"Sản xuất hàng hóa ra đời dựa trên(NHUNG HOÀNG)","options":[{"key":"A","text":"Một điều kiện"},{"key":"B","text":"Hai điều kiện"},{"key":"C","text":"Ba điều kiện"},{"key":"D","text":"Bốn điều kiện"}],"answer":["B"]},{"number":13,"text":"Cách mạng công nghiệp lần thứ tư sẽ làm mất đi lợi thế của các nước đang phát triển về(NHUNG HOÀNG)","options":[{"key":"A","text":"Tài nguyên thiên nhiên, công nhân giá rẻ"},{"key":"B","text":"Khoáng sản, sức lao động"},{"key":"C","text":"Khoa học công nghệ, nhân công chất lượng cao"}],"answer":["A"]},{"number":14,"text":"Đại hội nào đã xác định kinh tế thị trường định hướng xã hội chủ nghĩa là \"một kiểu tổ chức kinh tế vừa tuân theo quy luật của kinh tế thị trường vừa dựa trên cơ sở và chịu sự dẫn dắt chi phối bởi các nguyên tắc và bản chất của chủ nghĩa xã hội?(NHUNG HOÀNG)","options":[{"key":"A","text":"Đại hội Đảng toàn quốc lần thứ VI"},{"key":"B","text":"Đại hội Đảng toàn quốc lần thứ VII"},{"key":"C","text":"Đại hội Đảng toàn quốc lần thứ VIII"},{"key":"D","text":"Đại hội Đảng toàn quốc lần thứ IX"}],"answer":["D"]},{"number":15,"text":"Chọn ý đúng về tăng cường độ lao động. Khi cường độ lao động tăng lên thì(NHUNG HOÀNG)","options":[{"key":"A","text":"Số lượng hàng hoá làm ra trong một đơn vị thời gian không đổi"},{"key":"B","text":"Số lượng lao động hao phí trong thời gian đó không thay đổi"},{"key":"C","text":"Giá trị 1 đơn vị hàng hoá giảm đi"},{"key":"D","text":"Tổng số lượng hàng hóa làm ra của một người tăng lên"}],"answer":["D"]},{"number":16,"text":"Xét về bản chất, thì lợi ích kinh tế được hiểu là:(NHUNG HOÀNG)","options":[{"key":"A","text":"Quan hệ kinh tế xã hội"},{"key":"B","text":"Quan hệ xã hội, mang tính lịch sử"},{"key":"C","text":"Quan hệ sản xuất"},{"key":"D","text":"Quan hệ chính trị mang tính lợi ích"}],"answer":["C"]},{"number":17,"text":"Sự tuần hoàn của tư bản, nếu xét nó với tư cách là một quá trình định kỳ đổi mới và thường xuyên lặp đi lặp lại được gọi là(NHUNG HOÀNG)","options":[{"key":"A","text":"Chu chuyển tư bản"},{"key":"B","text":"Lưu thông tự bản"},{"key":"C","text":"Vận động tư bản"},{"key":"D","text":"Tái sản xuất tư bản"}],"answer":["A"]},{"number":18,"text":"Khi đồng thời tăng năng suất lao động và cường độ lao động lên 2 lần thì ý nào dưới đây là đúng?(NHUNG HOÀNG)","options":[{"key":"A","text":"Giá trị 1 hàng hoá giảm 2 lần, tổng số giá trị hàng hoá tăng 2 lần"},{"key":"B","text":"Tổng số hàng hoả tăng lên 2 lần, giá trị 1 hàng hoá giảm 2 lần"},{"key":"C","text":"Tổng số hàng hoá tăng lên 4 lần, tổng số giá trị hàng hoá tăng lên 4 lần"}],"answer":["A"]},{"number":19,"text":"Hãy chọn ý đúng khi nói về quan hệ giữa giá trị và giá cả?(NHUNG HOÀNG)","options":[{"key":"A","text":"Giá trị là cơ sở của giá cả, là yếu tố quyết định giá cả, giá cả là hình thức biểu hiện bằng tiền của giá trị"},{"key":"B","text":"Giá cả thị trường còn chịu ảnh hưởng của cung - cầu, giá trị của tiền"},{"key":"C","text":"Các phương án trả lời đều đúng"}],"answer":["C"]},{"number":20,"text":"Quan điểm cho rằng lợi nhuận phần thu nhập thặng dư tính bằng hiệu quả giữa giá trị tổng doanh thu trừ đi tổng chi phí và là phần thưởng cho việc gánh chịu rủi ro và cho sự đổi mới là của ai?(NHUNG HOÀNG)","options":[{"key":"A","text":"Paul A.Samuelson"},{"key":"B","text":"David Begg"},{"key":"C","text":"Stanley Fischer"},{"key":"D","text":"Rudiger Dornbusch"}],"answer":["A"]},{"number":21,"text":"Khi nào xuất hiện hình thái tiền tệ?(NHUNG HOÀNG)","options":[{"key":"A","text":"Khi sản xuất và trao đổi đã phát triển"},{"key":"B","text":"Khi vật ngang giá chung được cố định ở vàng, bạc"},{"key":"C","text":"Khi không còn quan hệ trao đổi trực tiếp, có một thứ hàng làm trung gian trong trao đổi"},{"key":"D","text":"Khi nhu cầu trao đổi vượt quá phạm vi quốc gia"}],"answer":["B"]},{"number":22,"text":"Những đặc điểm kinh tế cơ bản nhất của chủ nghĩa tư bản độc quyền bao gồm:(NHUNG HOÀNG)","options":[{"key":"A","text":"Tập trung sản xuất cùng với các tổ chức độc quyền; tư bản tài chính; xuất khẩu tư bản; sự phân chia thế giới về lãnh thổ giữa các nước đế quốc"},{"key":"B","text":"Tập trung sản xuất cùng với các tổ chức độc quyền, tư bản tài chính; sự phân chia thị trường thế giới giữa các tổ chức độc quyền, sự phân chia thế giới về lãnh thổ giữa các nước đế quốc"},{"key":"C","text":"Tập trung sản xuất cùng với các tổ chức độc quyền; xuất khẩu tư bản; sự phân chia thị trường thế giới giữa các tổ chức độc quyền; sự phân chia thế giới về lãnh thổ giữa các nước đế quốc"},{"key":"D","text":"Tập trung sản xuất cùng với các tổ chức độc quyền; tư bản tài chính; xuất khẩu tư bản; sự phân chia thị trường thế giới giữa các tổ chức độc quyền; sự phân chia thế giới về lãnh thổ giữa các nước đế quốc"}],"answer":["D"]},{"number":23,"text":"Các luận điểm dưới đây, luận điểm nào sai?(NHUNG HOÀNG)","options":[{"key":"A","text":"Bóc lột sản phẩm thặng dư chỉ có ở chủ nghĩa tư bản"},{"key":"B","text":"Các phương thức sản xuất trước chủ nghĩa tư bản bóc lột sản phẩm thặng dư trực tiếp"},{"key":"C","text":"Sản xuất giá trị thặng dư tuyệt đối là hình thái chung nhất của sản xuất giá trị thặng dư"}],"answer":["A"]},{"number":24,"text":"Hệ thống lý luận kinh tế chính trị nào bước đầu nghiên cứu về nền sản xuất tư bản chủ nghĩa?(NHUNG HOÀNG)","options":[{"key":"A","text":"Chủ nghĩa trọng thương"},{"key":"B","text":"Chủ nghĩa trọng nông"},{"key":"C","text":"Chủ nghĩa tư bản"},{"key":"D","text":"Chủ nghĩa xã hội"}],"answer":["A"]},{"number":25,"text":"Lao động sản xuất có vai trò gì đối với con người?(NHUNG HOÀNG)","options":[{"key":"A","text":"Tạo ra của cải vật chất để nuôi sống con người"},{"key":"B","text":"Phát triển, hoàn thiện con người cả về thể lực và trí lực"},{"key":"C","text":"Giúp con người tích luỹ kinh nghiệm, chế tạo ra công cụ sản xuất ngày càng tinh vi"},{"key":"D","text":"Các phương án trả lời đều đúng"}],"answer":["D"]},{"number":26,"text":"Tính hai mặt của lao động sản xuất hàng hóa là(NHUNG HOÀNG)","options":[{"key":"A","text":"Lao động tư nhân, lao động xã hội"},{"key":"B","text":"Lao động giản đơn, lao động phức tạp"},{"key":"C","text":"Lao động cụ thể, lao động trừu tượng"}],"answer":["C"]},{"number":27,"text":"Kinh tế chính trị cổ điển Anh được hình thành và phát triển trong thời kỳ nào?(NHUNG HOÀNG)","options":[{"key":"A","text":"Từ cổ đại đến thế kỷ XVIII"},{"key":"B","text":"Từ nửa cuối thế kỷ XVII đến nửa đầu thế kỷ XVIII"},{"key":"C","text":"Từ cuối thế kỷ XVIII đến nửa đầu thế kỷ XIX"},{"key":"D","text":"Từ nửa đầu thế kỷ XIX"}],"answer":["C"]},{"number":28,"text":"Giá cả ruộng đất phụ thuộc các nhân tố nào?(NHUNG HOÀNG)","options":[{"key":"A","text":"Mức địa tô của đất"},{"key":"B","text":"Độ màu mỡ của đất"},{"key":"C","text":"Vị trí của đất"}],"answer":["A"]},{"number":29,"text":"Độc quyền nhà nước xuất hiện trong chủ nghĩa tư bản là sự liên minh giữa nhà nước tư bản với(073-356-8678)","options":[{"key":"A","text":"Các tổ chức nhà nước"},{"key":"B","text":"Các tổ chức độc quyền"},{"key":"C","text":"Các tổ chức kinh tế tư nhân"}],"answer":["B"]},{"number":30,"text":"Trong nền kinh tế thị trường định hướng xã hội chủ nghĩa, thành phần hật Bản và các nước công nghiệp mới diễn ra trong khoảng bao nhiêu năm?(NHUNG HOÀNG)","options":[{"key":"A","text":"Từ 10 - 20 năm"},{"key":"B","text":"Từ 15 - 25 năm"},{"key":"C","text":"Từ 20 - 30 năm"},{"key":"D","text":"Từ 25 - 35 năm"}],"answer":["C"]},{"number":36,"text":"Đảng và Nhà nước quyết định xây dựng nền kinh tế thị trường định hướng xã hội chủ nghĩa ở nước ta từ Đại hội nào?(073-356-8678)","options":[{"key":"A","text":"Đại hội VI (1986)"},{"key":"B","text":"Đại hội X (2006)"},{"key":"C","text":"Đại hội XI (2011)"},{"key":"D","text":"Đại hội V (1982)"}],"answer":["A"]},{"number":37,"text":"Ai là người đưa kinh tế chính trị trở thành môn khoa học có tính hệ thống với các phạm trù và khái niệm chuyên ngành?(NHUNG HOÀNG)","options":[{"key":"A","text":"Adam Smith"},{"key":"B","text":"David Ricardo"},{"key":"C","text":"Karl Marx"},{"key":"D","text":"Willian Stafford"}],"answer":["A"]},{"number":38,"text":"Người phát minh ra con thoi - một cải tiến của khung dệt và là một đóng góp quan trọng cho cách mạng cộng nghiệp lần thứ nhất là","options":[{"key":"A","text":"John Kay (1704 - 1779)"},{"key":"B","text":"Richard Arkwright (1732-1792)"},{"key":"C","text":"Edmund Cartwright (1743-1823)"},{"key":"D","text":"James Watt (1736-1891)"}],"answer":["A"]},{"number":39,"text":"Xét về trình độ phát triển, kinh tế thị trường ở Việt Nam bao gồm nhiều cấp độ(NHUNG HOÀNG)","options":[{"key":"A","text":"Sản xuất hàng hóa nhỏ, kinh tế thị trường sơ khai, kinh tế thị trường hiện đại đan xen"},{"key":"B","text":"Sản xuất hàng hóa lớn, kinh thế thị trường sơ khai, kinh tế thị trường đan xen"},{"key":"C","text":"Sản xuất hàng hóa nhỏ, kinh tế thị trường hoàn thiện, kinh tế thị trường hiện đại"},{"key":"D","text":"Sản xuất hàng hóa lớn, kinh tế thị trường hoàn thiện, kinh tế thị trường hiện đại đan xen"}],"answer":["A"]},{"number":40,"text":"Trong quá trình hội nhập kinh tế quốc tế, Việt Nam đã gia nhập những tổ chức nào sau đây ?","options":[{"key":"A","text":"ASEAN, AFTA, ASEM, APEC, WTO..."},{"key":"B","text":"ASEAN, G20, ASEM, APEC, WTO..."},{"key":"C","text":"ASEAN, AFTA, ASEM, APEC, EU..."},{"key":"D","text":"ASEAN, ASEM, APEC, WTO, ECOWAS..."}],"answer":["A"]},{"number":41,"text":"Hình thức độc quyền dưới dạng Cartel được phổ biến ở Châu âu vào thời gian nào?(NHUNG HOÀNG)","options":[{"key":"A","text":"Đầu thế kỷ XIX"},{"key":"B","text":"Giữ thế kỷ XIX"},{"key":"C","text":"Cuối thế kỷ XIX"},{"key":"D","text":"Đầu thế kỷ XX"}],"answer":["C"]},{"number":42,"text":"Chọn phương án sai: Lý do Việt Nam hoàn thiện thể chế kinh tế thị trường định hướng XHCN:(NHUNG HOÀNG)","options":[{"key":"A","text":"Do thể chế kinh tế thị trường định hướng xã hội chủ nghĩa chưa hoàn thiện"},{"key":"B","text":"Do đảng cộng sản lãnh đạo"},{"key":"C","text":"Hệ thống thể chế chưa đầy đủ"},{"key":"D","text":"Hệ thống thể chế còn kém hiệu lực, hiệu quả, thiếu các yếu tố thị trường và các loại thị trường"}],"answer":["B"]},{"number":43,"text":"Đảng ta khẳng định: \"Nền kinh tế thị trường định hướng xã hội chủ nghĩa ở nước ta là nền kinh tế nhiều thành phần, vận hành theo cơ chế thị trường, có sự quản lý của Nhà nước, dưới sự lãnh đạo của Đảng Cộng sản\" từ Đại hội nào?","options":[{"key":"A","text":"Đại hội V (1982)"},{"key":"B","text":"Đại hội X (2006)"},{"key":"C","text":"Đại hội VI (1986)"},{"key":"D","text":"Đại hội XI (2011)"}],"answer":["D"]},{"number":44,"text":"Chức năng tiền tệ là(NHUNG HOÀNG)","options":[{"key":"A","text":"Phương tiện lưu thông, phương tiện thanh toán; phương tiện mua bán; tiền tệ thế giới, thước đo giá trị"},{"key":"B","text":"Phương tiện lưu thông, phương tiện thanh toán; phương tiện cất trữ; tiền tệ thế giới, thước đo giá trị"},{"key":"C","text":"Phương tiện lưu thông, phương tiện trao đổi, phương tiện cất trữ; tiền tệ, thước đo giá trị"},{"key":"D","text":"Phương tiện lưu thông, phương tiện thanh toán. phương tiện cất trữ, thước đo giá trị"}],"answer":["B"]},{"number":45,"text":"Nền kinh tế hàng hoá có thể hình thành và phát triển mạnh vừa chưa mang tính hiệu quả cao"},{"key":"D","text":"Tất cả phương án trên"}],"answer":["D"]},{"number":136,"text":"Cum từ nào thích hợp để điên vào dấu (...) sau: \"Kinh tế thị trường định hướng... là nền kinh tế vận hành theo các quy luật của...\".?","options":[{"key":"A","text":"Xã hội chủ nghĩa/ Thị trường."},{"key":"B","text":"Xã hội chủ nghĩa/Sản xuất hàng hóa."},{"key":"C","text":"Thị trường/ Xã hội."},{"key":"D","text":"Xã hội chủ nghĩa/cạnh tranh hàng hóa."}],"answer":["A"]},{"number":137,"text":"Quy luật giá trị yêu cầu sản xuất và trao đối hàng hóa phải tiến hành trên cơ sở nào?(NHUNG HOÀNG)","options":[{"key":"A","text":"Hao phí lao động xã hội cần thiết"},{"key":"B","text":"Hao phí lao động cá biệt"},{"key":"C","text":"Hao phí lao động tư nhân"},{"key":"D","text":"Hao phí lao động cụ thế"}],"answer":["A"]},{"number":138,"text":"Có bao nhiêu mô hình công nghiệp hóa tiêu biểu trên thế giới?(NHUNG HOÀNG)","options":[{"key":"A","text":"3"},{"key":"B","text":"4"},{"key":"C","text":"5"},{"key":"D","text":"6"}],"answer":["A"]},{"number":139,"text":"Một hệ giá trị toàn diện gồm cà dân giàu, nước mạnh, dân chủ, công bằng, văn minh là hệ giá trị của xã hội nào mà loài người phải phấn đấu?","options":[{"key":"A","text":"Hiện tại."},{"key":"B","text":"Quá khứ."},{"key":"C","text":"Tương lai."},{"key":"D","text":"Tư bản chủ nghĩa."}],"answer":["C"]},{"number":140,"text":"Tư bản thương nghiệp của chủ nghĩa tư bản là:(NHUNG HOÀNG)","options":[{"key":"A","text":"Là một bộ phận của tư bản nông nghiệp tách ra phục vụ quá trình lưu thông hàng hóa"},{"key":"B","text":"Là một bộ phận của tư bản công nghiệp tách ra phục vụ quá trình lưu thông hàng hóa"},{"key":"C","text":"Là một bộ phận của tư bản cho vay tách ra phục vụ quá trình lưu thông hàng hóa"},{"key":"D","text":"Là một bộ phận của tư bản thương nghiệp tách ra phục vụ quá trình lưu thông hàng hóa"}],"answer":["B"]}]}];const $=s=>document.querySelector(s);let setIndex=0,index=0,answers=[],reviewMode=false,studyMode=false;const exam=$('#exam');for(let groupName of [...new Set(sets.map(s=>s.group))]){const group=document.createElement('optgroup');group.label=groupName;sets.filter(s=>s.group===groupName).forEach((s)=>{const o=document.createElement('option');o.value=sets.indexOf(s);o.textContent=`${s.title} (${s.questions.length} câu)`;group.append(o)});exam.append(group)}function correctKeys(q){return Array.isArray(q.answer)?q.answer:String(q.answer).split(/[,;\s]+/).filter(Boolean)}function isMulti(q){return correctKeys(q).length>1}function isAnswered(i){const a=answers[i],q=sets[setIndex].questions[i];return isMulti(q)?Array.isArray(a)&&a.length>=correctKeys(q).length:a!==null&&a!==undefined}function isCorrect(i){const q=sets[setIndex].questions[i],a=answers[i],keys=correctKeys(q);if(isMulti(q))return Array.isArray(a)&&a.length===keys.length&&keys.every(k=>a.includes(k))&&a.every(k=>keys.includes(k));return a===keys[0]}function reviewIndices(){return answers.map((_,i)=>isAnswered(i)?i:-1).filter(i=>i>=0)}function loadSet(){setIndex=+exam.value;index=0;reviewMode=false;answers=Array(sets[setIndex].questions.length).fill(null);render()}function move(step){const qs=sets[setIndex].questions;if(reviewMode){const list=reviewIndices();if(!list.length)return;let pos=list.indexOf(index);if(pos<0)pos=0;pos=Math.max(0,Math.min(list.length-1,pos+step));index=list[pos]}else index=Math.max(0,Math.min(qs.length-1,index+step));render()}function answerDisplay(q){return correctKeys(q).map(k=>k+'. '+(q.options.find(o=>o.key===k)?.text||'')).join(' / ')}function render(){const qs=sets[setIndex].questions,q=qs[index],multi=isMulti(q);$('#qcount').textContent=`Câu ${index+1} / ${qs.length}${reviewMode?' • Xem lại':''}`;$('#question').textContent=q.text;$('#options').innerHTML='';$('#questionOptions').innerHTML='';$('#feedback').textContent='';$('#feedback').className='feedback';$('#answerHint').textContent=multi?`(Chọn ${correctKeys(q).length} đáp án)`:'(Chọn một đáp án)';$('#multiHint').textContent=multi?`Câu này có nhiều đáp án đúng. Hãy chọn đủ ${correctKeys(q).length} lựa chọn.`:'';q.options.forEach(o=>{const selected=multi?(Array.isArray(answers[index])&&answers[index].includes(o.key)):answers[index]===o.key;const lab=document.createElement('label');lab.className='opt';if(selected&&isAnswered(index))lab.classList.add(correctKeys(q).includes(o.key)?'correct':'wrong');const input=document.createElement('input');input.type=multi?'checkbox':'radio';input.name=multi?'answer-multi':'answer';input.checked=selected;input.addEventListener('change',()=>choose(o.key));const tx=document.createElement('span');tx.textContent=o.key;lab.append(input,tx);$('#options').append(lab);const qrow=document.createElement('label');qrow.className='qchoice'+(selected&&isAnswered(index)?(correctKeys(q).includes(o.key)?' correct':' wrong'):'');const qinput=document.createElement('input');qinput.type=multi?'checkbox':'radio';qinput.name=multi?'answer-copy-multi':'answer-copy';qinput.checked=selected;qinput.addEventListener('change',()=>choose(o.key));const qt=document.createElement('span');qt.textContent=o.key+'. '+o.text;qrow.append(qinput,qt);$('#questionOptions').append(qrow)});if(isMulti(q)&&Array.isArray(answers[index])&&!isAnswered(index))$('#feedback').textContent=`Đã chọn ${answers[index].length}/${correctKeys(q).length}`;else if(isAnswered(index)){$('#feedback').className='feedback '+(isCorrect(index)?'good':'bad');$('#feedback').textContent=isCorrect(index)?'✓ Chính xác!':'✗ Chưa đúng. Đáp án đúng: '+answerDisplay(q)}$('#status').textContent=isAnswered(index)?'Đã trả lời':'Chưa trả lời';$('#prev').disabled=index===0&&!reviewMode;$('#next').disabled=index===qs.length-1&&!reviewMode;$('#review').disabled=!reviewMode&&!reviewIndices().length;$('#review').textContent=reviewMode?'Thoát xem lại':'Xem lại câu đã làm';$('#questionNav').innerHTML='';qs.forEach((item,i)=>{const b=document.createElement('button'),done=isAnswered(i);b.textContent=i+1;b.className=(done?'done ':'')+(i===index?'current ':'')+(done&&!isCorrect(i)?'wrong':'');b.title=`Câu ${i+1}${done?(isCorrect(i)?' • Đúng':' • Sai'):Array.isArray(answers[i])?' • Đang chọn':' • Chưa làm'}`;b.onclick=()=>{index=i;render()};$('#questionNav').append(b)});const done=answers.reduce((n,_,i)=>n+(isAnswered(i)?1:0),0),correct=answers.reduce((n,_,i)=>n+(isAnswered(i)&&isCorrect(i)?1:0),0);$('#bar').style.width=(done/qs.length*100)+'%';$('#progressText').textContent=`${done}/${qs.length}`;$('#score').textContent=`Đã làm ${done}/${qs.length} • Đúng ${correct}`;$('#finish').textContent=studyMode?'Kết thúc xem lại':'Kết thúc bài'}function choose(key){const q=sets[setIndex].questions[index],multi=isMulti(q);if(multi){let picked=Array.isArray(answers[index])?[...answers[index]]:[];picked=picked.includes(key)?picked.filter(k=>k!==key):[...picked,key];answers[index]=picked;render();if(isAnswered(index)&&!studyMode){const current=index;const ok=isCorrect(current);if(current<sets[setIndex].questions.length-1){index=current+1;render();$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=`Câu ${current+1}: ${ok?'✓ Chính xác!':'✗ Chưa đúng. Đáp án đúng: '+answerDisplay(q)}`}}return}answers[index]=key;const answeredIndex=index,ok=isCorrect(index);render();if(!studyMode&&answeredIndex<sets[setIndex].questions.length-1){index=answeredIndex+1;render();$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=`Câu ${answeredIndex+1}: ${ok?'✓ Chính xác!':'✗ Chưa đúng. Đáp án đúng: '+answerDisplay(q)}`}}$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#leftArrow').onclick=()=>move(-1);$('#rightArrow').onclick=()=>move(1);$('#review').onclick=()=>{if(reviewMode)reviewMode=false;else{const list=reviewIndices();if(!list.length)return;reviewMode=true;index=list[0]}render()};$('#reveal').onclick=()=>{const q=sets[setIndex].questions[index];$('#feedback').className='feedback good';$('#feedback').textContent='Đáp án: '+answerDisplay(q)};exam.onchange=loadSet;$('#mode').onchange=()=>{studyMode=$('#mode').value==='study';loadSet()};$('#finish').onclick=()=>{const qs=sets[setIndex].questions,done=answers.reduce((n,_,i)=>n+(isAnswered(i)?1:0),0),correct=answers.reduce((n,_,i)=>n+(isAnswered(i)&&isCorrect(i)?1:0),0);$('#summaryTitle').textContent=studyMode?'Hoàn thành phiên học':'Kết quả luyện đề';$('#summaryText').textContent=`${sets[setIndex].title}: đúng ${correct}/${qs.length}; đã làm ${done}/${qs.length} câu.`;$('#summary').classList.add('show')};$('#closeSummary').onclick=()=>$('#summary').classList.remove('show');$('#restart').onclick=()=>{$('#summary').classList.remove('show');loadSet()};loadSet();
</script></body></html>
