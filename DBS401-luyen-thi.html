es extensive programming skills."},{"key":"B","text":"It allows for deep customization of the code."},{"key":"C","text":"It is easier and quicker to install compared to source code installation."},{"key":"D","text":"It is more secure than other methods."}],"answer":"C"},{"number":30,"text":"The primary purpose of security testing is to:","options":[{"key":"A","text":"Demonstrate compliance with regulations"},{"key":"B","text":"Implement security controls and safeguards"},{"key":"C","text":"Identify vulnerabilities and potential attack scenarios"},{"key":"D","text":"Train employees on security awareness"}],"answer":"C"},{"number":31,"text":"What is SQL injection used for?","options":[{"key":"A","text":"SQL injections are used to identify and exploit weaknesses within a database management system."},{"key":"B","text":"SQL injections are used to protect a database management system."},{"key":"C","text":"SQL injections are used to encrypt a database management system."},{"key":"D","text":"None of the mentioned"}],"answer":"A"},{"number":32,"text":"What is the act of using system vulnerabilities and carefully crafted SQL queries to gather information and subsequently peel away at the infrastructure's security defense for the purpose of gaining access or control of a system?","options":[{"key":"A","text":"Exploitation"},{"key":"B","text":"Injection"},{"key":"C","text":"Identifying"},{"key":"D","text":"None of the mentioned."}],"answer":"A"},{"number":33,"text":"Which database response provides the most reliable way to identify the underlying database system during an SQL injection?","options":[{"key":"A","text":"The scripting language used by the web application"},{"key":"B","text":"The platform the database is running on"},{"key":"C","text":"Database error messages"},{"key":"D","text":"The time it takes for the database to respond"}],"answer":"C"},{"number":34,"text":"What is the main requirement for using UNION statements in SQL injection attacks?","options":[{"key":"A" on"},{"key":"C","text":"Denial of Service"},{"key":"D","text":"Social Engineering"}],"answer":"B"},{"number":45,"text":"Which security mechanism helps to prevent unauthorized users from accessing a database?","options":[{"key":"A","text":"Backup strategies"},{"key":"B","text":"Firewalls"},{"key":"C","text":"Indexing"},{"key":"D","text":"Query optimization"}],"answer":"B"},{"number":46,"text":"Which of the following is NOT a common execution strategy for SQL injections?","options":[{"key":"A","text":"Single Channel"},{"key":"B","text":"Multi Channel"},{"key":"C","text":"Blind Injection"},{"key":"D","text":"Observational"}],"answer":"D"},{"number":47,"text":"Why are passwords considered the first defense in securing a network?","options":[{"key":"A","text":"Because they are easy to remember"},{"key":"B","text":"They are the most basic form of user authentication"},{"key":"C","text":"Passwords are not important"},{"key":"D","text":"They can be easily shared"}],"answer":"B"},{"number":48,"text":"How can database responses aid an attacker in identifying the database?","options":[{"key":"A","text":"Through detailed error messages"},{"key":"B","text":"By the speed of the response"},{"key":"C","text":"By the language the response is written in"},{"key":"D","text":"Through the server's IP address"}],"answer":"A"},{"number":49,"text":"What is the suggested default port to add for MySQL in Windows Vista and Windows 7 firewall settings?","options":[{"key":"A","text":"3036"},{"key":"B","text":"3306"},{"key":"C","text":"3360"},{"key":"D","text":"6330"}],"answer":"B"},{"number":50,"text":"Why is it suggested not to run SQL Server on machines with only the minimum requirements?","options":[{"key":"A","text":"Increased cost of operation"},{"key":"B","text":"Microsoft recommends higher specifications for proper functioning"},{"key":"C","text":"Improved scalability and performance"},{"key":"D","text":"Compatibility issues with Windows operating systems"}],"answer":"B"}]},{"id":"SU24_F abase activity important?","options":[{"key":"A","text":"To ensure all employees are working the required hours"},{"key":"B","text":"To monitor changes, access, and attempts to access the database"},{"key":"C","text":"To track the number of coffee breaks taken by the IT department"},{"key":"D","text":"For updating the organization's website content"}],"answer":"B"},{"number":12,"text":"Which of the following is an audit conducted using tools that are either installed onto a machine or embedded within an application for the purpose of recording the typical behavior of a system?","options":[{"key":"A","text":"automated audit"},{"key":"B","text":"external audit"},{"key":"C","text":"formal audit"},{"key":"D","text":"None of the mentioned."}],"answer":"A"},{"number":13,"text":"What is included in the scope of an audit?","options":[{"key":"A","text":"Only the software components of the system"},{"key":"B","text":"The physical security measures of the building"},{"key":"C","text":"The area or system on which the security audit will focus"},{"key":"D","text":"The personal devices of employees"}],"answer":"C"},{"number":14,"text":"What is the primary driver for conducting a formal security audit?","options":[{"key":"A","text":"Internal evaluation of the effectiveness of current security practices"},{"key":"B","text":"Compliance with mandatory industry standards or legal requirements"},{"key":"C","text":"Public demonstration of commitment to cybersecurity and data protection"},{"key":"D","text":"Identification and remediation of potential security vulnerabilities"}],"answer":"B"},{"number":15,"text":"What is the primary purpose of conducting an informal security audit?","options":[{"key":"A","text":"To identify and exploit vulnerabilities in an organization's systems"},{"key":"B","text":"To gather evidence of the effectiveness of existing security policies and practices"},{"key":"C","text":"To publicly demonstrate an organization's commitment to cybersecurity"},{"key":"D","te ach"},{"key":"D","text":"Avoiding any communication regarding the breach"}],"answer":"B"},{"number":21,"text":"What happens to a dynamic SQL statement after it's generated?","options":[{"key":"A","text":"It's automatically saved to the database for future use"},{"key":"B","text":"It's sent directly to the database engine for execution"},{"key":"C","text":"It's parsed and validated before being sent to the database"},{"key":"D","text":"It's displayed back to the user for confirmation"}],"answer":"B"},{"number":22,"text":"How should administrators approach source code analysis for SQL injection vulnerabilities?","options":[{"key":"A","text":"By focusing on the encryption of the source code"},{"key":"B","text":"Through manual line-by-line review and using automated tools"},{"key":"C","text":"By completely rewriting the source code periodically"},{"key":"D","text":"Only through automated tools for efficiency"}],"answer":"B"},{"number":23,"text":"Which method is NOT used for executing SQL injections?","options":[{"key":"A","text":"Observational"},{"key":"B","text":"Multichannel"},{"key":"C","text":"Data Encryption"},{"key":"D","text":"Single-channel"}],"answer":"C"},{"number":24,"text":"Which of the following is a valid SQL injection payload that can be used to bypass a login form?","options":[{"key":"A","text":"'OR 1-1--"},{"key":"B","text":"admin' AND 1=0 --"},{"key":"C","text":"'; DROP TABLE users;"},{"key":"D","text":"username' OR password LIKE '%"}],"answer":"A"},{"number":25,"text":"Which type of analysis is more likely to find potential security vulnerabilities?","options":[{"key":"A","text":"Static Analysis"},{"key":"B","text":"Widen Analysis"},{"key":"C","text":"Both are equally effective in finding vulnerabilities"},{"key":"D","text":"Neither is particularly effective in finding vulnerabilities"}],"answer":"A"},{"number":26,"text":"When choosing a licensing option for SQL Server, what should be considered?","options":[{"key":"A","text":"The color of the server raphical interface."},{"key":"D","text":"To limit the number of users that can access the database."}],"answer":"A"},{"number":12,"text":"What is external audit?","options":[{"key":"A","text":"An audit most often conducted to satisfy specific industry standards that are required by law for certain types of organizations."},{"key":"B","text":"An audit conducted using a third-party group or a number of individuals from a source outside the organization itself."},{"key":"C","text":"An audit conducted as a way to provide organizations evidence that their security policies and practices are effective and working properly."},{"key":"D","text":"An audit conducted using a committee of individuals who are employees of the company itself."}],"answer":"B"},{"number":13,"text":"Which Oracle edition would be the most cost-effective choice for a small startup company with limited resources and basic database needs?","options":[{"key":"A","text":"Oracle Database Standard One"},{"key":"B","text":"Oracle Database Standard"},{"key":"C","text":"Oracle Express"},{"key":"D","text":"Oracle Enterprise Edition"}],"answer":"C"},{"number":14,"text":"What is the term for sending copies of one database to another database within a network?","options":[{"key":"A","text":"Replication"},{"key":"B","text":"Synchronization"},{"key":"C","text":"Migration"},{"key":"D","text":"Backup"}],"answer":"A"},{"number":15,"text":"____ is licensed on a per-user or per-processor basis. It was developed for servers that use one to two processors. If the number of CPUs on a server exceeds two, the user must upgrade to the Standard license There are no restrictions placed on memory usage or user data storage. To qualify for a license for this edition, there must be at least five or more users.","options":[{"key":"A","text":"Oracle Database Standard Edition"},{"key":"B","text":"Enterprise Edition-"},{"key":"C","text":"Express Edition"},{"key":"D","text":"Oracle Database Standard Edition One"}],"answer":"D"},{"number system is not supported by Microsoft SQL Server 2008?","options":[{"key":"A","text":"Windows 98"},{"key":"B","text":"Windows XP"},{"key":"C","text":"Windows Server 2008"},{"key":"D","text":"Windows 7"}],"answer":"A"},{"number":5,"text":"is a strategy that allows the database to contain multiple instances of a record, all pointing to the same primary key, but which contains and displays different values to users of different security classifications.","options":[{"key":"A","text":"Polyinstantiation"},{"key":"B","text":"Encryption"},{"key":"C","text":"Parallel recording"},{"key":"D","text":"Cryptography"}],"answer":"A"},{"number":6,"text":"How does security testing differ from security auditing?","options":[{"key":"A","text":"Auditing is time-consuming, while testing is quick"},{"key":"B","text":"Auditing focuses on internal controls, while testing does not"},{"key":"C","text":"Testing is more costly and time-consuming than auditing"},{"key":"D","text":"Auditing covers security policies, human resources, and legal compliance, while testing does not"}],"answer":"D"},{"number":7,"text":"Which of the following is a best practice for securing SQL Server before installation?","options":[{"key":"A","text":"Placing servers behind firewalls and locked doors."},{"key":"B","text":"Using group range exceptions for port configurations."},{"key":"C","text":"Sharing administrative access with multiple users."},{"key":"D","text":"Enabling guest accounts by default."}],"answer":"A"},{"number":8,"text":"What is the main focus of Advanced Security in Oracle database?","options":[{"key":"A","text":"Simplifying user access and enhancing database performance"},{"key":"B","text":"Providing additional layers of protection against data breaches and unauthorized access"},{"key":"C","text":"Integrating with social media platforms for user authentication"},{"key":"D","text":"Automatically backing up your data to the cloud"}],"answer":"B"},{"number":9,"text":"What type of reconnaissance involves gathering information without directly interacting with the system?","options":[{"key":"A","text":"Active reconnaissance"},{"key":"B","text":"Passive reconnaissance"},{"key":"C","text":"Black box testing"},{"key":"D","text":"Internal testing"}],"answer":"B"},{"number":10,"text":"In MySQL, global privileges apply to all databases and are stored in the mysql.user table. Global privileges should be avoided when possible, as one mistake can cause a great security breach on the database. To grant global privileges:","options":[{"key":"A","text":"GRANT privilege_list ON *.*"},{"key":"B","text":"GRANT privilege_list OFF *.*"},{"key":"C","text":"GRANT authentication_list ON *.*"},{"key":"D","text":"GRANT authentication_list OFF *.*"}],"answer":"A"},{"number":11,"text":"What is the primary advantage of using a network database model over a hierarchical model?","options":[{"key":"A","text":"It supports simpler queries"},{"key":"B","text":"It allows for many-to-many relationships"},{"key":"C","text":"It uses less storage space"},{"key":"D","text":"It is easier to implement"}],"answer":"B"},{"number":12,"text":"What should be included in the audit scope?","options":[{"key":"A","text":"The cost of the audit"},{"key":"B","text":"The specific areas or systems that the audit will focus on"},{"key":"C","text":"The names of all employees in the organization"},{"key":"D","text":"The software used during the audit"}],"answer":"B"},{"number":13,"text":"Which approach is described as most effective in minimizing the risk of a data breach?","options":[{"key":"A","text":"Using a single, strong firewall."},{"key":"B","text":"Deploying antivirus solutions only."},{"key":"C","text":"Implementing multiple layers of security."},{"key":"D","text":"Relying solely on user training and awareness."}],"answer":"C"},{"number":14,"text":"Which of the following is considered the basic unit of storage in a database?","options":[{"key":"A","text":"Query"},{"key":"B","text":"Row"},{"key":"C","text":"Table"},{"key":"D","text":"Key"}],"answer":"C"},{"number":15,"text":"What are the objectives of encrypting data within a database? (Choose two)","options":[{"key":"A","text":"To enhance database aesthetics"},{"key":"B","text":"To protect data confidentiality"},{"key":"C","text":"To increase data accessibility"},{"key":"D","text":"To ensure data integrity"},{"key":"E","text":"To make database management easier"}],"answer":"D"},{"number":16,"text":"Which edition of Oracle is designed for high-volume, query-intensive environments?","options":[{"key":"A","text":"Standard Edition"},{"key":"B","text":"Express Edition"},{"key":"C","text":"Enterprise Edition"},{"key":"D","text":"Standard Edition One"}],"answer":"C"},{"number":17,"text":"How does an administrator determine the right SQL Server components to install for a specific network?","options":[{"key":"A","text":"By installing all components"},{"key":"B","text":"Based on the specific network scenarios and needs"},{"key":"C","text":"By guessing"},{"key":"D","text":"By flipping a coin"}],"answer":"B"},{"number":18,"text":"Which phase of MySQL maturity indicates the software is ready for production with very few known bugs?","options":[{"key":"A","text":"Alpha"},{"key":"B","text":"Beta"},{"key":"C","text":"General Availability (GA)"},{"key":"D","text":"Release Candidate (RC)"}],"answer":"C"},{"number":19,"text":"Which testing method is described as being conducted with prior knowledge of the system?","options":[{"key":"A","text":"Black box testing"},{"key":"B","text":"White box testing"},{"key":"C","text":"Grey box testing"},{"key":"D","text":"Blue box testing"}],"answer":"B"},{"number":20,"text":"Why are roles used in database security?","options":[{"key":"A","text":"To limit the number of users in the database"},{"key":"B","text":"To simplify management of user privileges"},{"key":"C","text":"To encrypt data transfers between databases"},{"key":"D","text":"To backup and restore the database"}],"answer":"B"},{"number":21,"text":"In what ways can users minimize potential risks in database systems?","options":[{"key":"A","text":"By avoiding system updates"},{"key":"B","text":"By frequently sharing passwords"},{"key":"C","text":"By following secure password practices"},{"key":"D","text":"By granting system access to unauthorized individuals"}],"answer":"C"},{"number":22,"text":"Which database model restricts entities to have one parent but allows multiple children?","options":[{"key":"A","text":"Hierarchical model"},{"key":"B","text":"Network model"},{"key":"C","text":"Relational model"},{"key":"D","text":"Object-oriented model"}],"answer":"A"},{"number":23,"text":"Which of the following is NOT a benefit of using honeypots?","options":[{"key":"A","text":"Early detection of intrusion attempts"},{"key":"B","text":"Gathering information about attacker methods and tools"},{"key":"C","text":"Wasting the attacker's time and resources"},{"key":"D","text":"Directly stopping or hindering the attacker's goals"}],"answer":"D"},{"number":24,"text":"Symmetric cryptography comes with both advantages and disadvantages. Among the following, which is not regarded as a disadvantage?","options":[{"key":"A","text":"Key management"},{"key":"B","text":"Confidentiality"},{"key":"C","text":"Scalability"},{"key":"D","text":"Key distribution"}],"answer":"B"},{"number":25,"text":"What makes worms different from viruses?","options":[{"key":"A","text":"Worms require user interaction to spread."},{"key":"B","text":"Worms exploit network vulnerabilities to replicate."},{"key":"C","text":"Worms disguise themselves in harmful code."},{"key":"D","text":"Worms self-update and encrypt information."}],"answer":"B"},{"number":26,"text":"What is a key difference between passive and active reconnaissance?","options":[{"key":"A","text":"Passive reconnaissance involves direct system attacks"},{"key":"B","text":"Active reconnaissance uses only public information"},{"key":"C","text":"Passive reconnaissance gathers information indirectly, without alerting the target system"},{"key":"D","text":"Active reconnaissance is never used in security testing"}],"answer":"C"},{"number":27,"text":"What is the primary purpose of SQL injections from an attacker's perspective?","options":[{"key":"A","text":"To secure the database"},{"key":"B","text":"To create backups of the database"},{"key":"C","text":"To gain unauthorized access or manipulate database data"},{"key":"D","text":"To optimize database performance"}],"answer":"C"},{"number":28,"text":"What does the suffix 'm2' in MySQL version 5.5.0-m2 indicate?","options":[{"key":"A","text":"General Availability"},{"key":"B","text":"Release Candidate"},{"key":"C","text":"Beta phase"},{"key":"D","text":"Milestone achieved"}],"answer":"D"}]}];let setIndex=0,index=0,answers=[],reviewMode=false;const $=s=>document.querySelector(s);const exam=$('#exam');sets.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.title+' ('+s.questions.length+' câu)';exam.append(o)});function loadSet(){setIndex=+exam.value;index=0;reviewMode=false;answers=Array(sets[setIndex].questions.length).fill(null);render()}function reviewIndices(){return answers.map((a,i)=>a?i:-1).filter(i=>i>=0)}function moveQuestion(step){const qs=sets[setIndex].questions;if(reviewMode){const list=reviewIndices();if(!list.length)return;let pos=list.indexOf(index);if(pos<0)pos=0;pos=Math.max(0,Math.min(list.length-1,pos+step));index=list[pos]}else index=Math.max(0,Math.min(qs.length-1,index+step));render()}function render(){const qs=sets[setIndex].questions,q=qs[index];$('#qcount').textContent=reviewMode?`Xem lại ${Math.max(1,reviewIndices().indexOf(index)+1)} / ${reviewIndices().length}`:`Câu ${index+1} / ${qs.length}`;$('#question').textContent=q.text;$('#options').innerHTML='';$('#questionOptions').innerHTML='';$('#feedback').textContent='';$('#feedback').className='feedback';q.options.forEach(o=>{const lab=document.createElement('label');lab.className='opt';if(answers[index]===o.key)lab.classList.add(o.key===q.answer?'correct':'wrong');const radio=document.createElement('input');radio.type='radio';radio.name='answer';radio.checked=answers[index]===o.key;radio.addEventListener('change',()=>choose(o.key));const tx=document.createElement('span');tx.textContent=o.key;lab.append(radio,tx);$('#options').append(lab);const qr=document.createElement('label');qr.className='qchoice';const qradio=document.createElement('input');qradio.type='radio';qradio.name='answercopy';qradio.checked=answers[index]===o.key;qradio.addEventListener('change',()=>choose(o.key));const qtxt=document.createElement('span');qtxt.textContent=o.key+'. '+o.text;qr.append(qradio,qtxt);$('#questionOptions').append(qr)});if(answers[index]){const ok=answers[index]===q.answer;$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=ok?'✓ Chính xác!':'✗ Chưa đúng. Đáp án đúng: '+q.answer+'. '+(q.options.find(o=>o.key===q.answer)?.text||'');}$('#qstatus').textContent=answers[index]?'Đã trả lời':'Chưa trả lời';const reviewList=reviewIndices();$('#prev').disabled=reviewMode?reviewList.indexOf(index)<=0:index===0;$('#next').disabled=reviewMode?reviewList.indexOf(index)>=reviewList.length-1:index===qs.length-1;$('#next').textContent=reviewMode?'Câu tiếp →':'Next';$('#reviewToggle').textContent=reviewMode?'Thoát xem lại':'Xem lại câu đã làm';$('#reviewToggle').disabled=!reviewMode&&!reviewList.length;$('#reviewToggle').title=reviewMode?'Quay lại chế độ làm bài':'Chỉ duyệt các câu đã trả lời';$('#keys').innerHTML='';qs.forEach((_,i)=>{const b=document.createElement('button');b.className='key'+(answers[i]?' done':'')+(i===index?' current':'');b.textContent=i+1;b.title='Đi tới câu '+(i+1);b.onclick=()=>{index=i;render()};$('#keys').append(b)});const done=answers.filter(Boolean).length;$('#bar').style.width=(done/qs.length*100)+'%';$('#proglabel').textContent=`${done}/${qs.length}`;$('#tagline').textContent=`are ${qs.length} questions, and your progress of answering is`; const correct=answers.reduce((n,a,i)=>n+(a===qs[i].answer?1:0),0);$('#scoreline').textContent=`Đã làm ${done}/${qs.length} • Đúng ${correct}`;}function choose(key){answers[index]=key;render()}$('#prev').onclick=()=>moveQuestion(-1);$('#next').onclick=()=>moveQuestion(1);$('#reviewToggle').onclick=()=>{if(reviewMode){reviewMode=false}else{const list=reviewIndices();if(!list.length)return;reviewMode=true;index=list[0]}render()};exam.onchange=loadSet;$('#leftArrow').onclick=()=>moveQuestion(-1);$('#rightArrow').onclick=()=>moveQuestion(1);$('#finishCheck').onchange=e=>{if(e.target.checked)$('#finish').click()};$('#finish').onclick=()=>{const qs=sets[setIndex].questions,done=answers.filter(Boolean).length,correct=answers.reduce((n,a,i)=>n+(a===qs[i].answer?1:0),0);$('#sumtitle').textContent='Kết quả bài luyện';$('#sumtext').textContent=`${sets[setIndex].title}: đúng ${correct}/${qs.length}. Bạn đã trả lời ${done}/${qs.length} câu.`;$('#summary').classList.add('show')};$('#close').onclick=()=>$('#summary').classList.remove('show');$('#restart').onclick=()=>{$('#summary').classList.remove('show');loadSet()};loadSet();
</script></body></html>
